通達（特定輸出者の認定）","t":"select","tp":"特定輸出者の承認","q":"特定輸出者に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第67条の3・通達。あらかじめ税関長の承認を受けた特定輸出者は、貨物を保税地域等に入れることなく、その置かれている場所から輸出申告して許可を受けられる（AEO輸出者）。","c":["あらかじめ税関長の承認を受けた者は特定輸出者として、貨物を保税地域に入れずに輸出申告できる。","特定輸出者は財務大臣の許可による。","特定輸出者は誰でもなれる。","特定輸出者の制度はない。"],"ans":0},{"i":470,"l":"kanzeiho","a":"基本通達（積戻しの手続）","t":"select","tp":"積戻しの準用手続","q":"外国貨物の積戻しの手続に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第75条・通達。外国貨物の積戻し（外国に向けて送り出すこと）には、輸出申告・検査・許可等の規定が準用され、積戻し申告をして許可を受ける。","c":["積戻しには輸出申告・検査・許可に関する規定が準用される。","積戻しに手続は不要である。","積戻しは輸入の手続による。","積戻しは財務大臣の許可による。"],"ans":0},{"i":471,"l":"teiritsuho","a":"基本通達3の2-1","t":"select","tp":"入国者簡易税率の除外（託送品）","q":"入国者の輸入貨物に対する簡易税率の適用対象から除かれるものに関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3の2-1(1)。入国者の簡易税率の対象から、船舶・航空機の乗組員等が携帯・別送する託送貨物や、消費税の納税証明として輸入許可書発給を希望する託送貨物等は除かれる。","c":["船舶・航空機の乗組員が携帯・別送して輸入する託送貨物は、入国者の簡易税率の対象に含まれない。","乗組員の託送貨物も入国者の簡易税率の対象である。","託送貨物に関する除外規定はない。","すべての携帯品が無条件に対象となる。"],"ans":0},{"i":472,"l":"teiritsuho","a":"基本通達3の2-1(3)","t":"select","tp":"1組としての取扱い","q":"入国者の簡易税率における「1組」の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3の2-1(3)。2個以上の貨物で通常組・対として使用されるものは1組として取り扱う。1個の容器・包装に収容され個々の価格が明らかでないものも全体を1組とする。","c":["通常、組又は対として使用される2個以上の貨物は1組として取り扱う。","2個以上の貨物は常に別個に扱う。","組・対の貨物も個別に課税する。","1組の取扱いに定めはない。"],"ans":0},{"i":473,"l":"teiritsuho","a":"基本通達3の3-1","t":"select","tp":"少額輸入貨物20万円の判定","q":"少額輸入貨物に対する簡易税率の20万円判定に関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3の3-1。課税価格の合計額が20万円以下かの判定は、関税無税品（特恵無税品を含む）・関税免税品・適用除外物品に係る課税価格を含んだ1輸入申告等に係る合計額で行う。","c":["課税価格の合計額が20万円以下であるかの判定は、無税品・免税品等の課税価格も含んだ上で行う。","判定には有税品の課税価格のみを用いる。","20万円は1品目ごとに判定する。","20万円の判定基準はない。"],"ans":0},{"i":474,"l":"teiritsuho","a":"基本通達3の3-4","t":"select","tp":"簡易税率によらない申出（郵便物）","q":"輸入郵便物について少額輸入貨物の簡易税率によることを希望しない場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3の3-4。輸入郵便物について、名宛人は到着通知書発送後・課税通知書作成前等の所定の時期までに、少額輸入貨物の簡易税率表によることを希望しない旨を税関に申し出ることができる。","c":["名宛人は、所定の時期までに簡易税率によらない旨を税関に申し出ることができる。","郵便物は簡易税率を拒否できない。","申出は輸入申告による。","希望しない旨の申出制度はない。"],"ans":0},{"i":475,"l":"teiritsuho","a":"課税価格通達（買付手数料の不算入）","t":"select","tp":"買付手数料","q":"買付手数料の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条第1項第2号イ。仲介料等の手数料は加算されるが、買手を代理して買付けに係る業務を行う者に支払われる対価（買付手数料）は加算要素から除かれる。","c":["買手を代理して買付けに係る業務を行う者に支払われる対価（買付手数料）は加算しない。","買付手数料は加算要素である。","すべての手数料が加算される。","買付手数料は課税価格を増額する。"],"ans":0},{"i":476,"l":"teiritsuho","a":"課税価格通達（間接支払）","t":"select","tp":"間接支払の算入","q":"現実支払価格に含まれる間接支払に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。現実支払価格には売手への直接支払のほか、買手が売手の債務の弁済として第三者へ支払う額等（間接支払）も含まれる。","c":["買手が売手の債務を弁済するため第三者へ支払う額等の間接支払も、現実支払価格に含まれる。","間接支払は現実支払価格に含まれない。","現実支払価格は売手への直接支払のみである。","間接支払は課税価格を減額する。"],"ans":0},{"i":477,"l":"teiritsuho","a":"課税価格通達（売手のための活動）","t":"select","tp":"売手のための活動費用","q":"買手が自己のために行う活動の費用の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。買手が自己のために行う活動（買手のための検査・広告宣伝等）の費用は、売手の利益のための活動でない限り、現実支払価格に含まれず加算もしない。","c":["買手が自己のために行う活動（自己のための検査等）の費用は、原則として現実支払価格に含まれず加算もしない。","買手の活動費用はすべて加算される。","買手の活動費用は常に現実支払価格に含まれる。","買手の活動費用は課税価格を減額する。"],"ans":0},{"i":478,"l":"teiritsuho","a":"課税価格通達（特殊関係の立証）","t":"select","tp":"特殊関係の影響の立証","q":"特殊関係がある場合に取引価格を用いるための立証に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条第2項。特殊関係が取引価格に影響を与えていないことを、同種・類似貨物の取引価格や試験価格との近接性等により立証できれば、取引価格を課税価格として用いることができる。","c":["特殊関係が価格に影響していないことを、比較価格との近接性等により立証できれば取引価格を用いうる。","特殊関係があれば常に取引価格は使えない。","立証は不要である。","特殊関係があると課税できない。"],"ans":0},{"i":479,"l":"teiritsuho","a":"課税価格通達（外貨換算相場）","t":"select","tp":"為替相場","q":"外貨建て価格の本邦通貨への換算に用いる為替相場に関する記述として、最も適切なものを一つ選びなさい。","e":"定率法第4条の7・通達。外貨建ての価格は、輸入申告の日の属する週の前々週における実勢外国為替相場の平均値（財務省令で定める為替相場）により本邦通貨に換算する。","c":["輸入申告の日の属する週の前々週の実勢相場の平均値（財務省令で定める相場）により換算する。","換算は契約日の相場による。","換算は輸入者の任意の相場による。","外貨建ては換算しない。"],"ans":0},{"i":480,"l":"teiritsuho","a":"課税価格通達（運賃不明）","t":"select","tp":"運賃が現実額不明の場合","q":"輸入港までの運賃が現実額不明の場合の課税価格計算に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。輸入貨物の輸入港までの運賃が現実に要した額として不明である場合や無償の場合は、当該運送につき通常要すると認められる運賃により課税価格を計算する。","c":["現実に要した運賃が不明な場合は、通常要すると認められる運賃により課税価格を計算する。","運賃不明なら加算しない。","運賃不明なら課税できない。","運賃は常に推定で2倍する。"],"ans":0},{"i":481,"l":"teiritsuho","a":"課税価格通達（容器費用の区分）","t":"select","tp":"容器費用の負担形態","q":"輸入貨物の容器費用の課税価格への算入区分に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4-10。容器費用は、買手が輸入取引に関し負担する場合は容器の費用（第2号ロ）として、買手が無償・値引きで提供した場合は提供物品の費用（第3号）として、負担形態に応じて区分して算入する。","c":["買手が輸入取引に関し負担する容器費用は容器費用として、買手が無償等で提供した容器の費用は提供物品費用として算入される。","容器費用はすべて加算しない。","容器費用は負担形態を問わず一律に扱う。","容器費用は課税価格を減額する。"],"ans":0},{"i":482,"l":"teiritsuho","a":"課税価格通達（同種・類似の優先）","t":"select","tp":"同種貨物の優先","q":"同種貨物と類似貨物の取引価格がともにある場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4〜4の8-1。同種貨物に係る取引価格と類似貨物に係る取引価格の双方があるときは、同種貨物に係る取引価格を優先して適用する。","c":["同種貨物に係る取引価格を優先して適用する。","類似貨物に係る取引価格を優先する。","輸入者が選択する。","両者を平均する。"],"ans":0},{"i":483,"l":"teiritsuho","a":"課税価格通達（国内販売価格・製造原価の順序）","t":"select","tp":"評価方法の順序選択","q":"国内販売価格による方法と製造原価による方法の適用順序に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法。原則は国内販売価格（控除方式）が先だが、輸入者が希望し税関長が認める場合には製造原価による方法（積上方式）を先に適用できる（順序の選択）。","c":["原則は国内販売価格による方法が先だが、輸入者が希望し税関長が認める場合は製造原価による方法を先に適用できる。","製造原価による方法が常に先である。","両者の順序は変更できない。","順序は税関が一方的に決める。"],"ans":0},{"i":484,"l":"teiritsuho","a":"課税価格通達（会計原則）","t":"select","tp":"一般的に認められた会計原則","q":"課税価格計算における利潤・一般経費等の算定資料に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4〜4の8-2。通常の利潤・一般経費や工賃等の計算には、適用条文に関連する国（本邦又は生産国）において一般的に認められた会計原則に適合する方法で作成された資料を使用する。","c":["通常の利潤・一般経費等は、関連する国において一般的に認められた会計原則に適合する方法で作成された資料を使用する。","会計原則は用いない。","資料は輸入者が任意に作成する。","会計原則の使用に定めはない。"],"ans":0},{"i":485,"l":"teiritsuho","a":"課税価格通達（委託加工）","t":"select","tp":"委託加工貨物","q":"委託者が原料を提供して外国で加工させた製品を取得する場合の課税価格に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条第3項。委託者が提供した原料を外国で加工等した製品を委託者が取得する場合は、輸入取引によらない貨物として、提供材料費・加工賃その他の費用等を基礎とする方法等で課税価格を決定する。","c":["輸入取引によらない貨物として、提供材料費・加工賃等を基礎とする方法等により課税価格を決定する。","委託加工製品は取引価格による。","委託加工製品は課税できない。","委託加工に課税価格の定めはない。"],"ans":0},{"i":486,"l":"teiritsuho","a":"課税価格通達（加算要素の客観性）","t":"select","tp":"加算要素の客観的資料","q":"加算要素を加算する場合の要件に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。加算要素は、客観的かつ数量化できる資料に基づいてその額を把握できるものを加算する。これによれない場合は取引価格によらず他の方法による。","c":["加算要素は、客観的かつ数量化できる資料に基づき額を把握できるものを加算する。","加算要素は推測で加算してよい。","加算要素に立証は不要である。","加算要素は輸入者の申告のみで決まる。"],"ans":0},{"i":487,"l":"teiritsuho","a":"課税価格通達（値引きの反映）","t":"select","tp":"値引きの反映","q":"輸入取引における値引きの現実支払価格への反映に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。現実支払価格は買手が現実に支払う価格であり、契約に基づき現実に適用された数量値引き・現金値引き等は、所定の要件・立証の下で現実支払価格に反映される。","c":["契約に基づき現実に適用された数量値引き・現金値引き等は、現実支払価格に反映される。","値引きは一切反映されない。","値引きは加算要素である。","値引きは課税価格を増額する。"],"ans":0},{"i":488,"l":"teiritsuho","a":"課税価格通達（輸入取引の意義）","t":"select","tp":"輸入取引","q":"課税価格の基礎となる「輸入取引」の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。輸入取引とは、本邦に拠点を有する者が買手として貨物を本邦に到着させることとなる売買をいう。これに該当しない場合は原則的方法（取引価格）によれない。","c":["本邦に拠点を有する者が買手として貨物を本邦に到着させることとなる売買をいう。","輸入取引とは輸出国内の取引をいう。","輸入取引には買手の概念がない。","輸入取引は国内転売をいう。"],"ans":0},{"i":489,"l":"teiritsuho","a":"課税価格通達（保険料不明）","t":"select","tp":"保険料不明の取扱い","q":"輸入貨物の保険料が不明・無保険の場合の課税価格計算に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。貨物が保険に付されていない場合や保険料の額が不明の場合は、通常要すると認められる保険料等の額により課税価格を計算する取扱いがある。","c":["保険に付されていない場合や保険料が不明の場合は、通常要すると認められる保険料等により計算する。","保険料が不明なら課税できない。","保険料は不明でも加算しない。","保険料は運賃に含めて計算する。"],"ans":0},{"i":490,"l":"teiritsuho","a":"課税価格通達（据付費等の控除）","t":"select","tp":"輸入後の据付費用","q":"輸入港到着後に行われる据付け・組立て等の費用に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。輸入貨物につき輸入港到着後に行われる据付け・組立て・整備・技術指導等の費用は、現実支払価格と明確に区別できる場合は課税価格に算入しない。","c":["輸入後に行われる据付け・組立て・整備・技術指導の費用は、明らかに区別できる場合は課税価格に算入しない。","据付け費用は常に加算する。","据付け費用は加算要素である。","据付け費用は課税価格を増額する。"],"ans":0},{"i":491,"l":"kanzeiho","a":"基本通達（特例申告書の提出期限）","t":"select","tp":"特例申告書の提出期限","q":"期限内特例申告書の提出期限に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の2・通達。特例申告貨物で輸入の許可を受けたものについて、特例申告書を作成し、当該許可の日の属する月の翌月末日までに当該許可をした税関長に提出する。","c":["特例申告貨物で輸入許可を受けたものについて、許可の日の属する月の翌月末日までに提出する。","輸入許可の日の翌日までに提出する。","輸入申告の日までに提出する。","提出期限はない。"],"ans":0},{"i":492,"l":"kanzeiho","a":"基本通達（特例申告の納期限）","t":"select","tp":"特例申告の納期限","q":"期限内特例申告書に記載された関税の納期限に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第9条第2項・通達。期限内特例申告書に記載された納付すべき税額は、特例申告書の提出期限（=許可の日の属する月の翌月末日）までに納付する。","c":["特例申告書の提出期限（許可の日の属する月の翌月末日）が納期限となる。","輸入申告の日が納期限である。","輸入許可の日が納期限である。","納期限の定めはない。"],"ans":0},{"i":493,"l":"kanzeiho","a":"基本通達（修正申告の効果）","t":"select","tp":"修正申告と加算税","q":"輸入許可後の修正申告と過少申告加算税の関係に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。調査による更正を予知してされたものでない自発的な修正申告については、過少申告加算税が軽減又は課されない場合がある（自発的な是正の促進）。","c":["更正を予知してされたものでない修正申告については、過少申告加算税が軽減・不適用となる場合がある。","修正申告には常に過少申告加算税が課される。","修正申告に加算税は一切課されない。","修正申告は加算税と無関係である。"],"ans":0},{"i":494,"l":"kanzeiho","a":"基本通達（更正の請求の期限）","t":"select","tp":"更正の請求の期限","q":"更正の請求の期限に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の15・通達。更正の請求は、原則として法定納期限等から所定の期間（一定年数）内に限り行うことができる（後発的事由による特則あり）。","c":["更正の請求は、原則として法定納期限等から所定の期間内に限り行うことができる。","更正の請求に期限はない。","更正の請求は輸入許可と同時にしかできない。","更正の請求は税関長が行う。"],"ans":0},{"i":495,"l":"kanzeiho","a":"基本通達（再調査の請求の期限）","t":"select","tp":"再調査の請求の期限","q":"税関長の処分に対する再調査の請求の期限に関する記述として、最も適切なものを一つ選びなさい。","e":"行政不服審査法・関税法・通達。再調査の請求は、原則として処分があったことを知った日の翌日から所定の期間（3月）内に税関長に対して行う（審査請求の期限も同様の枠組み）。","c":["再調査の請求は、原則として処分があったことを知った日の翌日から所定の期間内に行う。","再調査の請求に期限はない。","再調査の請求は処分前に行う。","再調査の請求は財務大臣に行う。"],"ans":0},{"i":496,"l":"kanzeiho","a":"基本通達（審査請求と裁決）","t":"select","tp":"審査請求の裁決","q":"関税に関する審査請求に対する裁決に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。関税に関する審査請求について、財務大臣は原則として関税等不服審査会に諮問し、その議を経て裁決を行う（公正性の確保）。","c":["財務大臣は、原則として関税等不服審査会に諮問し、その議を経て審査請求に対する裁決を行う。","審査請求は税関長が裁決する。","審査請求に諮問は不要である。","審査請求の制度はない。"],"ans":0},{"i":497,"l":"kanzeiho","a":"基本通達（特例輸入者の承認取消し）","t":"select","tp":"特例輸入者の承認取消事由","q":"特例輸入者の承認の取消しに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の12・通達。特例輸入者の承認は、特例輸入関税関係帳簿の備付け・記載・保存が法令に従っていないとき、帳簿・書類に不実の記載があるとき、承認の要件を欠くに至ったとき等に取り消されうる。","c":["帳簿が法令に従って備え付け・保存されていないとき、帳簿書類に不実の記載があるとき等は承認の取消事由となりうる。","帳簿の不備は承認に影響しない。","承認は取り消されない。","取消しは財務大臣が行う。"],"ans":0},{"i":498,"l":"kanzeiho","a":"基本通達（蔵置期間の延長）","t":"select","tp":"蔵置期間延長の取扱い","q":"保税蔵置場の外国貨物の蔵置期間の延長に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第43条の2・通達。保税蔵置場の外国貨物の蔵置期間は原則として蔵入承認の日から2年。税関長は必要があると認めるときこれを延長できる。","c":["蔵置期間は原則として蔵入承認の日から2年であり、税関長は必要があると認めるとき延長できる。","蔵置期間は延長できない。","蔵置期間は原則6月である。","蔵置期間に上限はない。"],"ans":0},{"i":499,"l":"kanzeiho","a":"基本通達（包括保税運送）","t":"select","tp":"包括保税運送の承認","q":"保税運送の包括承認に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第63条・通達。同一区間で継続的・反復的に行われる保税運送について、一定の期間・範囲を指定して一括して承認する包括保税運送承認の取扱いがある。","c":["同一区間で継続的・反復的に行われる保税運送について、一定期間・範囲を指定して一括承認する取扱いがある。","保税運送は常に個別承認のみである。","包括承認は輸出貨物のみが対象である。","包括承認の制度はない。"],"ans":0},{"i":500,"l":"kanzeiho","a":"基本通達（保税蔵置場の許可期間）","t":"select","tp":"保税蔵置場の許可期間と更新","q":"保税蔵置場の許可の期間に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。保税蔵置場の許可には許可の期間が定められ、申請により税関長が更新できる（施設・管理状況等を勘案して標準的な年数を踏まえ設定される）。","c":["保税蔵置場の許可には期間が定められ、申請により税関長が更新できる。","保税蔵置場の許可は無期限である。","許可期間は更新できない。","許可期間は財務大臣が定める。"],"ans":0},{"i":501,"l":"kanzeiho","a":"基本通達67-3-1","t":"select","tp":"輸入申告の効力発生時","q":"輸入申告の効力が生ずる時期に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-1。法第67条に規定する輸入申告は、税関がこれを受理した時にその効力を生ずる。","c":["輸入申告は、税関がこれを受理した時にその効力を生ずる。","輸入申告は、申告書を作成した時に効力を生ずる。","輸入申告は、輸入の許可の時に効力を生ずる。","輸入申告は、貨物が保税地域に搬入された時に効力を生ずる。"],"ans":0},{"i":502,"l":"kanzeiho","a":"基本通達67-3-3の2","t":"select","tp":"貨物を輸入しようとする者（賃貸借）","q":"賃貸借契約に基づき輸入される貨物の「貨物を輸入しようとする者」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-3の2。輸入取引によらない貨物については輸入貨物の処分の権限を有する者等をいい、賃貸借契約に基づき輸入される貨物については当該貨物を賃借して使用する者が該当する。","c":["当該貨物を賃借して使用する者が「貨物を輸入しようとする者」に該当する。","賃貸人が輸入しようとする者である。","運送業者が輸入しようとする者である。","賃貸借貨物には輸入者の概念がない。"],"ans":0},{"i":503,"l":"kanzeiho","a":"基本通達67-3-3の2","t":"select","tp":"貨物を輸入しようとする者（委託販売）","q":"委託販売のために輸入される貨物の「貨物を輸入しようとする者」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-3の2。委託販売のために輸入される貨物については、当該貨物の販売の委託を受けて自己（受託者）の名義をもって販売する者が「貨物を輸入しようとする者」に該当する。","c":["販売の委託を受けて自己（受託者）の名義をもって販売する者が該当する。","委託者が輸入しようとする者である。","最終消費者が輸入しようとする者である。","委託販売貨物に輸入者はいない。"],"ans":0},{"i":504,"l":"kanzeiho","a":"基本通達67-3-3の2","t":"select","tp":"貨物を輸入しようとする者（加工修繕・滅却）","q":"加工・修繕又は滅却のために輸入される貨物の「貨物を輸入しようとする者」に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-3の2。加工・修繕のために輸入される貨物は当該貨物を加工・修繕する者、滅却のために輸入される貨物は当該貨物を滅却する者が「貨物を輸入しようとする者」に該当する（いずれも納税義務を負う）。","c":["加工・修繕のための貨物は加工・修繕する者、滅却のための貨物は滅却する者が該当する。","いずれも荷送人が該当する。","いずれも運送業者が該当する。","加工・滅却貨物には輸入者の概念がない。"],"ans":0},{"i":505,"l":"kanzeiho","a":"基本通達67-3-8","t":"select","tp":"輸入検査の種類","q":"輸入貨物の検査の種類に含まれないものを一つ選びなさい。","e":"関税法基本通達67-3-8。輸入貨物の検査は、現場検査・本船検査・ふ中検査・検査場検査・委任検査の5種類。「巡回検査」という類型はない。","c":["現場検査","本船検査","ふ中検査","巡回検査"],"ans":3},{"i":506,"l":"kanzeiho","a":"基本通達67-3-8","t":"select","tp":"現場検査の対象貨物","q":"現場検査（現に置かれている場所で行う検査）の対象に含まれないものを一つ選びなさい。","e":"関税法基本通達67-3-8(2)。現場検査の対象は、巨大重量貨物、危険貨物、腐敗・損傷貨物やばら積貨物、検査個数が多い貨物、品名詐称のおそれがある貨物等、検査場搬入が困難・不適当な貨物。検査場搬入が容易な小口貨物は対象でない。","c":["巨大重量貨物","火薬・劇薬その他の危険貨物","腐敗・損傷した貨物又はそのおそれのある貨物","通常の小口貨物で検査場搬入が容易なもの"],"ans":3},{"i":507,"l":"kanzeiho","a":"基本通達67-3-10","t":"select","tp":"輸入検査の方法","q":"輸入検査の方法の種類に含まれないものを一つ選びなさい。","e":"関税法基本通達67-3-10。輸入検査の方法は、見本確認・一部指定検査・全部検査の3種類。「推定検査」という方法はない。","c":["見本確認","一部指定検査","全部検査","推定検査"],"ans":3},{"i":508,"l":"kanzeiho","a":"基本通達67-3-10","t":"select","tp":"見本確認の対象","q":"見本確認の方法による検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-10(1)。見本確認は、数量の確認を必要としない貨物につきその一部を見本として採取し、関税率表分類・統計分類・価格鑑定・他法令確認等の検査鑑定をする方法。","c":["数量の確認を必要としない貨物につき、その一部を見本として採取し検査鑑定する方法である。","見本確認は数量査定のための方法である。","見本確認は全部検査と同じである。","見本確認は数量の確認が必要な貨物に行う。"],"ans":0},{"i":509,"l":"kanzeiho","a":"基本通達67-3-10","t":"select","tp":"一部指定検査","q":"一部指定検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-10(2)。一部指定検査は、性質・数量の確認を要する貨物のうち均質等量に包装されたもの等につき、一部の検査・数量査定により申告貨物全体の性質・数量を認定する方法。","c":["均質等量に包装された貨物等につき、その一部を検査して全体の性質・数量を認定する方法である。","一部指定検査は全数量を実測する方法である。","一部指定検査は見本確認と同じである。","一部指定検査は数量確認を要しない貨物に行う。"],"ans":0},{"i":510,"l":"kanzeiho","a":"基本通達67-3-7","t":"select","tp":"特例申告貨物の輸入申告の撤回","q":"特例申告貨物の輸入申告の撤回に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-7。特例申告貨物の輸入申告（輸入引取申告）の撤回は、提出後に積戻し・保税運送の必要が生じた等の理由により、輸入の許可までに撤回の申出があった場合に認めて差し支えない。","c":["積戻し・保税運送の必要が生じた等の理由で、輸入の許可までに撤回の申出があった場合は撤回を認めて差し支えない。","輸入申告は一切撤回できない。","撤回は輸入許可後でもできる。","撤回には財務大臣の許可を要する。"],"ans":0},{"i":511,"l":"kanzeiho","a":"基本通達67-3-2","t":"select","tp":"輸入申告書の通数","q":"輸入（納税）申告書の提出に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-2。輸入（納税）申告書は原本・許可書用・統計用の3通を提出するのが原則。ただし統計基本通達に掲げる一定の貨物等については統計用の提出を要しない場合がある。","c":["原本・許可書用・統計用の3通を提出するのが原則だが、一定の場合は統計用の提出を要しない。","申告書は1通のみ提出する。","申告書は常に5通提出する。","提出通数に定めはない。"],"ans":0},{"i":512,"l":"kanzeiho","a":"基本通達67-3-4","t":"select","tp":"輸入申告書の添付書類","q":"輸入申告書に添付する書類に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-4。輸入申告書には、許可の判断に必要があるとき仕入書等を添付させ、経済産業大臣等の輸入承認証、他法令の許可・承認等を証する書類、減免税の書類、EPA・特恵の原産地証明書等を必要に応じ添付させる。","c":["輸入の許可の判断のために必要があるときは仕入書等を添付させ、必要に応じ輸入承認証・他法令の証明書類等を添付させる。","輸入申告に添付書類は一切不要である。","仕入書は常に添付不要である。","添付書類は税関が作成する。"],"ans":0},{"i":513,"l":"kanzeiho","a":"基本通達67-3-5","t":"select","tp":"内容点検確認書","q":"通関業者が作成する内容点検確認書に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-5。通関業者が申告前に貨物の内容を点検して作成した「内容点検確認書」が輸入申告に添付されている場合は、税関は審査・検査の参考とする。","c":["通関業者が申告前に貨物の内容を点検して作成した内容点検確認書が添付されている場合は、審査・検査の参考とする。","内容点検確認書は法定の添付書類である。","内容点検確認書がないと申告できない。","内容点検確認書は税関が作成する。"],"ans":0},{"i":514,"l":"kanzeiho","a":"基本通達67-3-9","t":"select","tp":"事前検査ができる場合","q":"輸入申告の前に行う事前検査ができる場合に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-9。事前検査は、保税地域搬入後では数量確認が困難な大量ばら積貨物（穀物・砂糖等）や、適正な見本採取が困難な貨物（同時蔵置される石油等）等について、輸入申告の前に行うことができる。","c":["保税地域搬入後では数量確認が困難な大量ばら積貨物や、適正な見本採取が困難な貨物等の場合に行いうる。","事前検査はすべての貨物に行う。","事前検査は許可後に行う。","事前検査の制度はない。"],"ans":0},{"i":515,"l":"kanzeiho","a":"基本通達67-3-13","t":"select","tp":"検査における見本の採取","q":"輸入検査における見本の採取に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-13。検査における見本の採取は、関税率表分類・価格鑑定・他法令確認等の検査鑑定に必要な最小限度の数量とし、所定の方法により税関職員が行う。","c":["見本の採取は検査鑑定に必要な最小限度の数量とし、所定の方法により行う。","見本は数量制限なく採取できる。","見本の採取に方法の定めはない。","見本の採取は輸入者が行う。"],"ans":0},{"i":516,"l":"kanzeiho","a":"基本通達67の2-3","t":"select","tp":"本船扱い・ふ中扱い","q":"本船扱い・ふ中扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67の2-3。巨大重量貨物・ばら積貨物等について、税関長の承認を受けて本船に積んだまま（本船扱い）又ははしけに積んだまま（ふ中扱い）輸入申告・検査を行う取扱いがある。","c":["一定の貨物について、税関長の承認を受けて本船上・はしけ内に置いたまま輸入申告・検査を行う取扱いがある。","貨物は必ず保税地域に搬入してから申告する。","本船扱いは輸出貨物のみである。","本船扱い・ふ中扱いの制度はない。"],"ans":0},{"i":517,"l":"kanzeiho","a":"基本通達67-1-3","t":"select","tp":"計量単位の換算基準","q":"輸入申告書への数量記載における計量単位の換算に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-1-3・67-3-3。ヤードポンド法等の計量単位で通常取引される貨物について、メートル法への換算を要する場合は所定の換算基準により換算して申告書に記載する。","c":["ヤードポンド法等で取引される貨物は、所定の換算基準によりメートル法に換算して記載する。","換算せずそのまま記載する。","計量単位の換算基準はない。","換算は輸入者が任意に行う。"],"ans":0},{"i":518,"l":"kanzeiho","a":"基本通達68-3-7","t":"select","tp":"協定税率の原産地証明書","q":"協定税率の適用を受けるための原産地証明書に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達68-3-7・令第61条。協定税率の適用には所定の場合に原産地証明書の提出を要するが、課税価格が一定額以下の貨物や、種類・形状により原産地が明らかと税関長が認めた貨物等は提出を要しない。","c":["一定の場合に原産地証明書の提出を要するが、貨物の種類・形状により原産地が明らかな貨物等は提出を要しない。","協定税率に原産地証明書は常に不要である。","原産地証明書は輸入者が作成する。","協定税率は原産地を問わない。"],"ans":0},{"i":519,"l":"kanzeiho","a":"基本通達68-5-6","t":"select","tp":"EPA原産地が明らかな貨物","q":"EPA税率における「原産地が明らかであると認めた貨物」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達68-5-6。EPAに係る「原産地が明らかであると認めた貨物」とは、輸出締約国固有の産品等であってHS6桁の輸入実績の太宗を占めるもの等であり、締約国原産地証明書等の提出を省略しうる。","c":["輸出締約国固有の産品等で過去の輸入実績の太宗を占めるもの等は、締約国原産地証明書等の提出を省略しうる。","EPA税率には常に原産地証明書を要する。","原産地が明らかな貨物の取扱いはない。","原産地の判断は輸入者が行う。"],"ans":0},{"i":520,"l":"kanzeiho","a":"基本通達67-3-4","t":"select","tp":"EPA税率と特例申告貨物","q":"EPA税率の適用に係る締約国原産地証明書等の提出と特例申告貨物の関係に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-4(4)。EPA税率の締約国原産地証明書等は、特例輸入者に係る特例申告貨物については原則として輸入申告時の提出を要せず、特例委託輸入者の場合は認定通関業者の確認が的確でない等徴収確保に支障がある場合に限り提出を要する。","c":["特例輸入者に係る特例申告貨物については、原則として締約国原産地証明書等の輸入申告時の提出を要しない取扱いがある。","特例申告貨物にも常に提出を要する。","特例申告貨物はEPA税率の適用を受けられない。","提出の要否は輸入者が決める。"],"ans":0},{"i":521,"l":"kanzeiho","a":"基本通達69の3-3","t":"select","tp":"知的財産侵害の認定手続（輸出）","q":"輸出貨物に係る知的財産侵害物品の認定手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達69の3-3。輸出に係る知的財産侵害疑義物品について、発見部門の長は見本を採取し保管証を作成して輸出者に交付する等の手続により認定手続を進める。","c":["発見部門の長は侵害疑義物品について見本を採取し、保管証を作成して輸出者に交付する等の手続をとる。","侵害疑義物品は直ちに廃棄する。","輸出貨物には知的財産の認定手続はない。","認定手続は輸出者が行う。"],"ans":0},{"i":522,"l":"kanzeiho","a":"基本通達67-3-6","t":"select","tp":"輸入申告の不受理","q":"輸入申告の不受理に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-6・67-1-9。必要な記載事項を欠く申告書、添付書類が整っていない申告等、申告として適式でないものは受理しない取扱いがある。","c":["必要な記載事項を欠く等、申告として適式でないものは受理しない取扱いがある。","輸入申告は常に受理される。","不受理の制度はない。","不受理は財務大臣が決める。"],"ans":0},{"i":523,"l":"kanzeiho","a":"基本通達67-3-20","t":"select","tp":"輸入許可の手続","q":"輸入の許可の手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-20等。輸入の許可は、関税等の納付（納期限延長の場合は担保枠）の確認と他法令の証明・確認が適法に行われた場合に、輸入申告書の許可書用に許可印を押なつし輸入許可書として交付する。","c":["関税等の納付（又は担保枠）の確認と他法令の証明・確認を経て、許可書用申告書に許可印を押なつして交付する。","輸入許可は口頭で行う。","関税納付の確認なしに許可する。","許可書は交付しない。"],"ans":0},{"i":524,"l":"kanzeiho","a":"基本通達67-3-2","t":"select","tp":"特例申告貨物の申告書の標題","q":"特例申告貨物の輸入申告書の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-2(2)。特例申告貨物の場合、輸入（納税）申告書の標題を「輸入（引取）申告書」と訂正のうえ所定の標記をし、令第59条の事項を記載して提出する（税額の申告は後日の特例申告書による）。","c":["輸入（納税）申告書の標題を「輸入（引取）申告書」と訂正し、所定の事項を記載して提出する。","特例申告貨物も通常の輸入（納税）申告書をそのまま用いる。","特例申告貨物に申告書は不要である。","標題の訂正は要しない。"],"ans":0},{"i":525,"l":"kanzeiho","a":"基本通達67-1-9","t":"select","tp":"輸出申告の不受理","q":"輸出申告の不受理に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-1-9。輸出申告についても、記載事項を欠く等申告として適式でないものは受理せず、補正を求める等の取扱いがある（輸入申告の不受理が準用される）。","c":["申告として適式でないものは受理せず、補正を求める等の取扱いがある。","輸出申告は常に受理される。","輸出申告に不受理はない。","不受理は財務大臣が決める。"],"ans":0},{"i":526,"l":"kanzeiho","a":"基本通達67-1-17","t":"select","tp":"開装検査票","q":"輸出貨物の開装検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-1-17。輸出貨物の検査のため開装した場合について、開装検査票を作成する等、検査の事実を記録する所定の取扱いがある。","c":["検査のため開装した貨物について、開装検査票を作成する等の所定の取扱いがある。","開装検査の記録は作成しない。","輸出貨物は開装検査しない。","開装検査は輸入者が行う。"],"ans":0},{"i":527,"l":"kanzeiho","a":"基本通達7-7","t":"select","tp":"輸入申告書の撤回","q":"輸入（納税）申告書の撤回に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達7-7。輸入（納税）申告書の撤回は、輸入の許可前において、積戻し・保税運送の必要が生じた等の所定の事由により撤回の申出があった場合に認めうる。","c":["輸入の許可前において、所定の事由により申告書の撤回の申出があった場合は撤回を認めうる。","輸入申告書は撤回できない。","撤回は輸入許可後に行う。","撤回には財務大臣の許可を要する。"],"ans":0},{"i":528,"l":"kanzeiho","a":"基本通達7-19","t":"select","tp":"事前照会への口頭回答","q":"輸入貨物に係る事前照会への回答に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達7-19等。事前照会（事前教示）には文書による回答と口頭による回答があり、文書回答は一定期間尊重されるのに対し口頭回答は尊重の扱いが異なる。","c":["事前照会には文書による回答のほか口頭による回答の取扱いがあるが、尊重の程度等が異なる。","事前照会への回答は文書に限られる。","事前照会の制度はない。","回答は輸入許可後に行う。"],"ans":0},{"i":529,"l":"kanzeiho","a":"基本通達67の2-3","t":"select","tp":"本船扱いの承認対象","q":"本船扱いの承認の対象に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67の2-3。本船扱いは、巨大重量貨物・ばら積貨物等、保税地域への搬入が困難又は不適当な貨物等について税関長の承認により認められ、本船上で申告・検査を行う。","c":["巨大重量貨物・ばら積貨物等、保税地域に搬入することが困難又は不適当な貨物について承認される。","あらゆる貨物が本船扱いの対象である。","本船扱いは小口貨物が対象である。","本船扱いに対象の限定はない。"],"ans":0},{"i":530,"l":"kanzeiho","a":"基本通達67-3-4","t":"select","tp":"仕入書の添付","q":"輸入申告書への仕入書の添付に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-4。輸入申告書には、輸入の許可の判断のために必要があるとき仕入書等を添付させる。通達等で提出の省略を認めている場合以外が「必要があるとき」に当たる。","c":["輸入の許可の判断のために必要があるときに仕入書等を添付させ、必要がない場合は添付の省略を認める取扱いがある。","仕入書は常に添付を要する。","仕入書の添付は一切不要である。","仕入書は税関が作成する。"],"ans":0},{"i":531,"l":"kanzeiho","a":"基本通達（輸出申告の効力）","t":"select","tp":"輸出申告の効力発生時","q":"輸出申告の効力が生ずる時期に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）。輸出申告も輸入申告と同様、税関がこれを受理した時にその効力を生ずる。","c":["輸出申告は、税関がこれを受理した時にその効力を生ずる。","輸出申告は、申告書作成時に効力を生ずる。","輸出申告は、許可時に効力を生ずる。","輸出申告は、船積み時に効力を生ずる。"],"ans":0},{"i":532,"l":"kanzeiho","a":"基本通達（特定委託輸出申告）","t":"select","tp":"特定委託輸出者","q":"特定委託輸出者に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第67条の3・通達。特定委託輸出者（認定通関業者に通関手続を委託した者）は、貨物を保税地域等に入れることなく、その置かれている場所から輸出申告して許可を受けられる。","c":["認定通関業者に輸出に係る通関手続を委託した者は、貨物を保税地域に入れずに輸出申告できる場合がある。","特定委託輸出者は税関長の承認を受けた者である。","特定委託輸出者の制度はない。","特定委託輸出は財務大臣の許可による。"],"ans":0},{"i":533,"l":"kanzeiho","a":"基本通達（輸出貨物の検査）","t":"select","tp":"輸出検査の準用","q":"輸出貨物の検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）。輸出貨物の検査についても、検査の種類・方法・見本採取等につき、一般輸入通関に係る規定に準じた取扱いが定められている。","c":["輸出貨物の検査についても、検査の種類・方法等につき輸入検査に準じた取扱いがある。","輸出貨物は検査しない。","輸出検査は輸入検査と全く別個の独自体系である。","輸出検査は輸入者が行う。"],"ans":0},{"i":534,"l":"kanzeiho","a":"基本通達（積戻し申告）","t":"select","tp":"積戻し申告の準用","q":"外国貨物の積戻し申告に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第75条・通達。外国貨物の積戻し申告には、輸出申告に関する申告手続・検査・許可等の規定が準用される。","c":["積戻し申告には輸出申告に関する手続・検査・許可の規定が準用される。","積戻し申告は輸入申告の手続による。","積戻しに申告は不要である。","積戻しは財務大臣の許可による。"],"ans":0},{"i":535,"l":"kanzeiho","a":"基本通達（輸入許可前引取り）","t":"select","tp":"BP承認の担保","q":"輸入の許可前における貨物の引取り（BP）の承認に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第73条・通達。輸入許可前引取り（BP）は関税額に相当する担保を提供して税関長の承認を受ける。承認を受けた貨物は課税物件確定時期等一定の規定を除き内国貨物とみなされる。","c":["関税額に相当する担保を提供して税関長の承認を受け、承認後の貨物は一定の規定を除き内国貨物とみなされる。","BP承認に担保は不要である。","BP承認後も外国貨物のままである。","BP承認は財務大臣が行う。"],"ans":0},{"i":536,"l":"kanzeiho","a":"基本通達（郵便物の課税）","t":"select","tp":"郵便物の直課税扱い","q":"輸入郵便物の課税手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第76条・通達。課税価格が一定額以下の輸入郵便物は輸入申告を要せず、税関の検査・税額通知（賦課課税方式）により通関される。一定額を超えるものは輸入申告を要する。","c":["一定額以下の課税価格の郵便物は、輸入申告を要せず税関の検査・賦課課税方式により通関される。","すべての郵便物に輸入申告を要する。","郵便物は課税されない。","郵便物は必ず申告納税方式による。"],"ans":0},{"i":537,"l":"kanzeiho","a":"基本通達（開庁時間外執務）","t":"select","tp":"時間外執務の届出","q":"開庁時間外に税関の事務の執行を求める場合の手続に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第98条・通達。開庁時間外に輸入の許可等の事務の執行を求めようとするときは、あらかじめその旨を税関長に届け出る（手数料を要する場合がある）。","c":["あらかじめその旨を税関長に届け出ることにより、開庁時間外の事務の執行を求めることができる。","時間外執務は求められない。","時間外執務の届出は事後でよい。","時間外執務は財務大臣に届け出る。"],"ans":0},{"i":538,"l":"kanzeiho","a":"基本通達（特例輸入者の輸入許可）","t":"select","tp":"特例輸入者の検査省略","q":"特例輸入者に係る特例申告貨物の輸入許可に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-20等。特例輸入者に係る特例申告貨物の輸入申告（保税地域搬入前）について、検査等の必要がないと認められる場合に輸入を許可する取扱いがある（AEOによる迅速通関）。","c":["保税地域搬入前の輸入申告について、検査等の必要がないと認められる場合に輸入を許可する取扱いがある。","特例輸入者にも常に検査を行う。","特例輸入者は輸入申告を要しない。","特例輸入者の許可は財務大臣が行う。"],"ans":0},{"i":539,"l":"kanzeiho","a":"基本通達（委任検査）","t":"select","tp":"委任検査","q":"委任検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-8(6)。委任検査は、貨物の蔵置場所（遠隔地の飼料工場等）等を勘案し、一部の貨物の現品検査を保税取締部門の職員に委任して行う検査。書類の送達は施封して行う。","c":["貨物の蔵置場所等を勘案し、一部の貨物の現品検査を保税取締部門の職員に委任して行う検査である。","委任検査は輸入者に検査を委任する方法である。","委任検査は通関業者が行う。","委任検査の制度はない。"],"ans":0},{"i":540,"l":"kanzeiho","a":"基本通達（検査場検査）","t":"select","tp":"検査場検査","q":"検査場検査に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-8(5)。検査場検査は、現場検査・本船検査・ふ中検査の対象貨物以外の貨物について、税関検査場に搬入させて行う検査（見本確認の場合は他の税関庁舎に搬入させてもよい）。","c":["現場検査・本船検査・ふ中検査の対象貨物以外の貨物について、税関検査場に搬入させて行う検査である。","検査場検査は本船上で行う。","検査場検査は巨大重量貨物に行う。","検査場検査の制度はない。"],"ans":0},{"i":541,"l":"kanzeiho","a":"基本通達（高価品の見本確認）","t":"select","tp":"高価品等の見本確認","q":"見本確認における高価な貨物等の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-10(1)ロ。高価な貨物（貴石・貴金属製品・こっとう品等）、汚染・損傷しやすい貨物、外装検査を要する貨物等は、各種類ごとの1梱包を見本として税関検査場に搬入させて検査する。","c":["貴石・貴金属製品・こっとう品等の高価な貨物は、各種類ごとの1梱包を見本として税関検査場に搬入させて検査する。","高価品は蔵置場所で開梱して検査する。","高価品は検査しない。","高価品の見本確認に定めはない。"],"ans":0},{"i":542,"l":"kanzeiho","a":"基本通達67-3-2","t":"select","tp":"受理印・審査印","q":"輸入申告書の処理に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-2。税関が輸入申告を受理したときは申告書の受理欄に受理印を押なつし、その審査が終了したときは原本の審査欄に審査印を押なつする。","c":["税関が申告を受理したときは受理欄に受理印を、審査が終了したときは原本の審査欄に審査印を押なつする。","申告書に押印はしない。","受理印のみで審査印はない。","押印は輸入者が行う。"],"ans":0},{"i":543,"l":"kanzeiho","a":"基本通達（統計用提出の省略）","t":"select","tp":"統計用申告書の省略","q":"輸入申告書の統計用の提出に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-2。統計基本通達21-2に掲げる貨物（一定のものを除く）については、減免税を受けようとする1品目の価格が20万円を超えるものを除き、統計用の提出を要しない。","c":["統計基本通達に掲げる一定の貨物については、原則として統計用の提出を要しない。","統計用は常に提出を要する。","統計用の提出に例外はない。","統計用は税関が作成する。"],"ans":0},{"i":544,"l":"kanzeiho","a":"基本通達（蔵入申請の手続）","t":"select","tp":"蔵入申請の手続","q":"保税蔵置場への蔵入承認の申請手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第43条の3・通達。保税蔵置場に外国貨物を3月を超えて置こうとする者は、所定の蔵入承認申請書を税関長に提出して承認を受ける（課税物件確定時期が蔵入承認時となる）。","c":["蔵入承認を受けようとする者は、所定の申請書を税関長に提出して承認を受ける。","蔵入承認に申請は不要である。","蔵入承認は財務大臣が行う。","蔵入承認は口頭でよい。"],"ans":0},{"i":545,"l":"kanzeiho","a":"基本通達（検査の立会い）","t":"select","tp":"検査の立会い","q":"輸入貨物の検査の立会いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。輸入貨物の検査に際しては、開梱・現品確認等の適正を期すため、原則として申告者又はその代理人（通関業者等）を立ち会わせる取扱いがある。","c":["検査に際しては、原則として申告者又はその代理人を立ち会わせる取扱いがある。","検査に立会いは認められない。","立会いは税関が拒否する。","立会いに関する取扱いはない。"],"ans":0},{"i":546,"l":"kanzeiho","a":"基本通達（仕入書の言語）","t":"select","tp":"仕入書の取扱い","q":"輸入申告に添付する仕入書の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達・課税価格通達。仕入書（インボイス）は取引の内容（品名・数量・価格・取引条件等）を明らかにする書類として、申告審査・課税価格の計算の基礎とされる。","c":["仕入書は取引の内容（品名・数量・価格等）を明らかにするものとして、審査・課税価格計算の基礎とされる。","仕入書は審査に用いない。","仕入書は日本語のものに限る。","仕入書は課税価格計算に関係しない。"],"ans":0},{"i":547,"l":"kanzeiho","a":"基本通達（許可書の交付）","t":"select","tp":"輸入許可書の交付","q":"輸入許可書の交付に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-20等。輸入を許可したときは、輸入申告書の許可書用の1通に許可印を押なつし、これを輸入許可書として申告者に交付する。","c":["輸入を許可したときは、許可書用の申告書に許可印を押なつし、これを輸入許可書として申告者に交付する。","許可書は交付しない。","許可書は税関が保管する。","許可書は口頭で告知する。"],"ans":0},{"i":548,"l":"kanzeiho","a":"基本通達（数量の認定）","t":"select","tp":"申告数量の認定","q":"輸入貨物の申告数量に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-3。申告前に検量機関等により数量の測定が行われ数量が明らかな場合はその数量を、その他の場合は仕入書等に記載された数量を、それぞれ申告させる。","c":["検量機関等により数量が測定され明らかな場合はその数量を、その他の場合は仕入書等記載の数量を申告させる。","数量は常に推定で申告する。","数量の申告は不要である。","数量は税関が決定する。"],"ans":0},{"i":549,"l":"kanzeiho","a":"基本通達（納税義務との関係）","t":"select","tp":"輸入者と納税義務","q":"「貨物を輸入しようとする者」と納税義務の関係に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-3の2・第6条。「貨物を輸入しようとする者」（賃借使用者・受託販売者・加工修繕者・滅却者等を含む）は、法第6条に基づき当該貨物に係る関税を納付する義務を負う。","c":["「貨物を輸入しようとする者」は、法第6条に基づき当該貨物に係る関税を納付する義務を負う。","輸入しようとする者に納税義務はない。","納税義務は荷送人が負う。","納税義務は通関業者が負う。"],"ans":0},{"i":550,"l":"kanzeiho","a":"基本通達（特例委託輸入者の許可）","t":"select","tp":"特例委託輸入者の輸入許可","q":"特例委託輸入者に係る特例申告貨物の輸入許可に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達67-3-20等。特例委託輸入者に係る特例申告貨物の輸入申告については、審査及び必要な検査が終了するとともに輸入を許可する取扱いがある（特例輸入者の検査省略の扱いとは区別）。","c":["審査及び必要な検査が終了するとともに輸入を許可する取扱いがある。","特例委託輸入者には許可がされない。","特例委託輸入者は検査を要しない。","許可は財務大臣が行う。"],"ans":0},{"i":551,"l":"teiritsuho","a":"基本通達14（再輸入免税の輸出された貨物）","t":"select","tp":"再輸入免税「輸出された貨物」","q":"再輸入される本邦製品の無条件免税における「輸出された貨物」の意義に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。再輸入される本邦製品の免税の「輸出された貨物」には、輸出許可を受けた貨物のほか、郵便により本邦から輸出されたことが明らかな貨物、誤積みのため再輸入される輸出貨物等を含む。","c":["関税法第67条の輸出の許可を受けた貨物のほか、郵便により本邦から輸出されたことが明らかな貨物等を含む。","輸出許可を受けた貨物のみをいう。","郵便で輸出された貨物は含まない。","「輸出された貨物」の意義は定められていない。"],"ans":0},{"i":552,"l":"teiritsuho","a":"基本通達14（性質・形状が変わっていない）","t":"select","tp":"再輸入免税の同一性","q":"再輸入免税の「その輸出の許可の際の性質及び形状が変わっていないもの」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。「その輸出の許可の際の性質及び形状が変わっていないもの」とは、輸出の際の品質・規格・形状等が輸入の際において同一のものであることをいう（外国での加工等で性質が変わったものは該当しない）。","c":["輸出の際の品質・規格・形状等が輸入の際において同一のものであることをいう。","外国で加工されたものも含む。","性質・形状が変わっても免税される。","同一性は問わない。"],"ans":0},{"i":553,"l":"teiritsuho","a":"基本通達14（再輸入容器の課税価格）","t":"select","tp":"再輸入容器の課税価格（FOB）","q":"免税に関連する再輸入容器の課税価格に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。再輸入容器が輸出の際に輸出貨物の容器として使用されたものであるときは、便宜その輸出の際のFOB価格を、使用されたものでないときはFOB価格に往路の運賃・保険料を加えた価格を課税価格とする。","c":["再輸入容器が輸出の際に輸出貨物の容器として使用されたものであるときは、便宜その輸出の際のFOB価格を課税価格とする。","再輸入容器の課税価格は国内小売価格による。","再輸入容器は課税できない。","再輸入容器は無条件で免税される。"],"ans":0},{"i":554,"l":"teiritsuho","a":"基本通達14（容器入り貨物の控除）","t":"select","tp":"再輸入容器入り貨物の課税価格","q":"再輸入容器に詰められた内容貨物の課税価格に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。再輸入容器に詰められた貨物の課税価格は、容器を含む貨物全体の課税価格（法第4条〜第4条の9により算出）から、当該再輸入容器の課税価格を控除した価格とする。","c":["容器を含む貨物全体の課税価格から、再輸入容器の課税価格を控除した価格を内容貨物の課税価格とする。","容器と内容貨物を一体で課税する。","内容貨物に容器費用を加算する。","按分計算はしない。"],"ans":0},{"i":555,"l":"teiritsuho","a":"基本通達14-1","t":"select","tp":"内廷用品の無条件免税","q":"無条件免税のうち内廷用品に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14-1。法第14条第1号の内廷用品の無条件免税について、天皇及び内廷にある皇族の用に供される物品の用語の意義・取扱いが定められている。","c":["天皇及び内廷にある皇族の用に供される物品について、用語の意義・取扱いが定められている。","皇室用品にも課税される。","内廷用品は条件付免税である。","内廷用品の取扱いはない。"],"ans":0},{"i":556,"l":"teiritsuho","a":"基本通達14（船用品の免税）","t":"select","tp":"乗組員の携帯品等の免税","q":"船舶の乗組員に関連する免税の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。船舶の乗組員等に係る携帯品・職用品等について、用途・数量・下船の事情等の条件の下で関税を免除する取扱いが定められている。","c":["一定の乗組員等の携帯品・職用品等について、用途・数量等の条件の下で免税の取扱いがある。","乗組員の携帯品はすべて課税される。","乗組員に免税はない。","乗組員の携帯品は無条件・無制限に免税される。"],"ans":0},{"i":557,"l":"teiritsuho","a":"基本通達（特定用途免税の用途確認）","t":"select","tp":"特定用途免税の事後確認","q":"特定用途免税の事後確認に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達・第15条。特定用途免税は条件付免税であり、所定期間内の用途を確認し、用途外使用・譲渡等があれば免除された関税を徴収する（事後管理）。","c":["免税の用途に供されているかを所定期間確認し、用途外使用等があれば免除された関税を徴収する。","特定用途免税に事後確認はない。","用途外使用も免税が継続する。","事後確認は輸入者が行う。"],"ans":0},{"i":558,"l":"teiritsuho","a":"基本通達（再輸出免税の期間）","t":"select","tp":"再輸出免税の再輸出期間","q":"再輸出免税の再輸出期間に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第17条・通達。再輸出免税は、輸入の許可の日から原則1年（やむを得ない理由により税関長の承認を受けたときは延長）以内に再輸出されることを条件とする。","c":["輸入の許可の日から原則1年（税関長承認で延長可）以内に再輸出されることを要する。","再輸出期間は2年である。","再輸出期間に定めはない。","再輸出免税は再輸出しなくても維持される。"],"ans":0},{"i":559,"l":"teiritsuho","a":"基本通達（違約品の戻し税の期間）","t":"select","tp":"違約品戻し税の6月要件","q":"違約品等の再輸出に係る関税の払戻しの期間要件に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第20条・通達。違約品等の戻し税は、性質・形状に変更を加えず、輸入の許可の日から原則6月以内（税関長承認で最長1年）に保税地域等に入れて返送等することを要する。","c":["輸入の許可の日から原則6月以内に保税地域等に入れて返送等することを要する。","返送期間は2年である。","返送期間に定めはない。","違約品はいつでも戻し税を受けられる。"],"ans":0},{"i":560,"l":"teiritsuho","a":"基本通達（長期使用貨物の減税期間）","t":"select","tp":"長期使用貨物の輸出期間","q":"長期使用される一時輸入貨物の減税の輸出期間に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第18条・通達。長期間使用でき貸借・請負契約に基づき一時使用する政令指定貨物の減税は、輸入の許可の日から原則2年（特に長期にわたるものは最長5年）以内に輸出されることを要する。","c":["輸入の許可の日から原則2年（特に長期にわたるものは最長5年）以内に輸出されることを要する。","輸出期間は1年である。","輸出期間に定めはない。","減税は輸出しなくても維持される。"],"ans":0},{"i":561,"l":"teiritsuho","a":"基本通達（無条件免税の記録文書）","t":"select","tp":"記録文書等の無条件免税","q":"無条件免税の対象に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第14条・通達。無条件免税には、記録文書、注文の取集めのための見本（一定のもの）、再輸入される本邦製品等が含まれ、用途等の条件を課さずに免税される。","c":["記録文書・注文取集めのための見本・再輸入される本邦製品等が無条件免税の対象に含まれる。","国内販売用商品が無条件免税の対象である。","すべての輸入貨物が無条件免税である。","無条件免税の対象はない。"],"ans":0},{"i":562,"l":"teiritsuho","a":"基本通達（変質損傷減税の計算）","t":"select","tp":"変質損傷減税の方法","q":"輸入許可前に変質・損傷した貨物の減税の計算方法に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第10条・通達。変質・損傷による価格の低下率を基準として軽減する方法か、変質損傷後の性質・数量により課税した額との差額以内で軽減する方法による。","c":["価値の低下率を基準とする方法、又は変質損傷後の性質数量による課税額との差額以内で軽減する方法による。","一律半額とする。","変質損傷貨物は免税となる。","計算方法に定めはない。"],"ans":0},{"i":563,"l":"teiritsuho","a":"基本通達（加工修繕再輸入の課税標準）","t":"select","tp":"加工修繕再輸入の課税","q":"外国で加工・修繕した本邦製品の再輸入の減税に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第13条・通達。本邦から輸出して外国で加工・修繕した貨物の再輸入は、加工・修繕に要した費用等を課税標準として関税を軽減する（外国での付加価値分に対する課税）。","c":["加工・修繕に要した費用等を課税標準として関税を軽減し、製品全体には課税しない。","再輸入製品全体に課税する。","加工修繕貨物は免税される。","課税標準に定めはない。"],"ans":0},{"i":564,"l":"teiritsuho","a":"基本通達（特定用途免税の用途外）","t":"select","tp":"用途外使用時の徴収","q":"特定用途免税貨物を用途外に使用した場合の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第15条・通達。特定用途免税貨物を、定められた期間内に免税の用途以外に供し又はその用途に供する前に譲渡したときは、原則として免除された関税を直ちに徴収する。","c":["所定の期間内に用途以外に供し又は譲渡したときは、原則として免除された関税を直ちに徴収する。","用途外使用は自由である。","用途外使用しても関税は徴収されない。","徴収は財務大臣が行う。"],"ans":0},{"i":565,"l":"teiritsuho","a":"基本通達（外交官用貨物の相互条件）","t":"select","tp":"外交官用貨物免税の相互条件","q":"外交関係の貨物の免税に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法第16条・通達。本邦にある外国の大使館・領事館やその職員の用に供される一定の貨物は、外交関係条約・相互主義等の条件の下で関税が免除されうる。","c":["本邦にある外国の大使館等やその職員の用に供される一定の貨物は、相互条件等の下で免税となりうる。","外交関係の貨物は無条件・無制限に免税される。","外交関係の貨物に免税はない。","免税は財務大臣の裁量で決まる。"],"ans":0},{"i":566,"l":"teiritsuho","a":"基本通達（減免税申請の書類）","t":"select","tp":"減免税申請書類","q":"関税の減免税を受けるための申請に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法・関税法基本通達。減免税を受けようとする場合で輸入申告（特例申告貨物を除く）の際に特定の書類提出を要するときは、その書類を提出する。条件付免税には事後の用途確認・徴収を伴う。","c":["輸入申告（特例申告貨物を除く）の際に特定の書類提出を要するときは、その書類を提出して減免税の適用を受ける。","減免税は申請なく適用される。","減免税の書類は許可後に提出する。","減免税に書類は不要である。"],"ans":0},{"i":567,"l":"teiritsuho","a":"基本通達（誤積み再輸入）","t":"select","tp":"誤積み再輸入の確認","q":"誤積みのため再輸入される貨物の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。誤積みのため再輸入される貨物であって、当該輸入貨物が誤積みにより輸出された貨物であることを書類等により確認できるものは、再輸入免税の「輸出された貨物」に含まれる。","c":["誤積みにより輸出された貨物であることを書類等により確認できるものは、再輸入免税の「輸出された貨物」に含まれる。","誤積み貨物は再輸入免税の対象外である。","誤積みの確認は不要である。","誤積み貨物には課税される。"],"ans":0},{"i":568,"l":"teiritsuho","a":"基本通達（再輸入の同一性確認）","t":"select","tp":"再輸入の同一性確認措置","q":"再輸入免税のための同一性の確認に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。再輸入免税を受けようとする貨物について、輸出の際に再輸入の際の同一性の確認のため必要な措置（輸出時の確認申請等）をとることがある。","c":["輸出の際に、再輸入の際の同一性確認のため必要な措置（確認申請等）をとることがある。","同一性の確認は不要である。","同一性は輸入時のみ確認する。","同一性確認の措置はない。"],"ans":0},{"i":569,"l":"teiritsuho","a":"基本通達（保税工場からの積戻し）","t":"select","tp":"保税工場からの積戻し貨物","q":"保税工場から積み戻された貨物の一部が再輸入される場合の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14。保税工場から積み戻された貨物の一部が本体から取り外されて再輸入される場合で、当該貨物が積戻し前に明らかに内国貨物であったと認められるときは、再輸入免税の「輸出された貨物」に含まれうる。","c":["積戻し前に明らかに内国貨物であったと認められる部分は、再輸入免税の「輸出された貨物」に含まれうる。","保税工場からの積戻し貨物は再輸入免税の対象外である。","積戻し貨物はすべて外国貨物である。","保税工場からの貨物に免税はない。"],"ans":0},{"i":570,"l":"teiritsuho","a":"基本通達（無条件免税の納税申告）","t":"select","tp":"免税貨物の納税申告","q":"無条件免税を受けようとする場合の申告に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14等。無条件免税を受けようとする場合も、輸入申告において免税を受けようとする旨を明らかにし、その適用要件を証する必要な書類を提出する。","c":["免税を受けようとする旨を輸入申告において明らかにし、必要な書類を提出する。","免税貨物は申告を要しない。","免税は税関が職権で適用する。","免税の申告に書類は不要である。"],"ans":0},{"i":571,"l":"zanteiho","a":"暫定法基本通達4-2","t":"select","tp":"航空機部分品免税の対象者（運航者）","q":"航空機部分品等の免税を受けようとする者に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達4-2(1)。航空機の運航者が航空機に使用する部分品又はその製作素材を輸入する場合は、当該運航者が「関税の免除を受けようとする者」となる。","c":["航空機の運航者が航空機に使用する部分品等を輸入する場合は、当該運航者が免税を受けようとする者となる。","免税を受けようとする者は荷送人である。","免税申告者に定めはない。","免税は財務大臣が指定する者のみ。"],"ans":0},{"i":572,"l":"zanteiho","a":"暫定法基本通達4-2","t":"select","tp":"航空機部分品免税の対象者（製造者）","q":"航空機又はその部分品の製造・組立て・修理のために輸入する場合の免税を受けようとする者に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達4-2(2)。航空機又はその部分品の製造・組立て・修理のために輸入する場合は、当該製造・組立て・修理を行う者が「関税の免除を受けようとする者」となる。","c":["当該製造・組立て・修理を行う者が免税を受けようとする者となる。","運航者が免税を受けようとする者となる。","荷送人が免税を受けようとする者となる。","製造者は免税を受けられない。"],"ans":0},{"i":573,"l":"zanteiho","a":"暫定法基本通達（航空機部分品の承認）","t":"select","tp":"航空機部分品免税の承認","q":"航空機部分品等の免税に係る税関長の承認に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達。航空機部分品等の免税に係る税関長の承認について、過去に承認した例があり取締り上支障がないと認められるとき等は、調査依頼を行うことなく承認して差し支えない取扱いがある。","c":["取締り上支障がないと認められるとき等は、調査依頼を行うことなく承認して差し支えない取扱いがある。","承認には常に調査依頼を要する。","免税に承認は不要である。","承認は財務大臣が行う。"],"ans":0},{"i":574,"l":"zanteiho","a":"暫定法基本通達9-2","t":"select","tp":"減免対象施設の用語の意義","q":"暫定法基本通達における減免対象施設等の用語の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達9-2。減免税の対象となる施設等の範囲について用語の意義が定められ、関税定率法基本通達（児童福祉施設の範囲等）がこれを準用する場合がある。","c":["減免税の対象施設等の範囲について用語の意義が定められ、定率法基本通達がこれを準用する場合がある。","施設の範囲は法律のみで定まる。","用語の意義は通達にない。","施設の範囲は輸入者が定める。"],"ans":0},{"i":575,"l":"zanteiho","a":"暫定法（特恵原産地証明書の有効期間）","t":"select","tp":"特恵原産地証明書の有効期間","q":"特恵原産地証明書の有効期間に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。特恵原産地証明書（Form A等）は原則として発給の日から1年以内のものを提出することを要する（運送上の事由等による例外あり）。","c":["原産地証明書は原則として発給の日から1年以内のものを提出することを要する。","原産地証明書に有効期間はない。","有効期間は発給日から1月である。","有効期間は発給日から5年である。"],"ans":0},{"i":576,"l":"zanteiho","a":"暫定法（特恵原産地証明書の省略）","t":"select","tp":"特恵原産地証明書の提出省略","q":"特恵原産地証明書の提出を省略できる場合に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法施行令・通達。特恵関税の適用には原則として原産地証明書を要するが、課税価格の総額が一定額（20万円）以下の貨物や、種類・形状により原産地が明らかな貨物等については提出を省略しうる。","c":["課税価格の総額が一定額以下の貨物等については、原産地証明書の提出を省略しうる。","原産地証明書は常に省略できない。","省略は財務大臣が個別に認める。","原産地証明書の省略制度はない。"],"ans":0},{"i":577,"l":"zanteiho","a":"暫定法（特恵の直送原則）","t":"select","tp":"特恵の直送原則","q":"特恵原産地規則の積送基準（直送原則）に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。特恵には積送基準（直送原則）があり、原則として原産国から本邦へ直接運送されたものであることを要する。運送上・地理上の理由による第三国経由は、その国で取引・処分されない等の要件下で例外的に直送とみなされる。","c":["原則として原産国から本邦へ直接運送されたものであることを要し、第三国経由は一定要件下で例外的に認められる。","第三国経由でも無条件で特恵が適用される。","積送経路は特恵に関係しない。","直送原則は基本税率の要件である。"],"ans":0},{"i":578,"l":"zanteiho","a":"暫定法（特恵の累積）","t":"select","tp":"特恵の累積制度","q":"特恵原産地規則の累積に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。一定の地域的枠組み等において、複数の特恵受益国を一の国とみなして原産品の判断を行う累積の取扱いがある（原産材料の範囲を拡大する仕組み）。","c":["一定の場合、複数の特恵受益国を一の国とみなして原産品の判断を行う累積の取扱いがある。","累積制度は存在しない。","累積は先進国材料にも適用される。","累積は基本税率の要件である。"],"ans":0},{"i":579,"l":"zanteiho","a":"暫定法（特別特恵の対象）","t":"select","tp":"特別特恵受益国の指定","q":"特別特恵受益国に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。特別特恵受益国は後発開発途上国（LDC）のうち政令で指定された国であり、通常の特恵よりさらに優遇され、多くの品目で無税の特別特恵関税が適用される。","c":["後発開発途上国であって政令で指定された国が特別特恵受益国となり、多くの品目で無税の扱いを受ける。","すべての特恵受益国が特別特恵受益国である。","特別特恵受益国は先進国である。","特別特恵の指定制度はない。"],"ans":0},{"i":580,"l":"zanteiho","a":"暫定法（特恵の事後確認）","t":"select","tp":"特恵原産地の事後確認","q":"特恵関税適用後の原産地の事後確認に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。税関は輸入者等への質問・書類要求や輸出国当局への照会等により原産性を事後確認でき、原産性が確認できない場合は特恵税率の適用を否認し関税を徴収しうる。","c":["税関は輸入後も原産性を確認でき、確認できない場合は特恵の適用を否認し関税を徴収しうる。","輸入後の原産地確認は行われない。","事後確認で否認されることはない。","事後確認は輸出国が行う。"],"ans":0},{"i":581,"l":"zanteiho","a":"暫定法（特恵の僅少の非原産材料）","t":"select","tp":"特恵のデミニミス","q":"特恵原産地規則の僅少の非原産材料（許容限度）に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。実質的変更基準（関税分類変更基準）を満たさない非原産材料があっても、その価額・重量等の割合が一定の許容限度以下であれば、原産品と認められる取扱い（デミニミス）がある。","c":["関税分類変更基準を満たさない非原産材料があっても、その割合が一定以下であれば原産品と認められる場合がある。","非原産材料が含まれると常に原産品とならない。","僅少基準の取扱いはない。","僅少基準は完全生産品に適用される。"],"ans":0},{"i":582,"l":"zanteiho","a":"暫定法（暫定税率の適用期限）","t":"select","tp":"暫定税率の適用期限","q":"暫定税率の適用期限に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法第2条・通達。暫定税率は別表第一等に掲げる物品で一定期日までに輸入されるものに適用される時限的な税率で、適用期限は毎年度の関税改正で延長・改廃が検討される。","c":["暫定税率は別表に掲げる物品で一定期日までに輸入されるものに適用され、期限は毎年度の改正で見直される。","暫定税率に適用期限はない。","暫定税率は恒久的である。","暫定税率は輸出貨物に適用される。"],"ans":0},{"i":583,"l":"zanteiho","a":"暫定法（特恵の卒業）","t":"select","tp":"特恵の適用除外（卒業）","q":"特恵関税の適用除外（卒業）に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。経済発展により国際競争力をつけた特恵受益国・産品については、特恵関税の適用を除外・停止する（卒業）措置がとられる（全面卒業・部分卒業等）。","c":["国際競争力をつけた国・産品について、特恵関税の適用を除外・停止する措置がとられる。","特恵は一度供与すると除外されない。","卒業は基本税率の引下げを意味する。","卒業制度はない。"],"ans":0},{"i":584,"l":"zanteiho","a":"暫定法（特恵の緊急停止）","t":"select","tp":"特恵のエスケープクローズ","q":"特恵関税の緊急停止（エスケープ・クローズ）に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"暫定法・通達。特恵の供与により国内産業に重大な損害が生じる等の場合、緊急措置（エスケープ・クローズ）として特恵税率の適用を停止しうる。","c":["特恵の供与により国内産業に損害が生じる等のときは、緊急措置として特恵税率の適用を停止しうる。","特恵は停止されない。","停止は輸出国の同意を要する。","停止は基本税率の引下げを意味する。"],"ans":0},{"i":585,"l":"zanteiho","a":"暫定法（航空機部分品免税の趣旨）","t":"select","tp":"航空機部分品免税の政策目的","q":"航空機部分品等の免税の政策目的に関する通達・制度の記述として、最も適切なものを一つ選びなさい。","e":"暫定法。航空機部分品等の免税は、本邦で生産が困難な航空機・その部分品・製作素材等の輸入について、産業政策的観点から暫定的に関税を免除する制度である。","c":["国産化が困難な航空機・部分品等の輸入について、産業政策的観点から暫定的に免税するものである。","すべての機械部品の免税が目的である。","輸出促進が目的である。","政策目的はない。"],"ans":0},{"i":586,"l":"kanzeiho","a":"統計基本通達6-2","t":"select","tp":"再輸出品・再輸入品の定義","q":"外国貿易統計における「再輸出品」「再輸入品」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"統計基本通達6-2。再輸出品とは本邦から輸出する外国産貨物、再輸入品とは本邦に輸入する本邦産貨物をいう（原産国の認定基準は関税法施行令第4条の2第4項による）。","c":["再輸出品とは本邦から輸出する外国産貨物をいい、再輸入品とは本邦に輸入する本邦産貨物をいう。","再輸出品とは本邦産貨物の輸出をいう。","再輸出品・再輸入品の区別はない。","再輸出品とは輸入される外国産貨物をいう。"],"ans":0},{"i":587,"l":"kanzeiho","a":"統計基本通達7-1","t":"select","tp":"貿易相手国別分類","q":"外国貿易統計における国（貿易相手国）別分類に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"統計基本通達7-1等。貨物の国（貿易相手国）別分類について、輸出は仕向国（輸出貨物がその取引において最終的に仕向けられる国）、輸入は原産国を基準とする。","c":["輸出については仕向国（輸出貨物が取引において最終的に仕向けられる国）とする。","輸出については原産国とする。","輸出については船積港の所在国とする。","貿易相手国別分類はない。"],"ans":0},{"i":588,"l":"kanzeiho","a":"統計基本通達（単純な作業）","t":"select","tp":"原産国認定と単純な作業","q":"統計における原産国の認定に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"統計基本通達・関税法施行令第4条の2。原産国の認定において、単なる改装・仕分け・その他の手入れ、単純な混合・単純な分離、単純な組立て・分解等は、原産国を変更する実質的な加工・製造とは扱われない。","c":["単なる改装・仕分け・単純な混合・単純な組立て等は、原産国を変更する加工とは扱われない。","改装・仕分けにより原産国が変わる。","単純な組立てで原産国が変わる。","原産国認定に作業の内容は関係しない。"],"ans":0},{"i":589,"l":"kanzeiho","a":"統計基本通達（統計計上除外）","t":"select","tp":"統計計上の除外","q":"外国貿易統計の計上から除外される貨物に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"統計基本通達。臨特法・国連軍臨特法・MDA特例法等による一定の軍関係貨物・免税譲受貨物等、所定の貨物は外国貿易統計の計上から除外される取扱いがある。","c":["一定の軍関係貨物・国連軍関係貨物等、所定の貨物は統計計上から除外される取扱いがある。","すべての貨物が統計に計上される。","統計計上の除外はない。","除外は輸入者が決める。"],"ans":0},{"i":590,"l":"kanzeiho","a":"統計基本通達（水産物）","t":"select","tp":"本邦船舶の採捕水産物の統計","q":"本邦の船舶が外国で採捕した水産物の統計上の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"統計基本通達。本邦から出漁した本邦の船舶によって外国で採捕された水産物及びこれを原料として船内で加工・製造した貨物等について、所定の統計上の取扱い（定率法第14条との関係を含む）が定められている。","c":["本邦から出漁した本邦船舶が外国で採捕した水産物等は、所定の統計上の取扱いが定められている。","本邦船舶の採捕水産物は統計に計上しない。","採捕水産物の統計取扱いはない。","採捕水産物は外国産として計上する。"],"ans":0},{"i":591,"l":"kanzeiho","a":"基本通達（蔵入承認の課税物件）","t":"select","tp":"蔵入承認時の課税物件確定","q":"蔵入承認を受けた貨物の課税物件確定の時期に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第4条・通達。蔵入承認を受けた貨物の課税物件確定の時期は、原則として蔵入承認の時。長期蔵置中の性質変化に対応する申告時主義の例外。","c":["蔵入承認を受けた貨物の課税物件は、原則として蔵入承認の時の現況による。","蔵入承認貨物の課税物件は輸入申告時による。","蔵入承認に課税物件確定の効果はない。","蔵入承認貨物の課税物件は許可時による。"],"ans":0},{"i":592,"l":"kanzeiho","a":"基本通達（適用法令の特例）","t":"select","tp":"蔵入承認時の適用法令","q":"蔵入承認を受けた貨物の適用法令の時期に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第5条・通達。蔵入承認を受けた貨物については、適用法令の時期が原則（輸入申告時）と異なり、蔵入承認の時の法令によることがある（課税物件確定時期との整合）。","c":["蔵入承認を受けた貨物の適用法令は、原則として蔵入承認の時の法令による場合がある。","蔵入承認貨物の適用法令は契約時による。","蔵入承認に適用法令の効果はない。","蔵入承認貨物の適用法令は輸出申告時による。"],"ans":0},{"i":593,"l":"kanzeiho","a":"基本通達（BP承認後の更正）","t":"select","tp":"BP承認貨物の税額確定","q":"輸入許可前引取り（BP）承認を受けた貨物の税額確定に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の17・第74条・通達。BP承認を受けた貨物について、税関長は申告に係る税額等を書面で通知し、必要に応じ輸入許可前の更正等を経て関税を確定・徴収する。","c":["BP承認後、税関長は税額等を書面で通知し、必要に応じ輸入許可前の更正等が行われる。","BP承認貨物の税額は確定しない。","BP承認貨物には課税されない。","BP承認後の手続は不要である。"],"ans":0},{"i":594,"l":"kanzeiho","a":"基本通達（特例申告書の提出期限）","t":"select","tp":"特例申告書提出期限の再確認","q":"期限内特例申告書の提出期限に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の2・通達。特例申告貨物で輸入の許可を受けたものについて、特例申告書を作成し、当該許可の日の属する月の翌月末日までに当該許可をした税関長に提出する。","c":["輸入許可を受けたものについて、許可の日の属する月の翌月末日までに提出する。","許可の日の翌日までに提出する。","輸入申告の日までに提出する。","提出期限はない。"],"ans":0},{"i":595,"l":"kanzeiho","a":"基本通達（修正申告と加算税）","t":"select","tp":"自発的修正申告と加算税","q":"輸入許可後の自発的な修正申告と過少申告加算税の関係に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。調査による更正を予知してされたものでない自発的な修正申告については、過少申告加算税が課されない、又は軽減される場合がある（自発的是正の促進）。","c":["更正を予知してされたものでない修正申告については、過少申告加算税が課されない又は軽減される場合がある。","修正申告には常に加算税が課される。","修正申告に加算税は一切課されない。","修正申告は加算税と無関係である。"],"ans":0},{"i":596,"l":"kanzeiho","a":"基本通達（再調査の請求の期間）","t":"select","tp":"再調査の請求の期間","q":"税関長の処分に対する再調査の請求の期間に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"行政不服審査法・関税法・通達。再調査の請求は、原則として処分があったことを知った日の翌日から3月以内に税関長に対して行う。","c":["処分があったことを知った日の翌日から原則3月以内に行う。","再調査の請求に期間はない。","再調査の請求は処分前に行う。","再調査の請求は1年以内に行う。"],"ans":0},{"i":597,"l":"kanzeiho","a":"基本通達（審査請求と不服審査会）","t":"select","tp":"審査請求と諮問","q":"関税に関する審査請求の手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。関税に関する審査請求について、財務大臣は原則として関税等不服審査会に諮問し、その議を経て裁決を行う（公正性の確保）。","c":["財務大臣は、原則として関税等不服審査会に諮問し、その議を経て審査請求に対する裁決を行う。","審査請求は税関長が裁決する。","審査請求に諮問は不要である。","審査請求の制度はない。"],"ans":0},{"i":598,"l":"kanzeiho","a":"基本通達（収容課金の納付）","t":"select","tp":"収容貨物引取りの要件","q":"収容された貨物の引取りの要件に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第83条・通達。収容された貨物は、その関税等のほか収容に要した費用（収容課金）を納付することで収容を解除して引き取ることができる。","c":["関税等のほか収容に要した費用（収容課金）を納付することで、収容を解除して引き取ることができる。","収容貨物の引取りに費用はかからない。","収容貨物は引き取れない。","収容課金は輸出者が負担する。"],"ans":0},{"i":599,"l":"kanzeiho","a":"基本通達（公売代金の充当）","t":"select","tp":"公売代金の充当順位","q":"収容貨物の公売代金の処理に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第86条・通達。公売・売却の代金は、公売等の費用、関税・内国消費税等の順に充当され、残余があれば貨物の所有者等に交付される。","c":["公売代金は、公売費用・関税等に充て、残余があれば貨物の所有者等に交付される。","公売代金はすべて国庫に帰属する。","公売代金は輸出者に交付される。","公売代金の処理に定めはない。"],"ans":0},{"i":600,"l":"kanzeiho","a":"基本通達（質問検査権の性質）","t":"select","tp":"質問検査権と犯罪捜査","q":"税関職員の質問検査権の性質に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第105条・通達。質問検査権は適正な課税・通関の確保のための行政上の権限であり、犯罪捜査のために認められたものと解してはならない旨が定められている（犯則調査とは別）。","c":["適正な課税等のための行政上の権限であり、犯罪捜査のために認められたものと解してはならない。","犯罪捜査のための権限である。","税関長のみが行使する権限である。","質問検査権の性質は定められていない。"],"ans":0}];
/* ====== App ====== */
(function(){
  const LAW_LABELS={kanzeiho:"関税法",teiritsuho:"関税定率法",zanteiho:"暫定措置法",gyouho:"通関業法"};
  const LAW_ORDER=["kanzeiho","teiritsuho","zanteiho","gyouho"];
  // basis判定: id<=300 は条文, それ以降は通達（バッチ構成に基づく）
  function basisOf(q){ return q.i<=300 ? "jobun":"tsutatsu"; }

  const state={laws:new Set(LAW_ORDER),basis:new Set(["jobun","tsutatsu"]),order:"random",count:20,pool:[],idx:0,ok:0,ng:0,answered:false,results:[]};

  // ---- build setup chips ----
  const lawChips=document.getElementById("lawChips");
  LAW_ORDER.forEach(l=>{
    const n=QUESTIONS.filter(q=>q.l===l).length;
    const c=document.createElement("span");
    c.className="chip on";c.dataset.law=l;
    c.innerHTML=LAW_LABELS[l]+'<span class="ct">'+n+'</span>';
    c.onclick=()=>{toggleSet(state.laws,l,c);updatePool();};
    lawChips.appendChild(c);
  });
  const basisChips=document.getElementById("basisChips");
  [["jobun","条文"],["tsutatsu","通達"]].forEach(([b,lab])=>{
    const n=QUESTIONS.filter(q=>basisOf(q)===b).length;
    const c=document.createElement("span");
    c.className="chip on";c.dataset.basis=b;
    c.innerHTML=lab+'<span class="ct">'+n+'</span>';
    c.onclick=()=>{toggleSet(state.basis,b,c);updatePool();};
    basisChips.appendChild(c);
  });
  document.querySelectorAll("#orderChips .chip").forEach(c=>{
    c.onclick=()=>{document.querySelectorAll("#orderChips .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");state.order=c.dataset.order;};
  });
  document.querySelectorAll("#countChips .chip").forEach(c=>{
    c.onclick=()=>{document.querySelectorAll("#countChips .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");state.count=parseInt(c.dataset.count,10);updatePool();};
  });

  function toggleSet(set,val,el){
    if(set.has(val)){ if(set.size>1){set.delete(val);el.classList.remove("on");} }
    else{ set.add(val);el.classList.add("on"); }
  }

  function filtered(){
    return QUESTIONS.filter(q=>state.laws.has(q.l)&&state.basis.has(basisOf(q)));
  }
  function updatePool(){
    const f=filtered();
    const cnt=state.count===0?f.length:Math.min(state.count,f.length);
    document.getElementById("poolCount").textContent="該当 "+f.length+" 問中 "+cnt+" 問を出題";
    document.getElementById("startBtn").disabled=f.length===0;
  }
  updatePool();

  // ---- start ----
  document.getElementById("startBtn").onclick=()=>{
    let f=filtered().slice();
    if(state.order==="random"){ for(let i=f.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[f[i],f[j]]=[f[j],f[i]];} }
    else{ f.sort((a,b)=>a.i-b.i); }
    const cnt=state.count===0?f.length:Math.min(state.count,f.length);
    state.pool=f.slice(0,cnt);
    state.idx=0;state.ok=0;state.ng=0;state.results=[];
    document.getElementById("setup").classList.add("hide");
    document.getElementById("result").classList.add("hide");
    document.getElementById("quiz").classList.remove("hide");
    document.getElementById("qTotal").textContent=state.pool.length;
    renderQ();
  };

  function renderQ(){
    const q=state.pool[state.idx];
    state.answered=false;
    document.getElementById("qNum").textContent=state.idx+1;
    document.getElementById("okCount").textContent=state.ok;
    document.getElementById("ngCount").textContent=state.ng;
    document.getElementById("pbarFill").style.width=((state.idx)/state.pool.length*100)+"%";
    const basis=basisOf(q);
    const card=document.getElementById("qCard");
    card.className="card"+(basis==="tsutatsu"?" basis-tsutatsu":"");

    let html='<div class="meta-row">';
    html+='<span class="tag law">'+LAW_LABELS[q.l]+'</span>';
    html+='<span class="tag basis-'+basis+'">'+(basis==="jobun"?"条文":"通達")+'</span>';
    if(q.t==="fill")html+='<span class="tag fill">穴埋め</span>';
    if(q.tp)html+='<span class="tag" style="background:var(--ink-soft)">'+esc(q.tp)+'</span>';
    if(q.a)html+='<span class="src">'+esc(q.a)+'</span>';
    html+='</div>';
    html+='<div class="qtext">'+esc(q.q)+'</div>';

    if(q.t==="select"){
      html+='<ul class="opts" id="opts">';
      const nums=["①","②","③","④","⑤","⑥"];
      q.c.forEach((ch,i)=>{
        html+='<li class="opt" data-i="'+i+'"><span class="num">'+nums[i]+'</span><span>'+esc(ch)+'</span></li>';
      });
      html+='</ul>';
    }else{
      html+='<div class="fill-wrap"><input class="fill-input" id="fillIn" placeholder="答えを入力してEnter" autocomplete="off" autocapitalize="off"></div>';
      html+='<button class="btn btn-sm" id="fillBtn">答え合わせ</button>';
    }
    html+='<div class="explain" id="explain"></div>';
    html+='<div class="actions" id="actions"></div>';
    card.innerHTML=html;

    if(q.t==="select"){
      document.querySelectorAll("#opts .opt").forEach(o=>{ o.onclick=()=>selectOpt(parseInt(o.dataset.i,10)); });
    }else{
      const inp=document.getElementById("fillIn");
      const btn=document.getElementById("fillBtn");
      btn.onclick=checkFill;
      inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();if(!state.answered)checkFill();else nextQ();}});
      setTimeout(()=>inp.focus(),50);
    }
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function selectOpt(chosen){
    if(state.answered)return;
    state.answered=true;
    const q=state.pool[state.idx];
    const correct=q.ans;
    const isOk=chosen===correct;
    if(isOk)state.ok++;else state.ng++;
    state.results.push({law:q.l,basis:basisOf(q),ok:isOk});
    document.querySelectorAll("#opts .opt").forEach(o=>{
      const i=parseInt(o.dataset.i,10);
      o.classList.add("disabled");
      if(i===correct)o.classList.add("correct");
      else if(i===chosen)o.classList.add("wrong");
      else o.classList.add("dim");
    });
    showExplain(isOk,null,q);
    addNext();
    updateScoreHead();
  }

  function checkFill(){
    if(state.answered)return;
    const q=state.pool[state.idx];
    const inp=document.getElementById("fillIn");
    const v=norm(inp.value);
    const ans=(q.at||[]).map(norm);
    const isOk=ans.includes(v)&&v!=="";
    state.answered=true;
    if(isOk)state.ok++;else state.ng++;
    state.results.push({law:q.l,basis:basisOf(q),ok:isOk});
    inp.classList.add(isOk?"correct":"wrong");inp.disabled=true;
    document.getElementById("fillBtn").classList.add("hide");
    showExplain(isOk,(q.at||[])[0],q);
    addNext();
    updateScoreHead();
  }

  function showExplain(isOk,ansText,q){
    const ex=document.getElementById("explain");
    let h='<span class="verdict '+(isOk?"ok":"ng")+'">'+(isOk?"正解":"不正解")+'</span>';
    if(q.t==="select"){
      const nums=["①","②","③","④","⑤","⑥"];
      h+='<span class="ans-line">正解：'+nums[q.ans]+' '+esc(q.c[q.ans])+'</span><br>';
    }else if(ansText){
      h+='<span class="ans-line">正解：'+esc(ansText)+'</span><br>';
    }
    h+=esc(q.e);
    ex.innerHTML=h;ex.classList.add("show");
  }

  function addNext(){
    const act=document.getElementById("actions");
    const last=state.idx===state.pool.length-1;
    act.innerHTML='<div class="spacer"></div><button class="btn" id="nextBtn">'+(last?"結果をみる":"次の問題 →")+'</button>';
    document.getElementById("nextBtn").onclick=nextQ;
  }
  function updateScoreHead(){
    document.getElementById("okCount").textContent=state.ok;
    document.getElementById("ngCount").textContent=state.ng;
    document.getElementById("pbarFill").style.width=((state.idx+1)/state.pool.length*100)+"%";
  }

  function nextQ(){
    if(state.idx<state.pool.length-1){state.idx++;renderQ();}
    else showResult();
  }

  function showResult(){
    document.getElementById("quiz").classList.add("hide");
    document.getElementById("result").classList.remove("hide");
    const total=state.pool.length;
    document.getElementById("rScore").textContent=state.ok;
    document.getElementById("rTotal").textContent=total;
    const rate=total?Math.round(state.ok/total*100):0;
    let msg;
    if(rate>=90)msg="充分な仕上がり。この調子で。";
    else if(rate>=70)msg="合格圏。取りこぼしを潰していきましょう。";
    else if(rate>=50)msg="あと一歩。誤った分野を重点的に。";
    else msg="基礎の反復から。焦らず一問ずつ。";
    document.getElementById("rRate").textContent="正答率 "+rate+"％ ／ "+msg;

    // breakdown by law
    const bd=document.getElementById("breakdown");
    const byLaw={};
    state.results.forEach(r=>{ (byLaw[r.law]=byLaw[r.law]||{ok:0,n:0}); byLaw[r.law].n++; if(r.ok)byLaw[r.law].ok++; });
    let h='<div class="breakdown-title">分野別の正答率（このセッションのみ・保存されません）</div>';
    LAW_ORDER.forEach(l=>{
      if(!byLaw[l])return;
      const d=byLaw[l];const r=Math.round(d.ok/d.n*100);
      const col=r>=70?"var(--correct)":r>=50?"var(--gold)":"var(--seal)";
      h+='<div class="bd-row"><span class="bd-label">'+LAW_LABELS[l]+'</span>'
        +'<span class="bd-bar"><span class="bd-bar-fill" style="width:0;background:'+col+'" data-w="'+r+'"></span></span>'
        +'<span class="bd-num">'+d.ok+'/'+d.n+'（'+r+'％）</span></div>';
    });
    bd.innerHTML=h;
    setTimeout(()=>{document.querySelectorAll(".bd-bar-fill").forEach(b=>b.style.width=b.dataset.w+"%");},80);
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.getElementById("againBtn").onclick=()=>document.getElementById("startBtn").click();
  document.getElementById("backBtn").onclick=()=>{
    document.getElementById("result").classList.add("hide");
    document.getElementById("setup").classList.remove("hide");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function norm(s){return String(s).trim().replace(/\s+/g,"").replace(/[　]/g,"");}
})();
</script>
</body>
</html>
