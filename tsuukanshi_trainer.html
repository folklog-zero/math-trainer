期限後特例申告には期限の概念がない。","期限後特例申告は財務大臣に提出する。"],"ans":0},{"i":223,"l":"kanzeiho","a":"第7条の17","t":"select","tp":"許可前引取貨物の税額通知","q":"輸入の許可前に引き取られた貨物の税額に関する記述として、最も適切なものを一つ選びなさい。","e":"第7条の17。輸入許可前引取り（BP）の承認を受けた貨物について、税関長は納税申告に係る税額その他の事項を記載した書面を送付して通知する。","c":["輸入の許可前に引き取られた貨物について、税関長は申告に係る税額等を書面で通知する。","許可前引取貨物の税額は通知されない。","許可前引取貨物には関税が課されない。","税額通知は財務大臣が行う。"],"ans":0},{"i":224,"l":"kanzeiho","a":"第40条","t":"select","tp":"指定保税地域での行為","q":"指定保税地域における貨物の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"第40条。指定保税地域では外国貨物の積卸し・運搬・蔵置のほか内容点検・改装・仕分け等ができるが、加工・製造（保税工場の機能）は原則として行えない。","c":["指定保税地域では、貨物の内容の点検・改装・仕分け等を行うことができるが、加工・製造は原則できない。","指定保税地域では加工・製造が自由にできる。","指定保税地域では一切の取扱いができない。","指定保税地域は展示専用である。"],"ans":0},{"i":225,"l":"kanzeiho","a":"第41条の2","t":"select","tp":"指定の取消し","q":"指定保税地域の指定の取消しに関する記述として、最も適切なものを一つ選びなさい。","e":"指定保税地域は財務大臣の指定によるため、その必要がなくなった等の場合には財務大臣が指定を取り消す（許可制の保税蔵置場の取消しとは主体が異なる）。","c":["財務大臣は、指定の必要がなくなった等のときは指定保税地域の指定を取り消すことができる。","指定は取り消されない。","指定の取消しは税関長が行う。","指定の取消事由はない。"],"ans":0},{"i":226,"l":"kanzeiho","a":"第78条","t":"select","tp":"郵便物の関税の納付前検査","q":"輸入郵便物に関する税関の手続に関する記述として、最も適切なものを一つ選びなさい。","e":"第76条〜第78条。税関は輸入郵便物を検査し、課税物件については名宛人に税額を通知し、納付後に交付される（賦課課税方式。一定額超は輸入申告）。","c":["税関は輸入郵便物を検査し、課税物件については名宛人に税額を通知する等の手続を行う。","郵便物は検査されない。","郵便物の課税は差出人が申告する。","郵便物には課税できない。"],"ans":0},{"i":227,"l":"kanzeiho","a":"第83条","t":"select","tp":"収容の解除","q":"収容された貨物の収容解除に関する記述として、最も適切なものを一つ選びなさい。","e":"第83条等。収容された貨物は、その関税・収容に要した費用（収容課金）等を納付することで収容を解除して引き取ることができる。","c":["収容された貨物は、関税・収容課金等を納付すれば収容を解除して引き取ることができる。","収容された貨物は引き取れない。","収容解除に関税の納付は不要である。","収容解除は財務大臣が行う。"],"ans":0},{"i":228,"l":"kanzeiho","a":"第86条","t":"select","tp":"公売代金の充当順位","q":"公売・売却の代金の処理に関する記述として、最も適切なものを一つ選びなさい。","e":"第86条等。公売・随意契約による売却の代金は、公売等の費用、関税・内国消費税等の順に充当され、残余があれば貨物の所有者等に交付される。","c":["公売等の代金は、費用・関税等に充て、残余があれば貨物の所有者等に交付される。","公売代金はすべて国庫に帰属する。","公売代金は輸出者に交付される。","公売代金の処理に定めはない。"],"ans":0},{"i":229,"l":"kanzeiho","a":"第87条","t":"select","tp":"国庫帰属","q":"収容・公売物件の国庫帰属に関する記述として、最も適切なものを一つ選びなさい。","e":"第87条等。収容貨物を公売に付しても買受人がないとき等、一定の場合には当該貨物が国庫に帰属する旨が定められている。","c":["公売に付しても買受人がない等の一定の場合には、貨物が国庫に帰属することがある。","貨物が国庫に帰属することはない。","国庫帰属は財務大臣の任意である。","国庫帰属の規定はない。"],"ans":0},{"i":230,"l":"kanzeiho","a":"第94条","t":"select","tp":"帳簿の備付け（輸入者）","q":"輸入者の帳簿の備付け・保存義務に関する記述として、最も適切なものを一つ選びなさい。","e":"第94条。輸入者は、輸入許可を受けた貨物について、品名・数量・価格等を記載した帳簿を備え付け、契約書・仕入書等の書類を一定期間保存する義務を負う。","c":["輸入者は、輸入の許可を受けた貨物について帳簿を備え付け、書類を保存する義務を負う場合がある。","輸入者に帳簿の備付け義務はない。","帳簿は税関が作成する。","帳簿の保存は不要である。"],"ans":0},{"i":231,"l":"kanzeiho","a":"第102条","t":"select","tp":"証明書類の交付請求","q":"税関に対する証明・統計の閲覧等に関する記述として、最も適切なものを一つ選びなさい。","e":"第102条等。利害関係者は関税の納付等に関する事項の証明を求め、また貿易統計の閲覧・交付を受けることができる。","c":["利害関係者は、税関に対し関税の納付・徴収等に関する事項の証明や貿易統計の閲覧等を求めうる。","税関は証明・統計を一切提供しない。","証明の請求は財務大臣に対して行う。","統計の閲覧はできない。"],"ans":0},{"i":232,"l":"kanzeiho","a":"第105条","t":"select","tp":"通関業者への質問検査","q":"税関職員の権限の対象に関する記述として、最も適切なものを一つ選びなさい。","e":"第105条。税関職員の質問検査権は、輸入者のほか、その取引の相手方、通関業者・運送業者・倉庫業者等の関係者にも及ぶ。","c":["税関職員は、輸入者だけでなく通関業者・運送業者・倉庫業者等の関係者にも質問・検査ができる。","質問検査の対象は輸入者本人に限られる。","通関業者は質問検査の対象外である。","質問検査は財務大臣のみが行う。"],"ans":0},{"i":233,"l":"kanzeiho","a":"第106条","t":"select","tp":"特別の場合の権限","q":"犯則事件等に関する税関長の特別の権限に関する記述として、最も適切なものを一つ選びなさい。","e":"第106条等。犯則事件の調査等の特別の場合には、税関長・税関職員に質問・検査・領置・差押え等の権限が認められている（犯則調査手続）。","c":["一定の場合に、税関長は貨物の差押え・領置等の特別の権限を行使しうる。","税関長に特別の権限はない。","差押え等は財務大臣のみが行う。","差押えの制度はない。"],"ans":0},{"i":234,"l":"kanzeiho","a":"第108条の4","t":"select","tp":"輸出禁制品の罪と未遂","q":"輸出してはならない貨物に係る罪の処罰範囲に関する記述として、最も適切なものを一つ選びなさい。","e":"第108条の4等。輸出してはならない貨物（麻薬・銃砲・児童ポルノ等）の輸出は、既遂のほか未遂、さらに一定のものは予備も処罰の対象とされる。","c":["輸出してはならない貨物の輸出は、既遂のほか未遂・予備が処罰される類型がある。","未遂・予備は一切処罰されない。","輸出禁制品の罪に罰則はない。","処罰は財務大臣が決める。"],"ans":0},{"i":235,"l":"kanzeiho","a":"第111条","t":"select","tp":"許可を受けない輸出入の罪","q":"許可を受けないで輸出入する罪に関する記述として、最も適切なものを一つ選びなさい。","e":"第111条。輸出入の許可を受けないで、又は偽りの申告により許可を受けて貨物を輸出入した者等は処罰の対象となる（無許可輸出入罪）。","c":["輸出入の許可を受けるべき貨物を許可を受けずに輸出入した者は、処罰の対象となる。","無許可輸出入に罰則はない。","無許可輸出入は届出で適法となる。","処罰は法人に限られる。"],"ans":0},{"i":236,"l":"kanzeiho","a":"第115条の2","t":"select","tp":"両罰規定の対象","q":"両罰規定の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"第117条（両罰規定）。法人・人の代理人・使用人その他の従業者が業務に関して違反行為をしたときは、行為者を罰するほか法人・人にも各本条の罰金刑が科される。","c":["従業者等が業務に関し違反したとき、行為者の処罰に加え法人・人にも罰金刑が科されうる。","従業者の違反は本人のみが処罰される。","法人は処罰されない。","両罰規定の対象は限定されない。"],"ans":0},{"i":237,"l":"kanzeiho","a":"第7条の2","t":"select","tp":"特例申告貨物の課税物件","q":"特例申告貨物の課税物件確定の時期に関する記述として、最も適切なものを一つ選びなさい。","e":"第4条・第7条の2。特例申告制度は納税申告（税額確定）を後倒しにする制度であり、課税物件確定の時期は原則どおり輸入申告の時による。","c":["特例申告貨物についても、課税物件は原則として輸入申告の時の現況による。","特例申告貨物の課税物件は特例申告書提出の時による。","特例申告貨物には課税物件の概念がない。","特例申告貨物の課税物件は許可の時による。"],"ans":0},{"i":238,"l":"kanzeiho","a":"第9条の2第3項","t":"select","tp":"納期限延長と担保","q":"納期限の延長と担保に関する記述として、最も適切なものを一つ選びなさい。","e":"第9条の2。個別・包括・特例申告に係る納期限の延長は、いずれも延長に係る関税額に相当する担保の提供を条件として税関長の承認により行われる。","c":["納期限の延長を受けるには、原則として延長に係る関税額に相当する担保を提供する。","納期限の延長に担保は不要である。","担保は延長後に提供すればよい。","納期限の延長制度はない。"],"ans":0},{"i":239,"l":"kanzeiho","a":"第13条の4","t":"select","tp":"充当の順位","q":"過誤納金等の充当に関する記述として、最も適切なものを一つ選びなさい。","e":"過誤納金等を還付する場合に、その者に納付すべき関税等の未納があるときは、まずこれに充当し、残余を還付する。","c":["過誤納金等は、納税義務者に未納の関税等があるときはこれに充当される。","過誤納金は充当されず常に現金還付される。","充当の制度はない。","過誤納金は他人の関税に充当される。"],"ans":0},{"i":240,"l":"kanzeiho","a":"第30条第1項第2号","t":"select","tp":"保税地域外蔵置の許可","q":"保税地域以外の場所への外国貨物の蔵置に関する記述として、最も適切なものを一つ選びなさい。","e":"第30条第1項第2号。性質・形状から保税地域に置くことが困難・不適当な貨物については、税関長の許可（他所蔵置許可）を受けて保税地域以外の場所に置くことができる。","c":["巨大重量貨物等で保税地域に置くことが困難な場合、税関長の許可を受けて保税地域外の場所に置ける。","外国貨物は保税地域外に一切置けない。","保税地域外蔵置は届出で足りる。","保税地域外蔵置は財務大臣の許可による。"],"ans":0},{"i":241,"l":"kanzeiho","a":"第34条","t":"select","tp":"外国貨物の滅却","q":"保税地域にある外国貨物の滅却に関する記述として、最も適切なものを一つ選びなさい。","e":"第34条。外国貨物の廃棄はあらかじめの届出を要するが、滅却（焼却等により物理的に消滅させること）は原則として税関長の承認を要する。","c":["外国貨物を滅却しようとするときは、原則として税関長の承認を受ける。","外国貨物は自由に滅却できる。","滅却は届出で足りる。","外国貨物は滅却できない。"],"ans":0},{"i":242,"l":"kanzeiho","a":"第41条の3","t":"select","tp":"指定保税地域の貨物管理者","q":"指定保税地域における貨物の管理に関する記述として、最も適切なものを一つ選びなさい。","e":"指定保税地域の貨物を管理する者は、外国貨物の出入れの記帳等、適正な貨物管理のための義務を負う規定がある。","c":["指定保税地域の貨物を管理する者は、帳簿の記載等の所定の義務を負う場合がある。","指定保税地域に貨物管理者の義務はない。","管理は税関が直接行う。","貨物管理に関する規定はない。"],"ans":0},{"i":243,"l":"kanzeiho","a":"第43条の3第2項","t":"select","tp":"蔵入承認の効果（適用法令）","q":"蔵入承認を受けた貨物の適用法令の時期に関する記述として、最も適切なものを一つ選びなさい。","e":"第5条各号。蔵入承認を受けた貨物については、適用法令の時期が原則（輸入申告時）と異なり、蔵入承認の時の法令によることがある（課税物件確定時期との整合）。","c":["蔵入承認を受けた貨物の適用法令は、原則として蔵入承認の時の法令による場合がある。","蔵入承認貨物の適用法令は契約時による。","蔵入承認に適用法令の効果はない。","蔵入承認貨物の適用法令は輸出申告時による。"],"ans":0},{"i":244,"l":"kanzeiho","a":"第7条の3","t":"select","tp":"特例申告の対象貨物","q":"特例申告の対象とならない貨物に関する記述として、最も適切なものを一つ選びなさい。","e":"第7条の2第4項等。特例申告制度には対象貨物の例外があり、関税暫定措置法別表第一の六に掲げる物品その他政令で定める貨物は特例申告の対象から除かれる。","c":["一定の貨物（暫定措置法別表第一の六に掲げる物品等政令で定めるもの）は特例申告の対象から除かれる。","すべての貨物が特例申告の対象である。","特例申告に対象貨物の限定はない。","特例申告は輸出貨物が対象である。"],"ans":0},{"i":245,"l":"kanzeiho","a":"第63条の9","t":"select","tp":"特定保税運送者の認定","q":"特定保税運送者に関する記述として、最も適切なものを一つ選びなさい。","e":"第63条の2以下。運送業務に係る法令遵守規則の整備等の要件を満たす者は、税関長の認定を受けて特定保税運送者となり、保税運送の承認手続を要しない運送ができる。","c":["運送に関し法令遵守体制等の要件を満たす者は、税関長の認定を受けて特定保税運送者となれる。","特定保税運送者は財務大臣が指定する。","誰でも特定保税運送者になれる。","特定保税運送者の制度はない。"],"ans":0},{"i":246,"l":"kanzeiho","a":"第67条の2第2項","t":"select","tp":"船（機）上申告","q":"外国貿易船に積み込んだ状態での輸出申告に関する記述として、最も適切なものを一つ選びなさい。","e":"第67条の2第2項。本邦と外国を往来する外国貿易船等に積み込んだ状態で輸出しようとする貨物について、その状態で輸出申告ができる特則がある（船（機）用品等の取扱い）。","c":["一定の貨物については、外国貿易船に積み込んだ状態で輸出申告できる特則がある。","輸出申告は必ず陸揚げ後でなければできない。","船上での申告は一切認められない。","船上申告は財務大臣の許可による。"],"ans":0},{"i":247,"l":"kanzeiho","a":"第69条の21","t":"select","tp":"専門委員","q":"知的財産侵害物品の認定手続における専門委員に関する記述として、最も適切なものを一つ選びなさい。","e":"第69条の21等。知的財産侵害物品の認定手続において、税関長は専門的な知識を有する者を専門委員として委嘱し、その意見を求めることができる。","c":["税関長は、認定手続において専門的知識を有する専門委員に意見を求めることができる。","専門委員の制度はない。","専門委員は輸入者が選任する。","専門委員が認定を行う。"],"ans":0},{"i":248,"l":"kanzeiho","a":"第75条","t":"select","tp":"積戻しと内国貨物","q":"外国貨物の積戻しの対象に関する記述として、最も適切なものを一つ選びなさい。","e":"第75条。積戻しは外国貨物を外国に向けて送り出すこと。内国貨物を外国へ送り出す「輸出」とは対象が異なるが、手続は輸出の規定が準用される。","c":["積戻しの対象は外国貨物であり、内国貨物を外国に送り出すのは輸出である。","積戻しの対象は内国貨物である。","積戻しと輸出に区別はない。","積戻しは輸入の一種である。"],"ans":0},{"i":249,"l":"kanzeiho","a":"第43条の2","t":"select","tp":"蔵置期間の延長","q":"保税蔵置場の蔵置期間の延長に関する記述として、最も適切なものを一つ選びなさい。","e":"第43条の2。保税蔵置場の外国貨物の蔵置期間は原則として蔵入承認の日から2年だが、税関長は必要と認めるときこれを延長できる。","c":["税関長は、必要があると認めるときは、原則2年の蔵置期間を延長することができる。","蔵置期間は延長できない。","延長は財務大臣が行う。","蔵置期間に上限はない。"],"ans":0},{"i":250,"l":"kanzeiho","a":"第62条の15","t":"select","tp":"総合保税地域の準用","q":"総合保税地域に関する記述として、最も適切なものを一つ選びなさい。","e":"第62条の15。総合保税地域は蔵置・加工製造・展示等の機能を併有するため、保税蔵置場・保税工場・保税展示場に関する規定が準用される。","c":["総合保税地域には、保税蔵置場・保税工場・保税展示場に関する規定が準用される部分がある。","総合保税地域に他の保税地域の規定は準用されない。","総合保税地域は財務大臣が指定する。","総合保税地域に蔵置期間はない。"],"ans":0},{"i":251,"l":"teiritsuho","a":"第18条","t":"select","tp":"長期使用貨物の再輸出減税","q":"長期間使用できる貸借・請負契約に基づく一時使用貨物の減税に関する記述として、最も適切なものを一つ選びなさい。","e":"第18条。長期使用でき、貸借契約・請負契約の履行に関連して本邦で一時使用する政令指定貨物で、許可の日から原則2年（特に長期は最長5年）以内に輸出されるものは関税を軽減できる。","c":["一時的に使用するため輸入され、許可の日から原則2年以内に輸出される一定の貨物は、関税を軽減できる。","一時使用貨物には常に全額課税される。","一時使用貨物の減税は存在しない。","一時使用貨物の減税に期間の定めはない。"],"ans":0},{"i":252,"l":"teiritsuho","a":"第20条","t":"select","tp":"違約品等の戻し税の期間","q":"違約品等の再輸出に係る関税の払戻しの要件に関する記述として、最も適切なものを一つ選びなさい。","e":"第20条。違約品等の戻し税は、性質・形状に変更を加えず、輸入許可の日から原則6月以内（税関長承認で最長1年）に保税地域等に入れて返送等することが要件。","c":["輸入の許可の日から原則6月以内に保税地域等に入れて返送等することが要件とされる。","返送の期間に定めはない。","違約品の戻し税は輸入後すぐに限られる。","違約品の戻し税は1年以内が原則である。"],"ans":0},{"i":253,"l":"teiritsuho","a":"第15条","t":"select","tp":"特定用途免税の事後管理","q":"特定用途免税を受けた貨物の用途外使用に関する記述として、最も適切なものを一つ選びなさい。","e":"第15条。特定用途免税は条件付免税であり、定められた用途以外に供し又は譲渡した場合、原則として免除された関税が徴収される（用途外使用の制限期間内）。","c":["免税の用途以外に供し又は譲渡したときは、原則として免除された関税が徴収される。","用途外使用は自由である。","用途外使用しても関税は徴収されない。","特定用途免税に事後管理はない。"],"ans":0},{"i":254,"l":"teiritsuho","a":"第17条","t":"select","tp":"再輸出免税の期間","q":"再輸出免税に係る再輸出の期間に関する記述として、最も適切なものを一つ選びなさい。","e":"第17条。再輸出免税は、輸入許可の日から原則1年（やむを得ない理由があり税関長の承認を受けたときは延長）以内に再輸出されることを条件とする条件付免税。","c":["輸入の許可の日から原則1年（税関長承認で延長可）以内に再輸出されることが要件とされる。","再輸出の期間に定めはない。","再輸出免税は再輸出しなくても維持される。","再輸出は輸入後直ちに行う必要がある。"],"ans":0},{"i":255,"l":"teiritsuho","a":"第19条","t":"select","tp":"輸出貨物の製造用原料の減免","q":"輸出貨物の製造に使用する原料品の減免・戻し税に関する記述として、最も適切なものを一つ選びなさい。","e":"第19条等。輸出される貨物の製造に使用する輸入原料品について、関税の軽減・免除や、いったん納付した関税の払戻し（輸出貨物製造用原料品の戻し税）の制度がある。","c":["輸出貨物の製造に使用する一定の原料品について、関税の軽減・免除・払戻しの制度がある。","輸出貨物の原料に関する減免制度はない。","原料品の減免は内需向け製品に適用される。","原料品の減免は財務大臣が個別に決める。"],"ans":0},{"i":256,"l":"teiritsuho","a":"第13条","t":"select","tp":"加工・修繕再輸入の減税対象","q":"外国で加工・修繕して再輸入する貨物の減税に関する記述として、最も適切なものを一つ選びなさい。","e":"第13条等。本邦から輸出して外国で加工・修繕した貨物を再輸入する場合、加工・修繕に要した費用等を課税標準として関税を軽減できる（製品全体ではなく付加価値分に課税）。","c":["本邦から輸出し外国で加工・修繕した貨物の再輸入につき、加工・修繕費等を基礎に関税を軽減しうる。","再輸入貨物全額に課税する。","加工・修繕貨物の減税は存在しない。","減税は輸出時に適用される。"],"ans":0},{"i":257,"l":"teiritsuho","a":"第10条第2項","t":"select","tp":"輸入許可後の滅失と戻し税","q":"輸入許可後に災害等で滅失した貨物の関税に関する記述として、最も適切なものを一つ選びなさい。","e":"第10条第2項。輸入許可を受けた貨物が引き続き保税地域等にある間に災害等で滅失・変質損傷した場合、関税の軽減・払戻し等の取扱いが問題となる。","c":["輸入許可後引き続き保税地域等にある貨物が災害等で滅失等した場合、関税の軽減・払戻しが問題となる。","輸入許可後の滅失は課税に影響しない。","滅失貨物には常に全額課税される。","滅失貨物は輸出扱いとなる。"],"ans":0},{"i":258,"l":"teiritsuho","a":"課税価格の計算（運賃按分）","t":"select","tp":"航空運賃の特例","q":"航空機で運送された貨物の課税価格の計算に関する記述として、最も適切なものを一つ選びなさい。","e":"無償の見本・公的機関の貨物・災害救助物資等の一定の航空貨物については、現実の航空運賃ではなく通常の運賃により課税価格を計算する特例がある（航空運賃特例）。","c":["一定の貨物については、航空運賃ではなく通常の運賃（船舶運賃等）により課税価格を計算する特例がある。","航空貨物は常に実際の航空運賃で課税価格を計算する。","航空運賃は課税価格に算入しない。","航空運賃の特例は存在しない。"],"ans":0},{"i":259,"l":"teiritsuho","a":"第4条の5","t":"select","tp":"課税価格決定方法の特例的順序","q":"国内販売価格による方法と製造原価による方法の適用順序に関する記述として、最も適切なものを一つ選びなさい。","e":"第4条の3・第4条の4。原則は国内販売価格（控除方式）が先だが、輸入者が希望し税関長が認める等の場合、製造原価による方法を先に適用できる（順序の選択）。","c":["輸入者の希望により、製造原価による方法を国内販売価格による方法に先立って適用できる場合がある。","両者の順序は変更できない。","製造原価による方法は適用されない。","順序は税関が一方的に決める。"],"ans":0},{"i":260,"l":"teiritsuho","a":"第3条の2","t":"select","tp":"便益関税・特殊税率の関係","q":"輸入貨物に適用される税率の決定に関する記述として、最も適切なものを一つ選びなさい。","e":"関税率表に基づき品目分類（HSコード）を確定し、その品目について基本税率・暫定税率・協定税率・特恵税率等の中から適用順位・低税率優先の原則に従って実行税率を決定する。","c":["適用税率は、貨物の品目分類を確定したうえで、基本・暫定・協定・特恵等の中から適用順位に従って決定する。","税率は輸入者が任意に選べる。","税率は品目分類と無関係に決まる。","税率は常に基本税率である。"],"ans":0},{"i":261,"l":"teiritsuho","a":"第16条","t":"select","tp":"外交官用貨物等の相互条件","q":"外国の大使館等の用に供する貨物の免税に関する記述として、最も適切なものを一つ選びなさい。","e":"第16条。外国の大使館・領事館やその職員の用に供する一定の貨物は、相互主義の条件の下で関税が免除されうる（外交関係条約等との関係）。","c":["相互条件等の下で、本邦にある外国の大使館・公館やその職員の用に供する一定の貨物が免税となりうる。","外交関係の貨物は無条件に免税される。","外交関係の貨物に免税はない。","免税は財務大臣が個別に裁量で決める。"],"ans":0},{"i":262,"l":"teiritsuho","a":"第14条","t":"select","tp":"記録文書等の無条件免税","q":"無条件免税の対象として、最も適切なものを一つ選びなさい。","e":"第14条。無条件免税には、本邦の在外公館等から送還される公用品、記録文書、注文の取集めのための見本、再輸入される本邦製品等、用途等の条件を課さない類型が列挙される。","c":["本邦の在外公館から送還される公用品、記録文書、再輸入される本邦製品等が含まれうる。","国内販売用の一般商品が含まれる。","すべての輸入貨物が含まれる。","無条件免税の対象は定められていない。"],"ans":0},{"i":263,"l":"teiritsuho","a":"第4条第1項第2号ロ","t":"select","tp":"容器・包装費用","q":"輸入貨物の容器・包装に要する費用の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"第4条第1項第2号ロ・ハ。輸入貨物の容器（通常その貨物の一部として取り扱われるもの）の費用、及び包装に要する費用で買手が負担するものは課税価格に加算される。","c":["輸入貨物の容器（通常その貨物の一部とされるもの）・包装の費用は、買手負担分が加算される。","容器・包装費用は一切加算されない。","容器・包装費用は課税価格を減額する。","容器費用のみ加算し包装費用は加算しない。"],"ans":0},{"i":264,"l":"teiritsuho","a":"第4条第1項第5号","t":"select","tp":"売手帰属収益","q":"輸入貨物の処分・使用による収益で売手に帰属するものの取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"第4条第1項第5号。輸入貨物の処分・使用による収益のうち、売手に直接・間接に帰属するものは課税価格に加算される。","c":["輸入貨物の再販売等による収益で売手に直接・間接に帰属するものは、課税価格に加算される。","売手帰属収益は加算されない。","売手帰属収益は課税価格を減額する。","収益の帰属は課税価格に関係しない。"],"ans":0},{"i":265,"l":"teiritsuho","a":"第4条の7","t":"select","tp":"課税価格決定の特別な方法","q":"いずれの方法によっても課税価格を計算できない場合に関する記述として、最も適切なものを一つ選びなさい。","e":"第4条の4等。取引価格・同種類似・国内販売価格・製造原価のいずれによっても課税価格を計算できない場合、これらの方法に準ずる合理的な方法により課税価格を計算する。","c":["規定する方法により計算できない場合は、これらに準ずる合理的な方法により課税価格を計算する。","計算できない場合は課税しない。","輸入者の申告額をそのまま採用する。","常に最高価格を採用する。"],"ans":0},{"i":266,"l":"teiritsuho","a":"第9条","t":"select","tp":"相殺関税の手続","q":"相殺関税の発動手続に関する記述として、最も適切なものを一つ選びなさい。","e":"第9条。補助金の交付・国内産業への損害・因果関係について調査が行われ、これらが認定されると政令で相殺関税が課される（補助金額の範囲内）。","c":["補助金交付の事実・国内産業への損害等の調査を経て、政令で相殺関税が課される。","相殺関税は調査なしに課される。","相殺関税は輸入者の申請で課される。","相殺関税に発動手続はない。"],"ans":0},{"i":267,"l":"teiritsuho","a":"第7条","t":"select","tp":"対抗関税・緊急措置","q":"本邦の利益を守るための関税措置に関する記述として、最も適切なものを一つ選びなさい。","e":"第6条・第7条等。WTO協定に基づく本邦の利益が侵害された場合等に、対抗措置として関税の譲許停止・割増関税等の措置をとりうる規定がある。","c":["WTO協定上の利益を守る等のため、特定国産品への関税の譲許の停止等の措置をとりうる規定がある。","本邦の利益を守る関税措置は存在しない。","措置はすべての国に一律にとられる。","措置は輸入者が申請する。"],"ans":0},{"i":268,"l":"teiritsuho","a":"第10条第1項","t":"select","tp":"変質損傷減税の方法","q":"輸入許可前に変質・損傷した貨物の減税の計算方法に関する記述として、最も適切なものを一つ選びなさい。","e":"第10条第1項。変質・損傷による価格の低下率を基準として軽減する方法か、変質損傷後の性質・数量により課税した額との差額以内で軽減する方法による。","c":["価値の減少に基づく価格の低下率を基準とする方法、又は変質損傷後の性質数量による課税額との差額以内で軽減する方法による。","変質損傷の程度にかかわらず一律に半額とする。","変質損傷貨物は免税となる。","変質損傷の減税方法に定めはない。"],"ans":0},{"i":269,"l":"teiritsuho","a":"減免税の手続","t":"select","tp":"減免税の申請手続","q":"関税の減免税を受けるための手続に関する記述として、最も適切なものを一つ選びなさい。","e":"減免税を受けるには、原則として輸入申告の際に減免税の適用を受ける旨の申請を行い、用途・要件を証する書類を提出する必要がある（事後の確認・徴収を伴う条件付免税もある）。","c":["減免税を受けようとする者は、原則として輸入申告等の際に所定の申請・書類提出を行う必要がある。","減免税は申請なく自動的に適用される。","減免税の申請は輸入許可後に限られる。","減免税に手続は不要である。"],"ans":0},{"i":270,"l":"teiritsuho","a":"第2条","t":"select","tp":"定率法の輸出の定義","q":"関税定率法上の「輸出」の定義に関する記述として、最も適切なものを一つ選びなさい。","e":"第2条。定率法上の「輸出」は、関税法第2条第1項第2号の行為のほか、貨物を特定の国（公海・排他的経済水域での採捕国船舶を含む）から他の国へ向けて送り出すことを含む独自の定義がある。","c":["関税法の定義に加え、特定の国から他の国に向けて貨物を送り出すこと等を含む。","関税法の輸出の定義と完全に同一である。","定率法に輸出の定義はない。","定率法の輸出は内国貨物の移動を指す。"],"ans":0},{"i":271,"l":"zanteiho","a":"暫定税率の優先","t":"select","tp":"暫定税率と基本税率","q":"暫定税率が設定されている品目の税率適用に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定税率は基本税率を暫定的に修正するものであり、設定品目については基本税率に代えて暫定税率が適用される（協定税率・特恵税率との比較で実行税率が決まる）。","c":["暫定税率が設定されている品目は、基本税率に代えて暫定税率が適用される。","暫定税率と基本税率は併課される。","暫定税率があっても基本税率が優先する。","暫定税率は参考値にすぎない。"],"ans":0},{"i":272,"l":"zanteiho","a":"特恵の適用順位","t":"select","tp":"特恵と協定税率の関係","q":"特恵税率と協定税率の関係に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵税率は開発途上国支援のため協定税率よりさらに優遇された（多くは無税・低税率の）税率で、原産地規則等の要件を満たす特恵受益国原産品に適用される。","c":["特恵受益国の原産品で要件を満たすものは、原則として協定税率より優遇された特恵税率が適用される。","協定税率が常に特恵税率に優先する。","特恵税率と協定税率は同一である。","特恵税率は協定税率より不利である。"],"ans":0},{"i":273,"l":"zanteiho","a":"原産地基準（完全生産品）","t":"select","tp":"完全生産品基準","q":"特恵原産地規則の完全生産品基準に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵原産地規則の一つ。鉱物・農産物・その国で生まれ育った動物等、一国で完全に得られ又は生産された産品はその国の原産品と認められる（完全生産品基準）。","c":["一国で完全に得られ又は生産された産品は、その国の原産品と認められる。","完全生産品基準は存在しない。","完全生産品は原産品と認められない。","完全生産品基準は輸出国の希望で適用される。"],"ans":0},{"i":274,"l":"zanteiho","a":"原産地基準（実質的変更）","t":"select","tp":"実質的変更基準","q":"複数国の材料を用いた産品の原産地判定に関する記述として、最も適切なものを一つ選びなさい。","e":"原産材料以外の材料を使用した産品は、実質的な変更（関税分類変更・付加価値・加工工程等の基準）を加える加工・製造が最後に行われた国を原産国とする（実質的変更基準）。","c":["原産材料以外の材料を用いた場合、原則として実質的な変更を加える加工・製造が行われた国が原産国とされる。","材料の原産国が常に産品の原産国となる。","複数国材料の産品は原産品と認められない。","原産地は最終仕向地で判定する。"],"ans":0},{"i":275,"l":"zanteiho","a":"原産地証明書の有効期間","t":"select","tp":"原産地証明書の有効期間","q":"特恵原産地証明書に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵原産地証明書は原産国の発給機関等が発給し、有効期間（原則発給の日から1年）が定められている。輸入申告の際に有効な証明書を提出する。","c":["原産地証明書には有効期間があり、原則として発給日から一定期間内のものを提出する必要がある。","原産地証明書に有効期間はない。","原産地証明書は輸入者が作成する。","原産地証明書は税関が発給する。"],"ans":0},{"i":276,"l":"zanteiho","a":"積送基準の例外","t":"select","tp":"積送基準の例外","q":"特恵の積送基準（直送原則）の例外に関する記述として、最も適切なものを一つ選びなさい。","e":"直送原則の例外として、運送上・地理上の理由で第三国を経由しても、その国で積替え・一時蔵置以外の取引・使用がされず税関監督下にある等の要件を満たせば、直接運送とみなされる。","c":["運送上の理由等で第三国を経由する場合でも、その国で積替え等以外の取引・処分がされない等の要件を満たせば直送とみなされる。","第三国経由は一切認められない。","第三国でどのような処分をしても直送とみなされる。","積送基準に例外はない。"],"ans":0},{"i":277,"l":"zanteiho","a":"特恵の自己申告","t":"select","tp":"原産品申告（EPA等）","q":"EPA等における原産地の証明方法に関する記述として、最も適切なものを一つ選びなさい。","e":"近年のEPAでは、第三者証明制度に加え、輸入者・輸出者・生産者が自ら原産性を申告する自己申告制度（原産品申告書）が採用されているものがある。","c":["協定によっては、輸入者・輸出者・生産者による自己申告（原産品申告書）により原産性を証明できる。","原産性の証明は第三者機関の証明書に限られる。","自己申告制度は存在しない。","自己申告は基本税率の要件である。"],"ans":0},{"i":278,"l":"zanteiho","a":"特恵の事後確認","t":"select","tp":"原産地の事後確認","q":"特恵・EPA税率適用後の原産地確認に関する記述として、最も適切なものを一つ選びなさい。","e":"税関は輸入者等への質問・書類提出要求や輸出国当局への照会等により原産性を事後確認でき、原産性が確認できない場合は特恵・EPA税率の適用を否認し関税を徴収しうる。","c":["税関は、輸入後においても原産性について確認（事後確認）を行うことができ、確認できない場合は特恵等を否認しうる。","輸入後の原産地確認は行われない。","事後確認で否認されることはない。","事後確認は財務大臣が行う。"],"ans":0},{"i":279,"l":"zanteiho","a":"暫定措置の改廃","t":"select","tp":"暫定措置の年度見直し","q":"暫定措置法の改正に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定措置法の税率・減免税は時限的な特例であり、適用期限が設定され、毎年度の税制改正（関税改正）の中で延長・廃止・新設が検討される。","c":["暫定税率・暫定的減免税等は適用期限が定められ、毎年度の関税改正で延長・改廃が検討される。","暫定措置法は改正されない。","暫定措置に適用期限はない。","暫定措置の見直しは10年ごとである。"],"ans":0},{"i":280,"l":"zanteiho","a":"特恵関税の趣旨","t":"select","tp":"特恵関税の目的","q":"特恵関税制度の目的に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵関税（GSP）は、開発途上国の産品に低税率・無税を供与することで、その輸出所得増大・工業化・経済発展を支援する国際的な制度に基づく。","c":["開発途上国の輸出所得の増大・工業化・経済発展の促進を支援することを目的とする。","先進国の産業保護を目的とする。","輸入の抑制を目的とする。","特恵関税に政策目的はない。"],"ans":0},{"i":281,"l":"gyouho","a":"第3条","t":"select","tp":"弁護士等の適用除外","q":"通関業の許可に関する適用除外に関する記述として、最も適切なものを一つ選びなさい。","e":"第3条第5項。弁護士・弁護士法人がその職務として行うもの、弁理士が一定の事務として行うもの等には、通関業の許可に関する規定が適用されない（士業の職務との調整）。","c":["弁護士・弁護士法人や弁理士が一定の職務として行う通関手続等には、通関業の許可の規定が適用されない場合がある。","弁護士も必ず通関業の許可を要する。","適用除外は一切ない。","適用除外は税関長が個別に認める。"],"ans":0},{"i":282,"l":"gyouho","a":"第9条","t":"select","tp":"営業所新設の許可基準","q":"営業所の新設の許可の審査に関する記述として、最も適切なものを一つ選びなさい。","e":"第9条。営業所の新設の許可については、許可の基準（第5条）や欠格事由等に関する規定が準用され、通関士の設置等も審査される。","c":["営業所新設の許可についても、通関業の許可の基準（経営の基礎・人的構成等）が準用される。","営業所新設に審査基準はない。","営業所新設は無審査で許可される。","営業所新設は税関長が許可する。"],"ans":0},{"i":283,"l":"gyouho","a":"第12条","t":"select","tp":"許可の公告等","q":"通関業の許可に伴う公告・許可証に関する記述として、最も適切なものを一つ選びなさい。","e":"第3条第4項等。財務大臣は通関業の許可をしたとき、遅滞なくその旨を公告するとともに、許可を受けた者に許可証を交付する。","c":["財務大臣は許可をしたとき、遅滞なくその旨を公告し、許可を受けた者に許可証を交付する。","許可に公告・許可証はない。","公告は税関長が行う。","許可証は通関士に交付される。"],"ans":0},{"i":284,"l":"gyouho","a":"第14条","t":"select","tp":"通関士の審査対象書類","q":"通関士が審査・記名すべき通関書類に関する記述として、最も適切なものを一つ選びなさい。","e":"第14条。通関業者は、輸出入申告書・不服申立書その他財務省令で定める通関書類について、通関士に審査させ、これに記名させなければならない。","c":["輸出入申告書その他財務省令で定める通関書類について、通関士が審査し記名する。","すべての社内文書を通関士が審査する。","審査対象書類は定められていない。","審査・記名は誰が行ってもよい。"],"ans":0},{"i":285,"l":"gyouho","a":"第17条","t":"select","tp":"更正に関する意見聴取","q":"税関による更正等と通関業者の関与に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業者が依頼を受けて作成・提出した申告について税関長が更正をする場合等、通関業者・通関士に対する事前の意見聴取・通知に関する規定がある（適正手続の確保）。","c":["通関業者が作成した申告について税関長が更正をする場合、通関業者の意見を聴く機会に関する規定がある。","更正に通関業者は一切関与しない。","更正は通関業者が行う。","意見聴取の制度はない。"],"ans":0},{"i":286,"l":"gyouho","a":"第21条","t":"select","tp":"検査の通知","q":"通関業者の業務に関する税関の関与に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業者は依頼者を代理して通関手続を行うため、検査の立会い・更正の通知等、通関に関する税関の通知・連絡は通関業者に対して行われる。","c":["通関業者が代理して行う通関手続に関し、税関は必要な通知等を通関業者に対して行う。","税関は通関業者に一切通知しない。","通知は輸入者にのみ行われる。","通知制度はない。"],"ans":0},{"i":287,"l":"gyouho","a":"第31条","t":"select","tp":"通関士の確認の申請","q":"通関士の確認の申請に関する記述として、最も適切なものを一つ選びなさい。","e":"第31条。通関業者が試験合格者をその通関業務に従事させようとするときに、財務大臣に対し確認を申請する。確認を受けて初めて通関士となる。","c":["通関業者が試験合格者を通関士として通関業務に従事させようとするとき、財務大臣に確認を申請する。","確認の申請は本人が行う。","確認は申請なく行われる。","確認は税関長に申請する。"],"ans":0},{"i":288,"l":"gyouho","a":"第6条","t":"select","tp":"欠格事由（刑罰）","q":"通関業の許可に係る欠格事由に関する記述として、最も適切なものを一つ選びなさい。","e":"第6条。関税法その他の法令違反による刑の執行終了等から所定年数（例：一定の罪につき2年・3年等）を経過しない者等が欠格事由に該当する。","c":["一定の刑に処せられその執行を終わり等から所定年数を経過しない者は欠格事由に該当する。","過去の刑罰歴は欠格事由に関係しない。","欠格事由は無期限である。","欠格事由は通関士のみに適用される。"],"ans":0},{"i":289,"l":"gyouho","a":"第34条","t":"select","tp":"業務停止の期間","q":"通関業者に対する業務停止処分に関する記述として、最も適切なものを一つ選びなさい。","e":"第34条。財務大臣は、通関業者が法令違反等をしたとき、戒告、又は期間（1年以内）を定めた業務の停止、許可の取消し等の監督処分をすることができる。","c":["財務大臣は、法令違反等があった通関業者に対し、期間を定めて通関業務の停止を命じることができる。","業務停止は無期限である。","業務停止処分はない。","業務停止は税関長が命じる。"],"ans":0},{"i":290,"l":"gyouho","a":"第35条","t":"select","tp":"通関士の従事停止期間","q":"通関士に対する懲戒処分の内容に関する記述として、最も適切なものを一つ選びなさい。","e":"第35条。財務大臣は、通関士が法令違反等をした場合、戒告、又は期間（1年以内）を定めた通関業務に従事することの停止、通関士でなくする等の懲戒処分をしうる。","c":["財務大臣は、通関士に対し戒告又は期間を定めた通関業務への従事の停止等の懲戒処分をしうる。","通関士への懲戒処分はない。","懲戒は無期限の資格剥奪のみである。","懲戒は税関長が行う。"],"ans":0},{"i":291,"l":"gyouho","a":"第39条","t":"select","tp":"通関業者の権利義務の周知","q":"通関業に関する周知・公告に関する記述として、最も適切なものを一つ選びなさい。","e":"第3条・第40条等。財務大臣は、通関業の許可、許可の取消し、業務停止、通関業者の地位の承継等一定の事項について公告等を行う。","c":["財務大臣は、許可・取消し等一定の事項について公告等を行うことがある。","通関業に関する公告は一切ない。","公告は通関業者が行う。","公告制度は廃止された。"],"ans":0},{"i":292,"l":"gyouho","a":"第40条","t":"select","tp":"相続による承継","q":"通関業者の死亡と相続に関する記述として、最も適切なものを一つ選びなさい。","e":"第10条・第40条等。通関業者（個人）が死亡した場合、相続人は所定の期間内に届出・承認等の手続をすることにより通関業者の地位を承継できる。","c":["通関業者が死亡した場合、相続人が所定の手続により通関業者の地位を承継できる規定がある。","死亡により地位は当然に消滅し承継できない。","承継に手続は不要である。","承継は税関長が認める。"],"ans":0},{"i":293,"l":"gyouho","a":"第13条","t":"select","tp":"通関士設置の趣旨","q":"通関士の設置義務の趣旨に関する記述として、最も適切なものを一つ選びなさい。","e":"第13条・第14条。通関業務に係る通関書類を専門家である通関士に審査・記名させることで、申告の正確性を担保し適正・迅速な通関を確保する趣旨である。","c":["通関書類の専門的審査を通じ、適正・迅速な通関を確保するために通関士の設置が義務付けられている。","通関士の設置は形式的なもので意味はない。","通関士は経理事務のために置く。","通関士の設置は任意である。"],"ans":0},{"i":294,"l":"gyouho","a":"第22条","t":"select","tp":"帳簿の保存期間","q":"通関業者の帳簿・書類の保存に関する記述として、最も適切なものを一つ選びなさい。","e":"第22条。通関業者は通関業務に関し帳簿を設けて取扱状況を記載し、その帳簿及び関係書類を所定の期間（書類の種類に応じた年数）保存しなければならない。","c":["通関業者は、通関業務に関する帳簿・書類を所定の期間保存しなければならない。","帳簿は作成後直ちに廃棄してよい。","保存期間の定めはない。","保存義務は通関士個人にある。"],"ans":0},{"i":295,"l":"gyouho","a":"第2条第1号","t":"select","tp":"通関手続の代理・代行","q":"通関業務における代理・代行に関する記述として、最も適切なものを一つ選びなさい。","e":"第2条第1号。通関業務は、他人の依頼に応じてその者を代理・代行して行う通関手続（輸出入申告、関税の納付に関する手続、不服申立て等）及びこれに先行・後続する手続等である。","c":["他人の依頼により、その者を代理して輸出入申告等を行うこと等が通関業務に含まれる。","自己の貨物の輸出入申告が通関業務である。","通関業務に代理・代行は含まれない。","通関業務は貨物の運送のみである。"],"ans":0},{"i":296,"l":"gyouho","a":"第14条","t":"select","tp":"通関士の記名の意義","q":"通関士の記名の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"第14条。通関士の審査・記名は、通関書類が専門的知識をもって審査されたことを示し、申告内容の正確性・信頼性を担保する役割を果たす。","c":["通関士の記名は、通関書類を専門家が審査したことを明らかにし、申告の信頼性を担保する。","通関士の記名は形式にすぎず意味はない。","記名は誰が行ってもよい。","記名は税関職員が行う。"],"ans":0},{"i":297,"l":"gyouho","a":"第5条","t":"select","tp":"経営の基礎の審査","q":"通関業の許可における経営の基礎の審査に関する記述として、最も適切なものを一つ選びなさい。","e":"第5条。許可の基準として、申請者の資力・収支その他の経営の基礎が確実であること、及び人的構成に照らし通関業務を適正に遂行できることが審査される。","c":["財務大臣は、許可に当たり申請者の資産・収支等の経営の基礎が確実であるかを審査する。","経営状態は審査されない。","経営の基礎は通関士が審査する。","経営の基礎の審査は廃止された。"],"ans":0},{"i":298,"l":"gyouho","a":"第31条第2項","t":"select","tp":"確認をしない場合","q":"通関士の確認がされない場合に関する記述として、最も適切なものを一つ選びなさい。","e":"第31条第2項。確認を受けようとする者が通関士の欠格事由に該当する場合等には、財務大臣はその確認をしないことができる。","c":["確認を受けようとする者が欠格事由に該当する場合等、財務大臣は確認をしないことができる。","確認は常に行われる。","確認の拒否事由はない。","確認は税関長が拒否する。"],"ans":0},{"i":299,"l":"gyouho","a":"第33条の2","t":"select","tp":"通関業者の義務（総則）","q":"通関業者・通関士の義務に関する記述として、最も適切なものを一つ選びなさい。","e":"第16条〜第20条等。通関業者・通関士は、依頼の応諾義務、確認義務、名義貸しの禁止、秘密を守る義務、信用失墜行為の禁止等の各種義務を負う。","c":["通関業者・通関士は、信用失墜行為の禁止・秘密保持・依頼応諾等の義務を負う。","通関業者に法律上の義務はない。","義務は通関士のみに課される。","義務は努力目標にすぎない。"],"ans":0},{"i":300,"l":"gyouho","a":"第1条","t":"select","tp":"通関業法の体系的位置づけ","q":"通関業法と関税法等との関係に関する記述として、最も適切なものを一つ選びなさい。","e":"第1条。通関業法は通関業者・通関士を規律することで、関税法等に基づく通関手続が適正・迅速に代行されることを担保する。税率は定率法・暫定措置法、為替は外為法の領域。","c":["通関業法は通関業を営む者を規律する法律で、関税法等が定める通関手続の適正な代行を担保する役割を持つ。","通関業法は関税の税率を定める法律である。","通関業法は関税法と無関係である。","通関業法は外国為替を規律する。"],"ans":0},{"i":301,"l":"kanzeiho","a":"基本通達30-1","t":"select","tp":"難破貨物の定義","q":"関税法基本通達における「難破貨物」の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達30-1。難破貨物とは遭難その他の事故により船舶・航空機から離脱した貨物をいい、単に運航の自由を失った船舶等に積まれている貨物は含まれない。","c":["遭難その他の事故により船舶又は航空機から離脱した貨物をいい、運航の自由を失っただけの船舶等に積まれている貨物は含まない。","単に運航の自由を失った船舶に積まれている貨物をいう。","あらゆる海難に遭遇した船舶の積荷をすべて含む。","難破貨物とは輸入の許可を受けた貨物をいう。"],"ans":0},{"i":302,"l":"kanzeiho","a":"基本通達30-2","t":"select","tp":"他所蔵置が認められる貨物","q":"税関長の許可を受けて保税地域以外の場所に置くことができる貨物（他所蔵置）の例として、通達上認められないものを一つ選びなさい。","e":"基本通達30-2。他所蔵置が認められるのは巨大重量物・大量貨物・交通至難地・腐敗汚損のおそれ・特殊管理を要する貴重品等で、保税地域に置くことが困難・著しく不適当な貨物。単なる保管料節約は理由にならない。","c":["巨大重量物であって保税地域にこれを置く設備がないもの","腐敗変質し又は他の貨物を汚損するおそれがある貨物","貴重品・危険物・生鮮食料品のような特殊な施設・管理を要する貨物で適した保税地域がないもの","単に保管料を節約したいという理由だけによる一般貨物"],"ans":3},{"i":303,"l":"kanzeiho","a":"基本通達30-6","t":"select","tp":"緊急時の他所蔵置","q":"台風・高潮・火災等により外国貨物を緊急に保税地域外に置く場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達30-6。台風・高潮・火災等で緊急に保税地域外へ置く必要がある場合、適宜の申出書又は口頭の申出により、便宜、運送承認を要せず他所蔵置を許可できる。原則として緊急事態がやんだ後速やかにもとの保税地域に戻し入れさせる。","c":["時宜に応じた申出書又は口頭による申出により、便宜、運送の承認を要することなく他所蔵置の許可を認めて差し支えない。","緊急時であっても通常どおり書面による申請と運送承認を要する。","緊急時には一切の手続を要しない。","緊急時の他所蔵置は認められない。"],"ans":0},{"i":304,"l":"kanzeiho","a":"基本通達32-3","t":"select","tp":"見本一時持出しの包括許可","q":"見本の一時持出しの包括許可に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達32-3。同一申請者により同一の保税地域（保税展示場を除く）で恒常的に行われる見本の一時持出しは、一定期間を指定して一括して許可（包括許可）して差し支えない。","c":["同一申請者により同一の保税地域で恒常的に行われる場合、一定期間を指定して一括して許可して差し支えない。","見本の一時持出しは常に個別に許可を要する。","包括許可は保税展示場のみで認められる。","見本の一時持出しに許可は不要である。"],"ans":0},{"i":305,"l":"kanzeiho","a":"基本通達3-2","t":"select","tp":"協定税率の意義","q":"関税法基本通達における協定税率の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達3-2等。協定税率は、WTO協定等の関税についての条約により便益を許与している国の産品に適用される税率（実行税率の比較で低い方が適用される）。","c":["協定税率は、関税についての条約により一定の便益を許与している国の産品に適用される税率である。","協定税率はすべての国に適用される。","協定税率は基本税率と常に同一である。","協定税率は輸出貨物に適用される。"],"ans":0},{"i":306,"l":"kanzeiho","a":"基本通達9の10-6","t":"select","tp":"徴収規定競合時の順位","q":"同一の外国貨物について関税の徴収規定が競合する場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達9の10-6。同一貨物について徴収規定が競合する場合は所定の順位によるが、裁判等の関係で先順位の徴収が不確実なときは後順位の関税をまず徴収する取扱いがある。","c":["原則として所定の順位により徴収するが、先順位の徴収が不確実と認められる場合は後順位の関税をまず徴収する。","競合する場合はいずれも徴収しない。","競合する場合は輸入者が順位を選べる。","徴収規定が競合することはない。"],"ans":0},{"i":307,"l":"kanzeiho","a":"基本通達2-2","t":"select","tp":"船舶の意義","q":"関税法基本通達における船舶等の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"とん税法基本通達等。船舶がはしけを引き又は押して入港した場合、一時納付の取扱い等において船舶及びはしけを別個の外国貿易船として取り扱う場面がある。","c":["はしけを引き又は押して入港した場合等、とん税の取扱い等において船舶とはしけを別個の外国貿易船として扱う場合がある。","はしけは常に本船と一体として扱う。","はしけは船舶に含まれない。","船舶の意義に関する通達はない。"],"ans":0},{"i":308,"l":"kanzeiho","a":"基本通達67-4-9","t":"select","tp":"旅具通関扱い","q":"旅具通関扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達67-4-9。入国者が携帯・別送する身回品等は旅具通関として簡易な手続で通関する。商業量に達する数量の貨物は旅具通関扱いの範囲を超える。","c":["入国者が携帯・別送して輸入する身回品等について、簡易な手続（旅具通関）により通関する取扱いがある。","入国者の携帯品も一般貨物と同じ通関手続による。","旅具通関扱いの範囲に制限はない。","旅具通関扱いは輸出貨物に適用される。"],"ans":0},{"i":309,"l":"kanzeiho","a":"通関業法基本通達2-1","t":"select","tp":"代理の名義","q":"通関業者が依頼者の代理人として通関業務を行う場合の名義に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-1。通関業者が依頼者の代理人として行う申告・申請等は原則として依頼者の名をもって行い、通関業者が依頼者に代わって自己の名で申告等をすることはできない。","c":["各種の申告・申請等は原則として依頼者の名をもって行い、通関業者が自己の名で申告等をすることはできない。","通関業者は自己の名で申告できる。","申告は通関士個人の名で行う。","名義に関する取扱いの定めはない。"],"ans":0},{"i":310,"l":"kanzeiho","a":"通関業法基本通達2-3","t":"select","tp":"業として行う","q":"通関業法上「業として通関業務を行う」の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-3。「業として通関業務を行う」とは、反復継続の意思をもって通関業務を行うことをいい、営利性・反復継続性等を総合勘案して判断する旨が通達で具体化されている。","c":["営利の目的をもって反復継続して通関業務を行うこと等を意味し、その判断は通達により具体化されている。","1回でも通関業務を行えば常に「業として」に当たる。","「業として」の意義に関する取扱いはない。","無償で行う場合は常に「業として」に当たらない。"],"ans":0},{"i":311,"l":"teiritsuho","a":"基本通達3-1(1)","t":"select","tp":"基本税率と暫定税率","q":"同一品目について基本税率と暫定税率がある場合の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3-1(1)。同一品目について基本税率と暫定税率があるときは暫定税率を適用し、暫定税率がない場合に基本税率を適用する。","c":["暫定税率を適用し、暫定税率がない場合に基本税率を適用する。","基本税率を適用し、暫定税率は適用しない。","両者を平均した税率を適用する。","高い方の税率を適用する。"],"ans":0},{"i":312,"l":"teiritsuho","a":"基本通達3-1(2)","t":"select","tp":"協定税率の比較適用","q":"協定税率がある場合の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3-1(2)。協定税率が基本税率・暫定税率により適用されることとなる税率より低いときは、その協定税率を適用する（低い税率の選択適用）。","c":["協定税率が基本税率・暫定税率により適用される税率より低いときは、その協定税率を適用する。","協定税率は常に基本税率より優先して適用される。","協定税率は基本税率より高くても適用される。","協定税率は適用されない。"],"ans":0},{"i":313,"l":"teiritsuho","a":"基本通達3-1(3)","t":"select","tp":"協定税率が同一の場合","q":"協定税率が基本税率等と同一の税率である場合の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3-1(3)。協定税率が国定税率により適用される税率と同一のときは、国定税率により適用されることとなる税率を適用する（同率なら国定税率）。","c":["国定税率（基本税率・暫定税率）により適用されることとなる税率を適用する。","協定税率を優先して適用する。","いずれも適用しない。","輸入者が選択する。"],"ans":0},{"i":314,"l":"teiritsuho","a":"基本通達3-1(4)","t":"select","tp":"EPA税率の比較適用","q":"EPA税率がある場合の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3-1(4)。EPA税率が(1)〜(3)により適用されることとなる税率より低いときは、そのEPA税率を適用する。","c":["EPA税率が基本税率・暫定税率・協定税率により適用される税率より低いときは、そのEPA税率を適用する。","EPA税率は常に最後に適用される。","EPA税率は基本税率より高くても適用される。","EPA税率は適用されない。"],"ans":0},{"i":315,"l":"teiritsuho","a":"基本通達3-1(6)","t":"select","tp":"特恵税率の優先","q":"特恵関税の適用がある場合の税率適用に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3-1(6)。暫定法第8条の2・第8条の3に基づき特恵関税の適用がある場合には、他の税率に優先して特恵税率を適用する。","c":["暫定法の規定に基づき特恵関税の適用があるときは、他の税率に優先して特恵税率を適用する。","特恵税率は他の税率より後に適用される。","特恵税率は基本税率と同時に適用される。","特恵税率は適用されない。"],"ans":0},{"i":316,"l":"teiritsuho","a":"基本通達3の2-1","t":"select","tp":"入国者の簡易税率の対象","q":"入国者の輸入貨物に対する簡易税率の適用対象に関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3の2-1。入国者の簡易税率は旅客・乗組員が携帯・別送して輸入する貨物が対象。乗組員の託送貨物や、消費税の納税証明として輸入許可書発給を希望する託送貨物等は含まれない。","c":["旅客及び乗組員が入国の際に携帯し又は別送して輸入する貨物が対象となるが、託送貨物等は含まれない。","入国者が輸入するすべての貨物が無条件に対象となる。","商業量に達する数量の貨物も常に対象となる。","簡易税率は入国者には適用されない。"],"ans":0},{"i":317,"l":"teiritsuho","a":"基本通達3の2-1(3)","t":"select","tp":"1個又は1組の判定","q":"入国者の簡易税率における「1個又は1組」の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3の2-1(3)。荷作り・運送等の事情で1個の貨物を本体と部分品に分離した場合は全体を1個として扱う。通常組・対として使用されるものは1組として扱う。","c":["1個の貨物を本体と部分品に分離した場合は、その全体を1個として取り扱う。","分離した部分品は別個の貨物として扱う。","本体と部分品は常に別々に課税する。","1個又は1組の取扱いに定めはない。"],"ans":0},{"i":318,"l":"teiritsuho","a":"基本通達3の3-1","t":"select","tp":"少額輸入貨物の簡易税率","q":"少額輸入貨物に対する簡易税率の適用に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達3の3-1。少額輸入貨物に対する簡易税率は、1輸入申告等に係る貨物の課税価格の合計額が20万円以下であるか否かにより判定される。","c":["課税価格の合計額が20万円以下であるか否かの判定により、簡易税率の適用が決まる。","金額にかかわらず簡易税率が適用される。","簡易税率の適用に金額基準はない。","少額輸入貨物には簡易税率は適用されない。"],"ans":0},{"i":319,"l":"teiritsuho","a":"課税価格通達4-6","t":"select","tp":"輸出国の払戻し関税","q":"現実支払価格から除かれる「輸出国において輸出の際に軽減又は払戻しを受けるべき関税その他の課徴金」に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4-6。輸出国で輸出を条件に軽減・払戻しされる関税等は現実支払価格から除く。一般にこれらは仕入書価格に含まれないため、実務上調査は原則不要とされる。","c":["輸出国の法令により当該貨物の輸出を条件として軽減・払戻しされる関税・内国消費税その他の課徴金をいう。","本邦で課される関税をいう。","輸入港までの運賃をいう。","買手が支払う仲介手数料をいう。"],"ans":0},{"i":320,"l":"teiritsuho","a":"課税価格通達4-7","t":"select","tp":"加算要素の二重加算防止","q":"現実支払価格に運賃等の加算要素を加算する場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4-7。加算要素を加算する場合は、当該運賃等の額で現実支払価格に「含まれていないもの」を加算する（二重加算の防止）。","c":["加算するのは、当該運賃等の額で現実支払価格に含まれていないものに限る。","現実支払価格に含まれている運賃も改めて加算する。","運賃は常に全額を加算する。","加算要素は現実支払価格に含まれていても加算する。"],"ans":0},{"i":321,"l":"teiritsuho","a":"課税価格通達4-10","t":"select","tp":"容器費用の区分","q":"輸入貨物の容器の費用の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4-10。容器費用は、買手が輸入取引に関し負担する場合は法第4条第1項第2号ロの容器費用に、買手が無償・値引きで提供した場合は同項第3号の提供物品費用に該当する（負担形態で区分）。","c":["輸入取引に関し買手が負担する容器費用は加算要素に該当し、買手が無償等で提供した容器の費用は提供物品の費用に該当する。","容器費用は一切加算されない。","容器費用は常に提供物品の費用として扱う。","容器費用は課税価格を減額する。"],"ans":0},{"i":322,"l":"teiritsuho","a":"課税価格通達（運賃保険料）","t":"select","tp":"現実に要した運賃","q":"輸入港までの運賃・保険料の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。輸入港までの運賃・保険料は原則として現実に要した額を加算する（CIF基準）。これらが不明確な場合は通常要する費用により計算する取扱いがある。","c":["原則として現実に要した輸入港までの運賃・保険料の額を加算する。","運賃・保険料は加算しない。","国内運賃も加算する。","運賃は推定額で常に加算する。"],"ans":0},{"i":323,"l":"teiritsuho","a":"課税価格通達（特別な事情）","t":"select","tp":"取引価格によれない特別な事情","q":"原則的な課税価格の決定方法（取引価格）によることができない特別な事情に該当しないものを一つ選びなさい。","e":"課税価格通達・関税評価。特別な事情は、処分・使用の制限、課税価格決定を困難とする条件、明らかでない売手帰属収益、特殊関係の取引価格への影響等。単に国内品より高いことは特別な事情ではない。","c":["輸入貨物の処分・使用につき制限がある場合","課税価格の決定を困難とする条件が付されている場合","売手に帰属する収益があり、その額が明らかでない場合","輸入貨物の単価が国内の同種品より高い場合"],"ans":3},{"i":324,"l":"teiritsuho","a":"課税価格通達（無償貨物）","t":"select","tp":"輸入取引によらない貨物","q":"原則的な課税価格の決定方法によることができない「輸入取引によらない輸入貨物」に該当するものを一つ選びなさい。","e":"関税評価・課税価格通達。無償貨物、委託販売のため輸入される貨物、賃貸借契約に基づく貨物等は「輸入取引によらない輸入貨物」に当たり、取引価格による方法によれず他の方法で課税価格を決定する。","c":["無償貨物・委託販売貨物・賃貸借貨物等","通常の売買により輸入される貨物","取引価格が明確な有償貨物","特殊関係のない当事者間の有償取引貨物"],"ans":0},{"i":325,"l":"teiritsuho","a":"課税価格通達4の3","t":"select","tp":"国内販売価格の控除項目","q":"国内販売価格に基づく課税価格の決定（控除方式）で控除される項目に含まれないものを一つ選びなさい。","e":"関税評価・定率法第4条の3。控除方式では国内販売価格から、通常の手数料・利潤・一般経費、輸入港到着後の運送費用等、関税その他の公課を控除する。輸出国の製造原価は控除項目ではない（積上方式の要素）。","c":["同類の輸入貨物の国内販売に係る通常の手数料又は利潤及び一般経費","輸入港到着後の運送費用等","関税その他の公課","輸出国での製造原価"],"ans":3},{"i":326,"l":"teiritsuho","a":"課税価格通達4の3第1項第2号","t":"select","tp":"加工後国内販売の控除","q":"課税物件確定の時の属する日後に加工の上国内販売された場合の課税価格に関する記述として、最も適切なものを一つ選びなさい。","e":"定率法第4条の3第1項第2号。課税物件確定日後に加工の上国内販売された場合は、その国内販売価格から加工により付加された価額及び通常の手数料・利潤・一般経費等を控除した残額を課税価格とする。","c":["国内販売価格から、加工により付加された価額及び通常の手数料等の額を控除して課税価格を計算する。","加工後の国内販売価格をそのまま課税価格とする。","加工後の貨物は課税できない。","加工費は控除しない。"],"ans":0},{"i":327,"l":"teiritsuho","a":"課税価格通達4〜4の8-1","t":"select","tp":"評価方法の適用順序","q":"課税価格の決定方法の適用順序に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4〜4の8-1。同種貨物に係る取引価格と類似貨物に係る取引価格の双方があるときは、同種貨物に係る取引価格を優先して適用する。","c":["同種貨物と類似貨物の取引価格がともにある場合は、同種貨物の取引価格を優先する。","類似貨物の取引価格を常に優先する。","同種・類似の区別なく輸入者が選択する。","同種貨物と類似貨物の優先順位はない。"],"ans":0},{"i":328,"l":"teiritsuho","a":"基本通達14-1","t":"select","tp":"無条件免税（内廷用品）","q":"無条件免税のうち内廷用品等に関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達14-1。法第14条第1号に関し、天皇及び内廷にある皇族の用に供される物品の無条件免税について用語の意義・取扱いが定められている。","c":["天皇及び内廷にある皇族の用に供される物品等は、無条件免税の対象として通達で取扱いが定められている。","皇室用品にも一般と同じく課税される。","内廷用品は条件付免税である。","内廷用品の免税の取扱いは通達にない。"],"ans":0},{"i":329,"l":"teiritsuho","a":"基本通達14（再輸入容器）","t":"select","tp":"再輸入容器の課税価格","q":"無条件免税に関連する再輸入する容器の課税価格の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達14。再輸入する容器が輸出の際に輸出貨物の容器として使用されたものであるときは、便宜その輸出の際のFOB価格を、そうでないときはFOB価格に往路運賃・保険料を加えた価格を課税価格とする。","c":["再輸入する容器が輸出の際に輸出貨物の容器として使用されたものであるときは、便宜、その輸出の際のFOB価格を課税価格とする取扱いがある。","再輸入容器の課税価格は常に国内小売価格による。","再輸入容器には課税価格の概念がない。","再輸入容器は無条件で免税される。"],"ans":0},{"i":330,"l":"teiritsuho","a":"基本通達14（容器入り貨物）","t":"select","tp":"容器入り貨物の課税価格按分","q":"再輸入する容器に詰められた貨物の課税価格の計算に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達14。再輸入容器に詰められた貨物の課税価格は、容器を含む貨物全体の課税価格から当該再輸入容器の課税価格を控除した価格とする（免税容器分を控除）。","c":["容器を含む貨物全体の課税価格から、当該再輸入する容器の課税価格を控除した価格を内容貨物の課税価格とする。","容器と内容貨物は区別せず一体で課税する。","内容貨物の課税価格は容器費用を加算して計算する。","容器入り貨物の按分計算はしない。"],"ans":0},{"i":331,"l":"kanzeiho","a":"基本通達（指定地外検査）","t":"select","tp":"指定地外検査の許可","q":"税関長が指定した場所以外での貨物の検査に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第69条・第100条及び通達。税関長が指定した場所以外で貨物の検査を受けようとするときは指定地外検査の許可を受け、所定の手数料を納付する。","c":["指定された場所以外で検査を受けようとするときは、税関長の許可を受け、所定の手数料を納付する。","検査はどこでも自由に受けられる。","指定地外検査に手数料はかからない。","指定地外検査は認められない。"],"ans":0},{"i":332,"l":"kanzeiho","a":"基本通達（収容課金）","t":"select","tp":"収容課金","q":"収容された貨物に係る費用（収容課金）に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法及び通達。収容された貨物を引き取るには、関税等のほか収容に要した費用（収容課金。収容期間に応じて計算）を納付する必要がある。","c":["収容された貨物を引き取るには、関税のほか収容に要した費用（収容課金）を納付する必要がある。","収容貨物の引取りに費用はかからない。","収容課金は輸出者が負担する。","収容課金の制度はない。"],"ans":0},{"i":333,"l":"kanzeiho","a":"基本通達（保税運送の包括承認）","t":"select","tp":"保税運送の包括承認","q":"保税運送の包括承認に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第63条及び通達。同一区間で継続的・反復的に行われる保税運送について、一定期間・一定範囲を指定して一括して承認する包括保税運送承認の取扱いがある。","c":["継続的・反復的に行われる保税運送について、一定期間を指定して一括して承認する取扱いがある。","保税運送は常に個別に承認を要する。","包括承認は輸出貨物のみが対象である。","保税運送に承認は不要である。"],"ans":0},{"i":334,"l":"kanzeiho","a":"基本通達（記号番号）","t":"select","tp":"輸入申告事項","q":"輸入申告における記載事項の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第67条及び通達。輸入（納税）申告には、品名・数量・課税標準となるべき価格、税番・税率・税額等を所定の様式（C-5020等）により記載する。","c":["輸入申告には品名・数量・課税標準となるべき価格等のほか、必要な事項を所定の様式により記載する。","輸入申告には品名のみ記載すれば足りる。","申告事項は輸入者が任意に決める。","申告様式は定められていない。"],"ans":0},{"i":335,"l":"kanzeiho","a":"基本通達（評価申告）","t":"select","tp":"評価申告","q":"課税価格の計算の基礎となる事項を申告する評価申告に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達。加算要素や特殊関係の有無等、課税価格の計算に関する一定の事項について、輸入申告書のほか評価申告書（包括・個別）に記載して提出する取扱いがある。","c":["一定の場合、輸入申告書のほか評価申告書に所要の事項を記載して提出する取扱いがある。","評価申告は不要である。","評価申告は輸出時に行う。","評価申告は税関が作成する。"],"ans":0},{"i":336,"l":"kanzeiho","a":"基本通達（船（機）用品）","t":"select","tp":"船用品積込みの期間","q":"外国貨物である船用品の積込承認に係る期間の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第23条及び通達。外国貨物である船用品・機用品の積込承認は、承認の日から所定の期間内に積み込むことを条件とし、期間内に積み込まれない場合の関税徴収等の取扱いがある。","c":["承認の日から一定期間（原則として承認の日から所定の期間）内に積み込むことを条件とする取扱いがある。","積込期間に制限はない。","船用品は承認の日に必ず積み込む。","船用品の積込みに期間の概念はない。"],"ans":0},{"i":337,"l":"kanzeiho","a":"基本通達（他所蔵置許可申請書）","t":"select","tp":"他所蔵置の申請書","q":"他所蔵置の許可の申請手続に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達30-3。他所蔵置の許可申請は、貨物を置こうとする場所を所轄する税関官署に他所蔵置許可申請書（C-3000）を提出し、許可を受けて行う（輸出申告書による代替手続あり）。","c":["貨物を置こうとする場所を所轄する税関官署に他所蔵置許可申請書を提出し、許可を受ける。","申請書は不要で口頭で足りる（緊急時を除く）。","申請は輸入者の住所地税関に行う。","他所蔵置は財務大臣の許可による。"],"ans":0},{"i":338,"l":"kanzeiho","a":"基本通達30-4","t":"select","tp":"他所蔵置期間の延長","q":"他所蔵置の許可期間の延長に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達30-4。他所蔵置の許可期間の延長を受けようとするときは、他所蔵置許可期間延長承認申請書に交付済みの許可書を添付して提出し、認められれば許可書を訂正して交付を受ける。","c":["許可に係る期間の延長を受けようとするときは、所定の延長承認申請書を許可書を添付して提出する。","他所蔵置の期間は延長できない。","延長に申請は不要である。","延長は財務大臣が行う。"],"ans":0},{"i":339,"l":"kanzeiho","a":"基本通達30-5","t":"select","tp":"要検疫物件の取扱い","q":"要検疫物件を検疫等のため保税地域以外の場所に持ち出す場合の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達30-5。植物防疫法・家畜伝染病予防法等による要検疫物件を検疫等のため保税地域外へ運搬し、終了後もとの保税地域等で通関する場合は保税運送の手続をとらせる（指定検疫場所等で通関する場合は他所蔵置の許可等による）。","c":["検疫等のため特定の検査場所等へ運搬し、終了後もとの保税地域等で通関する場合は保税運送の手続をとらせる。","要検疫物件は保税地域外に持ち出せない。","要検疫物件には検疫の概念がない。","要検疫物件の運搬に手続は不要である。"],"ans":0},{"i":340,"l":"kanzeiho","a":"基本通達9の10-5","t":"select","tp":"許可前の関税徴収","q":"納税申告された貨物の関税徴収に関する記述として、最も適切なものを一つ選びなさい。","e":"基本通達9の10-5。納税申告された貨物の関税は一般に法第9条・第9条の2により納付されるが、輸入許可前であっても一定の徴収規定に該当する場合は、それぞれの規定により徴収されることがある。","c":["一般には法第9条等により納付されるが、輸入許可前に一定の規定に該当する場合は当該規定により徴収されることがある。","関税は必ず輸入許可後に徴収される。","許可前に関税が徴収されることはない。","関税の徴収時期に定めはない。"],"ans":0},{"i":341,"l":"kanzeiho","a":"通関業法基本通達（関連業務）","t":"select","tp":"通関手続に含まれる手続","q":"通関業法上、通関手続に含まれる手続に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達。輸入許可後に行われる修正申告・更正の請求・特例申告等、許可・承認の内容に変更を及ぼす手続（輸出許可後の船名・数量変更等）も通関手続に含まれる。","c":["輸入許可後の修正申告・更正の請求・特例申告等も通関手続に含まれる。","輸入許可後の手続は通関手続に含まれない。","修正申告は関連業務であり通関手続ではない。","通関手続は輸入申告のみを指す。"],"ans":0},{"i":342,"l":"kanzeiho","a":"通関業法基本通達2-1(2)","t":"select","tp":"委任を証する書類","q":"通関業者が代理手続をする場合の委任を証する書類に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-1(2)。通関業者が代理手続をする場合、必要がある場合を除き、別個に委任の事実を証する書類（委任状）の提出は要しない（ただし記帳・保存等の規定の適用はある）。","c":["代理手続をする場合には、必要がある場合を除き、別個に委任の事実を証する書類の提出は要しない。","代理手続には常に委任状の提出を要する。","委任を証する書類は一切提出できない。","委任の事実は口頭でも証明できない。"],"ans":0},{"i":343,"l":"teiritsuho","a":"課税価格通達（航空運賃特例）","t":"select","tp":"航空運賃特例の対象","q":"航空運送された貨物の課税価格計算における航空運賃特例の対象に含まれうるものとして、最も適切なものを一つ選びなさい。","e":"課税価格通達（航空運賃特例）。無償の見本・宣伝用物品、緊急輸入される救援物資、公的機関に係る一定の貨物、個人的な使用に供する一定の貨物等は、現実の航空運賃ではなく通常の運賃により課税価格を計算する。","c":["無償の見本、災害救助等のため緊急に輸入される貨物、公的機関に係る一定の貨物等","通常の商業輸入貨物すべて","高額の商業貨物のみ","航空運賃特例の対象は定められていない。"],"ans":0},{"i":344,"l":"teiritsuho","a":"課税価格通達（仕入書）","t":"select","tp":"仕入書による確認","q":"課税価格の調査における仕入書（インボイス）の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。課税価格の計算は、仕入書（インボイス）その他取引内容を示す書類により現実支払価格・加算要素を確認して行う。仕入書価格と現実支払価格の関係に留意する。","c":["課税価格の計算は、原則として仕入書その他の書類により取引価格を確認して行う。","仕入書は課税価格の計算に用いない。","課税価格は仕入書なしに推定で決める。","仕入書は輸出時にのみ用いる。"],"ans":0},{"i":345,"l":"teiritsuho","a":"課税価格通達（値引き）","t":"select","tp":"値引きの取扱い","q":"輸入取引における値引きの課税価格への影響に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。現実支払価格は買手が現実に支払う価格であり、契約に基づく数量値引き・現金値引き等で実際に適用されたものは現実支払価格に反映される（一定の要件・立証を要する）。","c":["一定の要件を満たす値引き（数量値引き・現金値引き等）は、現実支払価格に反映される場合がある。","値引きは課税価格に一切影響しない。","値引きは常に課税価格を増額する。","値引きは加算要素である。"],"ans":0},{"i":346,"l":"teiritsuho","a":"課税価格通達（据付費等）","t":"select","tp":"輸入港到着後の費用","q":"輸入港到着後の据付け・組立て・整備の費用に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。輸入貨物につき輸入港到着後に行われる据付け・組立て・整備・技術指導等の費用は、現実支払価格と明確に区別できる場合は課税価格に算入しない。","c":["輸入貨物につき輸入後に行われる据付け・組立て・整備等の費用は、明らかに区別できる場合は課税価格に算入しない。","据付け費用は常に課税価格に算入する。","据付け費用は加算要素である。","据付け費用は課税価格を増額する。"],"ans":0},{"i":347,"l":"teiritsuho","a":"課税価格通達（保険料不明）","t":"select","tp":"保険料が不明の場合","q":"輸入貨物の保険料の額が不明である場合の課税価格計算に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。貨物が保険に付されていない場合や保険料の額が不明の場合は、通常要すると認められる保険料等の額により課税価格を計算する取扱いがある。","c":["保険に付されていない場合や保険料が不明の場合は、通常要する保険料等により計算する取扱いがある。","保険料が不明なら課税価格は計算できない。","保険料は不明でも加算しない。","保険料は常に運賃に含めて計算する。"],"ans":0},{"i":348,"l":"teiritsuho","a":"課税価格通達（運賃按分）","t":"select","tp":"包括運賃の按分","q":"複数の貨物について包括して支払われた運賃の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。複数の貨物について包括して支払われた運賃等は、各貨物の価格・重量・容積等の合理的な基準により按分して各貨物の課税価格に算入する。","c":["包括運賃は、各貨物の価格・重量・容積等を基準に合理的に按分して各貨物に算入する。","包括運賃は最初の貨物に全額算入する。","包括運賃は算入しない。","包括運賃は輸入者が任意に配分する。"],"ans":0},{"i":349,"l":"teiritsuho","a":"課税価格通達（無償提供の按分）","t":"select","tp":"提供物品費用の配分","q":"買手が無償提供した物品（型・工具等）の費用の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。買手が無償・値引きで提供した材料・工具・鋳型等の費用は、その取得・生産費用を、これを用いて生産される貨物の総数量等に応じて適正に配分し、各輸入貨物に按分して加算する。","c":["提供物品の取得・生産費用を、生産される貨物の数量等に応じて適正に配分して加算する。","提供物品費用は最初の輸入貨物に全額加算する。","提供物品費用は加算しない。","提供物品費用は課税価格を減額する。"],"ans":0},{"i":350,"l":"teiritsuho","a":"課税価格通達（ロイヤルティ）","t":"select","tp":"権利使用料の加算要件","q":"権利使用料（ロイヤルティ）の課税価格への加算要件に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。権利使用料は、輸入貨物に係るものであって、その輸入貨物の輸入取引をするために買手が直接・間接に支払うものが加算される。輸入貨物と関係のないもの・取引条件でないものは加算しない。","c":["輸入貨物に係るもので、その輸入取引をするために買手が直接・間接に支払うものが加算される。","あらゆる権利使用料が無条件に加算される。","権利使用料は一切加算されない。","国内で発生する使用料も加算される。"],"ans":0},{"i":351,"l":"zanteiho","a":"暫定法基本通達4-2","t":"select","tp":"航空機部分品等の免税申告者","q":"航空機部分品等の免税を受けようとする者に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達4-2。航空機部分品等の免税について、運航者が航空機に使用する部分品等を輸入する場合は当該運航者が、製造・組立て・修理者が輸入する場合は当該者が「免除を受けようとする者」となる。","c":["航空機の運航者が航空機に使用する部分品等を輸入する場合は、当該運航者が免税を受けようとする者となる。","免税を受けようとする者は常に輸入者本人に限られない。","航空機部分品の免税に申告者の定めはない。","免税申告者は財務大臣が指定する。"],"ans":0},{"i":352,"l":"zanteiho","a":"暫定法基本通達（航空機部分品）","t":"select","tp":"航空機部分品免税の趣旨","q":"航空機部分品等の免税の趣旨に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法。航空機部分品等の免税は、本邦で生産が困難な航空機・その部分品等の輸入について、産業政策的観点から暫定的に関税を免除する制度である。","c":["国産化が困難な航空機部分品等の輸入について、政策的に関税を免除するものである。","すべての機械部品を免税するものである。","輸出される航空機部品を免税するものである。","航空機部分品の免税に政策目的はない。"],"ans":0},{"i":353,"l":"zanteiho","a":"暫定法基本通達9-2","t":"select","tp":"児童福祉施設等の範囲","q":"暫定法基本通達における用語の意義の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法基本通達9-2等。減免税の対象施設等の範囲について暫定法基本通達で用語の意義・取扱いが定められ、関税定率法基本通達がこれを準用する場合がある（通達間の準用関係）。","c":["減免税の対象となる施設等の範囲について、暫定法基本通達で用語の意義が定められ、定率法基本通達がこれを準用することがある。","施設の範囲に関する通達はない。","施設の範囲は輸入者が定める。","用語の意義は法律のみで定まる。"],"ans":0},{"i":354,"l":"zanteiho","a":"暫定法（特恵の適用順位）","t":"select","tp":"特恵の最優先適用","q":"特恵関税の適用と他の税率との関係に関する記述として、最も適切なものを一つ選びなさい。","e":"関税定率法基本通達3-1(6)。暫定法に基づく特恵関税の適用がある場合は、他の税率（基本・暫定・協定・EPA）に優先して特恵税率を適用する。","c":["特恵関税の適用要件を満たす場合、特恵税率は他の税率に優先して適用される。","特恵税率は協定税率の後に検討される。","特恵税率は基本税率より高くても適用される。","特恵税率は他の税率と同時に併課される。"],"ans":0},{"i":355,"l":"zanteiho","a":"暫定法（特恵原産地・累積）","t":"select","tp":"原産地の累積","q":"特恵原産地規則における累積制度に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵原産地規則。一定の地域的な枠組み等において、複数の特恵受益国を一の国とみなして原産品の判断を行う累積の取扱いがある（原産材料の範囲を広げる仕組み）。","c":["一定の場合、複数の特恵受益国を一の国とみなして原産性を判断する累積の取扱いがある。","累積制度は存在しない。","累積は先進国材料にも適用される。","累積は基本税率の要件である。"],"ans":0},{"i":356,"l":"zanteiho","a":"暫定法（特恵の僅少の非原産材料）","t":"select","tp":"僅少の非原産材料","q":"特恵原産地規則における僅少の非原産材料（デミニミス）に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵原産地規則。実質的変更基準（関税分類変更基準）を満たさない非原産材料があっても、その割合が一定（僅少）以下であれば原産品と認める取扱い（デミニミス・許容限度）がある。","c":["非原産材料の割合が僅少である場合、関税分類変更基準を満たさなくても原産品と認められる場合がある。","非原産材料が含まれると常に原産品とならない。","僅少の非原産材料の取扱いはない。","僅少基準は完全生産品に適用される。"],"ans":0},{"i":357,"l":"zanteiho","a":"暫定法（特恵原産地証明書の発給者）","t":"select","tp":"原産地証明書の発給機関","q":"特恵原産地証明書の発給に関する記述として、最も適切なものを一つ選びなさい。","e":"特恵原産地規則。特恵原産地証明書（Form A等）は、原則として原産国である特恵受益国の権限のある政府機関等が発給する（一部は自己申告制度）。","c":["原産地証明書は、原則として原産国（特恵受益国）の権限のある機関が発給する。","原産地証明書は輸入者が作成する。","原産地証明書は本邦の税関が発給する。","原産地証明書の発給機関に定めはない。"],"ans":0},{"i":358,"l":"zanteiho","a":"暫定法（暫定税率の根拠別表）","t":"select","tp":"暫定税率の別表","q":"暫定税率の根拠に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法第2条・別表第一。暫定税率は暫定法の別表第一に掲げる物品で一定期日までに輸入されるものについて、同表に定める税率として規定される。","c":["暫定税率は暫定法別表第一等に掲げる物品について、期限を区切って定められる。","暫定税率は定率法別表に定められる。","暫定税率は告示のみで定まる。","暫定税率に根拠規定はない。"],"ans":0},{"i":359,"l":"zanteiho","a":"暫定法（特別特恵の対象国）","t":"select","tp":"特別特恵受益国","q":"特別特恵受益国に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法。特別特恵受益国は、後発開発途上国（LDC）のうち政令で指定された国で、特恵受益国よりさらに優遇された（多くは無税の）特別特恵関税が適用される。","c":["後発開発途上国であって政令で指定された国が特別特恵受益国となる。","すべての特恵受益国が特別特恵受益国である。","特別特恵受益国は先進国である。","特別特恵受益国の指定制度はない。"],"ans":0},{"i":360,"l":"zanteiho","a":"暫定法（特恵の卒業）","t":"select","tp":"特恵の適用除外（卒業）","q":"特恵関税の適用除外（いわゆる卒業）に関する記述として、最も適切なものを一つ選びなさい。","e":"暫定法。経済発展により国際競争力をつけた特恵受益国・産品については、特恵関税の適用を除外・停止する（卒業）措置がとられる（全面卒業・部分卒業等）。","c":["国際競争力をつけた国・産品について、特恵関税の適用を除外・停止する措置がとられる。","特恵は一度供与すると除外されない。","卒業措置は基本税率の引下げを意味する。","特恵の卒業制度はない。"],"ans":0},{"i":361,"l":"kanzeiho","a":"基本通達（輸入申告の効果）","t":"select","tp":"輸入申告の効果","q":"輸入申告の効果に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）。輸入申告により、原則として課税物件の確定（第4条）・適用法令（第5条）の基準時が定まる等の効果が生じる。","c":["輸入申告により、課税物件・適用法令等が原則として申告の時点で確定する効果が生じる。","輸入申告には法的効果がない。","輸入申告は許可と同義である。","輸入申告の効果は通達にない。"],"ans":0},{"i":362,"l":"kanzeiho","a":"基本通達（他法令の証明書類）","t":"select","tp":"他法令の証明書類の提出","q":"他法令による許可・承認等を要する貨物の輸入申告における書類提出に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）・第70条。経済産業大臣又は税関長の輸入承認を要する貨物等は、その許可・承認等を証する書類を輸入申告の際に提出（検査完了・条件具備で申告時審査を要するものに限る）する。","c":["経済産業大臣等の輸入承認を要する貨物等は、その承認等を証する書類を輸入申告の際に提出等する。","他法令の証明書類は一切不要である。","他法令の証明は輸入許可後に提出すればよい。","他法令の証明は口頭で足りる。"],"ans":0},{"i":363,"l":"kanzeiho","a":"基本通達（減免税の書類）","t":"select","tp":"減免税の書類提出","q":"関税の軽減・免除・払戻しを受けようとする場合の書類提出に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）。定率法・暫定法等による関税の軽減・免除・払戻しを受けようとする場合で、輸入申告（特例申告貨物を除く）の際に特定の書類提出を要するときは、その書類を提出する。","c":["輸入申告の際に特定の書類の提出を要する場合は、その書類を提出して減免税の適用を受ける。","減免税に書類は不要である。","減免税の書類は許可後に提出する。","減免税は申告なく適用される。"],"ans":0},{"i":364,"l":"kanzeiho","a":"基本通達（原産品申告書）","t":"select","tp":"締約国原産地証明書等","q":"EPA税率の適用を受けるための原産地に関する書類に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達（第6章）。EPA税率の適用を受けるには、協定に応じて締約国原産地証明書又は原産品申告書（自己申告）を提出する（協定により第三者証明・自己申告の別がある）。","c":["締約国原産地証明書又は原産品申告書（締約国原産地証明書等）を提出して、EPA税率の適用を受ける。","EPA税率に原産地の証明は不要である。","EPA税率は基本税率の証明書による。","EPA税率の書類は輸出時に提出する。"],"ans":0},{"i":365,"l":"kanzeiho","a":"基本通達（貨物確認）","t":"select","tp":"貨物確認の意義","q":"通達における「貨物確認」の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達。貨物確認とは、他法令の該非の確認、関税分類、知的財産侵害物品の認定等、輸入貨物等の適正な審査のために行う貨物の検査をいう。","c":["他法令の該非確認・関税分類・知的財産侵害物品の認定等のために行う貨物の検査をいう。","貨物確認とは輸入許可をいう。","貨物確認は課税価格の計算をいう。","貨物確認は通達に定義がない。"],"ans":0},{"i":366,"l":"kanzeiho","a":"基本通達（特例申告の納期限）","t":"select","tp":"特例申告と納期限延長","q":"特例申告に係る納期限の延長に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第9条の2・基本通達。特例申告に係る関税についても、所要の手続・担保提供を条件に納期限の延長を受けられる（申告書に納期限延長に係る所要事項を記載する取扱いがある）。","c":["特例申告に係る関税についても、担保の提供を条件に納期限の延長を受けられる場合がある。","特例申告に納期限の延長はない。","特例申告は納付を要しない。","特例申告の納期限延長に担保は不要である。"],"ans":0},{"i":367,"l":"kanzeiho","a":"基本通達（保税蔵置場の許可期間）","t":"select","tp":"許可期間の標準","q":"保税蔵置場の許可期間の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達。保税蔵置場の許可期間は、通達で示される標準的な年数を踏まえて税関長が定め、申請により更新できる（施設・管理状況等を勘案）。","c":["保税蔵置場の許可期間は、通達上の標準（一定年数）を踏まえて税関長が定め、更新できる。","許可期間は法律で一律に定まり税関長の裁量はない。","許可期間は無期限である。","許可期間は更新できない。"],"ans":0},{"i":368,"l":"kanzeiho","a":"基本通達34の2-10","t":"select","tp":"外国籍船舶修理資材の記帳","q":"造船所内の保税蔵置場における外国籍船舶の修理・改装用資材の帳簿に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達34の2-10。造船所内の保税蔵置場における外国籍船舶の修理・改装用資材に係る記帳義務の帳簿は、他の資材の帳簿と明確に区分し、入きょ等した外国籍船舶ごとに別冊とさせ所定の標記をさせる。","c":["修理・改装用資材に係る帳簿は他の資材の帳簿と明確に区分し、船舶ごとに別冊とさせる取扱いがある。","修理用資材の帳簿は他の資材と一体でよい。","外国籍船舶の資材に記帳義務はない。","記帳は税関が行う。"],"ans":0},{"i":369,"l":"kanzeiho","a":"基本通達（指定地外貨物取扱）","t":"select","tp":"指定地外貨物の積卸し","q":"税関長が指定した場所以外での貨物の積卸しに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法及び通達。税関長が指定した場所以外で貨物の積卸しをしようとするときは、指定地外貨物取扱いの許可を受け、所定の手数料を納付する（他所蔵置許可と一括処理する取扱いがある）。","c":["指定地外で貨物の積卸しをしようとするときは、税関長の許可を受け、所定の手数料を納付する。","貨物の積卸しはどこでも自由である。","指定地外積卸しに手数料はかからない。","指定地外での積卸しは認められない。"],"ans":0},{"i":370,"l":"kanzeiho","a":"基本通達（収容の要件）","t":"select","tp":"収容できる場合","q":"外国貨物を収容できる場合に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第80条・通達。保税地域の蔵置期間を経過した外国貨物、許可・承認を受けずに保税地域外にある外国貨物等、一定の要件に該当する場合に税関長は収容できる。","c":["保税地域の蔵置期間を経過した外国貨物等、一定の要件に該当する場合に収容できる。","あらゆる外国貨物をいつでも収容できる。","収容できるのは内国貨物である。","収容に要件はない。"],"ans":0},{"i":371,"l":"teiritsuho","a":"課税価格通達（買付手数料）","t":"select","tp":"買付手数料の不算入","q":"買付手数料の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条第1項第2号イ。仲介料等の手数料は加算されるが、買手を代理して買付けに係る業務を行う者に支払われる対価（買付手数料）は加算要素から除かれる。","c":["買手を代理して買付けに係る業務を行う者への対価（買付手数料）は、課税価格に加算しない。","買付手数料は加算要素である。","すべての手数料が加算される。","買付手数料は課税価格を減額する。"],"ans":0},{"i":372,"l":"teiritsuho","a":"課税価格通達（検査費用）","t":"select","tp":"検査費用の取扱い","q":"輸入貨物に係る検査の費用の課税価格への算入に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。買手が自己のために行う検査（買手のための活動）の費用は、原則として現実支払価格に含まれず課税価格に算入しない（売手のために行う活動と区別する）。","c":["買手が自己のために行う検査の費用は、原則として課税価格に算入しない。","あらゆる検査費用が加算される。","検査費用は常に加算要素である。","検査費用は課税価格を減額する。"],"ans":0},{"i":373,"l":"teiritsuho","a":"課税価格通達（保証費用）","t":"select","tp":"保証に係る費用","q":"輸入貨物の保証（ワランティ）に係る費用の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。売手が負担すべき費用を買手が肩代わりして負担する場合（保証費用等を含む）は、その額が現実支払価格の一部（間接支払）として課税価格に含まれることがある。","c":["売手が負担すべき保証費用を買手が負担する場合等、現実支払価格の一部として扱われることがある。","保証費用は常に課税価格に算入しない。","保証費用は加算要素として別途加算する。","保証費用は課税価格を減額する。"],"ans":0},{"i":374,"l":"teiritsuho","a":"課税価格通達（割増金）","t":"select","tp":"現実支払価格の構成","q":"現実支払価格に含まれる支払に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。現実支払価格には、売手への直接支払のほか、買手が売手の債務を弁済するため等に第三者へ支払う額（間接支払）も含まれることがある。","c":["買手が売手のために又は売手の債務の弁済として第三者に支払う額等も、現実支払価格に含まれることがある。","現実支払価格は売手への直接支払のみである。","間接支払は現実支払価格に含まれない。","現実支払価格に第三者への支払は一切含まれない。"],"ans":0},{"i":375,"l":"teiritsuho","a":"課税価格通達（輸入取引）","t":"select","tp":"輸入取引の意義","q":"課税価格の基礎となる「輸入取引」の意義に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・関税評価。輸入取引とは、本邦に拠点を有する者が買手として貨物を本邦に到着させることとなる売買をいう。買手が本邦に住所等を有しない取引等は原則的方法によれない。","c":["本邦に拠点を有する者が買手として貨物を本邦に到着させることとなる売買をいう。","輸入取引とは国内の転売をいう。","輸入取引には買手・売手の概念がない。","輸入取引は輸出国内の取引をいう。"],"ans":0},{"i":376,"l":"teiritsuho","a":"課税価格通達（同種・類似の意義）","t":"select","tp":"同種・類似の貨物","q":"課税価格の決定における「同種の貨物」「類似の貨物」に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。同種の貨物は形状・品質・社会的評価を含むすべての点で同一の貨物、類似の貨物は同一でないが同様の特性・構成材料を有し同一の機能を果たし代替可能な貨物をいう（いずれも同一生産国産品）。","c":["同種の貨物は形状・品質・社会的評価等が同一の貨物、類似の貨物は同一の機能等を有し代替可能な貨物をいう。","同種と類似に区別はない。","同種・類似は輸入者が任意に決める。","同種・類似の貨物の概念はない。"],"ans":0},{"i":377,"l":"teiritsuho","a":"課税価格通達（生産費）","t":"select","tp":"製造原価方式の構成","q":"製造原価に基づく課税価格の計算（積上方式）の構成に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条の4。製造原価方式は、輸入貨物の製造原価に、本邦への輸出のための販売に係る通常の利潤・一般経費、及び輸入港までの運賃等を加えて課税価格を計算する。","c":["製造原価に、本邦への輸出販売に係る通常の利潤・一般経費及び輸入港までの運賃等を加える。","製造原価のみで計算する。","製造原価から利潤を控除する。","製造原価方式に運賃は含めない。"],"ans":0},{"i":378,"l":"teiritsuho","a":"課税価格通達（端数処理）","t":"select","tp":"課税価格の端数処理","q":"課税価格・関税額の端数処理に関する記述として、最も適切なものを一つ選びなさい。","e":"通則・通達。課税標準となる価格は千円未満の端数を切り捨て、これに税率を乗じて算出した関税額は百円未満の端数を切り捨てる（国税通則法に準じた端数処理）。","c":["課税標準となる価格は千円未満の端数を切り捨て、確定関税額は百円未満を切り捨てる取扱いがある。","端数は常に切り上げる。","端数処理は行わない。","端数処理は輸入者が任意に行う。"],"ans":0},{"i":379,"l":"teiritsuho","a":"課税価格通達（外貨換算）","t":"select","tp":"外貨建ての換算相場","q":"外貨建て取引の課税価格の本邦通貨への換算に関する記述として、最も適切なものを一つ選びなさい。","e":"定率法第4条の7・通達。外貨建ての価格は、輸入申告の日の属する週の前々週の実勢相場の平均値（財務省令で定める為替相場）により本邦通貨に換算する。","c":["財務省令で定める一定期間（週間）の平均値に基づく為替相場により換算する取扱いがある。","換算は輸入者が任意の相場で行う。","外貨建ては換算せず課税する。","換算相場は契約日のものを用いる。"],"ans":0},{"i":380,"l":"teiritsuho","a":"課税価格通達（特殊関係の影響）","t":"select","tp":"特殊関係の取引価格への影響","q":"特殊関係がある場合の取引価格の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達・定率法第4条第2項。特殊関係があっても、それが取引価格に影響を与えていない（比較価格との近接性等で立証）と認められれば、取引価格を課税価格として用いることができる。","c":["特殊関係が価格に影響していないことを立証できれば、取引価格を課税価格として用いることができる。","特殊関係があれば常に取引価格は使えない。","特殊関係の影響は立証を要しない。","特殊関係があると課税できない。"],"ans":0},{"i":381,"l":"gyouho","a":"通関業法基本通達（通関業務の範囲）","t":"select","tp":"通関業務に含まれる手続","q":"通関業務に含まれる手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達。通関業務には、輸出入申告等、関税の確定・納付に関する手続、不服申立て・主張代理等が含まれ、輸入許可後の修正申告・更正の請求・特例申告等も含まれる。","c":["輸出入申告のほか、関税の納付に関する手続、不服申立て、これらに先行・後続する一定の手続が含まれる。","通関業務は輸入申告のみを指す。","不服申立ては通関業務に含まれない。","通関業務の範囲は通達にない。"],"ans":0},{"i":382,"l":"gyouho","a":"通関業法基本通達（関連業務）","t":"select","tp":"関連業務の範囲","q":"通関業者が行う関連業務に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第7条。通関業者は通関業務のほか、これに先行・後続する運送・保管の取次ぎ等の関連業務を行うことができる（通関業務に密接に関連する範囲）。","c":["通関業務に先行・後続する運送・保管の取次ぎ等は関連業務として行うことができる。","関連業務は通関業務と同一である。","関連業務には許可が別途必要である。","関連業務は行えない。"],"ans":0},{"i":383,"l":"gyouho","a":"通関業法基本通達（記帳）","t":"select","tp":"記帳の方法","q":"通関業者の記帳義務に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第22条。通関業者は通関業務に関する帳簿に、依頼者の氏名・取扱貨物・通関業務の内容・料金等の所定の事項を記載し、関係書類とともに保存する。","c":["通関業務に関する帳簿には、依頼者・取扱貨物・料金等所定の事項を記載させる。","帳簿の記載事項に定めはない。","記帳は通関士のみが行う。","記帳義務は通達では定めていない。"],"ans":0},{"i":384,"l":"gyouho","a":"通関業法基本通達（料金掲示）","t":"select","tp":"料金の掲示方法","q":"通関業務の料金の掲示に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第18条等。通関業者は通関業務の料金の額を、営業所において依頼者の見やすいように掲示する方法により明らかにする。","c":["料金の額を営業所の依頼者の見やすい場所に掲示する等の方法による。","料金は掲示せず個別に通知する。","料金の掲示方法に定めはない。","料金は税関が掲示する。"],"ans":0},{"i":385,"l":"gyouho","a":"通関業法基本通達（確認の手続）","t":"select","tp":"通関士確認の手続","q":"通関士の確認の申請手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第31条。通関業者が試験合格者をその通関業務に従事させようとするとき、所定の確認申請書に必要書類を添えて財務大臣（税関長経由）に確認を申請する。","c":["通関業者が、試験合格者を通関業務に従事させようとするとき、所定の申請書により財務大臣に確認を申請する。","確認は本人が直接申請する。","確認に申請書は不要である。","確認は税関長に申請する。"],"ans":0},{"i":386,"l":"gyouho","a":"通関業法基本通達（営業所の責任者）","t":"select","tp":"通関業務の責任者","q":"通関業務を行う営業所の体制に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第13条等。通関業務を行う営業所ごとに、通関士の設置をはじめ通関業務を適正に遂行できる人的体制を確保することが求められる。","c":["営業所ごとに通関業務を適正に遂行できる体制（通関士の設置等）を確保する必要がある。","営業所の体制に関する取扱いはない。","通関業務はどの営業所でも体制を要しない。","営業所には責任者を置けない。"],"ans":0},{"i":387,"l":"gyouho","a":"通関業法基本通達（秘密保持の範囲）","t":"select","tp":"秘密保持義務の対象者","q":"通関業務上の秘密保持義務の対象に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第19条。秘密保持義務は通関業者・通関士のほか、その従業者等も対象とし、これらの者でなくなった後（退職後）も及ぶ。","c":["通関業者・通関士のほか、その従業者等も秘密保持義務の対象となる。","秘密保持義務は通関士のみが負う。","従業者は秘密保持義務を負わない。","秘密保持義務は退職により消滅する。"],"ans":0},{"i":388,"l":"gyouho","a":"通関業法基本通達（依頼の拒絶）","t":"select","tp":"依頼拒絶の正当な理由","q":"通関業者が通関業務の依頼を拒める「正当な理由」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第16条等。通関業者は正当な理由なく依頼を拒んではならないが、業務量が過大で適正処理が困難な場合や違法・不当な依頼である場合等、合理的な事由があるときは拒みうる。","c":["業務量が過大で適正な処理ができない場合等、合理的な事由があるときは依頼を拒みうる。","通関業者はいかなる理由でも依頼を拒める。","依頼は一切拒めない。","正当な理由の判断基準はない。"],"ans":0},{"i":389,"l":"gyouho","a":"通関業法基本通達（信用失墜行為）","t":"select","tp":"信用失墜行為の例","q":"通関業者・通関士の信用失墜行為に該当しうるものとして、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第20条。信用失墜行為は、虚偽申告への関与、不正の手段による通関等、通関業者・通関士の信用又は品位を害する行為をいう。適正な業務遂行は当然これに当たらない。","c":["虚偽の申告に関与する等、通関業者・通関士の信用・品位を害する行為","適正な通関業務の遂行","料金の適正な掲示","依頼者への正確な説明"],"ans":0},{"i":390,"l":"gyouho","a":"通関業法基本通達（監督処分の基準）","t":"select","tp":"監督・懲戒処分の運用","q":"通関業者・通関士に対する監督・懲戒処分の運用に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達・第34条・第35条。財務大臣による監督処分・懲戒処分は、違反行為の態様・程度・故意過失等を勘案して、戒告から業務停止・許可取消し（懲戒では従事停止等）まで運用される。","c":["違反の態様・程度等を勘案して、戒告・業務停止・許可取消し等の処分が運用される。","処分は違反の程度に関係なく一律である。","処分の運用基準はない。","処分は税関長が任意に決める。"],"ans":0},{"i":391,"l":"kanzeiho","a":"基本通達（収容貨物の公売）","t":"select","tp":"公売の手続","q":"収容された貨物の公売の手続に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第84条・通達。収容された貨物が収容後一定期間内に引き取られないときは、公告等の所定の手続を経て公売（又は随意契約による売却）に付される。","c":["収容後一定期間内に引き取られない貨物は、公告等の手続を経て公売に付される。","収容貨物は直ちに公売される。","公売に公告は不要である。","収容貨物は公売されない。"],"ans":0},{"i":392,"l":"kanzeiho","a":"基本通達（亡失と関税）","t":"select","tp":"保税地域の貨物の亡失","q":"保税地域の外国貨物が亡失した場合の関税に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第45条等・通達。保税蔵置場等の外国貨物が亡失・滅却したときは原則として許可を受けた者から関税を徴収するが、災害その他やむを得ない事由による亡失・税関長承認による滅却の場合は除かれる。","c":["原則として許可を受けた者から関税を徴収するが、災害等やむを得ない事由による亡失・税関長承認による滅却は除く。","亡失しても関税は徴収されない。","亡失貨物の関税は輸入者から徴収する。","亡失と関税は無関係である。"],"ans":0},{"i":393,"l":"kanzeiho","a":"基本通達（廃棄と滅却の区別）","t":"select","tp":"廃棄と滅却","q":"外国貨物の廃棄と滅却の区別に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第34条・通達。外国貨物の廃棄はあらかじめの届出を要し、滅却（焼却・破砕等で物理的に消滅させること）は原則として税関長の承認を要する（滅却された貨物には関税を課さない取扱いがある）。","c":["廃棄は事前の届出、滅却（焼却等で物理的に消滅）は原則として税関長の承認による。","廃棄も滅却もともに承認による。","廃棄も滅却も手続を要しない。","廃棄と滅却に区別はない。"],"ans":0},{"i":394,"l":"kanzeiho","a":"基本通達（見本一時持出しの不許可）","t":"select","tp":"見本一時持出しを認めない貨物","q":"見本の一時持出しの包括許可を認めない貨物に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達32-3。見本の一時持出しの包括許可は、関税関係法令以外の法令により許可・承認等又は検査・条件具備を要する貨物や、その他取締上支障があると認められる貨物については認めない。","c":["他法令により見本の一時持出しに許可・承認等を要する貨物や、取締上支障があると認められる貨物は認めない。","すべての貨物の見本の包括持出しが認められる。","見本の一時持出しに制限はない。","見本は一切持ち出せない。"],"ans":0},{"i":395,"l":"kanzeiho","a":"基本通達（特例輸入者の帳簿）","t":"select","tp":"特例輸入関税関係帳簿","q":"特例輸入者の帳簿（特例輸入関税関係帳簿）に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の9・第7条の12等。特例輸入関税関係帳簿の備付け・記載・保存が法令に従って行われていない場合や、帳簿・書類に不実の記載があるときは、特例輸入者の承認の取消事由となりうる。","c":["帳簿の備付け・記載・保存が政令で定めるところに従って行われていない場合や不実記載があるときは、承認の取消事由となりうる。","帳簿の不備は承認に影響しない。","特例輸入者に帳簿義務はない。","帳簿は税関が作成する。"],"ans":0},{"i":396,"l":"teiritsuho","a":"課税価格通達（委託加工）","t":"select","tp":"委託加工貿易の課税価格","q":"委託者が提供した原材料を外国で加工させた製品を取得する取引（委託加工）の課税価格に関する記述として、最も適切なものを一つ選びなさい。","e":"定率法第4条第3項・通達。委託者が直接・間接に提供した原料・材料を外国で加工等した製品を委託者が取得する場合、輸入取引によらない貨物として、提供材料費・加工賃等を基礎とする方法等により課税価格を決定する。","c":["委託加工により取得する製品は輸入取引によらない貨物として、原則的方法によらず他の方法で課税価格を決定する。","委託加工製品は取引価格で課税する。","委託加工製品は課税できない。","委託加工の課税価格に定めはない。"],"ans":0},{"i":397,"l":"teiritsuho","a":"課税価格通達（一般的に認められた会計原則）","t":"select","tp":"会計原則の使用","q":"課税価格の計算における会計処理に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達4〜4の8-2。通常の利潤・一般経費や工賃等の計算は、適用条文に関連する国（本邦又は輸入貨物の生産国）において一般的に認められた会計原則に適合する方法で作成された資料を使用する。","c":["通常の利潤・一般経費や製造原価等の計算は、関連する国における一般的に認められた会計原則に適合する方法による。","会計原則は課税価格の計算に用いない。","計算方法は輸入者が任意に定める。","会計原則の使用に関する取扱いはない。"],"ans":0},{"i":398,"l":"teiritsuho","a":"課税価格通達（運賃の現実額）","t":"select","tp":"運賃が無償・不明の場合","q":"輸入貨物の運賃が無償又は不明である場合の課税価格計算に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。運賃が無償である場合や現実に要した運賃が不明である場合等は、当該貨物の輸入港までの運送につき通常要すると認められる運賃により課税価格を計算する。","c":["運賃が無償・不明等の場合は、通常要する運賃により計算する取扱いがある。","運賃が無償なら課税価格に加算しない。","運賃が不明なら課税できない。","運賃は常に推定で2倍を加算する。"],"ans":0},{"i":399,"l":"teiritsuho","a":"課税価格通達（加算要素の立証）","t":"select","tp":"加算要素の客観性","q":"加算要素を課税価格に加算する場合の要件に関する記述として、最も適切なものを一つ選びなさい。","e":"課税価格通達。加算要素は、客観的かつ数量化できる資料（書類等）に基づいてその額を把握できるものを加算する。これによれない場合は取引価格によらず他の方法による。","c":["加算要素は、客観的かつ数量化できる資料に基づいて算出できるものを加算する。","加算要素は推測で加算してよい。","加算要素は立証を要しない。","加算要素は輸入者の申告のみで決まる。"],"ans":0},{"i":400,"l":"teiritsuho","a":"課税価格通達（少額貨物の簡易な取扱い）","t":"select","tp":"少額貨物の課税価格","q":"少額輸入貨物の課税価格・税率の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"定率法第3条の3・通達。1輸入申告に係る課税価格の合計額が20万円以下の少額輸入貨物には、原則として少額輸入貨物に対する簡易税率を適用する（適用除外物品・希望しない旨の申出がある場合を除く）。","c":["課税価格の合計額が一定額以下の少額輸入貨物には、簡易税率を適用する取扱いがある（適用除外物品を除く）。","少額貨物には課税しない。","少額貨物にも常に一般税率を適用する。","少額貨物の取扱いは定められていない。"],"ans":0},{"i":401,"l":"gyouho","a":"基本通達2-3","t":"select","tp":"「業として」と無償","q":"通関業法上「業として通関業務を行う」の意義に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-3。「業として」とは営利目的で反覆継続して行い又はその意思をもって行う場合をいい、営利目的が直接的・間接的かを問わず、他の業務に附帯して無償で行われる場合も該当する。","c":["営利の目的をもって反覆継続して行い又はその意思をもって行う場合をいい、他の業務に附帯して無償で行われる場合もこれに該当する。","無償で行う場合は「業として」に該当しない。","営利の目的が間接的な場合は該当しない。","1回限りでも常に「業として」に該当する。"],"ans":0},{"i":402,"l":"gyouho","a":"基本通達2-2(1)","t":"select","tp":"通関手続に含まれる手続","q":"輸出入申告から許可・承認を得るまでの間に行われる手続の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-2(1)。減免税関係手続、指定地外貨物検査許可申請、開庁時間外執務を求める届出等であっても、輸出入申告等と関連して許可・承認を得るまでの間に行われるものは通関手続に含まれる。","c":["指定地外貨物検査許可申請や開庁時間外執務を求める届出も、輸出入申告等と関連して許可等を得るまでの間に行われるものは通関手続に含まれる。","輸出入申告以外の手続はすべて関連業務である。","指定地外貨物検査許可申請は通関手続に含まれない。","通関手続は輸出入申告のみを指す。"],"ans":0},{"i":403,"l":"gyouho","a":"基本通達2-2","t":"select","tp":"通関業務と関連業務の区別","q":"次のうち、通関業務に含まれるものとして最も適切なものを一つ選びなさい。","e":"通関業法基本通達。保税工場に外国貨物を置くことの承認申請は通関業務に含まれる一方、保税運送の承認申告は関連業務に当たるとされる（過去問でも問われる区別）。運送・保管そのものは通関業務ではない。","c":["外国貨物を保税工場に置くことの承認の申請","外国貨物を保税運送することの承認の申告","貨物の国内運送そのもの","貨物の保管そのもの"],"ans":0},{"i":404,"l":"gyouho","a":"基本通達2-2(2)","t":"select","tp":"許可後の手続","q":"輸入の許可後に行われる手続の通関手続該当性に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-2(2)。輸入許可後の修正申告・更正の請求・特例申告等、及び許可・承認の内容に変更を及ぼす手続（輸出許可後の船名・数量変更等）も通関手続に含まれる。","c":["輸入許可後の修正申告・更正の請求・特例申告等は通関手続に含まれる。","輸入許可後の手続はすべて通関手続から除かれる。","修正申告は関連業務である。","特例申告は通関手続に含まれない。"],"ans":0},{"i":405,"l":"gyouho","a":"基本通達2-1(1)","t":"select","tp":"代理申告の名義","q":"通関業者が依頼者の代理人として行う申告の名義に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-1(1)。代理申告の各種申告・申請等は原則として依頼者の名をもって行い、通関業者が依頼者に代わって自己の名で申告等をすることはできない。","c":["各種の申告・申請等は原則として依頼者の名をもって行い、通関業者が自己の名で申告等をすることはできない。","申告は通関業者の名で行う。","申告は通関士個人の名で行う。","名義は任意に選べる。"],"ans":0},{"i":406,"l":"gyouho","a":"基本通達2-1(2)","t":"select","tp":"依頼を受けたことを証する書類","q":"通関業者が保存すべき委任に関する書類に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-1(2)。代理手続に別個の委任を証する書類の提出は原則不要だが、通関業者は記帳・保存の規定により、依頼者から依頼を受けたことを証する書類（包括的なものでも差し支えない）を保存しなければならない。","c":["通関業者は、依頼者から依頼を受けたことを証する書類（包括的なものでも可）を保存しなければならない。","委任に関する書類は一切保存を要しない。","委任状は申告ごとに提出しなければならない。","委任の事実は記録に残してはならない。"],"ans":0},{"i":407,"l":"gyouho","a":"基本通達3-1","t":"select","tp":"許可に付せる条件の種類","q":"通関業の許可に付することができる条件に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-1。許可に付することができる条件は「貨物限定」と「許可の期限」に限られ、その内容は許可証に明記する。","c":["付することができる条件は、取り扱う貨物の種類の限定（貨物限定）及び許可の期限に限られる。","条件は財務大臣が自由に内容を定められる。","条件として通関士の人数を指定できる。","許可に条件を付すことはできない。"],"ans":0},{"i":408,"l":"gyouho","a":"基本通達3-5","t":"select","tp":"新規許可の期限条件","q":"新規の通関業の許可に付する許可期限の条件に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-5(1)。新規の通関業の許可に許可期限の条件を付す必要があると認められる場合、その期限は3年とされる。","c":["資産内容・収支の状況・通関業務経験者の有無等を勘案して必要と認められる場合、許可期限を3年とする。","新規許可の期限は常に1年である。","新規許可に期限条件を付すことはできない。","新規許可の期限は5年である。"],"ans":0},{"i":409,"l":"gyouho","a":"基本通達3-5","t":"select","tp":"業務停止後の期限条件","q":"監督処分として通関業務の停止を命じた場合に付する許可期限の条件に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-5(2)。監督処分として通関業務の停止を命じた場合、当該処分後の業務改善等の状況を監視する必要があるため、許可期限の条件をその期限を2年として付す。","c":["業務の停止を命じた場合、その後の業務改善等の監視のため許可期限を2年とする。","業務停止後の期限は3年である。","業務停止後に期限条件は付さない。","業務停止後の期限は5年である。"],"ans":0},{"i":410,"l":"gyouho","a":"基本通達3-9","t":"select","tp":"許可の公告方法","q":"通関業の許可をした旨の公告の方法に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-9。許可の公告は、許可年月日・通関業者の住所氏名又は名称・付した条件を税関のホームページに掲載する方法により行い、併せて税関官署の見やすい場所に掲示する。","c":["許可の年月日・通関業者の住所氏名・付した条件を税関のホームページに掲載する方法により行い、税関官署に掲示する。","公告は官報のみで行う。","公告は行わない。","公告は通関業者が自ら行う。"],"ans":0},{"i":411,"l":"gyouho","a":"基本通達3-10","t":"select","tp":"登録免許税の納付期限","q":"通関業の許可に係る登録免許税の納付期限に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-10。通関業の許可に係る登録免許税の納付通知書に記載すべき納付の期限は、通関業の許可の日から20日を経過する日とする。","c":["通知書に記載する納付の期限は、通関業の許可の日から20日を経過する日とする。","納付期限は許可の日から10日である。","登録免許税の納付は不要である。","納付期限は許可の日から1月である。"],"ans":0},{"i":412,"l":"gyouho","a":"基本通達3-12","t":"select","tp":"許可の標準処理期間","q":"通関業の許可の標準処理期間に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-12。通関業許可申請書が税関に到達してから20日以内に当該申請に対する処分をするよう努める。補正・内容変更・資料追加・欠格事由確認に要する期間は含まない。","c":["通関業許可申請書が税関に到達してから20日以内に処分をするよう努めるものとされている。","標準処理期間は到達から60日である。","標準処理期間の定めはない。","標準処理期間は到達から3日である。"],"ans":0},{"i":413,"l":"gyouho","a":"基本通達3-12(2)","t":"select","tp":"標準処理期間に含まれない期間","q":"通関業の許可の標準処理期間に含まれない期間に該当しないものを一つ選びなさい。","e":"通関業法基本通達3-12(2)。標準処理期間に含まれないのは、補正・内容変更・資料追加・欠格事由の該非確認に要する期間。税関の通常の事務処理期間は標準処理期間そのものに含まれる。","c":["申請を補正するために要する期間","申請者が申請内容を変更するために要する期間","欠格事由の該非を確認するために要する期間","税関の通常の事務処理に要する期間"],"ans":3},{"i":414,"l":"gyouho","a":"基本通達4-3","t":"select","tp":"営業所ごとの責任者","q":"許可申請における「営業所ごとの責任者」に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達4-3。「営業所ごとの責任者」とは、本社であれば通関業務担当役員、支店であれば支店長など、通関業務に対する管理監督責任を有する者をいう（通関士とは別の概念）。","c":["本社の場合は通関業務担当の役員、支店の場合は支店長など、通関業務に対する管理監督責任を有する者をいう。","責任者は通関士に限られる。","営業所に責任者は不要である。","責任者は税関長が指名する。"],"ans":0},{"i":415,"l":"gyouho","a":"基本通達3-7","t":"select","tp":"許可条件の変更手続","q":"通関業の許可に付した条件の変更手続に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達3-7。許可条件の変更は、原則として許可を受けている者からの申請に基づき行い、許可等条件変更申請書を提出させ、変更時はその旨を公告し変更書を交付する。","c":["条件の変更は許可を受けている者からの申請に基づき行い、変更時はその旨を公告する。","条件は一度付すと変更できない。","条件の変更に公告は不要である。","条件の変更は税関長の職権のみで行う。"],"ans":0},{"i":416,"l":"gyouho","a":"基本通達（通関業務と関連業務）","t":"select","tp":"保税運送承認申告の位置づけ","q":"外国貨物を保税運送することの承認の申告の位置づけに関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達。外国貨物を保税運送することの承認の申告は、通関手続そのものではなく関連業務に含まれるとされる（保税工場へ置くことの承認申請が通関業務に含まれるのと対比される頻出論点）。","c":["保税運送の承認の申告は、通関業務ではなく関連業務に含まれる。","保税運送の承認の申告は通関業務に含まれる。","保税運送の承認の申告は通関業務でも関連業務でもない。","保税運送の承認の申告は無許可で行えない。"],"ans":0},{"i":417,"l":"gyouho","a":"通関業法第14条・通達","t":"select","tp":"通関士の審査・記名の対象","q":"通関士の審査・記名押印の対象に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第14条・基本通達。通関業者は、輸出入申告書・修正申告書・更正の請求書・不服申立書等の財務省令で定める通関書類について、通関士に審査させ記名させなければならない。","c":["輸出入申告書その他財務省令で定める通関書類について、通関士に審査させ記名させる必要がある。","すべての社内書類が審査対象である。","審査・記名は通関業者の任意である。","審査・記名は通関士以外の従業者が行う。"],"ans":0},{"i":418,"l":"gyouho","a":"通関業法第22条・通達","t":"select","tp":"記帳すべき事項","q":"通関業者の記帳義務に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第22条第1項・通達。通関業者は通関業務（関連業務を含む）に関して帳簿を設け、その収入に関する事項その他所定の事項を記載し、関係書類とともに保存する。","c":["通関業者は、通関業務（関連業務を含む）に関して帳簿を設け、その収入に関する事項等を記載しなければならない。","記帳は通関業務のみが対象で関連業務は含まない。","記帳すべき事項に収入は含まれない。","記帳義務は通関士個人にある。"],"ans":0},{"i":419,"l":"gyouho","a":"通関業法第35条・通達","t":"select","tp":"通関士への懲戒の3類型","q":"通関士に対する懲戒処分の種類に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第35条第1項。通関士が法令違反等をしたとき、財務大臣は戒告、1年以内の期間を定めた通関業務従事の停止、又は2年間の通関業務従事の禁止の懲戒処分をすることができる。","c":["戒告、1年以内の期間を定めた通関業務従事の停止、又は2年間の通関業務従事の禁止のいずれかである。","懲戒は戒告のみである。","懲戒は無期限の資格剥奪である。","通関士に懲戒処分はない。"],"ans":0},{"i":420,"l":"gyouho","a":"通関業法第31条第2項・第6条第8号","t":"select","tp":"懲戒と通関士の欠格","q":"懲戒処分を受けた者の通関士確認に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第31条第2項・第6条第8号。懲戒処分（従事禁止）を受けた者で、その処分を受けた日から2年を経過しないものは欠格事由に該当し、確認を受けて通関士となることができない。","c":["懲戒処分により通関業務に従事することを禁止された者で、その処分の日から2年を経過しないものは通関士となることができない。","懲戒処分を受けてもすぐに通関士となれる。","懲戒処分による禁止は1年経過で解消される。","懲戒処分は通関士確認に影響しない。"],"ans":0},{"i":421,"l":"gyouho","a":"通関業法第34条・通達","t":"select","tp":"通関業者への監督処分の種類","q":"通関業者に対する監督処分の種類に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第34条第1項。財務大臣は、通関業者が法令違反等をしたとき、戒告、1年以内の期間を定めた通関業務の全部・一部の停止、又は許可の取消しの監督処分をすることができる。","c":["戒告、1年以内の期間を定めた通関業務の全部又は一部の停止、又は許可の取消しである。","監督処分は許可取消しのみである。","監督処分は戒告のみである。","通関業者に監督処分はない。"],"ans":0},{"i":422,"l":"gyouho","a":"通関業法第40条・通達","t":"select","tp":"何人も申し出ることができる","q":"通関業者・通関士の違反事実に対する申出に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第40条。何人も、通関業者又は通関士に監督処分・懲戒処分に該当する事実があると認めたときは、税関長に対しその事実を申し出て適当な措置をとるべきことを求めることができる。","c":["何人も、通関業者・通関士に監督処分・懲戒処分の対象となる事実があると認めたときは、税関長に申し出て適当な措置を求めることができる。","違反事実の申出ができるのは依頼者に限られる。","違反事実の申出制度はない。","申出は財務大臣にのみできる。"],"ans":0},{"i":423,"l":"gyouho","a":"通関業法第32条・通達","t":"select","tp":"通関士の資格喪失事由","q":"通関士でなくなる事由に該当しないものを一つ選びなさい。","e":"通関業法第32条。通関士でなくなるのは、確認を受けた通関業者の通関業務に従事しないこととなったとき、欠格事由に該当したとき、合格の決定が取り消されたとき、不正手段で確認を受けたことが判明したとき。単なる営業所の移転は該当しない。","c":["確認を受けた通関業者の通関業務に従事しないこととなったとき","通関士試験の合格の決定が取り消されたとき","偽りその他不正の手段により確認を受けたことが判明したとき","勤務する営業所が移転したとき"],"ans":3},{"i":424,"l":"gyouho","a":"通関業法第33条・通達","t":"select","tp":"通関士の名義貸し禁止","q":"通関士の名義貸しに関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第33条。通関士は、その名義を他人に通関業務のため使用させてはならない（通関士の名義貸しの禁止。通関業者の名義貸し禁止とは別に規定される）。","c":["通関士は、その名義を他人に通関業務のため使用させてはならない。","通関士は名義を自由に貸与できる。","名義貸しの禁止は通関業者のみに及ぶ。","通関士の名義貸し禁止規定はない。"],"ans":0},{"i":425,"l":"gyouho","a":"基本通達6-5","t":"select","tp":"欠格事由の審査方法","q":"通関業の許可における欠格事由の審査方法に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達6-5。法第6条の一定の欠格事由については、処分通知書の写し等との照合や、都道府県警察への照会等により該非を確認する取扱いが定められている。","c":["一定の欠格事由については、都道府県警察への照会等により該非を確認する取扱いがある。","欠格事由は申請者の自己申告のみで判断する。","欠格事由の審査は行わない。","欠格事由は税関の独自調査のみで判断する。"],"ans":0},{"i":426,"l":"gyouho","a":"基本通達4-2","t":"select","tp":"許可申請書の添付書面（定款）","q":"通関業許可申請書に添付する定款・登記事項証明書に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達4-2(2)。許可申請書に添付する定款・登記事項証明書については、その事業目的に「通関業」との記載がないものであっても差し支えない。","c":["定款・登記事項証明書は、その事業目的に「通関業」との記載がないものであっても差し支えない。","事業目的に「通関業」の記載がないと許可されない。","定款の添付は一切不要である。","定款は通関業を主目的とするものに限る。"],"ans":0},{"i":427,"l":"gyouho","a":"基本通達4-2(7)","t":"select","tp":"求めない書類","q":"通関業許可申請の審査における書類の取扱いに関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達4-2(7)。許可審査のために提出を求める書類は必要最小限とし、主要荷主等依頼者の推薦状・委任状といった書類を求めることのないよう留意する。","c":["提出を求める書類は必要最小限とし、主要荷主等依頼者の推薦状・委任状といった書類は求めないよう留意する。","依頼者の推薦状を必ず求める。","可能な限り多くの書類を求める。","委任状を必ず添付させる。"],"ans":0},{"i":428,"l":"gyouho","a":"通関業法第36条・通達","t":"select","tp":"業務改善命令","q":"通関業の適正な遂行のための措置に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第36条。財務大臣は、通関業の適正な遂行のために必要があると認めるときは、その必要の限度において、通関業者に対し業務の運営の改善に必要な措置をとるべきことを命じることができる。","c":["財務大臣は、必要があると認めるときは、その必要の限度で通関業者に業務運営の改善に必要な措置を命じることができる。","財務大臣は業務改善を命じられない。","業務改善命令は税関長が行う。","業務改善の措置に関する規定はない。"],"ans":0},{"i":429,"l":"gyouho","a":"通関業法第31条・通達","t":"select","tp":"確認の届出書面","q":"通関士の確認に係る届出に添付する書面に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法施行令・通達。財務大臣の確認に係る届出に関する書面には、当該届出に係る者が法第6条第1号から第9号（欠格事由）に該当しないことを証する書面その他参考となるべき書面を添付する。","c":["届出に係る者が欠格事由に該当しないことを証する書面その他参考となるべき書面を添付する。","確認の届出に添付書面は不要である。","添付書面は通関士試験の合格証のみである。","添付書面は税関が作成する。"],"ans":0},{"i":430,"l":"gyouho","a":"通関業法第6条・通達","t":"select","tp":"欠格事由（処分後の期間）","q":"通関業の許可の欠格事由に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第6条。一定の刑の執行終了等から所定年数を経過しない者、通関業の許可を取り消された者で取消しの日から所定期間を経過しないもの等が欠格事由に該当する。","c":["許可を取り消された者で取消しの日から所定期間を経過しないもの等が欠格事由に該当する。","過去に許可を取り消されても直ちに許可を受けられる。","欠格事由に期間の概念はない。","欠格事由は法人には適用されない。"],"ans":0},{"i":431,"l":"gyouho","a":"通関業法第13条・通達13-1","t":"select","tp":"一定の種類の貨物のみ","q":"通関士の設置を要しない営業所に係る「一定の種類の貨物のみに限られている場合」に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第13条ただし書・基本通達13-1。取り扱う貨物が一定の種類のもののみに限られている営業所等については、通関士を置くことを要しない場合がある（貨物限定の許可条件と対応）。","c":["取り扱う貨物が一定の種類のものに限定されている営業所については、通関士の設置を要しない場合がある。","取扱貨物の種類にかかわらず通関士を要しない。","すべての営業所に通関士の設置を要しない。","貨物限定の概念はない。"],"ans":0},{"i":432,"l":"gyouho","a":"通関業法第18条・通達","t":"select","tp":"料金掲示の方法","q":"通関業務の料金の掲示に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第18条。通関業者は、通関業務の料金の額を、営業所において依頼者の見やすいように掲示しなければならない。","c":["通関業者は、料金の額を営業所において依頼者の見やすいように掲示しなければならない。","料金は掲示せず内部で管理すればよい。","料金は税関に届け出れば足りる。","料金の掲示は通関士が行う。"],"ans":0},{"i":433,"l":"gyouho","a":"通関業法第19条・通達","t":"select","tp":"秘密保持義務の存続","q":"通関業務上の秘密保持義務に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第19条。通関業者・通関士・その従業者等は通関業務に関して知り得た秘密を他に漏らし・盗用してはならない。これらの者でなくなった後（退職後）も同様にこの義務を負う。","c":["通関業者・通関士・その従業者等は、通関業務上知り得た秘密を漏らし・盗用してはならず、これらの者でなくなった後も同様である。","秘密保持義務は在職中のみに及ぶ。","従業者は秘密保持義務を負わない。","秘密保持義務は通関士のみに及ぶ。"],"ans":0},{"i":434,"l":"gyouho","a":"通関業法第8条・通達","t":"select","tp":"営業所新設の許可","q":"通関業者の営業所の新設に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第8条。通関業者が通関業務を行う営業所を新たに設けようとするときは、財務大臣の許可（営業所の新設の許可）を受けなければならない。許可基準・欠格事由の規定が準用される。","c":["通関業務を行う営業所を新たに設けようとするときは、財務大臣の許可を受けなければならない。","営業所の新設は届出で足りる。","営業所の新設は税関長の許可による。","営業所の新設に手続は不要である。"],"ans":0},{"i":435,"l":"gyouho","a":"通関業法第12条・通達","t":"select","tp":"許可の消滅事由","q":"通関業の許可が消滅する場合に該当しないものを一つ選びなさい。","e":"通関業法第10条。許可の消滅事由は、通関業の廃止、法人の解散、個人の死亡、破産手続開始の決定等。通関士の退職は許可の消滅事由ではない（営業所の体制の問題）。","c":["通関業を廃止したとき","法人が合併以外の理由により解散したとき","個人である通関業者が破産手続開始の決定を受けたとき","通関士が退職したとき"],"ans":3},{"i":436,"l":"gyouho","a":"通関業法第11条・通達","t":"select","tp":"許可の取消し","q":"通関業の許可の取消しに関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第11条。偽りその他不正の手段により許可を受けたとき、許可後に欠格事由に該当するに至ったとき等は、財務大臣は通関業の許可を取り消すことができる。","c":["偽りその他不正の手段により許可を受けたとき、欠格事由に該当するに至ったとき等に、財務大臣は許可を取り消すことができる。","許可は取り消されない。","取消しは税関長が行う。","取消事由は定められていない。"],"ans":0},{"i":437,"l":"gyouho","a":"通関業法第37条・通達","t":"select","tp":"聴聞","q":"監督処分・懲戒処分に係る聴聞に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第37条等。通関業者への監督処分・通関士への懲戒処分をしようとするときは、不利益処分として、原則として聴聞の手続を行う（意見陳述の機会の付与）。","c":["監督処分・懲戒処分をしようとするときは、行政手続法に基づき聴聞を行わなければならない。","処分に聴聞は不要である。","聴聞は処分後に行う。","聴聞は税関長の任意である。"],"ans":0},{"i":438,"l":"gyouho","a":"通関業法第41条・通達","t":"select","tp":"無許可営業の罰則","q":"通関業法上の無許可営業に対する罰則に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第41条以下。財務大臣の許可を受けずに通関業を営んだ者は、所定の懲役又は罰金の刑に処せられうる。両罰規定により法人にも罰金刑が科されうる。","c":["財務大臣の許可を受けずに通関業を営んだ者は、懲役又は罰金の刑に処せられうる。","無許可営業に罰則はない。","無許可営業は過料のみである。","罰則は法人にのみ適用される。"],"ans":0},{"i":439,"l":"gyouho","a":"通関業法第42条・通達","t":"select","tp":"秘密漏えいの罰則","q":"通関業務上の秘密漏えいに対する罰則に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第42条等。秘密を守る義務（第19条）に違反して通関業務上知り得た秘密を漏らし・盗用した者は、罰則の対象となる。","c":["秘密を守る義務に違反して秘密を漏らし・盗用した者は、罰則の対象となる。","秘密漏えいに罰則はない。","秘密漏えいは行政処分のみである。","罰則は通関業者のみに及ぶ。"],"ans":0},{"i":440,"l":"gyouho","a":"通関業法第40条・通達","t":"select","tp":"通関業者の地位の承継","q":"通関業者の地位の承継に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第11条の2・第40条等。相続・合併・分割による通関業者の地位の承継には、財務大臣の承認や届出等の所定の手続を要する。","c":["相続・合併・分割等による通関業者の地位の承継には、財務大臣の承認・届出等の手続を要する。","地位の承継は一切認められない。","承継に手続は不要である。","承継は税関長の許可による。"],"ans":0},{"i":441,"l":"gyouho","a":"通関業法第14条・通達","t":"select","tp":"通関士審査の趣旨","q":"通関士の審査・記名の制度趣旨に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"通関業法第14条・通達。通関士による通関書類の審査・記名は、専門家による審査を経たことを明らかにし、申告内容の正確性・信頼性を担保する趣旨である。","c":["通関書類が専門的知識をもって審査されたことを担保し、申告の正確性・信頼性を確保するためである。","審査・記名は形式にすぎず意味はない。","審査・記名は税関の事務負担軽減のみが目的である。","審査・記名の趣旨は通達にない。"],"ans":0},{"i":442,"l":"gyouho","a":"通関業法施行令・通達","t":"select","tp":"変更の届出事項","q":"通関業者の届出事項の変更に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第7条・通達。通関業者は、許可申請書の記載事項（氏名・名称、住所、営業所の名称・所在地等）に変更があったときは、遅滞なくその旨を財務大臣に届け出る。","c":["氏名・名称、住所、営業所の名称・所在地等の届出事項に変更があったときは、遅滞なく財務大臣に届け出る。","届出事項の変更に届出は不要である。","変更の届出は税関長に行う。","変更があっても届出義務はない。"],"ans":0},{"i":443,"l":"gyouho","a":"通関業法第3条・通達","t":"select","tp":"弁護士等の適用除外","q":"通関業の許可に関する適用除外に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第3条等。弁護士・弁護士法人がその職務として行うもの、弁理士が一定の事務として行うもの等には、通関業の許可に関する規定が適用されない。","c":["弁護士・弁護士法人がその職務として行うもの等には、通関業の許可に関する規定が適用されない。","弁護士も必ず許可を要する。","適用除外は存在しない。","適用除外は税関長が個別に認める。"],"ans":0},{"i":444,"l":"gyouho","a":"通関業法第22条・通達","t":"select","tp":"報告義務","q":"通関業者の報告に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第22条・通達。通関業者は、記帳・書類保存のほか、その取扱いに係る通関業務・関連業務の状況（件数・金額等）について所定の様式により税関長に報告する義務を負う。","c":["通関業者は、その取扱いに係る通関業務・関連業務の件数・金額等を所定の様式により税関長に報告する。","通関業者に報告義務はない。","報告は通関士が行う。","報告事項は定められていない。"],"ans":0},{"i":445,"l":"gyouho","a":"通関業法第38条・通達","t":"select","tp":"報告徴収・検査","q":"財務大臣による通関業者への報告徴収・検査に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第38条。財務大臣は、通関業の適正な運営を確保するため必要があるときは、通関業者から報告を徴し、又は職員に通関業者の帳簿書類等を検査させることができる。","c":["財務大臣は、必要があるときは通関業者から報告を徴し、又は職員に帳簿書類等を検査させることができる。","財務大臣は報告徴収・検査を行えない。","報告徴収・検査は税関長の独自権限である。","報告徴収・検査の制度はない。"],"ans":0},{"i":446,"l":"gyouho","a":"通関業法第33条の2・通達","t":"select","tp":"通関士の義務（信用失墜）","q":"通関士の信用失墜行為の禁止に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第20条（信用失墜行為の禁止）。通関業者・通関士は、通関業者・通関士の信用又は品位を害するような行為をしてはならない。","c":["通関士は、通関士の信用又は品位を害するような行為をしてはならない。","信用失墜行為の禁止は通関業者のみに及ぶ。","信用失墜行為は自由である。","通関士に信用失墜行為の禁止はない。"],"ans":0},{"i":447,"l":"gyouho","a":"通関業法第23条・通達","t":"select","tp":"通関士試験の科目","q":"通関士試験の試験科目に含まれないものを一つ選びなさい。","e":"通関業法第23条。試験科目は①関税法等及び外為法（第6章）、②通関実務（通関書類の作成要領その他通関手続の実務）、③通関業法の3科目。簿記・会計学は試験科目ではない。","c":["関税法・関税定率法その他関税に関する法律及び外為法（第6章に係る部分）","通関書類の作成要領その他通関手続の実務","通関業法","簿記及び会計学"],"ans":3},{"i":448,"l":"gyouho","a":"通関業法第24条・通達","t":"select","tp":"試験科目の免除","q":"通関士試験の科目免除に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第24条。通関業者の通関業務又は官公署における通関事務等に一定期間従事した者は、申請により実務科目等の試験が免除される（従事期間に応じた免除）。","c":["通関業務等に一定期間従事した者は、申請により実務科目等の試験が免除される。","科目免除は誰にでも認められる。","科目免除の制度はない。","科目免除は財務大臣の裁量で個別に決まる。"],"ans":0},{"i":449,"l":"gyouho","a":"通関業法第3条第2項・通達","t":"select","tp":"条件の最少限度","q":"通関業の許可に付する条件に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第3条第3項・基本通達3-1。許可に付する条件は法律の目的達成に必要な最少限度でなければならず、付しうる条件は貨物限定及び許可期限に限られる。","c":["条件は法律の目的達成に必要な最少限度のものでなければならず、付しうるのは貨物限定と許可期限に限られる。","条件は内容に制限なく付しうる。","条件は付してはならない。","条件は税関長が定める。"],"ans":0},{"i":450,"l":"gyouho","a":"通関業法第31条・通達","t":"select","tp":"確認をしない場合","q":"通関士の確認をしない場合に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法第31条第2項。確認を受けようとする者が通関士の欠格事由に該当する場合等には、財務大臣はその確認をしないことができる。","c":["確認を受けようとする者が欠格事由に該当する場合等は、財務大臣は確認をしないことができる。","確認は常に行われる。","確認の拒否事由はない。","確認は税関長が拒否する。"],"ans":0},{"i":451,"l":"kanzeiho","a":"基本通達7-2","t":"select","tp":"通関業者による代理申告","q":"通関業者による代理申告の輸入（納税）申告書への記載に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法基本通達7-2。通関業者による代理申告では、輸入（納税）申告書の輸入者欄に依頼者（輸入者）を記載し、代理人住所・氏名欄に通関手続の委任を受けた通関業者の住所・氏名又は名称を記載する。","c":["代理申告では、申告書の輸入者欄に依頼者を、代理人欄に通関業者の住所・氏名等を記載する。","代理申告では通関業者を輸入者欄に記載する。","代理人欄の記載は不要である。","代理申告は記載方法が定められていない。"],"ans":0},{"i":452,"l":"kanzeiho","a":"基本通達（限定申告者の復代理）","t":"select","tp":"限定申告者の代理申告","q":"限定申告者に係る通関業者の代理申告に関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-1(3)・関税法基本通達。限定申告者であっても通関業者による代理申告は認められ、限定申告者→輸入取引者→通関業者という復代理の関係として、申告書に限定申告者・輸入取引者・代理人を記載する。","c":["限定申告者であっても通関業者による代理申告は認められ、復代理の関係として申告書に所定の記載をする。","限定申告者の貨物は代理申告できない。","限定申告者は通関業者を利用できない。","限定申告者の代理申告に記載の定めはない。"],"ans":0},{"i":453,"l":"kanzeiho","a":"基本通達（開庁時間外執務）","t":"select","tp":"開庁時間外の執務の求め","q":"開庁時間外の事務の執行を求める手続に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第98条第1項・通達。開庁時間外に税関の事務の執行（輸入の許可等）を求めようとするときは、あらかじめその旨を税関長に届け出る（この届出は輸出入申告と関連する場合通関手続に含まれる）。","c":["開庁時間外に税関の事務の執行を求めようとするときは、あらかじめその旨を税関長に届け出る。","開庁時間外の執務は求められない。","時間外執務の求めに手続は不要である。","時間外執務は財務大臣に求める。"],"ans":0},{"i":454,"l":"kanzeiho","a":"基本通達（指定地外貨物検査許可申請）","t":"select","tp":"指定地外貨物検査の位置づけ","q":"指定地外貨物検査の許可の申請の通関業務上の位置づけに関する記述として、最も適切なものを一つ選びなさい。","e":"通関業法基本通達2-2(1)。指定地外貨物検査の許可申請は、輸出入申告からそれぞれの許可を受けるまでの間に行われる場合、通関手続の一環として通関業務に含まれる（前後に行われる場合は関連業務）。","c":["輸出入申告から許可を受けるまでの間に行われる場合は、通関手続の一環として通関業務に含まれる。","指定地外貨物検査許可申請は常に関連業務である。","指定地外貨物検査許可申請は通関業務に含まれない。","指定地外貨物検査許可申請は無許可で行えない。"],"ans":0},{"i":455,"l":"kanzeiho","a":"基本通達43の3","t":"select","tp":"蔵入承認申請の期限","q":"保税蔵置場への蔵入承認の申請時期に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第43条の3・通達。外国貨物を保税蔵置場に入れた者は、入れた日から3月を超えて当該貨物を置こうとするときは、税関長の承認（蔵入承認）を受ける。","c":["外国貨物を保税蔵置場に入れた者が、入れた日から3月を超えて置こうとするときは蔵入承認を受ける。","蔵入承認は搬入後直ちに受ける必要がある。","蔵入承認の期限は1年である。","蔵入承認に期限の定めはない。"],"ans":0},{"i":456,"l":"kanzeiho","a":"基本通達（収容課金の計算）","t":"select","tp":"収容課金の計算","q":"収容に要した費用（収容課金）の計算に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。収容課金は収容した貨物について、その課税価格や収容期間（収容の日数）等に応じて所定の方法により計算され、貨物の引取りの際に納付する。","c":["収容課金は、収容した貨物の課税価格・収容期間等に応じて計算される。","収容課金は定額である。","収容課金は収容期間に関係なく一律である。","収容課金は計算されない。"],"ans":0},{"i":457,"l":"kanzeiho","a":"基本通達（公売の予定価格）","t":"select","tp":"公売の手続","q":"収容貨物の公売の手続に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第84条・通達。収容貨物の公売は、あらかじめ公売の日時・場所・貨物等を公告し、入札等により最高価申込者に売却する手続による（買受人がない場合の随意契約・国庫帰属の規定もある）。","c":["公売に付するときは、あらかじめ公告し、所定の手続により最高価申込者に売却する。","公売は公告なしに行う。","公売は税関職員が随意に買い受ける。","公売の手続は定められていない。"],"ans":0},{"i":458,"l":"kanzeiho","a":"基本通達（保税運送の運送目録）","t":"select","tp":"保税運送の到着確認","q":"保税運送の承認を受けた貨物の到着確認に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。保税運送の承認を受けた外国貨物が運送先に到着したときは、運送に係る書類（外国貨物運送申告書等）を到着地税関に提出し、到着を証明する（運送期間徒過時の関税徴収と関連）。","c":["承認を受けた貨物が運送先に到着したときは、運送に係る書類を到着地税関に提出して到着を証明する。","到着確認は不要である。","到着確認は発送地税関で行う。","到着確認は輸入者が省略できる。"],"ans":0},{"i":459,"l":"kanzeiho","a":"基本通達（特例委託輸入者）","t":"select","tp":"特例委託輸入者の要件","q":"特例委託輸入者に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第7条の2・通達。特例委託輸入者とは、貨物の輸入に係る通関手続を「認定通関業者」に委託した者をいう。あらかじめ税関長の承認を受ける特例輸入者とは要件が異なる。","c":["貨物の輸入に係る通関手続を認定通関業者に委託した者が特例委託輸入者となる。","特例委託輸入者は税関長の承認を受けた者である。","特例委託輸入者は一般の通関業者に委託した者である。","特例委託輸入者の制度はない。"],"ans":0},{"i":460,"l":"kanzeiho","a":"基本通達（認定通関業者の認定）","t":"select","tp":"認定通関業者の要件","q":"認定通関業者の認定要件に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第79条・通達。認定通関業者は、通関業務の遂行に係る法令遵守規則を定め、業務を適正・確実に遂行できる能力を有すること等の要件を満たし、税関長の認定を受ける（AEO）。","c":["法令遵守規則を定め、業務を適正に遂行できる能力を有すること等の要件を満たし、税関長の認定を受ける。","認定は申請があれば無条件に受けられる。","認定は財務大臣が一方的に行う。","認定通関業者に要件はない。"],"ans":0},{"i":461,"l":"kanzeiho","a":"基本通達（輸入許可の効果）","t":"select","tp":"輸入許可後の貨物","q":"輸入の許可を受けた貨物の法的地位に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。輸入の許可を受けた貨物は外国貨物でなくなり内国貨物となる。これにより保税地域から引き取り、国内で自由に流通させることができる。","c":["輸入の許可を受けた貨物は内国貨物となり、国内で自由に流通できる。","輸入許可後も外国貨物のままである。","輸入許可により貨物は輸出されたことになる。","輸入許可に法的効果はない。"],"ans":0},{"i":462,"l":"kanzeiho","a":"基本通達（他法令確認の時期）","t":"select","tp":"他法令の証明・確認","q":"他法令による許可・承認等の証明・確認の時期に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第70条・通達。他法令により許可・承認等を要する貨物は、輸出入申告の際にその許可・承認等を証する書類を提出し、検査等の際に確認を受けなければ輸出入を許可されない。","c":["輸出入申告の際に許可・承認等を証する書類を提出し、検査等の際に確認を受けなければ許可されない。","他法令の確認は輸入許可後に行う。","他法令の確認は不要である。","他法令の確認は財務大臣が事後に行う。"],"ans":0},{"i":463,"l":"kanzeiho","a":"基本通達（原産地虚偽表示の措置）","t":"select","tp":"原産地虚偽表示への措置","q":"原産地について偽った表示等がある外国貨物への措置に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第71条・通達。原産地について偽った・誤認させる表示がある外国貨物について、税関長は表示の是正・抹消等を求め、相当の期間内にこれがされない場合は輸入を許可しない。","c":["税関長は、表示の是正・抹消等の措置をとることを求め、応じない場合は輸入を許可しない。","原産地表示の是正は求められない。","原産地虚偽表示は輸入許可に影響しない。","措置は財務大臣が行う。"],"ans":0},{"i":464,"l":"kanzeiho","a":"基本通達（亡失・滅却と関税）","t":"select","tp":"亡失と関税徴収の例外","q":"保税地域の外国貨物の亡失・滅却に係る関税徴収の例外に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第45条等・通達。保税地域の外国貨物の亡失・滅却は原則として被許可者から関税を徴収するが、災害その他やむを得ない事由による亡失、又は税関長の承認を受けて滅却した場合は徴収しない。","c":["災害その他やむを得ない事由による亡失、又は税関長の承認を受けて滅却した場合は、関税を徴収しない。","亡失・滅却の場合は常に関税を徴収する。","災害による亡失でも関税を徴収する。","滅却には承認を要しない。"],"ans":0},{"i":465,"l":"kanzeiho","a":"基本通達（収容の対象）","t":"select","tp":"収容できる貨物","q":"収容の対象となる外国貨物に関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第80条・通達。収容の対象は、保税地域の蔵置期間を経過した外国貨物、保税地域以外の場所に許可を受けず置かれている外国貨物等、一定の要件に該当する外国貨物。","c":["保税地域の蔵置期間を経過した外国貨物、保税地域以外に許可なく置かれている外国貨物等が対象となる。","あらゆる貨物をいつでも収容できる。","内国貨物が収容の対象である。","収容の対象は定められていない。"],"ans":0},{"i":466,"l":"kanzeiho","a":"基本通達（質問検査の趣旨）","t":"select","tp":"質問検査権の性質","q":"税関職員の質問検査権の性質に関する通達の記述として、最も適切なものを一つ選びなさい。","e":"関税法第105条・通達。質問検査権は適正な課税・通関の確保のための行政上の権限であり、犯罪捜査のために認められたものと解してはならない旨が定められている。","c":["質問検査権は適正な課税等のための行政上の権限であり、犯罪捜査のために認められたものと解してはならない。","質問検査権は犯罪捜査の権限である。","質問検査権は税関長のみが行使する。","質問検査権の性質は通達に定めがない。"],"ans":0},{"i":467,"l":"kanzeiho","a":"基本通達（事前教示の尊重期間）","t":"select","tp":"事前教示回答書の尊重","q":"文書による事前教示回答書の取扱いに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法・通達。文書による事前照会に対する事前教示回答書の内容は、原則として相当の期間（一定年数）尊重され、通関の予見可能性・斉一性を確保する。","c":["文書による事前教示の回答内容は、一定期間（原則として相当の期間）尊重される取扱いがある。","事前教示の回答は法的に一切尊重されない。","事前教示は口頭でのみ行う。","事前教示の制度はない。"],"ans":0},{"i":468,"l":"kanzeiho","a":"基本通達（輸入差止申立ての有効期間）","t":"select","tp":"輸入差止申立ての有効期間","q":"知的財産権者による輸入差止申立てに関する記述として、最も適切なものを一つ選びなさい。","e":"関税法第69条の13・通達。知的財産権者の輸入差止申立てが受理されると所定の有効期間（一定年数）が定められ、期間経過後も差止めを求める場合は更新の申立てを要する。","c":["差止申立てが受理された場合、所定の有効期間が定められ、期間経過後は更新を要する。","差止申立ての効力は無期限である。","差止申立ては輸入者が行う。","差止申立ての有効期間はない。"],"ans":0},{"i":469,"l":"kanzeiho","a":"基本
