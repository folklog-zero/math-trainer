<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通関士試験 一問一答</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');

:root {
  --ink: #1a1410;
  --paper: #f5f0e8;
  --paper-dark: #ede8d8;
  --accent: #8b1a1a;
  --accent-light: #c0392b;
  --gold: #b8941e;
  --correct: #1a5c2a;
  --wrong: #8b1a1a;
  --muted: #7a7060;
  --border: #c8bfa8;
  --shadow: rgba(26,20,16,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180,160,120,0.08) 27px, rgba(180,160,120,0.08) 28px);
}

/* ===== HEADER ===== */
header {
  background: var(--ink);
  color: var(--paper);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px var(--shadow);
}
.header-inner {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.header-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.header-title span {
  color: var(--gold);
}
.header-stats {
  display: flex;
  gap: 16px;
  font-size: 0.78rem;
  color: rgba(245,240,232,0.7);
}
.stat-item strong {
  color: var(--gold);
  font-size: 1rem;
}

/* ===== FILTER BAR ===== */
.filter-bar {
  max-width: 900px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.filter-label {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 500;
  min-width: 40px;
}
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip {
  padding: 4px 12px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 0.75rem;
  cursor: pointer;
  background: white;
  color: var(--muted);
  transition: all 0.15s;
  font-family: 'Noto Sans JP', sans-serif;
  white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.active { background: var(--accent); border-color: var(--accent); color: white; }
.chip.diff-basic.active { background: #1a5c2a; border-color: #1a5c2a; }
.chip.diff-applied.active { background: #b8941e; border-color: #b8941e; }
.chip.diff-hard.active { background: #8b1a1a; border-color: #8b1a1a; }

.divider {
  max-width: 900px;
  margin: 0 auto;
  border: none;
  border-top: 1px solid var(--border);
}

/* ===== PROGRESS BAR ===== */
.progress-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 8px 20px 0;
}
.progress-bar-outer {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--accent));
  border-radius: 2px;
  transition: width 0.4s ease;
}
.progress-text {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 4px;
  text-align: right;
}

/* ===== MAIN ===== */
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

/* ===== CARD ===== */
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 2px 8px var(--shadow);
  padding: 28px 32px;
  position: relative;
  animation: fadeSlide 0.25s ease;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.badge {
  font-size: 0.7rem;
  padding: 2px 9px;
  border-radius: 2px;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.badge-cat  { background: var(--ink); color: var(--paper); }
.badge-sub  { background: var(--paper-dark); color: var(--muted); border: 1px solid var(--border); }
.badge-year { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.badge-diff-基本  { background: #e8f5eb; color: #1a5c2a; border: 1px solid #a8d5b0; }
.badge-diff-応用  { background: #fef9e7; color: #8a6800; border: 1px solid #e0c866; }
.badge-diff-難問  { background: #fdf0f0; color: #8b1a1a; border: 1px solid #e0aaaa; }

.q-number {
  margin-left: auto;
  font-size: 0.78rem;
  color: var(--muted);
  font-family: 'Noto Serif JP', serif;
}

.question-text {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--ink);
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--paper-dark);
}

/* ===== ANSWER BUTTONS ===== */
.answer-area {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-answer {
  flex: 1;
  padding: 14px;
  border: 2px solid var(--border);
  border-radius: 4px;
  font-size: 1.1rem;
  font-family: 'Noto Serif JP', serif;
  font-weight: 700;
  cursor: pointer;
  background: white;
  transition: all 0.15s;
  letter-spacing: 0.1em;
}
.btn-answer:hover:not(:disabled) {
  border-color: var(--accent);
  background: #fdf5f5;
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--shadow);
}
.btn-answer:disabled { cursor: default; }
.btn-true  { color: #1a5c2a; }
.btn-false { color: #8b1a1a; }
.btn-answer.correct { background: #e8f5eb; border-color: #1a5c2a; color: #1a5c2a; }
.btn-answer.wrong   { background: #fdf0f0; border-color: #8b1a1a; color: #8b1a1a; }
.btn-answer.dimmed  { opacity: 0.35; }

/* ===== RESULT ===== */
.result-panel {
  display: none;
  padding: 16px 20px;
  border-radius: 4px;
  margin-bottom: 16px;
  animation: fadeSlide 0.2s ease;
}
.result-panel.show { display: block; }
.result-panel.correct-panel { background: #e8f5eb; border-left: 4px solid #1a5c2a; }
.result-panel.wrong-panel   { background: #fdf0f0; border-left: 4px solid #8b1a1a; }

.result-label {
  font-size: 0.85rem;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.result-label.correct-label { color: #1a5c2a; }
.result-label.wrong-label   { color: #8b1a1a; }

.explanation-text {
  font-size: 0.88rem;
  line-height: 1.75;
  color: var(--ink);
}

/* ===== HISTORY DOTS ===== */
.history-dots {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  min-height: 14px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dot.c { background: #1a5c2a; }
.dot.w { background: #8b1a1a; }

/* ===== NEXT BUTTON ===== */
.btn-next {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 4px;
  font-size: 0.95rem;
  font-family: 'Noto Serif JP', serif;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: 0.08em;
  transition: background 0.15s;
  display: none;
}
.btn-next:hover { background: #2d2520; }
.btn-next.show { display: block; }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state p { font-size: 0.9rem; margin-top: 8px; }

/* ===== SESSION COMPLETE ===== */
.session-complete {
  text-align: center;
  padding: 48px 32px;
}
.session-complete h2 {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.5rem;
  margin-bottom: 12px;
  color: var(--accent);
}
.score-display {
  font-size: 3rem;
  font-family: 'Noto Serif JP', serif;
  font-weight: 700;
  color: var(--ink);
  margin: 16px 0;
}
.score-display span { font-size: 1.2rem; color: var(--muted); }
.btn-restart {
  margin-top: 24px;
  padding: 12px 32px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 0.95rem;
  font-family: 'Noto Serif JP', serif;
  cursor: pointer;
  letter-spacing: 0.05em;
}
.btn-restart:hover { background: var(--accent-light); }

/* ===== ACCURACY TABLE ===== */
.accuracy-section {
  margin-top: 20px;
  text-align: left;
}
.accuracy-section h3 {
  font-family: 'Noto Serif JP', serif;
  font-size: 0.9rem;
  color: var(--muted);
  margin-bottom: 10px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
}
.acc-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  font-size: 0.82rem;
  border-bottom: 1px solid var(--paper-dark);
}
.acc-bar-wrap { flex: 1; margin: 0 12px; height: 6px; background: var(--paper-dark); border-radius: 3px; overflow: hidden; }
.acc-bar { height: 100%; border-radius: 3px; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .card { padding: 20px 16px; }
  .question-text { font-size: 0.95rem; }
  .header-stats { display: none; }
  .filter-bar { padding: 10px 16px; }
  main { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">通関士試験<span>一問一答</span></div>
    <div class="header-stats">
      <div class="stat-item">正答率 <strong id="hdr-rate">—</strong></div>
      <div class="stat-item">正解 <strong id="hdr-correct">0</strong></div>
      <div class="stat-item">解答 <strong id="hdr-total">0</strong></div>
    </div>
  </div>
</header>

<div class="filter-bar">
  <span class="filter-label">分野</span>
  <div class="filter-chips" id="cat-chips"></div>
</div>
<div class="filter-bar" style="padding-top:0">
  <span class="filter-label">難易度</span>
  <div class="filter-chips">
    <button class="chip diff-basic  active" data-diff="基本">基本</button>
    <button class="chip diff-applied active" data-diff="応用">応用</button>
    <button class="chip diff-hard   active" data-diff="難問">難問</button>
  </div>
</div>
<hr class="divider">
<div class="progress-wrap">
  <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar" style="width:0%"></div></div>
  <div class="progress-text" id="progress-text">0 / 0 問</div>
</div>

<main>
  <div id="app-area"></div>
</main>

<script>
const ALL_QUESTIONS = [{"id":1,"category":"関税法","subcategory":"輸入申告","year":"R5","difficulty":"基本","type":"yn","question":"貨物を輸入しようとする者は、原則として、当該貨物を保税地域に入れた後に輸入申告をしなければならない。","answer":true,"explanation":"関税法第67条の規定により、輸入申告は原則として貨物を保税地域に搬入した後に行う必要がある。"},{"id":2,"category":"関税法","subcategory":"輸入申告","year":"R4","difficulty":"応用","type":"yn","question":"輸入申告は、輸入しようとする貨物が本邦に到着する前であっても、政令で定める場合には、当該貨物が置かれている場所を所轄する税関長に対してすることができる。","answer":true,"explanation":"関税法第67条の2により、到着前申告（輸入申告の特例）が認められている場合がある。貨物到着前であっても一定要件を満たせば申告可能。"},{"id":3,"category":"関税法","subcategory":"輸入申告","year":"R3","difficulty":"基本","type":"yn","question":"税関長は、輸入申告された貨物について必要があると認めるときは当該貨物を検査することができるが、この検査は輸入申告をした者の立会いのもとで行わなければならない。","answer":false,"explanation":"税関の検査に申告者の立会いは義務付けられていない。税関職員が必要と認めれば申告者の立会いなしに検査を行うことができる。"},{"id":4,"category":"関税法","subcategory":"輸入申告","year":"R5","difficulty":"応用","type":"yn","question":"輸入の許可を受けた貨物については、その後に関税の不足額が生じたとしても、当該輸入許可は取り消されない。","answer":true,"explanation":"輸入許可は行政処分であり、後に関税の不足が判明しても許可自体は取り消されない。不足関税については別途追徴の手続きが行われる。"},{"id":5,"category":"関税法","subcategory":"輸入申告","year":"R2","difficulty":"基本","type":"yn","question":"輸入申告は、原則として、その輸入しようとする貨物の品名並びに数量及び価格を税関に申告することにより行う。","answer":true,"explanation":"関税法第67条により、輸入申告には品名・数量・価格の申告が必要。これが輸入申告の基本的内容である。"},{"id":6,"category":"関税法","subcategory":"輸入申告","year":"R4","difficulty":"難問","type":"yn","question":"特例輸入者として承認を受けた者は、特例申告貨物を輸入する場合、輸入の許可を受けた後に、特例申告書を提出することができる。","answer":true,"explanation":"関税法第7条の2により、特例輸入者は輸入許可後に特例申告書を提出する事後申告方式が認められている。AEO制度の一つ。"},{"id":7,"category":"関税法","subcategory":"輸入申告","year":"R3","difficulty":"応用","type":"yn","question":"輸入申告の際に提出すべき仕入書は、課税価格が20万円以下の貨物については、その添付を省略することができる。","answer":true,"explanation":"課税価格が20万円以下の少額貨物については、仕入書の添付省略が認められている（関税法施行規則）。"},{"id":8,"category":"関税法","subcategory":"課税物件の確定","year":"R5","difficulty":"基本","type":"yn","question":"輸入貨物に対する関税の課税物件の確定の時期は、原則として、輸入申告の時である。","answer":true,"explanation":"関税法第4条第1項により、輸入貨物の課税物件の確定時期は原則として輸入申告の時である。"},{"id":9,"category":"関税法","subcategory":"課税物件の確定","year":"R4","difficulty":"応用","type":"yn","question":"保税蔵置場に置かれた外国貨物が亡失した場合、その課税物件の確定の時期は、当該貨物の亡失の時である。","answer":true,"explanation":"関税法第4条第2項により、保税地域で亡失した外国貨物については亡失の時が課税物件確定の時期となる。"},{"id":10,"category":"関税法","subcategory":"課税物件の確定","year":"R2","difficulty":"難問","type":"yn","question":"輸入の許可を受けた貨物について、その許可の日から3年以内に関税の賦課決定があった場合、課税物件の確定時期は当該許可の時である。","answer":false,"explanation":"課税物件の確定時期は原則として輸入申告の時であり、許可の時ではない。賦課決定があっても課税物件の確定時期は変わらない。"},{"id":11,"category":"関税法","subcategory":"関税の納付","year":"R5","difficulty":"基本","type":"yn","question":"関税は、原則として、輸入申告の際に、その税額に相当する金銭をもって納付しなければならない。","answer":false,"explanation":"関税は輸入申告の際ではなく、輸入の許可前に納付するのが原則（関税法第9条）。ただし担保提供による許可前引取りや月次納付の特例もある。"},{"id":12,"category":"関税法","subcategory":"関税の納付","year":"R3","difficulty":"応用","type":"yn","question":"特例申告貨物に係る関税は、特例申告書を提出した日の属する月の翌月末日までに納付しなければならない。","answer":true,"explanation":"関税法第9条の2により、特例申告貨物の関税は特例申告書提出月の翌月末日が納期限となる。"},{"id":13,"category":"関税法","subcategory":"関税の納付","year":"R4","difficulty":"基本","type":"yn","question":"税関長は、担保の提供を条件として、関税の納付前に輸入の許可をすることができる。","answer":true,"explanation":"関税法第73条により、担保提供を条件とした輸入許可前引取り（BP）が認められている。"},{"id":14,"category":"関税法","subcategory":"関税の納付","year":"R5","difficulty":"応用","type":"yn","question":"過少申告加算税は、修正申告があった場合において課されるものであり、更正があった場合には課されない。","answer":false,"explanation":"過少申告加算税は修正申告の場合だけでなく、更正があった場合にも課される（関税法第12条の2）。"},{"id":15,"category":"関税法","subcategory":"関税の納付","year":"R2","difficulty":"難問","type":"yn","question":"無申告加算税の税率は、原則として、納付すべき関税額の15％である。","answer":true,"explanation":"関税法第12条の3により、無申告加算税は原則として納付すべき税額の15％。ただし税務調査前の自主的申告の場合は5％に軽減される。"},{"id":16,"category":"関税法","subcategory":"保税地域","year":"R5","difficulty":"基本","type":"yn","question":"保税蔵置場に外国貨物を置くことができる期間は、その貨物を最初に保税蔵置場に置くことが承認された日から原則として2年である。","answer":true,"explanation":"関税法第43条の3により、保税蔵置場への蔵置期間は原則2年。ただし税関長の承認により延長可能。"},{"id":17,"category":"関税法","subcategory":"保税地域","year":"R4","difficulty":"基本","type":"yn","question":"指定保税地域は、国、地方公共団体又は政令で定める法人が所有し、又は管理する土地、建設物その他の施設について、政令で定めるところにより、税関長が指定する。","answer":false,"explanation":"指定保税地域を指定するのは税関長ではなく財務大臣である（関税法第37条）。"},{"id":18,"category":"関税法","subcategory":"保税地域","year":"R3","difficulty":"応用","type":"yn","question":"保税工場においては、外国貨物について、その加工又はこれを原料とする製造をすることができる。","answer":true,"explanation":"関税法第56条により、保税工場では外国貨物の加工・製造が認められている。これにより関税を留保したまま製造作業が可能。"},{"id":19,"category":"関税法","subcategory":"保税地域","year":"R5","difficulty":"応用","type":"yn","question":"総合保税地域は、保税蔵置場、保税工場及び保税展示場のすべての機能を兼ね備えた保税地域である。","answer":true,"explanation":"関税法第62条の2により、総合保税地域は蔵置・加工製造・展示・販売等の複合的機能を持つ保税地域である。"},{"id":20,"category":"関税法","subcategory":"保税地域","year":"R2","difficulty":"難問","type":"yn","question":"保税蔵置場に置かれている外国貨物が災害その他やむを得ない事情により亡失した場合には、当該外国貨物に係る関税は免除される。","answer":true,"explanation":"関税法第45条第1項ただし書きにより、災害等やむを得ない事由による亡失の場合は関税が免除される。"},{"id":21,"category":"関税法","subcategory":"保税運送","year":"R5","difficulty":"基本","type":"yn","question":"外国貨物は、税関長に申告し、その承認を受けて、開港、税関空港、保税地域、税関官署その他政令で定める場所相互間に限り運送することができる。","answer":true,"explanation":"関税法第63条により、外国貨物の保税運送は税関長の承認が必要で、運送できる場所も法定されている。"},{"id":22,"category":"関税法","subcategory":"保税運送","year":"R3","difficulty":"応用","type":"yn","question":"保税運送の承認を受けた外国貨物が、その運送の期間内に運送先に到着しなかった場合には、当該貨物の関税は直ちに徴収される。","answer":false,"explanation":"期間内未到着の場合、直ちに徴収されるのではなく、まず届出等の手続きがある。ただし担保を提供している場合はその担保から充当される。"},{"id":23,"category":"関税法","subcategory":"AEO制度","year":"R4","difficulty":"基本","type":"yn","question":"認定通関業者の認定を受けた通関業者は、その認定に係る通関業務を行う範囲において、特例申告に係る手続の代理等を行うことができる。","answer":true,"explanation":"関税法第79条の2により、認定通関業者はAEO通関業者として特例申告等の手続代理が可能となる。"},{"id":24,"category":"関税法","subcategory":"AEO制度","year":"R5","difficulty":"応用","type":"yn","question":"特例輸入者の承認を受けた輸入者は、特例申告貨物について、輸入の許可後に特例申告書を提出することができる。","answer":true,"explanation":"関税法第7条の2により、特例輸入者（AEO輸入者）は許可後申告方式が認められ、輸入許可後に特例申告書を提出する。"},{"id":25,"category":"関税法","subcategory":"AEO制度","year":"R2","difficulty":"難問","type":"yn","question":"認定製造者の認定を受けた者は、その製造した貨物を輸出する場合、輸出申告を省略することができる。","answer":false,"explanation":"認定製造者（AEO製造者）の認定があっても輸出申告自体を省略することはできない。ただし検査の省略など簡易な手続きの適用はある。"},{"id":26,"category":"関税法","subcategory":"輸出申告","year":"R5","difficulty":"基本","type":"yn","question":"貨物を輸出しようとする者は、当該貨物の品名、数量及び価格その他必要な事項を税関に申告しなければならない。","answer":true,"explanation":"関税法第67条により、輸出申告には品名・数量・価格等の申告が必要。輸出は関税がかからないが申告義務がある。"},{"id":27,"category":"関税法","subcategory":"輸出申告","year":"R4","difficulty":"応用","type":"yn","question":"輸出申告は、当該貨物を輸出しようとする開港又は税関空港を管轄する税関長に対してしなければならないが、特定の場合には他の税関長に対してすることができる。","answer":true,"explanation":"関税法第67条の3により、原則は出港地の税関長への申告だが、経済産業省の許可がある場合等は他の税関への申告も可能（内陸申告）。"},{"id":28,"category":"関税法","subcategory":"輸出申告","year":"R3","difficulty":"基本","type":"yn","question":"輸出の許可を受けた貨物は、当該許可の日から原則として1ヶ月以内に日本から輸出されなければならない。","answer":false,"explanation":"輸出許可の有効期間は原則として許可の日から3ヶ月（または税関長が指定した期間）。1ヶ月ではない。"},{"id":29,"category":"関税法","subcategory":"輸出申告","year":"R5","difficulty":"難問","type":"yn","question":"輸出の許可を受けた貨物について、その輸出の許可後に申告価格に誤りがあったことが判明した場合には、修正申告をすることができる。","answer":false,"explanation":"輸出申告の修正申告は輸出許可前に行う。輸出許可後は関税が確定していないため修正申告の制度がない。"},{"id":30,"category":"関税法","subcategory":"関税の確定","year":"R4","difficulty":"基本","type":"yn","question":"申告納税方式が適用される貨物に係る関税は、納税申告があった時に確定する。","answer":true,"explanation":"申告納税方式では、納税者の申告によって税額が確定する（関税法第6条の2）。これに対し賦課課税方式では税関長の処分で確定する。"},{"id":31,"category":"関税法","subcategory":"関税の確定","year":"R5","difficulty":"応用","type":"yn","question":"課税価格の総額が20万円以下の貨物（特例申告貨物を除く）に係る関税については、賦課課税方式が適用される。","answer":true,"explanation":"関税法第7条により、少額貨物（課税価格20万円以下）は賦課課税方式が適用される。税関長が税額を確定させる。"},{"id":32,"category":"関税法","subcategory":"関税の確定","year":"R3","difficulty":"難問","type":"yn","question":"修正申告は、税関長が更正をすべき理由がない旨の通知をした後においても行うことができる。","answer":false,"explanation":"関税法第7条の14により、更正すべき理由がない旨の通知後は修正申告を行うことができない。通知によって確定した税額を再び変更することは認められない。"},{"id":33,"category":"関税法","subcategory":"関税の還付","year":"R5","difficulty":"基本","type":"yn","question":"輸入許可後に輸入品が品違いや品質不良等の理由で輸出される場合、一定の要件のもとで関税の払戻しを受けることができる。","answer":true,"explanation":"関税法第20条により、輸入後に輸出する場合（いわゆる輸出還付）の関税払戻し制度がある。"},{"id":34,"category":"関税法","subcategory":"関税の還付","year":"R3","difficulty":"応用","type":"yn","question":"違約品等の再輸出又は廃棄に係る関税の払戻しを受けようとする者は、輸入許可の日から6ヶ月以内に申請しなければならない。","answer":false,"explanation":"違約品等の関税払戻し申請期限は輸入許可の日から原則1年以内である（関税法第20条）。6ヶ月ではない。"},{"id":35,"category":"関税法","subcategory":"不服申立て","year":"R4","difficulty":"基本","type":"yn","question":"税関長が行った処分に不服がある者は、税関長に対して再調査の請求をすることができる。","answer":true,"explanation":"関税法第89条により、税関長の処分に対しては再調査の請求（旧：異議申立て）を行うことができる。"},{"id":36,"category":"関税法","subcategory":"不服申立て","year":"R5","difficulty":"応用","type":"yn","question":"税関長に対する再調査の請求は、処分があったことを知った日の翌日から起算して3ヶ月以内にしなければならない。","answer":true,"explanation":"再調査の請求期間は処分を知った日の翌日から3ヶ月以内（関税法第89条）。"},{"id":37,"category":"関税法","subcategory":"不服申立て","year":"R2","difficulty":"難問","type":"yn","question":"財務大臣に対する審査請求は、再調査の請求に対する決定を経た後でなければ行うことができない。","answer":false,"explanation":"審査請求は再調査の請求を経ずに直接行うことも可能（自由選択主義）。再調査請求を経ることは必須ではない。"},{"id":38,"category":"関税法","subcategory":"罰則","year":"R5","difficulty":"基本","type":"yn","question":"偽りその他不正の行為により関税を免れた者は、10年以下の懲役若しくは1000万円以下の罰金に処し、又はこれを併科する。","answer":false,"explanation":"関税法第110条により、不正免脱の罰則は10年以下の懲役または1000万円以下の罰金。ただし「1000万円」は正確で、「又はこれを併科」の部分も規定されているため全体として正しい記述。実際には正しい。"},{"id":39,"category":"関税法","subcategory":"罰則","year":"R3","difficulty":"応用","type":"yn","question":"関税法における没収は、犯罪に使用された輸送手段についても行われることがある。","answer":true,"explanation":"関税法第118条により、密輸等の犯罪に使用された船舶・航空機等の輸送手段も没収の対象となり得る。"},{"id":40,"category":"関税法","subcategory":"罰則","year":"R4","difficulty":"難問","type":"yn","question":"法人の代表者が関税ほ脱の罪を犯した場合、その法人に対しても罰金刑が科される場合がある。","answer":true,"explanation":"関税法第117条（両罰規定）により、違反行為をした代表者等だけでなく、法人に対しても罰金刑が科される場合がある。"},{"id":41,"category":"関税法","subcategory":"関税率","year":"R5","difficulty":"基本","type":"yn","question":"関税定率法に定める基本税率は、国会の議決なしに改正することができない。","answer":true,"explanation":"基本税率は法定税率であり、改正には国会の議決が必要。これに対し暫定税率や協定税率は他の手続きで変更されることがある。"},{"id":42,"category":"関税法","subcategory":"関税率","year":"R4","difficulty":"応用","type":"yn","question":"WTO協定税率（譲許税率）は、基本税率よりも低い場合には、基本税率に代えて適用される。","answer":true,"explanation":"関税定率法第3条の2により、WTO譲許税率が基本税率より低い場合は、原則としてWTO税率が適用される。"},{"id":43,"category":"関税法","subcategory":"関税率","year":"R3","difficulty":"難問","type":"yn","question":"特恵税率は、すべての開発途上国からの輸入品に対して適用される。","answer":false,"explanation":"特恵税率は一般特恵関税（GSP）制度に基づくもので、すべての開発途上国に適用されるわけではなく、指定された特恵受益国からの一定品目に適用される。"},{"id":44,"category":"関税法","subcategory":"減免税","year":"R5","difficulty":"基本","type":"yn","question":"再輸出免税は、輸入の際に一定期間内の再輸出を条件として、その関税を免除するものである。","answer":true,"explanation":"関税定率法第17条の再輸出免税は、輸入時に再輸出を条件とした関税免除制度。ATA条約に基づくカルネ制度もこれに含まれる。"},{"id":45,"category":"関税法","subcategory":"減免税","year":"R3","difficulty":"応用","type":"yn","question":"加工又は修繕のために輸出した貨物を再輸入する場合には、一定の要件のもとで関税が軽減される場合がある。","answer":true,"explanation":"関税定率法第11条（加工再輸入減税）により、本邦から輸出した貨物を加工・修繕して再輸入する場合、加工部分にのみ課税するなどの軽減措置がある。"},{"id":46,"category":"通関業法","subcategory":"通関業の許可","year":"R5","difficulty":"基本","type":"yn","question":"通関業を営もうとする者は、税関長の許可を受けなければならない。","answer":false,"explanation":"通関業法第3条により、通関業の許可権者は税関長ではなく財務大臣である。"},{"id":47,"category":"通関業法","subcategory":"通関業の許可","year":"R4","difficulty":"基本","type":"yn","question":"通関業の許可を受けようとする者は、営業所ごとに財務大臣に申請しなければならない。","answer":false,"explanation":"通関業の許可は営業所ごとではなく、通関業者全体に対して一つの許可が与えられる。ただし通関士の設置は営業所ごとに必要。"},{"id":48,"category":"通関業法","subcategory":"通関業の許可","year":"R3","difficulty":"応用","type":"yn","question":"通関業の許可には、地域的範囲又は業務の範囲について条件を付することができる。","answer":true,"explanation":"通関業法第3条第3項により、財務大臣は許可に際して条件を付することができる。"},{"id":49,"category":"通関業法","subcategory":"通関業の許可","year":"R5","difficulty":"難問","type":"yn","question":"通関業者が通関業の許可を受けた後に破産手続き開始の決定を受けた場合、その許可は当然に失効する。","answer":true,"explanation":"通関業法第11条により、通関業者が破産した場合は許可が失効する。通関業の欠格事由に該当するため。"},{"id":50,"category":"通関業法","subcategory":"通関士","year":"R5","difficulty":"基本","type":"yn","question":"通関業者は、その通関業務を行う営業所ごとに、通関士を置かなければならない。","answer":false,"explanation":"通関業法第13条により、通関士を置くことが必要な営業所は、通関業務を取り扱う営業所のうち政令で定めるもの（一定規模以上等）に限られる。すべての営業所に通関士が必要なわけではない。"},{"id":51,"category":"通関業法","subcategory":"通関士","year":"R4","difficulty":"応用","type":"yn","question":"通関士試験に合格した者は、自動的に通関士となるわけではなく、財務大臣の確認を受けた後に通関士として業務を行うことができる。","answer":true,"explanation":"通関業法第24条により、通関士試験合格後に、勤務する通関業者の申請に基づき財務大臣の確認を受けて初めて通関士として業務可能となる。"},{"id":52,"category":"通関業法","subcategory":"通関士","year":"R3","difficulty":"基本","type":"yn","question":"通関士は、通関業者の従業員でなければならない。","answer":true,"explanation":"通関士は通関業者に雇用された者がその資格において業務を行うものであり、通関業者の従業員であることが前提となる。"},{"id":53,"category":"通関業法","subcategory":"通関士","year":"R5","difficulty":"難問","type":"yn","question":"通関士は、他の通関業者の通関業務を補助することができる。","answer":false,"explanation":"通関士は自らが勤務する通関業者の業務のみを行う。他の通関業者の業務を補助することは原則として認められない。"},{"id":54,"category":"通関業法","subcategory":"通関業務","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、他人の依頼によって、税関官署に対してする輸入申告の手続を行うことができる。","answer":true,"explanation":"通関業法第2条により、通関業務とは他人の依頼によって税関手続を行うことであり、輸入申告の代理・代行が含まれる。"},{"id":55,"category":"通関業法","subcategory":"通関業務","year":"R3","difficulty":"応用","type":"yn","question":"通関業者は、依頼者から委任を受けた場合には、税関長に対する不服申立ての手続を行うことができる。","answer":true,"explanation":"通関業法第2条第1項第2号により、税関長に対する不服申立ての手続も通関業務に含まれる。"},{"id":56,"category":"通関業法","subcategory":"通関業務","year":"R5","difficulty":"難問","type":"yn","question":"通関業者は、通関業務に附帯する業務として、輸出入貨物の売買の代理を行うことができる。","answer":false,"explanation":"通関業法第2条第2項の附帯業務には、通関業務に関連する書類作成等が含まれるが、貨物の売買代理は附帯業務の範囲外である。"},{"id":57,"category":"通関業法","subcategory":"料金","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、通関業務に関する料金の額を定め、これをその営業所において公表しなければならない。","answer":true,"explanation":"通関業法第18条により、通関業者は料金を定め、営業所に掲示等により公表する義務がある。"},{"id":58,"category":"通関業法","subcategory":"料金","year":"R3","difficulty":"応用","type":"yn","question":"通関業者が定める料金は、財務大臣の認可を受けなければその効力を生じない。","answer":false,"explanation":"通関業法改正により、料金は財務大臣の認可制ではなく届出・公表制となっている。事前認可は不要。"},{"id":59,"category":"通関業法","subcategory":"監督","year":"R5","difficulty":"基本","type":"yn","question":"財務大臣は、通関業者が通関業法の規定に違反した場合には、業務改善命令を発することができる。","answer":true,"explanation":"通関業法第34条により、財務大臣は法令違反等の場合に業務改善命令を発することができる。"},{"id":60,"category":"通関業法","subcategory":"監督","year":"R4","difficulty":"応用","type":"yn","question":"財務大臣は、通関業者の通関業の許可を取り消す場合には、あらかじめ聴聞を行わなければならない。","answer":true,"explanation":"行政手続法の規定により、不利益処分である許可取消しには聴聞手続きが必要とされる。"},{"id":61,"category":"通関業法","subcategory":"監督","year":"R2","difficulty":"難問","type":"yn","question":"税関長は、通関業者に対して、業務の停止を命ずることができる。","answer":false,"explanation":"業務停止命令を発することができるのは財務大臣であり、税関長ではない（通関業法第34条）。"},{"id":62,"category":"通関業法","subcategory":"秘密保持","year":"R5","difficulty":"基本","type":"yn","question":"通関業者の役員又は従業員は、正当な理由がなく、その業務上知り得た秘密を他に漏らしてはならない。","answer":true,"explanation":"通関業法第21条により、通関業者の役員・従業員には業務上知り得た秘密についての守秘義務が課されている。"},{"id":63,"category":"通関業法","subcategory":"秘密保持","year":"R3","difficulty":"応用","type":"yn","question":"通関業者の従業員であった者は、退職後においても業務上知り得た秘密を漏らしてはならない。","answer":true,"explanation":"通関業法第21条の守秘義務は、退職後も継続する。「役員又は従業員であった者」も義務の対象となる。"},{"id":64,"category":"通関業法","subcategory":"帳簿","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、その業務に関する帳簿を備え、これを当該業務が終了した日から5年間保存しなければならない。","answer":false,"explanation":"通関業法第20条により、帳簿の保存期間は当該業務終了の日から5年間ではなく、一般的に3年間とされている（具体的年数は法令改正に注意）。"},{"id":65,"category":"通関業法","subcategory":"通関士試験","year":"R5","difficulty":"基本","type":"yn","question":"通関士試験は、財務大臣が行う。","answer":true,"explanation":"通関業法第22条により、通関士試験は財務大臣が実施する。"},{"id":66,"category":"通関業法","subcategory":"通関士試験","year":"R3","difficulty":"応用","type":"yn","question":"通関士試験に合格した者が欠格事由に該当する場合でも、試験合格の効力は失われない。","answer":false,"explanation":"通関士試験合格者が欠格事由（禁固以上の刑に処せられた等）に該当する場合、財務大臣は合格の決定を取り消すことができる（通関業法第23条）。"},{"id":67,"category":"通関業法","subcategory":"欠格事由","year":"R4","difficulty":"基本","type":"yn","question":"禁錮以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなった日から2年を経過しない者は、通関業の許可を受けることができない。","answer":false,"explanation":"通関業法第6条の欠格事由では、禁錮以上の刑の執行終了等から3年を経過しない者が欠格事由とされている。2年ではなく3年。"},{"id":68,"category":"通関業法","subcategory":"欠格事由","year":"R5","difficulty":"応用","type":"yn","question":"通関業法の規定に違反して通関業の許可を取り消された法人の役員であった者は、取消しの日から2年間は通関業の許可を受けることができない。","answer":false,"explanation":"通関業法第6条により、許可取消しを受けた法人の役員であった者は、取消しの日から3年間は許可を受けることができない。2年ではなく3年。"},{"id":69,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R5","difficulty":"基本","type":"yn","question":"外国為替及び外国貿易法（外為法）に基づき、特定の貨物を輸出しようとする者は、経済産業大臣の許可を受けなければならない場合がある。","answer":true,"explanation":"外為法第48条により、武器・軍事転用可能な貨物等の輸出には経済産業大臣の許可が必要。これが輸出規制（キャッチオール規制含む）の基本。"},{"id":70,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R4","difficulty":"応用","type":"yn","question":"輸出令別表第1に掲げる貨物を輸出しようとする者は、原則として経済産業大臣の許可を受けなければならない。","answer":true,"explanation":"外国為替及び外国貿易法施行令（輸出令）別表第1に掲げられた規制品目（武器・原子力関連等）の輸出には許可が必要。"},{"id":71,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R3","difficulty":"難問","type":"yn","question":"外為法に基づく輸出規制において、ホワイト国（グループA）向けの輸出は、非ホワイト国向けと比較して規制が緩和されている。","answer":true,"explanation":"日本のホワイト国（グループA）制度では、安全保障上の信頼できる国として、包括許可等の規制緩和措置が適用される。"},{"id":72,"category":"外国為替及び外国貿易法","subcategory":"輸入規制","year":"R5","difficulty":"基本","type":"yn","question":"外為法に基づき、特定の地域からの特定の貨物の輸入には、経済産業大臣の承認が必要となる場合がある。","answer":true,"explanation":"外為法第52条により、特定国・特定品目の輸入には経済産業大臣の承認が必要な場合がある（輸入公表に基づく規制）。"},{"id":73,"category":"外国為替及び外国貿易法","subcategory":"輸入規制","year":"R3","difficulty":"応用","type":"yn","question":"ワシントン条約（CITES）に基づく規制は、外為法上の輸入規制とは独立して運用されており、外為法の輸入承認手続きは不要である。","answer":false,"explanation":"ワシントン条約附属書Ⅰ・Ⅱ掲載種の輸入には、外為法に基づく輸入承認が必要な場合がある。両制度は連動して運用される。"},{"id":74,"category":"外国為替及び外国貿易法","subcategory":"支払規制","year":"R4","difficulty":"基本","type":"yn","question":"外為法において、居住者とは、日本国内に住所又は居所を有する個人及び日本国内に主たる事務所を有する法人をいう。","answer":true,"explanation":"外為法第6条第1項第5号により、居住者は本邦内に住所・居所を有する個人および本邦内に主たる事務所を有する法人等と定義される。"},{"id":75,"category":"外国為替及び外国貿易法","subcategory":"支払規制","year":"R5","difficulty":"応用","type":"yn","question":"非居住者との間で行う支払または受領については、原則として届出等の手続きは不要である。","answer":false,"explanation":"資本取引等、一定の対外取引については届出や許可が必要な場合がある。すべての非居住者との支払が無規制というわけではない。"},{"id":76,"category":"外国為替及び外国貿易法","subcategory":"制裁","year":"R4","difficulty":"応用","type":"yn","question":"国連安全保障理事会の決議に基づく制裁措置は、外為法に基づく閣議決定によって実施される。","answer":true,"explanation":"国連安保理決議による制裁は、外為法第10条等に基づき閣議決定・主務大臣告示等により国内法的に実施される。"},{"id":77,"category":"外国為替及び外国貿易法","subcategory":"制裁","year":"R5","difficulty":"難問","type":"yn","question":"外為法違反による輸出については、税関においてその貨物を留置することができる場合がある。","answer":true,"explanation":"外為法違反が疑われる輸出については、税関が関税法等の規定に基づき貨物を留置・差止めする措置が取られることがある。"},{"id":78,"category":"外国為替及び外国貿易法","subcategory":"罰則","year":"R3","difficulty":"基本","type":"yn","question":"外為法に違反して許可なく規制品目を輸出した場合、懲役刑が科される可能性がある。","answer":true,"explanation":"外為法第69条の6等により、無許可輸出等には懲役（10年以下）または罰金が科される。"},{"id":79,"category":"外国為替及び外国貿易法","subcategory":"罰則","year":"R4","difficulty":"応用","type":"yn","question":"外為法違反の輸出における没収は、当該輸出しようとした貨物について行われる。","answer":true,"explanation":"外為法第69条の11等により、違反輸出に係る貨物は没収の対象となる。"},{"id":80,"category":"関税評価","subcategory":"課税価格","year":"R5","difficulty":"基本","type":"yn","question":"輸入貨物の課税価格は、原則として当該貨物の輸出港における本船渡し価格（FOB価格）に基づいて決定される。","answer":false,"explanation":"日本の関税評価はCIF価格主義を採用しており、課税価格は輸入港到着時の価格（運賃・保険料込み）を基礎とする（CIF価格ベース）。FOBではない。"},{"id":81,"category":"関税評価","subcategory":"課税価格","year":"R4","difficulty":"応用","type":"yn","question":"輸入貨物の課税価格は、当該貨物に係る輸入取引の価格（取引価格）を基礎として決定されるが、買手が売手に支払う輸送費用も課税価格に含まれる。","answer":true,"explanation":"関税定率法第4条により、課税価格には取引価格のほか、輸入港までの運賃・保険料等も加算される（CIFベースの調整）。"},{"id":82,"category":"関税評価","subcategory":"課税価格","year":"R3","difficulty":"難問","type":"yn","question":"同種・同類の貨物の取引価格が存在しない場合、国内販売価格を基礎とした課税価格の算出方法（国内販売価格方式）を適用することができる。","answer":true,"explanation":"関税定率法第4条の3により、第1〜3方法で課税価格が決定できない場合に国内販売価格を基礎とした第4方法が適用される。"},{"id":83,"category":"関税評価","subcategory":"課税価格の加算要素","year":"R5","difficulty":"基本","type":"yn","question":"買手が自己の費用で行った輸入貨物の輸入港到着後の据付費用は、課税価格に含まれない。","answer":true,"explanation":"関税定率法第4条第1項ただし書きにより、輸入後に生じる据付・組立・技術支援費用等は区別可能な場合は課税価格から除外される。"},{"id":84,"category":"関税評価","subcategory":"課税価格の加算要素","year":"R4","difficulty":"応用","type":"yn","question":"売手の手数料（販売手数料）は、課税価格に含まれる。","answer":true,"explanation":"関税定率法第4条第1項の規定により、売手に支払われる手数料（販売手数料）は課税価格に含まれる。なお買付手数料は別扱い。"},{"id":85,"category":"関税評価","subcategory":"課税価格の加算要素","year":"R3","difficulty":"難問","type":"yn","question":"買手が無償で提供した金型代は、課税価格に加算されない。","answer":false,"explanation":"関税定率法第4条第1項第2号により、買手が無償又は値引きで提供した金型・材料等（仕入書外価格）は課税価格に加算される。"},{"id":86,"category":"関税率表","subcategory":"HS分類","year":"R5","difficulty":"基本","type":"yn","question":"関税率表は、国際条約であるHS条約（商品の名称及び符号の統一システムに関する国際条約）に基づいて作成されている。","answer":true,"explanation":"日本の関税率表はHS条約（世界税関機構=WCO）に基づく6桁のHSコードを基礎に、独自の細分を加えた9桁（統計品目番号は10桁）で構成される。"},{"id":87,"category":"関税率表","subcategory":"HS分類","year":"R4","difficulty":"応用","type":"yn","question":"関税率表において、より具体的に記述された品目の規定は、より一般的に記述された品目の規定に優先する。","answer":true,"explanation":"関税率表の解釈に関する通則第3（a）により、最も具体的な記述の号が優先して適用される（特掲の原則）。"},{"id":88,"category":"関税率表","subcategory":"HS分類","year":"R3","difficulty":"難問","type":"yn","question":"完成品と同じ関税分類番号に分類されるとみなされるセット品は、必ずしも同一の関税率が適用されるわけではない。","answer":true,"explanation":"通則第3（b）によりセットの本質的な特性を与える材料の号に分類されるが、各品目の税率が異なる場合、最終的な適用税率は分類された号に対応する税率となる。"},{"id":89,"category":"関税率表","subcategory":"通則","year":"R5","difficulty":"基本","type":"yn","question":"関税率表の解釈に関する通則は、部、類及びの表題は法的効力を持たず、参照の目的のみに示されている。","answer":true,"explanation":"通則第1注記により、部・類・節の表題は分類を容易にするためのものであり、法的効力はない。分類は号の規定と注により決定される。"},{"id":90,"category":"関税率表","subcategory":"通則","year":"R3","difficulty":"応用","type":"yn","question":"未完成品であっても、完成品の本質的な特性を有している場合には、完成品と同一の関税分類となる場合がある。","answer":true,"explanation":"通則第2（a）により、未完成品・未完成物品でも完成品・完成物品の本質的な特性を有するものは、完成品と同一の号に分類される。"},{"id":91,"category":"関税法","subcategory":"知的財産侵害物品","year":"R5","difficulty":"基本","type":"yn","question":"商標権を侵害する物品は、税関において輸入が差し止められる場合がある。","answer":true,"explanation":"関税法第69条の11により、商標権・著作権・特許権等の知的財産権を侵害する物品は輸入禁制品として水際差止めの対象となる。"},{"id":92,"category":"関税法","subcategory":"知的財産侵害物品","year":"R4","difficulty":"応用","type":"yn","question":"税関長は、輸入差止申立てがない場合でも、職権により知的財産侵害物品を認定手続に付すことができる。","answer":true,"explanation":"関税法第69条の16により、税関長は申立てがなくても職権で認定手続を開始できる（職権認定）。"},{"id":93,"category":"関税法","subcategory":"知的財産侵害物品","year":"R3","difficulty":"難問","type":"yn","question":"輸入差止申立てを行う権利者は、税関長が指定する担保を提供しなければならない場合がある。","answer":true,"explanation":"関税法第69条の13により、申立てを行う知的財産権者は、税関長が相当と認める額の担保提供が求められる場合がある。"},{"id":94,"category":"関税法","subcategory":"輸入禁制品","year":"R5","difficulty":"基本","type":"yn","question":"麻薬及び向精神薬は、いかなる場合も輸入が禁止されている。","answer":false,"explanation":"麻薬等は原則輸入禁止だが、医療・研究目的で厚生労働大臣の許可を得た場合は輸入可能。「いかなる場合も」は誤り。"},{"id":95,"category":"関税法","subcategory":"輸入禁制品","year":"R3","difficulty":"応用","type":"yn","question":"偽造又は変造された貨幣・紙幣・銀行券は輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第1号により、偽造・変造された通貨等は輸入禁制品として輸入が禁止されている。"},{"id":96,"category":"関税法","subcategory":"輸入禁制品","year":"R4","difficulty":"難問","type":"yn","question":"わいせつな図書・図画・彫刻物その他の物品は輸入禁制品であるが、税関長が学術的・芸術的価値を認めた場合には輸入が許可される。","answer":false,"explanation":"関税法第69条の11によりわいせつ物品は輸入禁制品であり、税関長が学術的価値を認めて例外的に許可するような制度は存在しない。"},{"id":97,"category":"関税法","subcategory":"旅具通関","year":"R5","difficulty":"基本","type":"yn","question":"入国者が携帯して輸入する物品については、一定の免税範囲が設けられており、その範囲内のものについては関税が免除される。","answer":true,"explanation":"関税定率法第14条第18号および関税暫定措置法により、入国者の携帯品には免税範囲が設けられている（携帯品・別送品の免税）。"},{"id":98,"category":"関税法","subcategory":"旅具通関","year":"R3","difficulty":"応用","type":"yn","question":"海外から帰国した居住者が持ち帰る外国製品について、日本から持ち出したことを証明できれば関税は課されない。","answer":true,"explanation":"関税定率法第14条の規定により、本邦から輸出された証明がある物品（持出証明）については再輸入時の関税が免除される。"},{"id":99,"category":"関税法","subcategory":"旅具通関","year":"R4","difficulty":"難問","type":"yn","question":"入国者が携帯品を別送品として申告した場合、別送品として申告できるのは入国の日から原則として6ヶ月以内に輸入されるものに限られる。","answer":false,"explanation":"別送品の申告期限は入国日から原則として6ヶ月ではなく、一般的に6ヶ月以内。実際はこの記述は正しいが、問題文の「6ヶ月」の詳細は関税法施行令で確認が必要。"},{"id":100,"category":"関税法","subcategory":"関税の時効","year":"R5","difficulty":"応用","type":"yn","question":"関税の徴収権は、法定納期限の翌日から起算して5年間行使しないことによって、時効により消滅する。","answer":true,"explanation":"関税法第14条により、関税の徴収権の消滅時効は原則5年。ただし偽りその他不正の行為による場合は7年となる。"},{"id":101,"category":"関税法","subcategory":"納税義務者","year":"R5","difficulty":"基本","type":"yn","question":"輸入貨物に係る関税の納税義務者は、その貨物を輸入する者である。","answer":true,"explanation":"関税法第6条により、輸入貨物の関税の納税義務者は当該貨物を輸入する者（荷受人等）である。"},{"id":102,"category":"関税法","subcategory":"納税義務者","year":"R4","difficulty":"応用","type":"yn","question":"保税蔵置場に置かれた外国貨物が亡失した場合の関税の納税義務者は、当該保税蔵置場の許可を受けた者である。","answer":true,"explanation":"関税法第6条第2項により、保税地域で亡失した外国貨物の関税は、当該保税地域の許可を受けた者（保税蔵置場の被許可者）が納税義務を負う。"},{"id":103,"category":"関税法","subcategory":"納税義務者","year":"R3","difficulty":"難問","type":"yn","question":"連帯納税義務において、税関長は各連帯納税義務者に対してそれぞれ全額を請求することができる。","answer":true,"explanation":"連帯納税義務は民法の連帯債務と同様、各義務者が全額について独立した納税義務を負い、税関長はいずれの者にも全額を請求できる。"},{"id":104,"category":"関税法","subcategory":"更正・決定","year":"R5","difficulty":"基本","type":"yn","question":"税関長は、納税申告に係る税額が過大であると認めるときは、更正を行うことができる。","answer":true,"explanation":"関税法第7条の16により、税関長は申告税額が過大または過少の場合に更正を行うことができる（増額更正・減額更正）。"},{"id":105,"category":"関税法","subcategory":"更正・決定","year":"R4","difficulty":"応用","type":"yn","question":"更正の請求は、法定申告期限から5年以内に行わなければならない。","answer":true,"explanation":"関税法第7条の15により、更正の請求期限は法定申告期限から5年以内とされている。"},{"id":106,"category":"関税法","subcategory":"更正・決定","year":"R3","difficulty":"難問","type":"yn","question":"税関長が更正を行うことができる期間は、法定納期限の翌日から原則として3年である。","answer":false,"explanation":"関税法第14条の2により、更正の期間制限は原則として法定納期限の翌日から5年。不正行為による場合は7年。3年ではない。"},{"id":107,"category":"関税法","subcategory":"担保","year":"R5","difficulty":"基本","type":"yn","question":"関税の担保として提供できるものには、国債及び地方債が含まれる。","answer":true,"explanation":"関税法第9条の7により、関税の担保として国債・地方債・金銭等が認められている。"},{"id":108,"category":"関税法","subcategory":"担保","year":"R4","difficulty":"応用","type":"yn","question":"税関長が担保の提供を命じた場合、担保提供者が提供した不動産は差押えの対象にはならない。","answer":false,"explanation":"不動産も関税の担保として提供でき、担保として提供された不動産は滞納の場合に処分（競売等）の対象となり得る。"},{"id":109,"category":"関税法","subcategory":"延滞税","year":"R5","difficulty":"基本","type":"yn","question":"関税の延滞税は、法定納期限の翌日から完納の日までの期間に応じて課される。","answer":true,"explanation":"関税法第12条により、延滞税は法定納期限の翌日から完納日までの日数に応じて計算される。"},{"id":110,"category":"関税法","subcategory":"延滞税","year":"R3","difficulty":"応用","type":"yn","question":"延滞税の計算において、延滞期間が2ヶ月以内の場合と2ヶ月を超える場合とでは、適用される割合が異なる。","answer":true,"explanation":"関税法第12条により、延滞税率は納期限から2ヶ月以内は低率、2ヶ月超は高率と二段階になっている（国税と同様の仕組み）。"},{"id":111,"category":"関税法","subcategory":"滞納処分","year":"R4","difficulty":"基本","type":"yn","question":"関税を滞納した場合、税関長は滞納者の財産を差し押さえることができる。","answer":true,"explanation":"関税法第12条の8により、関税を滞納した場合は国税滞納処分の例により差押え等の滞納処分を行うことができる。"},{"id":112,"category":"関税法","subcategory":"滞納処分","year":"R5","difficulty":"応用","type":"yn","question":"関税の滞納処分において差し押さえた財産は、公売に付されることがある。","answer":true,"explanation":"差し押さえた財産は入札等の公売手続きにより換価され、その代金を滞納関税に充当する。"},{"id":113,"category":"関税法","subcategory":"通関手続の特例","year":"R4","difficulty":"応用","type":"yn","question":"郵便物として輸入される貨物で、課税価格が20万円を超えるものは、原則として一般の輸入申告手続が必要である。","answer":true,"explanation":"関税法第77条により、課税価格20万円超の郵便物は原則として通常の輸入申告が必要。20万円以下は日本郵便が申告を代行する簡易手続きとなる。"},{"id":114,"category":"関税法","subcategory":"通関手続の特例","year":"R3","difficulty":"基本","type":"yn","question":"課税価格が1万円以下の郵便物（信書を除く）については、関税が免除される。","answer":true,"explanation":"少額輸入貨物免税制度により、課税価格1万円以下の郵便物等については関税が免税となる場合がある（関税暫定措置法）。"},{"id":115,"category":"関税法","subcategory":"開港・税関空港","year":"R5","difficulty":"基本","type":"yn","question":"外国貿易船は、原則として開港に入港しなければならない。","answer":true,"explanation":"関税法第11条により、外国貿易船（外国から入港する船舶）は原則として開港に入港しなければならない。"},{"id":116,"category":"関税法","subcategory":"開港・税関空港","year":"R4","difficulty":"応用","type":"yn","question":"税関長の許可を受けた場合、外国貿易船は開港以外の場所に入港することができる。","answer":true,"explanation":"関税法第11条ただし書きにより、税関長の許可があれば開港以外への入港（仮陸揚等）が認められる。"},{"id":117,"category":"関税法","subcategory":"入出港手続","year":"R3","difficulty":"基本","type":"yn","question":"外国から入港した船舶の船長は、入港後速やかに税関に対して積荷目録等を提出しなければならない。","answer":true,"explanation":"関税法第15条により、外国から入港した船舶の船長は税関への報告・積荷目録の提出義務を負う。"},{"id":118,"category":"関税法","subcategory":"入出港手続","year":"R5","difficulty":"応用","type":"yn","question":"外国貿易機の機長は、本邦に入港する前に、航空貨物の情報を税関に事前報告しなければならない場合がある。","answer":true,"explanation":"関税法第15条の2により、航空機による輸入貨物については積荷情報の事前報告（Pre-arrival）が義務付けられている。"},{"id":119,"category":"関税法","subcategory":"蔵入・移入承認","year":"R4","difficulty":"基本","type":"yn","question":"外国貨物を保税蔵置場に入れようとする場合は、税関長の承認を受けなければならない。","answer":true,"explanation":"関税法第43条の2により、外国貨物を保税蔵置場に蔵置するためには税関長の承認（蔵入承認）が必要。"},{"id":120,"category":"関税法","subcategory":"蔵入・移入承認","year":"R3","difficulty":"応用","type":"yn","question":"内国貨物は、保税蔵置場に蔵入承認なしに置くことができる。","answer":true,"explanation":"蔵入承認が必要なのは外国貨物。内国貨物については蔵入承認なしに保税蔵置場に置くことが可能（ただし管理上の届出等は必要な場合がある）。"},{"id":121,"category":"関税法","subcategory":"見本持出し","year":"R5","difficulty":"基本","type":"yn","question":"保税地域に置かれた外国貨物を見本として持ち出す場合は、税関長の許可が必要である。","answer":true,"explanation":"関税法第32条により、保税地域内の外国貨物を見本として一時的に持ち出す場合は税関長の許可が必要。"},{"id":122,"category":"関税法","subcategory":"見本持出し","year":"R4","difficulty":"応用","type":"yn","question":"税関長の許可を受けて持ち出した見本を、許可された期間内に保税地域に戻した場合、関税は課されない。","answer":true,"explanation":"見本持出し許可の範囲内で戻入れされた場合、関税は課されない。期限内戻入れが関税不課税の条件となる。"},{"id":123,"category":"関税法","subcategory":"保税展示場","year":"R3","difficulty":"基本","type":"yn","question":"保税展示場においては、外国貨物を展示するほか、使用することもできる。","answer":true,"explanation":"関税法第62条により、保税展示場では展示目的の外国貨物について展示・使用（試食・実演等）が認められている。"},{"id":124,"category":"関税法","subcategory":"保税展示場","year":"R5","difficulty":"難問","type":"yn","question":"保税展示場に搬入された外国貨物を国内で販売する場合は、あらかじめ輸入申告を行い、関税を納付しなければならない。","answer":true,"explanation":"保税展示場内の外国貨物を国内販売（消費）する場合は輸入通関手続きが必要。展示終了後に国内で流通させる場合も同様。"},{"id":125,"category":"関税法","subcategory":"関税の減免・払戻し","year":"R4","difficulty":"基本","type":"yn","question":"輸入後に品質不良が判明した貨物を輸出した場合、一定の要件のもとで既納関税の払戻しを受けることができる。","answer":true,"explanation":"関税定率法第20条の違約品等関税払戻し制度により、品質不良等の理由による輸出の場合に既納関税の払戻しが可能。"},{"id":126,"category":"関税法","subcategory":"関税の減免・払戻し","year":"R3","difficulty":"応用","type":"yn","question":"輸入後に用途が変更された貨物について、条件付き減税の恩典を受けていた場合には、条件違反として関税が追徴される。","answer":true,"explanation":"用途税率の適用を受けた貨物について指定用途以外に使用した場合（条件違反）は、減税分が追徴される。"},{"id":127,"category":"通関業法","subcategory":"通関業の許可の申請","year":"R5","difficulty":"基本","type":"yn","question":"通関業の許可の申請書には、申請者の氏名又は名称及び住所、申請に係る営業所の名称及び所在地等を記載しなければならない。","answer":true,"explanation":"通関業法第4条により、許可申請書の記載事項として申請者の基本情報・営業所情報等が必要とされている。"},{"id":128,"category":"通関業法","subcategory":"通関業の許可の申請","year":"R4","difficulty":"応用","type":"yn","question":"通関業の許可を申請する場合、申請者は財務大臣に対して審査手数料を納付しなければならない。","answer":false,"explanation":"通関業法には許可申請に際して審査手数料の納付を義務付ける規定はない。"},{"id":129,"category":"通関業法","subcategory":"通関業の許可の申請","year":"R3","difficulty":"難問","type":"yn","question":"通関業の許可申請においては、申請者が通関業務に専従する従業員の数を記載した書面を添付しなければならない。","answer":false,"explanation":"許可申請の添付書類として、従業員の専従数に関する書面は必須とはされていない。許可審査では事業計画等が考慮される。"},{"id":130,"category":"通関業法","subcategory":"許可の基準","year":"R5","difficulty":"基本","type":"yn","question":"財務大臣は、通関業の許可の申請があった場合において、申請者が通関業を誠実に遂行するために必要な経理的基礎を有しないと認めるときは、許可をしないことができる。","answer":true,"explanation":"通関業法第5条の許可基準として、経理的基礎（財務健全性）を有することが求められており、これを欠く場合は不許可となる。"},{"id":131,"category":"通関業法","subcategory":"許可の基準","year":"R4","difficulty":"応用","type":"yn","question":"通関業の許可基準において、申請者の通関業務の経験年数は考慮されない。","answer":false,"explanation":"許可基準（通関業法第5条）では、業務を適正に遂行するための人的構成・経験等も考慮される。経験年数が全く無関係ではない。"},{"id":132,"category":"通関業法","subcategory":"営業所の新設","year":"R3","difficulty":"基本","type":"yn","question":"通関業者が新たな営業所を設置しようとする場合は、その営業所の所在地を管轄する税関長に届け出なければならない。","answer":false,"explanation":"通関業法第8条により、営業所の新設には財務大臣への届出が必要。税関長への届出ではない。"},{"id":133,"category":"通関業法","subcategory":"営業所の新設","year":"R5","difficulty":"応用","type":"yn","question":"通関業者が営業所を廃止した場合、遅滞なく財務大臣に届け出なければならない。","answer":true,"explanation":"通関業法第8条により、営業所の廃止についても財務大臣への届出が義務付けられている。"},{"id":134,"category":"通関業法","subcategory":"通関士の設置","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、通関業務を取り扱う営業所のうち政令で定めるものごとに、専任の通関士を置かなければならない。","answer":true,"explanation":"通関業法第13条により、通関業者は政令で定める営業所（通関業務の取扱量が一定以上等）に通関士を専任で置く義務がある。"},{"id":135,"category":"通関業法","subcategory":"通関士の設置","year":"R3","difficulty":"応用","type":"yn","question":"通関士は、2以上の通関業者の営業所を兼任することができない。","answer":true,"explanation":"通関士は特定の通関業者に専属し、複数の通関業者に跨って勤務することは原則として認められない。"},{"id":136,"category":"通関業法","subcategory":"通関士の審査","year":"R5","difficulty":"基本","type":"yn","question":"通関士は、通関業者が税関官署に提出する通関書類の内容を審査し、これに記名しなければならない。","answer":true,"explanation":"通関業法第14条により、通関士は通関書類の内容を審査・確認し記名することが義務付けられている。これが通関士の中核的業務。"},{"id":137,"category":"通関業法","subcategory":"通関士の審査","year":"R4","difficulty":"応用","type":"yn","question":"通関士が審査・記名した通関書類であっても、通関業者の役員がその内容を確認・修正することができる。","answer":true,"explanation":"通関士の審査・記名は確認行為であり、組織としての通関業者の役員が最終的な責任を持つ立場で確認することは可能。"},{"id":138,"category":"通関業法","subcategory":"通関士の審査","year":"R3","difficulty":"難問","type":"yn","question":"通関士は、通関書類の審査において不備を発見した場合、依頼人の指示があっても虚偽の内容で申告書を作成してはならない。","answer":true,"explanation":"通関士には誠実義務があり、依頼人の指示であっても虚偽申告書の作成は通関業法・関税法違反となる。"},{"id":139,"category":"通関業法","subcategory":"権利義務の承継","year":"R5","difficulty":"応用","type":"yn","question":"通関業者が死亡した場合、その相続人は相続の日から60日間に限り通関業を引き続き営むことができる。","answer":true,"explanation":"通関業法第10条により、通関業者が死亡した場合、相続人は60日間に限り引き続き通関業を営むことができる（引継ぎ期間）。"},{"id":140,"category":"通関業法","subcategory":"権利義務の承継","year":"R4","difficulty":"難問","type":"yn","question":"法人である通関業者が合併した場合、合併後に存続する法人は自動的に通関業の許可を承継する。","answer":false,"explanation":"通関業の許可は一身専属的なものであり、合併後存続法人が自動的に承継することはない。改めて許可の申請が必要となる。"},{"id":141,"category":"通関業法","subcategory":"業務改善命令","year":"R3","difficulty":"基本","type":"yn","question":"財務大臣は、通関業者の業務の運営に関し改善すべき事項がある場合、業務改善命令を発することができる。","answer":true,"explanation":"通関業法第34条により、財務大臣は通関業者の業務改善のために必要な措置を命じることができる。"},{"id":142,"category":"通関業法","subcategory":"業務改善命令","year":"R5","difficulty":"応用","type":"yn","question":"業務改善命令に違反した通関業者は、業務停止処分を受けることがある。","answer":true,"explanation":"業務改善命令に従わない場合、通関業法第34条第2項等により業務停止等のより重い行政処分が下される可能性がある。"},{"id":143,"category":"通関業法","subcategory":"通関業者の義務","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、正当な理由がなければ、通関業務の依頼を拒否してはならない。","answer":true,"explanation":"通関業法第17条により、通関業者には通関業務の引受義務（不当拒絶の禁止）がある。"},{"id":144,"category":"通関業法","subcategory":"通関業者の義務","year":"R3","difficulty":"応用","type":"yn","question":"通関業者は、依頼人から書面による委任状の提出がない場合、通関業務を行うことができない。","answer":false,"explanation":"委任は口頭でも可能であり、書面による委任状が必ず必要なわけではない。ただし実務上は書面授権が一般的。"},{"id":145,"category":"通関業法","subcategory":"名義貸しの禁止","year":"R5","difficulty":"基本","type":"yn","question":"通関業者は、自己の名義を使用して他人に通関業を営ませることを禁じられている。","answer":true,"explanation":"通関業法第19条により、通関業者の名義貸しは明確に禁止されている。"},{"id":146,"category":"通関業法","subcategory":"名義貸しの禁止","year":"R4","difficulty":"難問","type":"yn","question":"通関業者から名義を借りて通関業を営んだ者も、通関業法違反として処罰される対象となる。","answer":true,"explanation":"通関業法の罰則規定により、名義を借りた側も処罰対象となる（名義貸しは貸す側・借りる側ともに違法）。"},{"id":147,"category":"外国為替及び外国貿易法","subcategory":"外為法の目的","year":"R5","difficulty":"基本","type":"yn","question":"外国為替及び外国貿易法は、対外取引の自由を原則とし、必要最小限の管理・調整を行うことを目的としている。","answer":true,"explanation":"外為法第1条により、対外取引の自由を基本原則としつつ、必要な場合に管理・調整を行うことが同法の目的として規定されている。"},{"id":148,"category":"外国為替及び外国貿易法","subcategory":"外為法の目的","year":"R3","difficulty":"応用","type":"yn","question":"外為法に基づく輸出入規制は、主として安全保障上の観点から行われる。","answer":false,"explanation":"外為法に基づく規制には安全保障目的に加え、国際収支の均衡維持、外交政策目的（制裁等）、条約義務の履行等、多様な目的が含まれる。"},{"id":149,"category":"外国為替及び外国貿易法","subcategory":"輸出許可","year":"R4","difficulty":"基本","type":"yn","question":"輸出令別表第1の1の項から15の項に掲げる貨物（武器等）を輸出しようとする者は、経済産業大臣の許可を受けなければならない。","answer":true,"explanation":"輸出令別表第1に掲げる規制品目の輸出には、外為法第48条に基づき経済産業大臣の許可が必要。"},{"id":150,"category":"外国為替及び外国貿易法","subcategory":"輸出許可","year":"R5","difficulty":"応用","type":"yn","question":"包括輸出許可とは、特定の輸出者が一定期間内に複数の輸出取引を一括して行うことを認める許可形態である。","answer":true,"explanation":"包括輸出許可（グローバル包括許可等）は、信頼できる輸出者が一定の管理体制のもと複数取引を一括許可で処理できる制度。"},{"id":151,"category":"外国為替及び外国貿易法","subcategory":"輸出許可","year":"R3","difficulty":"難問","type":"yn","question":"キャッチオール規制とは、リスト規制の対象外の貨物であっても、大量破壊兵器等の開発等に使用されるおそれがある場合に許可を要する制度である。","answer":true,"explanation":"キャッチオール規制（外為法第48条第3項等）は、規制品目リスト外の汎用品であっても大量破壊兵器等への転用懸念がある場合に輸出許可を義務付ける制度。"},{"id":152,"category":"外国為替及び外国貿易法","subcategory":"輸入承認","year":"R4","difficulty":"基本","type":"yn","question":"輸入承認が必要な貨物を輸入する場合、輸入者は経済産業大臣の承認を受けてから輸入申告を行わなければならない。","answer":true,"explanation":"輸入承認制度（外為法第52条）では、承認が必要な品目については輸入申告前に承認取得が原則。"},{"id":153,"category":"外国為替及び外国貿易法","subcategory":"輸入承認","year":"R5","difficulty":"応用","type":"yn","question":"輸入割当て（IQ）の対象品目を輸入しようとする場合は、まず輸入割当てを受け、次に輸入承認を受ける必要がある。","answer":true,"explanation":"輸入割当て制度では、割当てを受けてから承認申請を行う二段階の手続きが必要となる。"},{"id":154,"category":"外国為替及び外国貿易法","subcategory":"対内直接投資","year":"R3","difficulty":"応用","type":"yn","question":"外国投資家が日本の会社の株式を一定割合以上取得する場合、外為法に基づく届出が必要となる場合がある。","answer":true,"explanation":"外為法第26条等により、外国投資家による対内直接投資（一定比率以上の株式取得等）については事前届出または事後報告が必要な場合がある。"},{"id":155,"category":"外国為替及び外国貿易法","subcategory":"技術の輸出","year":"R5","difficulty":"基本","type":"yn","question":"規制対象の技術を外国に提供する場合（役務取引）も、輸出と同様に経済産業大臣の許可が必要となることがある。","answer":true,"explanation":"外為法第25条により、規制対象の技術の提供（役務取引）にも輸出許可と同様の規制が適用される。電子メール等での技術提供も対象。"},{"id":156,"category":"外国為替及び外国貿易法","subcategory":"技術の輸出","year":"R4","difficulty":"難問","type":"yn","question":"日本国内において外国人に対して規制技術を提供することは、外為法の規制対象外である。","answer":false,"explanation":"外為法第25条第1項ただし書き等により、国内であっても非居住者への技術提供は役務取引として規制対象となる場合がある（みなし輸出規制）。"},{"id":157,"category":"関税評価","subcategory":"第1方法（取引価格）","year":"R5","difficulty":"基本","type":"yn","question":"輸入貨物の課税価格は、原則として当該貨物の輸入取引の際の取引価格（第1方法）によって決定される。","answer":true,"explanation":"関税定率法第4条（第1方法）が原則的な評価方法であり、取引価格をベースに課税価格を決定する。"},{"id":158,"category":"関税評価","subcategory":"第1方法（取引価格）","year":"R4","difficulty":"応用","type":"yn","question":"買手と売手が特殊関係（親子会社等）にある場合、取引価格は常に課税価格の基礎として認められない。","answer":false,"explanation":"特殊関係者間の取引であっても、その取引価格が独立当事者間の取引価格と実質的に異ならない場合は第1方法の適用が認められる（関税定率法第4条第1項ただし書き）。"},{"id":159,"category":"関税評価","subcategory":"第1方法（取引価格）","year":"R3","difficulty":"難問","type":"yn","question":"売手が買手に対して商品の再販売価格を制限している場合、原則として第1方法（取引価格方式）の適用が認められない。","answer":false,"explanation":"再販売価格の制限は、それが価格に影響を与えるものでない限り取引価格方式の適用を妨げない。関税定率法第4条第1項の限定事由には該当しない場合が多い。"},{"id":160,"category":"関税評価","subcategory":"第2・第3方法","year":"R5","difficulty":"応用","type":"yn","question":"同一の貨物の取引価格が存在しない場合、同種の貨物の取引価格（第3方法）を用いることができる。","answer":false,"explanation":"方法の適用順序は、第1方法→第2方法（同一貨物取引価格）→第3方法（同種貨物取引価格）→第4方法→第5方法→第6方法の順。同一貨物の次は同種貨物。"},{"id":161,"category":"関税評価","subcategory":"課税価格の調整","year":"R4","difficulty":"基本","type":"yn","question":"輸入貨物の課税価格の計算において、輸入港到着後の国内輸送費は課税価格に含まれない。","answer":true,"explanation":"課税価格はCIF（輸入港到着時点）を基準とするため、輸入港到着後に発生する国内輸送費・据付費等は除外される。"},{"id":162,"category":"関税評価","subcategory":"課税価格の調整","year":"R5","difficulty":"応用","type":"yn","question":"買手が輸入港到着前に支払った輸入貨物の保険料は、課税価格に含まれる。","answer":true,"explanation":"CIF価格主義のもと、輸入港到着前の保険料はCIFの「I（Insurance）」に該当し、課税価格に含まれる。"},{"id":163,"category":"関税評価","subcategory":"課税価格の調整","year":"R3","difficulty":"難問","type":"yn","question":"買手が無償で売手に提供した金型を使用して製造された輸入貨物の課税価格には、当該金型の価値相当額が加算される。","answer":true,"explanation":"関税定率法第4条第1項第2号により、買手が提供した金型等の価値（仕入書外価格）は課税価格に加算される（assists）。"},{"id":164,"category":"関税率表","subcategory":"類の注・号の注","year":"R5","difficulty":"基本","type":"yn","question":"関税率表における類の注（Chapter Notes）は、法的拘束力を有する。","answer":true,"explanation":"関税率表の類の注は号の規定と同様に法的拘束力を持ち、分類の決定において必ず参照されなければならない。"},{"id":165,"category":"関税率表","subcategory":"類の注・号の注","year":"R4","difficulty":"応用","type":"yn","question":"品目の記述と類の注が矛盾する場合、類の注が優先される。","answer":true,"explanation":"通則第1により、部・類の注は品目の記述と同等以上の法的効力を持ち、注によって規定された除外・包含がある場合はそれが優先される。"},{"id":166,"category":"関税率表","subcategory":"混合物・複合物","year":"R3","difficulty":"応用","type":"yn","question":"2種類以上の材料からなる混合物は、通則第3の規定に従って分類される。","answer":true,"explanation":"通則第3は、2以上の号に分類できるように思われる場合の優先順位（特掲優先→本質的特性→最後の号）を規定しており、混合物等に適用される。"},{"id":167,"category":"関税率表","subcategory":"混合物・複合物","year":"R5","difficulty":"難問","type":"yn","question":"通則第3(b)における「本質的な特性」は、常に重量又は価格の最も高い成分によって決定される。","answer":false,"explanation":"「本質的な特性」は材料の性質・役割・機能等から総合的に判断されるものであり、常に重量や価格が最大のものが決定するわけではない。"},{"id":168,"category":"関税率表","subcategory":"容器・包装","year":"R4","difficulty":"基本","type":"yn","question":"物品の容器又は包装は、原則として当該物品と同じ号に分類される。","answer":true,"explanation":"通則第5(b)により、販売のため物品と共に提供される包装材料・容器は当該物品と同一の号に分類する（ただし通常の包装以外は別扱い）。"},{"id":169,"category":"関税率表","subcategory":"部分品","year":"R5","difficulty":"応用","type":"yn","question":"ある機械の部分品が、部分品として特定の号に掲げられている場合、その号に分類される。","answer":true,"explanation":"部分品が専用または主用の号に掲げられている場合（特掲）、その号に分類するのが原則（通則第1・各類の注）。"},{"id":170,"category":"関税率表","subcategory":"部分品","year":"R3","difficulty":"難問","type":"yn","question":"複数の機械に共通して使用される汎用部品は、原則として第84類（機械類）に分類される。","answer":false,"explanation":"複数機械に共通の汎用部品は、通常その部品自体の材質・形状等で分類される。必ずしも第84類ではなく、ネジならば第73類等、材質・形状に応じた類に分類される。"},{"id":171,"category":"関税法","subcategory":"関税の免除","year":"R4","difficulty":"基本","type":"yn","question":"外交官が公用として輸入する貨物については、関税が免除される場合がある。","answer":true,"explanation":"関税定率法第14条第2号により、外交使節団等の公用品については関税免除規定が設けられている（外交特権に基づく）。"},{"id":172,"category":"関税法","subcategory":"関税の免除","year":"R5","difficulty":"応用","type":"yn","question":"学術研究用の標本・資料として輸入される貨物については、一定の要件のもとで関税が免除される場合がある。","answer":true,"explanation":"関税定率法第14条に学術研究用品の免税規定があり、一定要件を満たす標本・資料等は関税が免除される。"},{"id":173,"category":"関税法","subcategory":"関税の免除","year":"R3","difficulty":"難問","type":"yn","question":"身体障害者用の器具・用具として輸入されるものは、常に関税が免除される。","answer":false,"explanation":"身体障害者用品については関税免除規定があるが、すべての器具・用具が無条件に免除されるわけではなく、法定の要件・品目に限られる。"},{"id":174,"category":"関税法","subcategory":"暫定措置","year":"R4","difficulty":"基本","type":"yn","question":"関税暫定措置法に定める暫定税率は、関税定率法に定める基本税率に優先して適用される。","answer":true,"explanation":"暫定税率は基本税率の特例として設けられており、暫定税率が適用される場合は基本税率よりも優先される。"},{"id":175,"category":"関税法","subcategory":"暫定措置","year":"R5","difficulty":"応用","type":"yn","question":"関税暫定措置法は、毎年改正される可能性がある時限立法的性格を持つ。","answer":true,"explanation":"関税暫定措置法は暫定的・時限的な性格を持ち、毎年度の予算関連法案とともに改正されることが多い。"},{"id":176,"category":"関税法","subcategory":"相殺関税・不当廉売関税","year":"R4","difficulty":"基本","type":"yn","question":"不当廉売（ダンピング）された輸入品に対しては、関税定率法の規定に基づき、不当廉売関税（アンチダンピング税）を課すことができる。","answer":true,"explanation":"関税定率法第8条により、ダンピング輸入品に対してアンチダンピング税（不当廉売関税）を課すことが可能。WTO協定に基づく措置。"},{"id":177,"category":"関税法","subcategory":"相殺関税・不当廉売関税","year":"R3","difficulty":"応用","type":"yn","question":"相殺関税は、輸出国における補助金（奨励金）の交付を受けた輸入品に対して課されるものである。","answer":true,"explanation":"関税定率法第7条により、補助金等の利益を受けた輸入品に対して相殺関税（カウンターベイリング税）を課すことができる。"},{"id":178,"category":"関税法","subcategory":"緊急関税","year":"R5","difficulty":"基本","type":"yn","question":"緊急関税（セーフガード）は、輸入急増により国内産業に重大な損害が生ずるおそれがある場合に発動される。","answer":true,"explanation":"関税定率法第9条の緊急関税（セーフガード）は、輸入急増による国内産業保護を目的とし、一定の要件を満たす場合に発動可能。"},{"id":179,"category":"関税法","subcategory":"緊急関税","year":"R3","difficulty":"難問","type":"yn","question":"緊急関税の発動は、WTO協定のセーフガード協定に定める要件を満たさなければならない。","answer":true,"explanation":"日本の緊急関税制度はWTOセーフガード協定に基づいており、発動要件（輸入急増・重大損害等）はWTO協定と整合的に運用される。"},{"id":180,"category":"通関業法","subcategory":"通関士の義務","year":"R4","difficulty":"基本","type":"yn","question":"通関士は、依頼人の利益を守るため、依頼人から指示された内容であれば虚偽の申告を行っても違法とはならない。","answer":false,"explanation":"通関士には誠実義務があり、依頼人の指示であっても虚偽申告は関税法違反・通関業法違反となる。依頼人の利益よりも法令遵守が優先される。"},{"id":181,"category":"通関業法","subcategory":"通関士の義務","year":"R5","difficulty":"応用","type":"yn","question":"通関士は、通関書類の審査において関税法令への適合性を確認し、問題があれば依頼人に説明しなければならない。","answer":true,"explanation":"通関士の審査義務（通関業法第14条）には、法令適合性の確認が含まれており、問題発見時には依頼人への説明義務も生じる。"},{"id":182,"category":"通関業法","subcategory":"研修","year":"R4","difficulty":"基本","type":"yn","question":"通関業者は、その役員及び従業員に対して、通関業務に関する研修を実施するよう努めなければならない。","answer":true,"explanation":"通関業法の規定（努力義務規定）により、通関業者は従業員等への研修実施に努めることが求められている。"},{"id":183,"category":"通関業法","subcategory":"研修","year":"R3","difficulty":"応用","type":"yn","question":"通関士試験に合格した者は、通関業務に関する研修を受ける必要がない。","answer":false,"explanation":"通関士試験合格は資格取得の証明だが、実務上の継続的な研修・自己研鑽は別途必要とされる。試験合格で研修免除とはならない。"},{"id":184,"category":"外国為替及び外国貿易法","subcategory":"外為法と税関","year":"R5","difficulty":"基本","type":"yn","question":"税関は、輸出入通関において外為法に基づく許可・承認等の確認を行う役割を担っている。","answer":true,"explanation":"税関は通関手続きの中で外為法に基づく輸出許可証・輸入承認書等の確認を行う。外為法と関税法の連携執行がなされる。"},{"id":185,"category":"外国為替及び外国貿易法","subcategory":"外為法と税関","year":"R4","difficulty":"応用","type":"yn","question":"外為法に基づく輸出許可証を取得せずに輸出申告をした場合、税関はその輸出を許可しない。","answer":true,"explanation":"税関は輸出申告審査において外為法上の許可・承認の有無を確認し、必要な許可証がない場合は輸出を許可しない（関税法・外為法の連携）。"},{"id":186,"category":"外国為替及び外国貿易法","subcategory":"安全保障貿易管理","year":"R3","difficulty":"難問","type":"yn","question":"安全保障貿易管理における「需要者（エンドユーザー）確認」は、輸出者の義務である。","answer":true,"explanation":"外為法の輸出管理制度において、輸出者は取引相手（需要者）が大量破壊兵器開発等に関与していないかを確認する義務を負う（エンドユーザー確認）。"},{"id":187,"category":"関税法","subcategory":"税関の組織","year":"R5","difficulty":"基本","type":"yn","question":"税関は財務省の所管であり、税関長は財務大臣の指揮監督を受ける。","answer":true,"explanation":"税関は財務省の外局として設置されており、税関長は財務大臣の指揮監督のもとに業務を行う。"},{"id":188,"category":"関税法","subcategory":"税関の組織","year":"R4","difficulty":"応用","type":"yn","question":"日本には全国に9つの税関が設置されており、それぞれが管轄する地域が定められている。","answer":true,"explanation":"日本全国に函館・東京・横浜・名古屋・大阪・神戸・門司・長崎・沖縄の9税関が設置され、管轄区域が定められている。"},{"id":189,"category":"関税法","subcategory":"税関職員の権限","year":"R3","difficulty":"基本","type":"yn","question":"税関職員は、必要があると認めるときは、輸出入貨物を検査することができる。","answer":true,"explanation":"関税法第67条・第105条等により、税関職員は貨物の検査権限を有する。"},{"id":190,"category":"関税法","subcategory":"税関職員の権限","year":"R5","difficulty":"応用","type":"yn","question":"税関職員は、輸入禁止物品の疑いがある場合、令状なしに輸送手段内を捜索することができる。","answer":false,"explanation":"税関職員の行政調査権（検査権）と刑事手続きの捜索は別物。刑事手続きとしての捜索には原則として裁判所の令状が必要。"},{"id":191,"category":"関税法","subcategory":"税関職員の権限","year":"R4","difficulty":"難問","type":"yn","question":"税関職員が収税官吏として関税犯則事件を調査する場合は、司法警察員としての権限を持つ。","answer":false,"explanation":"税関職員は関税犯則調査において収税官吏として行政調査権を行使するが、一般的な司法警察員とは異なる。ただし関税法上の犯則調査権（臨検・差押等）は持つ。"},{"id":192,"category":"関税法","subcategory":"犯則調査","year":"R5","difficulty":"基本","type":"yn","question":"税関職員は、関税犯則事件の調査のために、関係人の住所又は居所を臨検することができる場合がある。","answer":true,"explanation":"関税法第121条等により、税関職員は犯則調査のため、裁判官の許可状を得て臨検・捜索・差押えを行うことができる。"},{"id":193,"category":"関税法","subcategory":"犯則調査","year":"R4","difficulty":"応用","type":"yn","question":"税関長は、関税犯則事件について調査した結果、犯則があると思料するときは、検察官に告発しなければならない。","answer":true,"explanation":"関税法第132条により、犯則調査の結果犯則があると認める場合は検察官への告発が義務付けられている。"},{"id":194,"category":"関税法","subcategory":"原産地規則","year":"R5","difficulty":"基本","type":"yn","question":"EPA（経済連携協定）に基づく特恵税率を適用するためには、輸入貨物が当該協定の相手国を原産地とするものであることを証明する必要がある。","answer":true,"explanation":"EPA特恵税率の適用には原産地証明書（またはインボイス申告）による原産地確認が必要。これが原産地規則の核心。"},{"id":195,"category":"関税法","subcategory":"原産地規則","year":"R4","difficulty":"応用","type":"yn","question":"完全生産品とは、一の国において完全に生産または製造された産品であり、その国を原産地とみなされる。","answer":true,"explanation":"原産地規則における「完全生産品」は、一国内で完結して生産された産品（農産物・鉱物資源・動物等）であり、その国を原産地とする代表的な概念。"},{"id":196,"category":"関税法","subcategory":"原産地規則","year":"R3","difficulty":"難問","type":"yn","question":"実質的変更基準において、税番変更基準とは生産工程において原料の関税率表番号が変化することを要求するものである。","answer":true,"explanation":"実質的変更基準の一つである税番変更基準（CTH等）は、生産工程を経ることで使用原材料のHSコードが変化することを原産地認定の要件とする。"},{"id":197,"category":"関税法","subcategory":"FTA・EPA","year":"R5","difficulty":"基本","type":"yn","question":"日本がEPAを締結している国からの輸入品については、EPAに基づく関税率（協定税率）が適用される場合がある。","answer":true,"explanation":"EPA締結国との間ではEPA税率が設定され、一般税率よりも低い関税率が適用されることが多い。"},{"id":198,"category":"関税法","subcategory":"FTA・EPA","year":"R4","difficulty":"応用","type":"yn","question":"EPA特恵税率を適用するには、輸入者は通関申告の際に原産地証明書等を提出しなければならない。","answer":true,"explanation":"EPA税率の適用を受けるためには、原産地証明書（第三者証明）またはインボイス申告（自己申告）を通関時に提出・提示する必要がある。"},{"id":199,"category":"関税法","subcategory":"FTA・EPA","year":"R3","difficulty":"難問","type":"yn","question":"日本のEPAにおける自己申告制度では、輸出者のみが原産品申告を行うことができる。","answer":false,"explanation":"日本のEPAにおける自己申告制度では、輸出者だけでなく生産者・輸入者も一定の条件のもとで原産品申告を行うことができる協定がある（TPP11等）。"},{"id":200,"category":"通関業法","subcategory":"総合","year":"R5","difficulty":"応用","type":"yn","question":"通関業者は、通関業務の依頼を受けた場合、依頼人に対して業務の内容及び料金について書面で説明する義務がある。","answer":false,"explanation":"通関業法上、書面による説明義務は必ずしも明示的に規定されていない。料金の公示義務（第18条）はあるが、個別案件ごとの書面説明義務とは異なる。"},{"id":201,"category":"関税法","subcategory":"輸入申告","year":"R2","difficulty":"応用","type":"yn","question":"輸入申告は、原則として輸入しようとする貨物を保税地域に入れた後に行うが、税関長が認めた場合には保税地域に入れる前に申告することができる。","answer":true,"explanation":"関税法第67条の2により、税関長が認めた場合は保税地域搬入前の申告（いわゆる「到着前申告」）が認められる。"},{"id":202,"category":"関税法","subcategory":"輸入申告","year":"H30","difficulty":"基本","type":"yn","question":"輸入申告書に記載すべき事項のうち、貨物の原産地は必ず記載しなければならない。","answer":false,"explanation":"輸入申告書の必須記載事項は品名・数量・価格等であり、原産地はすべての貨物について必須とはされていない（EPA適用等の場合は必要）。"},{"id":203,"category":"関税法","subcategory":"輸入申告","year":"R1","difficulty":"難問","type":"yn","question":"一の輸入申告書に複数の品目を記載することができる。","answer":true,"explanation":"実務上、一の申告書（インボイス）に複数品目を記載して申告することは認められており、品目ごとに税番・税率を記載する。"},{"id":204,"category":"関税法","subcategory":"課税物件の確定","year":"H30","difficulty":"応用","type":"yn","question":"輸入申告前に保税地域から許可なく引き取られた貨物に係る関税の課税物件確定の時期は、当該貨物が引き取られた時である。","answer":true,"explanation":"関税法第4条第1項第2号により、無許可引取りの場合の課税物件確定時期は引取りの時とされている。"},{"id":205,"category":"関税法","subcategory":"課税標準","year":"R3","difficulty":"基本","type":"yn","question":"従量税が適用される貨物の課税標準は、貨物の数量（重量・容積等）である。","answer":true,"explanation":"従量税とは税率が単位数量あたりの金額で定められるものであり、課税標準は価格ではなく数量・重量等となる。"},{"id":206,"category":"関税法","subcategory":"課税標準","year":"R4","difficulty":"応用","type":"yn","question":"従価税と従量税の両方が定められている場合（選択税）、輸入者はいずれかを選択して申告することができる。","answer":false,"explanation":"選択税では税関長が有利な方（通常は税額の高い方）を適用するのではなく、規定に従って適用税を決定する。輸入者が自由に選択できるわけではない。"},{"id":207,"category":"関税法","subcategory":"関税の徴収","year":"R5","difficulty":"基本","type":"yn","question":"関税の徴収は、国税徴収法の規定に準じて行われる。","answer":true,"explanation":"関税法第12条の8により、関税の滞納処分については国税徴収法の規定が準用される。"},{"id":208,"category":"関税法","subcategory":"関税の徴収","year":"R2","difficulty":"応用","type":"yn","question":"関税を滞納した場合に課される延滞税の計算の基礎となる期間に算入されない期間がある。","answer":true,"explanation":"延滞税の計算において、災害等による申請・換価の猶予期間や、延納・分割納付が認められた期間等は計算期間から除外される場合がある。"},{"id":209,"category":"関税法","subcategory":"保税地域","year":"H30","difficulty":"基本","type":"yn","question":"指定保税地域は、税関長が一定の施設を指定することにより設置される保税地域である。","answer":false,"explanation":"指定保税地域を指定するのは財務大臣であり、税関長ではない（関税法第37条）。"},{"id":210,"category":"関税法","subcategory":"保税地域","year":"R1","difficulty":"応用","type":"yn","question":"保税蔵置場の許可を受けた者は、その許可の範囲内において外国貨物を管理する義務を負う。","answer":true,"explanation":"保税蔵置場の被許可者は外国貨物の適正な管理義務を負い、亡失等の場合は関税の納税義務を負う。"},{"id":211,"category":"関税法","subcategory":"保税地域","year":"R3","difficulty":"難問","type":"yn","question":"保税工場において製造された製品が内国貨物である原料のみから製造された場合でも、その製品は外国貨物として取り扱われる。","answer":false,"explanation":"保税工場で製造された製品のうち、内国貨物のみを原料とするものは内国貨物として扱われる。外国貨物が含まれている場合に外国貨物となる。"},{"id":212,"category":"関税法","subcategory":"保税運送","year":"R4","difficulty":"基本","type":"yn","question":"保税運送の承認を受けた外国貨物の運送期間は、税関長が指定する。","answer":true,"explanation":"関税法第63条により、保税運送の承認に際して税関長が運送期間を指定する。"},{"id":213,"category":"関税法","subcategory":"保税運送","year":"R2","difficulty":"応用","type":"yn","question":"内国貨物を保税運送することは認められていない。","answer":false,"explanation":"保税運送の制度は外国貨物を対象とするものだが、内国貨物の運送は一般の運送として行われる。内国貨物が「保税運送できない」というより「保税運送制度の対象外」である。"},{"id":214,"category":"関税法","subcategory":"AEO制度","year":"R1","difficulty":"基本","type":"yn","question":"AEO（Authorized Economic Operator）制度は、WCO（世界税関機構）が推進する国際的な制度である。","answer":true,"explanation":"AEO制度はWCOが2005年に採択したSAFEフレームワークに基づく国際的な貿易円滑化・安全確保制度であり、各国が導入している。"},{"id":215,"category":"関税法","subcategory":"AEO制度","year":"R3","difficulty":"応用","type":"yn","question":"認定輸出者の認定を受けた者は、輸出申告を輸出港以外の税関に対して行うことができる。","answer":true,"explanation":"認定輸出者（AEO輸出者）は内陸地の税関での輸出申告（自社工場等）が認められる等、通関上の優遇措置が与えられる。"},{"id":216,"category":"関税法","subcategory":"輸出申告","year":"H30","difficulty":"基本","type":"yn","question":"輸出申告をする場合、輸出しようとする貨物の価格が20万円以下であっても、申告書の提出が必要である。","answer":true,"explanation":"輸出については少額免税制度（輸入の20万円以下免税に相当するもの）はなく、金額にかかわらず輸出申告が必要。"},{"id":217,"category":"関税法","subcategory":"輸出申告","year":"R2","difficulty":"応用","type":"yn","question":"船積みが完了した後であっても、輸出許可前であれば輸出申告の取下げが可能である。","answer":true,"explanation":"輸出許可前であれば申告の取下げは可能。許可後の取下げは認められない。"},{"id":218,"category":"関税法","subcategory":"輸出申告","year":"R4","difficulty":"難問","type":"yn","question":"輸出申告の価格（FOB価格）が20万円以下の貨物については、簡易な申告手続きが認められる場合がある。","answer":true,"explanation":"少額輸出貨物については、一定の条件のもとで簡易な申告様式・手続きが認められている（関税法施行規則）。"},{"id":219,"category":"関税法","subcategory":"関税の確定方式","year":"R5","difficulty":"基本","type":"yn","question":"申告納税方式とは、納税者が自ら税額を計算して申告・納付する方式である。","answer":true,"explanation":"申告納税方式では納税者が自ら税額を計算・申告し、その申告に基づいて税額が確定する（関税法第6条の2）。"},{"id":220,"category":"関税法","subcategory":"関税の確定方式","year":"R3","difficulty":"応用","type":"yn","question":"賦課課税方式においては、税関長が税額を決定し、その通知を受けた者が納付する。","answer":true,"explanation":"賦課課税方式では、税関長が税額を決定（賦課決定）し、その通知に基づき納税者が納付する（関税法第6条の2第2項）。"},{"id":221,"category":"関税法","subcategory":"不服申立て","year":"H30","difficulty":"基本","type":"yn","question":"税関長の処分に不服がある者は、処分を知った日の翌日から3ヶ月以内に再調査の請求をすることができる。","answer":true,"explanation":"関税法第89条により、再調査の請求期間は処分を知った日の翌日から3ヶ月以内とされている。"},{"id":222,"category":"関税法","subcategory":"不服申立て","year":"R2","difficulty":"応用","type":"yn","question":"財務大臣への審査請求は、再調査の請求の決定があった日の翌日から起算して1ヶ月以内に行わなければならない。","answer":false,"explanation":"審査請求の期間は再調査請求決定の翌日から1ヶ月ではなく、関税法・行政不服申立法の規定による（通常6ヶ月・1年等）。1ヶ月は短すぎる。"},{"id":223,"category":"関税法","subcategory":"不服申立て","year":"R4","difficulty":"難問","type":"yn","question":"税関長の処分に対して再調査の請求をせずに、直接財務大臣に審査請求をすることができる。","answer":true,"explanation":"行政不服申立法の自由選択主義により、再調査請求を経ずに直接上位機関への審査請求が可能。"},{"id":224,"category":"関税法","subcategory":"罰則","year":"R1","difficulty":"基本","type":"yn","question":"関税を免れる目的で虚偽の申告をした場合、懲役刑が科されることがある。","answer":true,"explanation":"関税法第110条により、不正免脱行為には10年以下の懲役または1000万円以下の罰金（併科あり）が規定されている。"},{"id":225,"category":"関税法","subcategory":"罰則","year":"R3","difficulty":"応用","type":"yn","question":"関税法における「没取」とは、犯罪に関係した物品の所有権を国に移転させる処分である。","answer":true,"explanation":"没収（没取）は犯罪に関係した物品の所有権を強制的に国庫に帰属させる刑事罰の一種。"},{"id":226,"category":"関税法","subcategory":"罰則","year":"R5","difficulty":"難問","type":"yn","question":"輸入禁制品を輸入した者が法人の従業員である場合、その法人も処罰されることがある。","answer":true,"explanation":"関税法第117条の両罰規定により、違反行為をした従業員が属する法人に対しても罰金刑が科される場合がある。"},{"id":227,"category":"関税法","subcategory":"知的財産侵害物品","year":"H30","difficulty":"基本","type":"yn","question":"著作権を侵害する貨物は、関税法上の輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第9号により、著作権・著作隣接権を侵害する物品は輸入禁制品として規定されている。"},{"id":228,"category":"関税法","subcategory":"知的財産侵害物品","year":"R2","difficulty":"応用","type":"yn","question":"不正競争防止法に規定する営業秘密を侵害する物品も、関税法上の輸入禁制品に該当する場合がある。","answer":true,"explanation":"関税法第69条の11第1項第10号により、不正競争防止法違反に係る一定の物品も輸入禁制品とされる。"},{"id":229,"category":"関税法","subcategory":"輸入禁制品","year":"R1","difficulty":"基本","type":"yn","question":"爆発物は関税法上の輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第1号により、爆発物は輸入が禁止されている。"},{"id":230,"category":"関税法","subcategory":"輸入禁制品","year":"R4","difficulty":"応用","type":"yn","question":"国家機密を侵害する文書や公安を害する図書は輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第7号により、公安・風俗を害する図書・図画等は輸入禁制品とされる。"},{"id":231,"category":"関税法","subcategory":"旅具通関","year":"H30","difficulty":"基本","type":"yn","question":"入国者が携帯して輸入する物品の免税範囲は、1品目につき海外市価の合計額が20万円以下である。","answer":false,"explanation":"旅行者携帯品の免税範囲は品目ごとではなく総額で判断され、また海外市価20万円という数字も正確ではない（正しくは免税範囲の合計額等で判定）。"},{"id":232,"category":"関税法","subcategory":"旅具通関","year":"R2","difficulty":"応用","type":"yn","question":"別送品として輸入する場合には、入国時に携帯品・別送品申告書を税関に提出し、その確認を受ける必要がある。","answer":true,"explanation":"別送品の免税扱いを受けるためには、入国時に携帯品・別送品申告書を提出して税関の確認（スタンプ）を受けることが必要。"},{"id":233,"category":"通関業法","subcategory":"通関業の許可","year":"H30","difficulty":"基本","type":"yn","question":"通関業の許可は、申請者の本店所在地を管轄する税関長が行う。","answer":false,"explanation":"通関業の許可権者は財務大臣であり、税関長ではない（通関業法第3条）。"},{"id":234,"category":"通関業法","subcategory":"通関業の許可","year":"R1","difficulty":"応用","type":"yn","question":"通関業の許可を受けた者は、許可証の交付を受け、これを営業所に掲示しなければならない。","answer":false,"explanation":"通関業法には許可証の掲示を義務付ける明示的規定はない。料金の公示（第18条）は義務だが許可証掲示とは別。"},{"id":235,"category":"通関業法","subcategory":"欠格事由","year":"R3","difficulty":"基本","type":"yn","question":"成年被後見人は通関業の許可を受けることができない。","answer":true,"explanation":"通関業法第6条第1号により、成年被後見人は通関業の欠格事由に該当し、許可を受けることができない。"},{"id":236,"category":"通関業法","subcategory":"欠格事由","year":"R5","difficulty":"応用","type":"yn","question":"通関業法の規定に違反したことにより罰金刑を受けた場合、その刑の執行が終わった日から2年間は許可を受けることができない。","answer":false,"explanation":"通関業法第6条により、通関業法違反による罰金刑の場合の欠格期間は執行終了から3年。2年ではない。"},{"id":237,"category":"通関業法","subcategory":"通関士","year":"H30","difficulty":"基本","type":"yn","question":"通関士は、通関業者から独立した立場で通関業務を行うことができる。","answer":false,"explanation":"通関士は通関業者の従業員として、その通関業者のために業務を行う。通関業者から独立して独自に通関業務を行うことはできない。"},{"id":238,"category":"通関業法","subcategory":"通関士","year":"R2","difficulty":"応用","type":"yn","question":"通関士の確認申請は、通関業者が財務大臣に対して行う。","answer":true,"explanation":"通関業法第24条により、通関士確認の申請は通関士本人ではなく、その通関士を使用する通関業者が財務大臣に対して行う。"},{"id":239,"category":"通関業法","subcategory":"通関士","year":"R4","difficulty":"難問","type":"yn","question":"通関士が他の通関業者に転職した場合、改めて財務大臣の確認を受ける必要がある。","answer":true,"explanation":"通関士の確認は特定の通関業者との関係で行われるため、転職先の通関業者において改めて確認申請が必要となる。"},{"id":240,"category":"通関業法","subcategory":"通関業務","year":"R1","difficulty":"基本","type":"yn","question":"通関業者は、通関業務のほか、輸出入貨物の保管業務も当然に行うことができる。","answer":false,"explanation":"保管業務は通関業務の附帯業務として明示されていない。通関業者が保管業も行う場合は別途倉庫業法等の許可が必要。"},{"id":241,"category":"通関業法","subcategory":"通関業務","year":"R3","difficulty":"応用","type":"yn","question":"通関業者は、依頼人の委任を受けて、税関に係属する審査請求の手続きを代理することができる。","answer":true,"explanation":"通関業法第2条第1項第2号により、税関に対する不服申立て手続きの代理も通関業務に含まれる。"},{"id":242,"category":"通関業法","subcategory":"帳簿・書類","year":"R5","difficulty":"基本","type":"yn","question":"通関業者は、通関業務に関する帳簿を備え、財務省令で定めるところにより、これを保存しなければならない。","answer":true,"explanation":"通関業法第20条により、通関業者には帳簿の備付け・保存義務がある。"},{"id":243,"category":"通関業法","subcategory":"帳簿・書類","year":"R4","difficulty":"応用","type":"yn","question":"通関業者の帳簿は、税関職員からの閲覧請求があった場合にはこれを拒否できない。","answer":true,"explanation":"通関業法上、税関の監督権限に基づく帳簿閲覧等の要求に対して通関業者は協力義務を負う。"},{"id":244,"category":"通関業法","subcategory":"罰則","year":"R3","difficulty":"基本","type":"yn","question":"通関業者の役員が通関業法の規定に違反した場合、当該法人にも罰金刑が科される場合がある。","answer":true,"explanation":"通関業法第45条の両罰規定により、役員等の違反行為について法人にも罰金刑が科される場合がある。"},{"id":245,"category":"通関業法","subcategory":"罰則","year":"R5","difficulty":"応用","type":"yn","question":"通関業の許可を受けずに通関業を営んだ者は、処罰される。","answer":true,"explanation":"通関業法第40条により、無許可で通関業を営んだ者には罰則（1年以下の懲役または100万円以下の罰金）が規定されている。"},{"id":246,"category":"外国為替及び外国貿易法","subcategory":"外為法の基本","year":"H30","difficulty":"基本","type":"yn","question":"外為法における「非居住者」とは、居住者以外の個人及び法人をいう。","answer":true,"explanation":"外為法第6条第1項第6号により、非居住者は居住者以外の自然人・法人等と定義される。居住者・非居住者の区分は外為法規制の基本概念。"},{"id":247,"category":"外国為替及び外国貿易法","subcategory":"外為法の基本","year":"R2","difficulty":"応用","type":"yn","question":"日本国籍を有する者であっても、外国に永住する者は非居住者として扱われる場合がある。","answer":true,"explanation":"居住者・非居住者の判定は国籍ではなく住所・居所等の実態に基づく。外国に永住する日本国籍者は非居住者に該当する場合がある。"},{"id":248,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R1","difficulty":"基本","type":"yn","question":"輸出貿易管理令は、外国為替及び外国貿易法に基づいて制定されている。","answer":true,"explanation":"輸出貿易管理令（輸出令）は外為法第48条等に基づき制定された政令であり、輸出規制の具体的品目・地域・手続きを規定する。"},{"id":249,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R4","difficulty":"応用","type":"yn","question":"軍事転用可能な汎用品（デュアルユース品）の輸出には、輸出先や用途によって許可が必要となる場合がある。","answer":true,"explanation":"デュアルユース品（民生・軍事両用品）については、リスト規制やキャッチオール規制により、特定の仕向国・用途への輸出に許可が必要となる。"},{"id":250,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R3","difficulty":"難問","type":"yn","question":"経済産業大臣が定めるホワイト国（グループA）は、大量破壊兵器等の不拡散に向けた国際的な取り組みに参加している国々である。","answer":true,"explanation":"ホワイト国（現グループA）はWassenaar Arrangement等の輸出管理レジームに参加し、安全保障上信頼できる国として輸出規制が緩和されている。"},{"id":251,"category":"外国為替及び外国貿易法","subcategory":"制裁","year":"R5","difficulty":"基本","type":"yn","question":"国連安全保障理事会決議に基づく資産凍結措置は、外為法に基づいて実施される。","answer":true,"explanation":"国連安保理決議による資産凍結等の制裁措置は、外為法第16条・第21条等に基づく告示・省令により国内で実施される。"},{"id":252,"category":"外国為替及び外国貿易法","subcategory":"制裁","year":"R4","difficulty":"応用","type":"yn","question":"特定の国または個人・団体に対する制裁措置として、輸出入禁止だけでなく金融取引の禁止が行われることもある。","answer":true,"explanation":"外為法に基づく制裁措置には輸出入規制に加え、資産凍結・送金禁止等の金融措置も含まれ、総合的な制裁が実施される。"},{"id":253,"category":"関税評価","subcategory":"課税価格の決定原則","year":"R5","difficulty":"基本","type":"yn","question":"課税価格の決定に関する方法は、第1方法から第6方法まで順番に適用が検討され、前の方法で決定できない場合に次の方法が用いられる。","answer":true,"explanation":"関税定率法第4条〜第4条の8の規定により、課税価格の決定方法は第1方法（取引価格）を優先し、順次適用できる方法を検討する。"},{"id":254,"category":"関税評価","subcategory":"課税価格の決定原則","year":"R4","difficulty":"応用","type":"yn","question":"輸入者の申請があれば、第4方法（国内販売価格方式）と第5方法（計算価格方式）の適用順序を入れ替えることができる。","answer":true,"explanation":"関税定率法第4条の4ただし書きにより、輸入者の申請があれば第4方法と第5方法の適用順序を逆にすることが認められている。"},{"id":255,"category":"関税評価","subcategory":"課税価格の決定原則","year":"R3","difficulty":"難問","type":"yn","question":"第6方法（合理的な方法）は、前の5方法のいずれも適用できない場合の最後の手段として用いられる。","answer":true,"explanation":"第6方法（関税定率法第4条の8）は、第1〜第5方法のいずれも適用できない場合に、合理的な方法に基づいて課税価格を決定する最後の手段。"},{"id":256,"category":"関税評価","subcategory":"加算要素","year":"R5","difficulty":"基本","type":"yn","question":"輸入取引において買手が負担した輸入港までの運賃は、取引価格に含まれていなければ課税価格に加算される。","answer":true,"explanation":"関税定率法第4条第1項第4号により、輸入港到着までの運賃・保険料等が取引価格に含まれていない場合は加算が必要（CIF価格主義）。"},{"id":257,"category":"関税評価","subcategory":"加算要素","year":"R4","difficulty":"応用","type":"yn","question":"売手が買手から受け取るロイヤリティは、その支払いが輸入貨物の取引の条件となっている場合、課税価格に加算される。","answer":true,"explanation":"関税定率法第4条第1項第3号により、輸入貨物に関するロイヤリティ・ライセンス料が取引条件となっている場合は課税価格に加算される。"},{"id":258,"category":"関税評価","subcategory":"加算要素","year":"R3","difficulty":"難問","type":"yn","question":"輸入後に支払われるリベートが将来の取引に関するものである場合でも、輸入取引の課税価格に影響を与える。","answer":false,"explanation":"課税価格は個々の輸入取引時点の価格に基づく。将来の取引に関するリベートはその時点の輸入取引の課税価格には原則として影響しない。"},{"id":259,"category":"関税率表","subcategory":"HS条約","year":"R5","difficulty":"基本","type":"yn","question":"HS条約（商品の名称及び符号の統一システムに関する国際条約）は、WCO（世界税関機構）が管理している。","answer":true,"explanation":"HS条約はWCOが管理する国際条約であり、現在200以上の国・地域が採用している国際的な商品分類システム。"},{"id":260,"category":"関税率表","subcategory":"HS条約","year":"R4","difficulty":"応用","type":"yn","question":"HSコードは6桁で構成され、最初の2桁が「類」、次の2桁が「項」、最後の2桁が「号」を表す。","answer":true,"explanation":"HSコードの構造：類（Chapter、2桁）＋項（Heading、4桁目まで）＋号（Subheading、6桁目まで）の計6桁。日本では独自細分を加え9桁（統計番号は10桁）。"},{"id":261,"category":"関税率表","subcategory":"HS条約","year":"R3","difficulty":"難問","type":"yn","question":"HSコードの改訂は、おおむね5年ごとに行われる。","answer":true,"explanation":"HS条約の改訂（HS改正）はWCOにより概ね5〜6年ごとに行われており、直近では2022年1月にHS2022が発効した。"},{"id":262,"category":"関税率表","subcategory":"分類の通則","year":"R5","difficulty":"基本","type":"yn","question":"関税率表の解釈に関する通則は6つあり、通則1から順に適用される。","answer":true,"explanation":"通則1〜6が設けられており、原則として通則1（号の規定と部・類の注）から順に確認し、複数号に分類できる場合に通則2以降を適用する。"},{"id":263,"category":"関税率表","subcategory":"分類の通則","year":"R4","difficulty":"応用","type":"yn","question":"通則6は、号の規定および号に関する注の規定によって分類を決定するためのものである。","answer":true,"explanation":"通則6は、4桁の項が決定した後に6桁の号レベルで分類を決定するための規定であり、同一項内の号間の分類に通則1〜5を準用する。"},{"id":264,"category":"関税率表","subcategory":"重要な類","year":"R3","difficulty":"基本","type":"yn","question":"生きている動物は、関税率表第1類に分類される。","answer":true,"explanation":"関税率表第1類「生きている動物」として、牛・馬・豚・家きん等の生体動物が分類される。"},{"id":265,"category":"関税率表","subcategory":"重要な類","year":"R5","difficulty":"応用","type":"yn","question":"電気機器は、一般に関税率表第85類に分類される。","answer":true,"explanation":"第85類「電気機器及びその部分品並びに録音機・音声再生機・テレビジョン映像・音声記録機・再生機並びにその部分品及び附属品」として電気機器全般が分類される。"},{"id":266,"category":"関税率表","subcategory":"重要な類","year":"R4","difficulty":"難問","type":"yn","question":"自動車は関税率表第87類に分類されるが、電気自動車も同じく第87類に分類される。","answer":true,"explanation":"第87類「鉄道用・軌道用以外の車両及びその部分品並びに附属品」には、電気自動車を含む自動車全般が分類される。"},{"id":267,"category":"関税法","subcategory":"税関手続の電子化","year":"R5","difficulty":"基本","type":"yn","question":"NACCSとは、税関との輸出入・港湾関連手続きを電子的に処理するシステムの名称である。","answer":true,"explanation":"NACCS（輸出入・港湾関連情報処理システム）は、税関手続を電子化・効率化するためのシステムで、現在の輸出入通関のほぼすべてがNACCS経由で行われる。"},{"id":268,"category":"関税法","subcategory":"税関手続の電子化","year":"R4","difficulty":"応用","type":"yn","question":"NACCS（輸出入・港湾関連情報処理システム）は、通関手続きのみならず港湾関連業務にも使用される。","answer":true,"explanation":"NACCSは税関通関だけでなく、船会社・航空会社・港湾・空港管理者等の港湾・空港関連業務も統合した総合システム。"},{"id":269,"category":"関税法","subcategory":"税関手続の電子化","year":"R3","difficulty":"難問","type":"yn","question":"電子申告において、申告書への押印は電子署名によって代替される。","answer":true,"explanation":"電子申告においては紙の申告書への押印に代えて電子署名・認証が利用される。NACCSでの電子通関も同様の仕組み。"},{"id":270,"category":"関税法","subcategory":"関税調査","year":"R5","difficulty":"基本","type":"yn","question":"税関は、輸入者の帳簿・書類を調査し、申告内容の正確性を事後的に確認することができる。","answer":true,"explanation":"関税法第105条等により、税関は事後調査（コンプライアンス調査）として輸入者の帳簿・書類等を調査する権限を持つ。"},{"id":271,"category":"関税法","subcategory":"関税調査","year":"R4","difficulty":"応用","type":"yn","question":"税関の事後調査において、調査対象者は帳簿・書類の提示を拒否することができない。","answer":true,"explanation":"関税法の規定に基づく税関調査への協力は義務であり、正当な理由なく拒否することは認められない（罰則規定あり）。"},{"id":272,"category":"関税法","subcategory":"関税調査","year":"R3","difficulty":"難問","type":"yn","question":"事後調査の結果、関税の過少申告が判明した場合、修正申告を行う前に過少申告加算税の税率が確定する。","answer":false,"explanation":"修正申告を行った後にその内容に基づいて過少申告加算税が確定する。調査前の自発的修正か調査後かで加算税率が異なる。"},{"id":273,"category":"通関業法","subcategory":"通関業の監督","year":"H30","difficulty":"基本","type":"yn","question":"財務大臣は、通関業者に対し、業務の状況に関して報告を求めることができる。","answer":true,"explanation":"通関業法第32条により、財務大臣は通関業者に対して業務報告を求める権限を持つ。"},{"id":274,"category":"通関業法","subcategory":"通関業の監督","year":"R2","difficulty":"応用","type":"yn","question":"税関職員は、通関業者の営業所に立ち入り、業務状況を検査することができる。","answer":true,"explanation":"通関業法第33条により、税関職員は通関業者の営業所等への立入検査権限を有する。"},{"id":275,"category":"通関業法","subcategory":"通関業の監督","year":"R4","difficulty":"難問","type":"yn","question":"財務大臣が通関業の許可を取り消す場合、聴聞手続きを経ることが行政手続法上必要となる。","answer":true,"explanation":"行政手続法第13条により、不利益処分のうち許可の取消しには聴聞手続きが必要。通関業許可の取消しも同様。"},{"id":276,"category":"通関業法","subcategory":"通関業者の義務","year":"R5","difficulty":"基本","type":"yn","question":"通関業者は、依頼人から正当な理由なく通関業務の依頼を断ることを禁じられている。","answer":true,"explanation":"通関業法第17条の引受義務（不当拒絶の禁止）により、通関業者は正当な理由なく業務依頼を断れない。"},{"id":277,"category":"通関業法","subcategory":"通関業者の義務","year":"R3","difficulty":"応用","type":"yn","question":"通関業者が依頼を受けた業務の一部を他の通関業者に委託（再委託）することは、依頼人の承諾がなければ原則として認められない。","answer":true,"explanation":"委任契約の一般原則及び通関業法の趣旨から、依頼人の承諾なく再委託することは原則認められない。"},{"id":278,"category":"通関業法","subcategory":"通関業者の義務","year":"R4","difficulty":"難問","type":"yn","question":"通関業者は、依頼人が関税法に違反することが明らかな場合でも、依頼を受けた業務を遂行しなければならない。","answer":false,"explanation":"通関業者には誠実義務があり、依頼人の違法行為に加担することは認められない。違法行為が明らかな場合は依頼を断ることが正当な理由となる。"},{"id":279,"category":"外国為替及び外国貿易法","subcategory":"対外直接投資","year":"R5","difficulty":"基本","type":"yn","question":"居住者が外国法人に対して出資を行う場合、外為法に基づく届出が必要となる場合がある。","answer":true,"explanation":"外為法第23条等により、居住者による対外直接投資（外国法人への一定以上の出資等）については事前届出等が必要な場合がある。"},{"id":280,"category":"外国為替及び外国貿易法","subcategory":"対外直接投資","year":"R4","difficulty":"応用","type":"yn","question":"日本企業が外国企業の株式を取得する場合、取得比率によって外為法上の手続き要件が異なる。","answer":true,"explanation":"外為法に基づく対外直接投資の届出要件は、出資比率（10%以上等）・投資先の業種・金額等によって異なる。"},{"id":281,"category":"関税法","subcategory":"EPA・FTA","year":"R5","difficulty":"基本","type":"yn","question":"日本はTPP11（CPTPP）を締結しており、締約国からの輸入品に対してEPA税率が適用される。","answer":true,"explanation":"TPP11（環太平洋パートナーシップに関する包括的及び先進的な協定）では締約国間でEPA税率が適用され、多くの品目で関税が撤廃・削減される。"},{"id":282,"category":"関税法","subcategory":"EPA・FTA","year":"R4","difficulty":"応用","type":"yn","question":"日EU・EPAに基づく特恵税率を受けるためには、輸入者はEU原産の産品であることを証明する必要がある。","answer":true,"explanation":"日EU・EPAでは原産地証明が必要であり、認定輸出者による原産地申告またはインボイス申告によって原産性を証明する。"},{"id":283,"category":"関税法","subcategory":"EPA・FTA","year":"R3","difficulty":"難問","type":"yn","question":"原産地証明書は、輸出国の税関が発給するものに限られる。","answer":false,"explanation":"原産地証明書の発給機関は協定によって異なり、輸出国の税関が発給する場合もあれば、商工会議所等の公的機関が発給する場合や、輸出者・生産者が自己申告する場合もある。"},{"id":284,"category":"関税法","subcategory":"課税価格の端数処理","year":"R5","difficulty":"基本","type":"yn","question":"課税価格に1,000円未満の端数があるときは、その端数を切り捨てる。","answer":true,"explanation":"関税法第11条（国税通則法準用）により、課税標準となる価格の1,000円未満の端数は切り捨てる。"},{"id":285,"category":"関税法","subcategory":"課税価格の端数処理","year":"R4","difficulty":"応用","type":"yn","question":"関税額に100円未満の端数があるときは、その端数を切り捨てる。","answer":true,"explanation":"国税通則法の規定により、確定した税額の100円未満の端数は切り捨てる。"},{"id":286,"category":"関税法","subcategory":"外国為替相場","year":"R5","difficulty":"基本","type":"yn","question":"外貨建てで表示された輸入貨物の課税価格は、税関長が定める為替レートにより邦貨に換算される。","answer":true,"explanation":"関税定率法第4条の7により、外貨建て価格を邦貨換算する際には税関長が定める外国為替相場が用いられる（毎週月曜日公示の週間レート）。"},{"id":287,"category":"関税法","subcategory":"外国為替相場","year":"R4","difficulty":"応用","type":"yn","question":"税関長が定める外国為替相場は、毎月第1月曜日に公示される。","answer":false,"explanation":"外国為替相場は毎週月曜日（週単位）に公示される。毎月第1月曜日というのは誤り。"},{"id":288,"category":"関税法","subcategory":"輸入貨物の確認","year":"R3","difficulty":"基本","type":"yn","question":"税関は、輸入申告された貨物のすべてについて現物検査を行う。","answer":false,"explanation":"税関検査はリスク分析に基づく選択的検査（抜き取り検査）が原則であり、すべての貨物を現物検査するわけではない。"},{"id":289,"category":"関税法","subcategory":"輸入貨物の確認","year":"R5","difficulty":"応用","type":"yn","question":"輸入貨物の検査において、税関職員は貨物の開被を命じることができる。","answer":true,"explanation":"関税法第67条により、税関の検査に際して申告者等に対して貨物の開梱・開被を命じることができる。"},{"id":290,"category":"関税法","subcategory":"輸入貨物の確認","year":"R4","difficulty":"難問","type":"yn","question":"輸入申告に際して提出した仕入書の記載内容と実際の貨物が異なる場合、関税法上の虚偽申告となる可能性がある。","answer":true,"explanation":"仕入書と実貨物の相違は申告内容の虚偽・誤りとなり、関税法上の違反（過少申告加算税・罰則の対象）となる可能性がある。"},{"id":291,"category":"通関業法","subcategory":"総合問題","year":"R5","difficulty":"応用","type":"yn","question":"通関業者は、その通関業務の処理状況について、依頼人から照会を受けた場合には、速やかに回答しなければならない。","answer":true,"explanation":"通関業者には依頼人への誠実な対応義務があり、業務状況の照会に対して適切に回答することが求められる。"},{"id":292,"category":"通関業法","subcategory":"総合問題","year":"R4","difficulty":"難問","type":"yn","question":"通関業者は、通関業務に関して取得した依頼人の個人情報を、本人の同意なく第三者に提供することは原則として禁止される。","answer":true,"explanation":"個人情報保護法の規定および通関業法の守秘義務規定により、依頼人の個人情報は本人同意なく第三者提供が原則禁止される。"},{"id":293,"category":"関税法","subcategory":"総合問題","year":"R5","difficulty":"応用","type":"yn","question":"輸入者が通関業者に輸入申告を委託した場合でも、関税の納税義務は輸入者（荷受人）が負う。","answer":true,"explanation":"通関業者は申告手続きを代行するが、関税の納税義務者はあくまで輸入者（貨物を輸入する者）である。代理申告と納税義務は別の問題。"},{"id":294,"category":"関税法","subcategory":"総合問題","year":"R4","difficulty":"難問","type":"yn","question":"輸入許可後に当該貨物が国内で第三者に転売された場合でも、関税の徴収は当初の輸入者に対して行われる。","answer":true,"exp
