lanation":"関税の納税義務は輸入時点で輸入者に確定するため、その後に貨物が転売されても関税の請求先は当初の輸入者となる。"},{"id":295,"category":"外国為替及び外国貿易法","subcategory":"総合問題","year":"R5","difficulty":"応用","type":"yn","question":"外為法違反の輸出が疑われる場合、税関は経済産業省と連携して調査を行うことがある。","answer":true,"explanation":"外為法の主管省は経済産業省（輸出入規制部分）であり、税関と経産省は情報共有・合同調査等の連携体制を整備している。"},{"id":296,"category":"外国為替及び外国貿易法","subcategory":"総合問題","year":"R4","difficulty":"難問","type":"yn","question":"外為法に基づく輸出規制違反に対しては、行政罰（課徴金）のみが科され、刑事罰は科されない。","answer":false,"explanation":"外為法第69条の6等により、輸出規制違反には刑事罰（懲役・罰金）が規定されており、行政罰のみに限定されるわけではない。"},{"id":297,"category":"関税評価","subcategory":"総合問題","year":"R5","difficulty":"応用","type":"yn","question":"輸入貨物の課税価格の決定において、取引価格が存在しない場合でも、課税価格を決定しないということはない。","answer":true,"explanation":"取引価格（第1方法）が使えない場合でも第2〜第6方法を順次適用することで必ず課税価格を決定する。決定不能ということはない。"},{"id":298,"category":"関税評価","subcategory":"総合問題","year":"R4","difficulty":"難問","type":"yn","question":"無償で輸入される貨物（見本品等）の課税価格は、取引価格が存在しないため、必ず第2方法以降で決定される。","answer":true,"explanation":"無償貨物は売買取引に基づく取引価格がないため第1方法は適用できず、同一貨物・同種貨物の取引価格等（第2方法以降）を使って課税価格を決定する。"},{"id":299,"category":"関税率表","subcategory":"総合問題","year":"R5","difficulty":"応用","type":"yn","question":"HSコードが同じ品目であっても、日本の関税率表における税率は仕向地（輸出国）によって異なる場合がある。","answer":true,"explanation":"同一HSコードの品目であっても、WTO協定税率・EPA税率・特恵税率・基本税率等、原産国・輸出国によって適用税率が異なることがある。"},{"id":300,"category":"関税率表","subcategory":"総合問題","year":"R4","difficulty":"難問","type":"yn","question":"関税率表の解釈において疑義がある場合、WCOが発行するHSの解説書（Explanatory Notes）を参考にすることができる。","answer":true,"explanation":"WCOのHS解説書（Explanatory Notes）は法的拘束力はないが、品目分類の公式な指針として世界各国の税関で参考にされており、日本でも重要な解釈資料とされている。"},{"id":301,"category":"関税法","subcategory":"輸入申告","year":"H29","difficulty":"基本","type":"yn","question":"輸入申告は、原則として貨物を保税地域に搬入した後でなければ行うことができないが、難破貨物についてはこの限りでない。","answer":true,"explanation":"難破貨物等の特別な事情がある場合には、保税地域搬入前の申告が認められる例外がある（関税法第67条の2）。"},{"id":302,"category":"関税法","subcategory":"輸入申告","year":"H28","difficulty":"応用","type":"yn","question":"輸入申告の際に添付すべき書類として仕入書があるが、仕入書が存在しない場合には仕入書に代わる書類を提出することができる。","answer":true,"explanation":"仕入書が存在しない無償品・見本品等の場合は、価格を証明できる代替書類（見積書・価格表等）の提出が認められる。"},{"id":303,"category":"関税法","subcategory":"輸入申告","year":"R1","difficulty":"難問","type":"yn","question":"輸入申告後、輸入の許可前に申告内容の誤りに気づいた場合は、修正申告ではなく申告事項の訂正手続きによる。","answer":true,"explanation":"輸入許可前の申告内容の変更は修正申告ではなく、申告書の訂正（補正）手続きとして処理される。修正申告は許可後の手続き。"},{"id":304,"category":"関税法","subcategory":"課税物件の確定","year":"H29","difficulty":"基本","type":"yn","question":"輸入申告前に保税地域から貨物が引き取られた場合の課税物件確定時期は、当該貨物が引き取られた時である。","answer":true,"explanation":"関税法第4条第1項第2号により、無許可で引き取られた場合は引取りの時点が課税物件の確定時期となる。"},{"id":305,"category":"関税法","subcategory":"課税物件の確定","year":"H30","difficulty":"応用","type":"yn","question":"適法に輸入申告された貨物については、申告の時の性質及び数量により関税が課される。","answer":true,"explanation":"課税物件の確定時期は輸入申告の時であるため、申告時点での貨物の性質・数量が関税の基礎となる。"},{"id":306,"category":"関税法","subcategory":"課税標準","year":"H28","difficulty":"基本","type":"yn","question":"従価税が適用される貨物の課税標準は、当該貨物の課税価格である。","answer":true,"explanation":"従価税とは課税価格に税率（百分比）を乗じて税額を算出する方式であり、課税標準は貨物の価格（課税価格）となる。"},{"id":307,"category":"関税法","subcategory":"課税標準","year":"R2","difficulty":"応用","type":"yn","question":"従量税が適用される貨物について、貨物の数量が申告数量と実際数量が異なる場合、実際数量に基づいて課税される。","answer":true,"explanation":"課税標準となる数量は実際の貨物数量であり、申告数量に誤りがあれば実際数量に基づいて更正が行われる。"},{"id":308,"category":"関税法","subcategory":"関税率","year":"H29","difficulty":"基本","type":"yn","question":"協定税率（WTO税率）は、関税及び貿易に関する一般協定（GATT）またはWTO協定に基づき設定される。","answer":true,"explanation":"WTO協定税率（譲許税率）はWTO加盟国間で約束した上限税率であり、原則としてこれを超える税率を適用することはできない。"},{"id":309,"category":"関税法","subcategory":"関税率","year":"R3","difficulty":"応用","type":"yn","question":"暫定税率は、一定期間に限り基本税率に代えて適用される税率であり、基本税率より低い場合に限り適用される。","answer":false,"explanation":"暫定税率は基本税率より低い場合も高い場合もある。産業保護目的で基本税率より高い暫定税率が設定されることもある。"},{"id":310,"category":"関税法","subcategory":"関税率","year":"H28","difficulty":"難問","type":"yn","question":"複数の税率が適用可能な場合、原則として最も低い税率が適用される。","answer":false,"explanation":"適用税率の優先順位は法令で定められており（特恵税率・EPA税率・協定税率・暫定税率・基本税率等）、単純に最低税率が適用されるわけではない。"},{"id":311,"category":"関税法","subcategory":"減免税","year":"H29","difficulty":"基本","type":"yn","question":"外交官用物品の免税は、相互主義に基づいて認められる場合がある。","answer":true,"explanation":"外交特権に基づく免税は、相手国が日本の外交官に対して同様の免税を認めることを条件とする相互主義が採用されることがある。"},{"id":312,"category":"関税法","subcategory":"減免税","year":"R1","difficulty":"応用","type":"yn","question":"再輸出免税の適用を受けた貨物を、指定された期間内に再輸出しなかった場合、免除された関税が追徴される。","answer":true,"explanation":"再輸出免税（関税定率法第17条）は再輸出を条件とした免税であり、期限内に再輸出されない場合は免除税額が追徴される。"},{"id":313,"category":"関税法","subcategory":"減免税","year":"H30","difficulty":"難問","type":"yn","question":"学術研究用の標本として輸入された貨物を、免税の目的外に使用した場合でも関税は追徴されない。","answer":false,"explanation":"条件付き免税（用途免税）の場合、指定された目的外使用（条件違反）があれば免除された関税が追徴される。"},{"id":314,"category":"関税法","subcategory":"保税地域","year":"H29","difficulty":"基本","type":"yn","question":"保税蔵置場は、外国貨物の蔵置を目的として財務大臣の許可を受けた施設である。","answer":true,"explanation":"関税法第42条により、保税蔵置場は外国貨物の蔵置等のために財務大臣の許可を受けた場所（民間施設）。"},{"id":315,"category":"関税法","subcategory":"保税地域","year":"R2","difficulty":"応用","type":"yn","question":"保税蔵置場において、外国貨物に対して改装・仕分け等の簡単な作業を行うことができる。","answer":true,"explanation":"関税法第40条により、保税蔵置場では外国貨物の改装・仕分け・見本の展示等の軽易な作業が認められている。"},{"id":316,"category":"関税法","subcategory":"保税地域","year":"H28","difficulty":"難問","type":"yn","question":"保税蔵置場の許可の有効期間は10年であり、更新することができない。","answer":false,"explanation":"保税蔵置場の許可期間は6年（関税法第43条）であり、更新も可能。10年・更新不可という記述は誤り。"},{"id":317,"category":"関税法","subcategory":"保税工場","year":"H29","difficulty":"基本","type":"yn","question":"保税工場においては、外国貨物と内国貨物を混合して製品を製造することができる。","answer":true,"explanation":"関税法第56条により、保税工場では外国貨物と内国貨物を混合して加工・製造することが認められている。"},{"id":318,"category":"関税法","subcategory":"保税工場","year":"R3","difficulty":"応用","type":"yn","question":"保税工場で製造した製品を国内で販売するためには、輸入通関手続きを行い、関税を納付しなければならない。","answer":true,"explanation":"保税工場内での加工・製造は関税留保状態であり、製品を国内市場に出す場合は輸入申告・関税納付が必要となる。"},{"id":319,"category":"関税法","subcategory":"保税工場","year":"H28","difficulty":"難問","type":"yn","question":"保税工場において外国貨物を原料として製造された製品を、そのまま輸出する場合には関税は課されない。","answer":true,"explanation":"保税工場で製造した製品を輸出する場合、関税は留保されたまま輸出されるため課税されない。国内に引き取る場合にのみ関税が課される。"},{"id":320,"category":"関税法","subcategory":"保税展示場","year":"R1","difficulty":"基本","type":"yn","question":"保税展示場に搬入された外国貨物は、展示期間中は関税の課税が留保される。","answer":true,"explanation":"保税展示場は関税を留保したまま外国貨物を展示できる制度であり、展示期間中は課税が保留される。"},{"id":321,"category":"関税法","subcategory":"総合保税地域","year":"H29","difficulty":"基本","type":"yn","question":"総合保税地域では、保税蔵置・保税工場・保税展示場の各機能を合わせて行うことができる。","answer":true,"explanation":"関税法第62条の2の総合保税地域は、蔵置・加工製造・展示・販売等の機能を一体的に提供できる複合的な保税地域。"},{"id":322,"category":"関税法","subcategory":"総合保税地域","year":"R2","difficulty":"応用","type":"yn","question":"総合保税地域の許可は財務大臣が行うが、その許可には条件を付することができる。","answer":true,"explanation":"財務大臣は総合保税地域の許可に際して、必要な条件を付することができる（関税法第62条の3）。"},{"id":323,"category":"関税法","subcategory":"保税運送","year":"H29","difficulty":"基本","type":"yn","question":"外国貨物を保税運送する場合には、あらかじめ税関長の承認を受けなければならない。","answer":true,"explanation":"関税法第63条により、外国貨物の保税運送には事前の税関長承認が必要。"},{"id":324,"category":"関税法","subcategory":"保税運送","year":"H30","difficulty":"応用","type":"yn","question":"保税運送が承認された貨物の運送期間が経過した場合、担保が没収される。","answer":false,"explanation":"運送期間経過の場合は直ちに担保没収ではなく、関税の徴収手続きに移行する。担保は関税の確保手段であり、没収ではなく充当される。"},{"id":325,"category":"関税法","subcategory":"AEO制度","year":"H29","difficulty":"基本","type":"yn","question":"特例輸入者（AEO輸入者）は、輸入許可後に特例申告書を提出することができる。","answer":true,"explanation":"関税法第7条の2の特例輸入者制度では、事後申告（輸入許可後の特例申告書提出）が認められており、月次での一括申告が可能。"},{"id":326,"category":"関税法","subcategory":"AEO制度","year":"R1","difficulty":"応用","type":"yn","question":"認定通関業者（AEO通関業者）は、特例申告を行うことができるほか、簡易な審査・検査を受けることができる。","answer":true,"explanation":"AEO認定通関業者は、特例申告の手続き代理や検査の簡略化等の優遇措置を受けることができる。"},{"id":327,"category":"関税法","subcategory":"AEO制度","year":"H28","difficulty":"難問","type":"yn","question":"AEO認定を受けた事業者は、他国のAEO認定事業者との間で相互認証の恩恵を受けられる場合がある。","answer":true,"explanation":"日本はアメリカ・EU・カナダ等との間でAEO相互認証取決めを締結しており、相手国のAEO認定事業者に対しても審査簡略化等の恩恵が及ぶ。"},{"id":328,"category":"関税法","subcategory":"不服申立て","year":"H29","difficulty":"基本","type":"yn","question":"税関長の処分に対する再調査の請求の決定に不服がある場合、財務大臣に審査請求をすることができる。","answer":true,"explanation":"再調査請求の決定に不服がある場合は、上位機関たる財務大臣への審査請求が認められる（関税法第89条）。"},{"id":329,"category":"関税法","subcategory":"不服申立て","year":"R2","difficulty":"応用","type":"yn","question":"審査請求の決定に不服がある場合は、行政訴訟（取消訴訟）を提起することができる。","answer":true,"explanation":"審査請求の裁決に不服がある場合は、行政事件訴訟法に基づく取消訴訟を裁判所に提起することができる。"},{"id":330,"category":"関税法","subcategory":"不服申立て","year":"H28","difficulty":"難問","type":"yn","question":"関税の賦課決定に対する再調査の請求は、賦課決定通知書を受け取った日の翌日から起算して2ヶ月以内に行う必要がある。","answer":false,"explanation":"再調査の請求期間は処分を知った日の翌日から3ヶ月以内（関税法第89条）。2ヶ月ではない。"},{"id":331,"category":"関税法","subcategory":"知的財産侵害物品","year":"H29","difficulty":"基本","type":"yn","question":"特許権を侵害する物品は、関税法上の輸入禁制品として水際差止めの対象となる。","answer":true,"explanation":"関税法第69条の11第1項第9号により、特許権侵害物品は輸入禁制品として規定されている。"},{"id":332,"category":"関税法","subcategory":"知的財産侵害物品","year":"R3","difficulty":"応用","type":"yn","question":"輸入差止申立てを行った権利者は、認定手続において、当該貨物が侵害品であるか否かの意見を述べることができる。","answer":true,"explanation":"関税法第69条の17により、輸入差止申立て権利者は認定手続において意見陳述の機会が保障されている。"},{"id":333,"category":"関税法","subcategory":"知的財産侵害物品","year":"H30","difficulty":"難問","type":"yn","question":"輸入者が侵害品であることを知らずに輸入した場合でも、当該物品の輸入は禁止される。","answer":true,"explanation":"輸入禁制品の輸入禁止は客観的な禁止規定であり、輸入者の善意・悪意を問わない。知らずに輸入しても禁制品であれば輸入は認められない。"},{"id":334,"category":"関税法","subcategory":"輸入禁制品","year":"H29","difficulty":"基本","type":"yn","question":"覚醒剤は関税法上の輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第5号により、覚醒剤・麻薬・大麻等の薬物は輸入禁制品として規定されている。"},{"id":335,"category":"関税法","subcategory":"輸入禁制品","year":"R1","difficulty":"応用","type":"yn","question":"児童ポルノに該当する物品は、関税法上の輸入禁制品に該当する。","answer":true,"explanation":"関税法第69条の11第1項第7号の「公安又は風俗を害すべき書籍、図画、彫刻物その他の物品」および関連法令により、児童ポルノは輸入禁制品。"},{"id":336,"category":"関税法","subcategory":"輸入禁制品","year":"H28","difficulty":"難問","type":"yn","question":"不正競争防止法に規定する営業秘密を侵害する貨物は、関税法上の輸入禁制品である。","answer":true,"explanation":"関税法第69条の11第1項第10号により、不正競争防止法第2条第1項第4号〜第10号に規定する不正競争に係る物品も輸入禁制品とされる。"},{"id":337,"category":"関税法","subcategory":"罰則","year":"H29","difficulty":"基本","type":"yn","question":"関税を免れる目的で貨物を輸入した者は、10年以下の懲役または1,000万円以下の罰金に処される。","answer":true,"explanation":"関税法第110条第1項により、偽りその他不正の行為により関税を免れた者への罰則は10年以下の懲役または1,000万円以下の罰金（併科あり）。"},{"id":338,"category":"関税法","subcategory":"罰則","year":"R2","difficulty":"応用","type":"yn","question":"輸入禁制品を輸入した者は、10年以下の懲役または3,000万円以下の罰金に処される場合がある。","answer":true,"explanation":"関税法第109条により、輸入禁制品の輸入（密輸）には10年以下の懲役または3,000万円以下の罰金が規定されている（併科あり）。"},{"id":339,"category":"関税法","subcategory":"罰則","year":"H30","difficulty":"難問","type":"yn","question":"関税法上の犯罪について、法人の代表者が犯した場合、当該法人に対しては行為者の罰金額と同額の罰金が科される。","answer":false,"explanation":"両罰規定（関税法第117条）により法人にも罰金が科されるが、法人に対する罰金額は別途規定されており、必ずしも行為者と同額ではない。"},{"id":340,"category":"通関業法","subcategory":"通関業の許可","year":"H29","difficulty":"基本","type":"yn","question":"通関業の許可を受けようとする者は、財務大臣に申請書を提出しなければならない。","answer":true,"explanation":"通関業法第4条により、通関業の許可申請は財務大臣に対して行う。"},{"id":341,"category":"通関業法","subcategory":"通関業の許可","year":"H28","difficulty":"応用","type":"yn","question":"法人が通関業の許可を受けようとする場合、その法人の役員全員が欠格事由に該当しないことが必要である。","answer":true,"explanation":"通関業法第6条の欠格事由は法人の役員にも適用され、役員のうち一人でも欠格事由に該当する場合は許可を受けられない。"},{"id":342,"category":"通関業法","subcategory":"通関業の許可","year":"R3","difficulty":"難問","type":"yn","question":"通関業の許可を受けた者は、その許可の内容に変更があった場合でも、新たな許可を受ける必要はない。","answer":false,"explanation":"許可の内容（業務の範囲・地域等）に変更が生じる場合は、変更の届出または新たな許可申請が必要となる場合がある（通関業法第8条等）。"},{"id":343,"category":"通関業法","subcategory":"通関士","year":"H29","difficulty":"基本","type":"yn","question":"通関士試験は、通関業務に必要な知識・能力を有するかを判定するために実施される。","answer":true,"explanation":"通関業法第22条により、通関士試験は通関業務に関する知識・能力を判定することを目的として財務大臣が実施する。"},{"id":344,"category":"通関業法","subcategory":"通関士","year":"R1","difficulty":"応用","type":"yn","question":"通関士試験に合格した者が通関業者に採用された場合、採用と同時に通関士として業務を行うことができる。","answer":false,"explanation":"試験合格後に財務大臣の確認（通関業法第24条）が必要であり、確認を受けるまでは通関士として業務を行うことができない。"},{"id":345,"category":"通関業法","subcategory":"通関士","year":"H28","difficulty":"難問","type":"yn","question":"通関士の確認を受けた者が当該通関業者を退職した場合、その確認は失効する。","answer":true,"explanation":"通関士の確認は特定の通関業者との関係で行われるため、退職により確認の効力は失われる。再就職先では改めて確認が必要。"},{"id":346,"category":"通関業法","subcategory":"通関業務","year":"H30","difficulty":"基本","type":"yn","question":"通関業者が行う通関業務には、税関に提出する申告書類の作成が含まれる。","answer":true,"explanation":"通関業法第2条第1項により、申告書類の作成・提出代行は通関業務の中核をなす。"},{"id":347,"category":"通関業法","subcategory":"通関業務","year":"R2","difficulty":"応用","type":"yn","question":"通関業者は、依頼人の代理として輸入申告を行う場合、自己の名義で申告書を作成する。","answer":false,"explanation":"代理申告の場合、申告書は依頼人（荷受人）の名義で作成し、代理人（通関業者）として署名・記名する。自己名義では申告できない。"},{"id":348,"category":"通関業法","subcategory":"料金","year":"H29","difficulty":"基本","type":"yn","question":"通関業者は、通関業務の料金を定め、これを営業所において依頼人が見やすい場所に掲示しなければならない。","answer":true,"explanation":"通関業法第18条により、料金の掲示（公示）が義務付けられている。"},{"id":349,"category":"通関業法","subcategory":"料金","year":"H28","difficulty":"応用","type":"yn","question":"通関業者は、依頼人から通関業務の実費のみを受領することができ、報酬の受領は禁止されている。","answer":false,"explanation":"通関業者は通関業務の対価として実費のほか適正な報酬を受領することができる。報酬の受領が禁止されているわけではない。"},{"id":350,"category":"通関業法","subcategory":"監督","year":"H29","difficulty":"基本","type":"yn","question":"財務大臣は、通関業法の施行に必要な範囲内で通関業者に対して報告を求めることができる。","answer":true,"explanation":"通関業法第32条により、財務大臣は必要に応じて通関業者に業務報告を求めることができる。"},{"id":351,"category":"通関業法","subcategory":"監督","year":"R1","difficulty":"応用","type":"yn","question":"財務大臣が通関業者に対して業務停止処分を行う際には、あらかじめ聴聞手続きを行う必要はない。","answer":false,"explanation":"業務停止は不利益処分であり、行政手続法上、原則として処分前に弁明の機会の付与または聴聞手続きが必要となる。"},{"id":352,"category":"通関業法","subcategory":"監督","year":"H30","difficulty":"難問","type":"yn","question":"通関業者が通関業法に定める義務に違反した場合、財務大臣は許可を取り消さずに業務改善命令のみを発することができる。","answer":true,"explanation":"行政処分には段階があり、違反の程度に応じて業務改善命令・業務停止・許可取消しと段階的に対応される。軽微な違反には改善命令のみの場合もある。"},{"id":353,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H29","difficulty":"基本","type":"yn","question":"輸出貿易管理令別表第1に掲げる貨物については、原則として経済産業大臣の輸出許可が必要である。","answer":true,"explanation":"輸出令別表第1の規制品目（武器・原子力・化学兵器関連等）の輸出には外為法第48条に基づく経済産業大臣の許可が必要。"},{"id":354,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H28","difficulty":"応用","type":"yn","question":"輸出許可の有効期間は、原則として許可の日から6ヶ月である。","answer":true,"explanation":"輸出許可の有効期間は原則として6ヶ月であり、期間内に輸出しなければ再申請が必要となる。"},{"id":355,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"R1","difficulty":"難問","type":"yn","question":"同一貨物を分割して複数回に分けて輸出する場合、分割輸出全体が一の輸出許可の対象となることがある。","answer":true,"explanation":"包括輸出許可制度により、同一品目を一定期間内に複数回輸出する場合を一の許可でカバーできる場合がある。"},{"id":356,"category":"外国為替及び外国貿易法","subcategory":"輸入規制","year":"H29","difficulty":"基本","type":"yn","question":"輸入貿易管理令に基づく輸入割当て（IQ）の対象品目は、数量・金額等の制限のもとで輸入が認められる。","answer":true,"explanation":"輸入割当て制度（IQ）では、特定品目について数量・金額等の割当てを受けた範囲内でのみ輸入が認められる。"},{"id":357,"category":"外国為替及び外国貿易法","subcategory":"輸入規制","year":"R2","difficulty":"応用","type":"yn","question":"輸入承認を要する品目について、承認を受けずに輸入した場合、関税法上の輸入許可も受けることができない。","answer":true,"explanation":"税関は通関審査において外為法上の輸入承認の有無を確認するため、承認なしでは輸入許可が下りない。"},{"id":358,"category":"外国為替及び外国貿易法","subcategory":"技術の輸出","year":"H30","difficulty":"基本","type":"yn","question":"日本国内において外国の非居住者に対して規制技術を提供することは、外為法上の「役務取引」として規制される場合がある。","answer":true,"explanation":"外為法第25条（みなし輸出規制）により、国内であっても非居住者への技術提供は輸出と同等の規制が適用される場合がある。"},{"id":359,"category":"外国為替及び外国貿易法","subcategory":"技術の輸出","year":"R4","difficulty":"応用","type":"yn","question":"電子メールで規制技術情報を外国に送信することも、外為法上の輸出として規制される。","answer":true,"explanation":"外為法は技術の「提供」を規制しており、電子的手段（メール・オンライン等）による送信も輸出規制の対象となる。"},{"id":360,"category":"外国為替及び外国貿易法","subcategory":"外為法の罰則","year":"H29","difficulty":"基本","type":"yn","question":"外為法に違反して無許可で規制品目を輸出した場合、輸出した貨物が没収されることがある。","answer":true,"explanation":"外為法第69条の11等により、規制違反輸出に係る貨物は没収の対象となり得る。"},{"id":361,"category":"外国為替及び外国貿易法","subcategory":"外為法の罰則","year":"R1","difficulty":"応用","type":"yn","question":"外為法違反の輸出に対する制裁として、行政罰（輸出禁止等）と刑事罰の両方が科される場合がある。","answer":true,"explanation":"外為法違反には、行政制裁（輸出禁止命令等）と刑事罰（懲役・罰金）の両方が規定されており、双方が適用される場合がある。"},{"id":362,"category":"関税評価","subcategory":"取引価格方式","year":"H29","difficulty":"基本","type":"yn","question":"取引価格方式（第1方法）において、取引価格とは買手が売手に対して実際に支払いまたは支払うべき価格の総額をいう。","answer":true,"explanation":"関税定率法第4条第1項により、取引価格は現実支払価格（買手が売手に対して実際に支払いまたは支払うべき総額）を基礎とする。"},{"id":363,"category":"関税評価","subcategory":"取引価格方式","year":"H28","difficulty":"応用","type":"yn","question":"買手が第三者に支払う費用であっても、売手の利益のために支払われる場合は取引価格に含まれる。","answer":true,"explanation":"関税定率法第4条第1項の現実支払価格には、買手が売手またはその利益のために支払うすべての費用が含まれる。"},{"id":364,"category":"関税評価","subcategory":"取引価格方式","year":"R1","difficulty":"難問","type":"yn","question":"輸入後に生じる利益の一部を売手に配分する旨の合意がある場合、当該配分額は取引価格に含まれる。","answer":true,"explanation":"関税定率法第4条第1項第1号により、輸入後の再販売・処分等から生じる利益のうち売手に帰属する部分は取引価格に加算される。"},{"id":365,"category":"関税評価","subcategory":"第4方法・第5方法","year":"H30","difficulty":"応用","type":"yn","question":"第4方法（国内販売価格方式）は、輸入貨物と同一・同種の貨物の国内販売価格から一定の控除を行って課税価格を算出する方法である。","answer":true,"explanation":"関税定率法第4条の3の国内販売価格方式では、国内販売価格から輸入後に生じた費用（手数料・利益・輸入後の運賃等）を控除して課税価格を算出する。"},{"id":366,"category":"関税評価","subcategory":"第4方法・第5方法","year":"R2","difficulty":"難問","type":"yn","question":"第5方法（計算価格方式）は、輸入貨物の製造原価に利益・輸送費等を加算して課税価格を算出する方法である。","answer":true,"explanation":"関税定率法第4条の4の計算価格方式では、製造原価＋一般経費・利益＋輸入港までの運賃等を合計して課税価格を算出する。"},{"id":367,"category":"関税率表","subcategory":"重要な類","year":"H29","difficulty":"基本","type":"yn","question":"石油及び石油製品は、一般に関税率表第27類に分類される。","answer":true,"explanation":"第27類「鉱物性燃料及び鉱物油並びにこれらの蒸留物、歴青物質並びに鉱物性ろう」として石油・石油製品が分類される。"},{"id":368,"category":"関税率表","subcategory":"重要な類","year":"H28","difficulty":"応用","type":"yn","question":"プラスチック製品は、一般に関税率表第39類に分類される。","answer":true,"explanation":"第39類「プラスチック及びその製品」として各種プラスチック製品が分類される。ただし他の類に特別規定がある場合はそちらが優先される。"},{"id":369,"category":"関税率表","subcategory":"重要な類","year":"R1","difficulty":"難問","type":"yn","question":"時計は関税率表第91類に分類される。","answer":true,"explanation":"第91類「時計及びその部分品」として腕時計・置時計・掛け時計等の時計類が分類される。"},{"id":370,"category":"関税率表","subcategory":"重要な類","year":"H30","difficulty":"基本","type":"yn","question":"衣類及び衣類附属品（メリヤス編み等）は、関税率表第61類に分類される。","answer":true,"explanation":"第61類「メリヤス編み又はクロセ編みの衣類及び衣類附属品」として、ニット製衣類等が分類される。なお織物製衣類は第62類。"},{"id":371,"category":"関税法","subcategory":"税関の権限","year":"H29","difficulty":"基本","type":"yn","question":"税関職員は、輸出入貨物の検査のために、船舶・航空機・車両等に立ち入ることができる。","answer":true,"explanation":"関税法第105条により、税関職員は輸出入貨物の検査等のため、必要な場合に船舶・航空機・車両等に立ち入る権限を持つ。"},{"id":372,"category":"関税法","subcategory":"税関の権限","year":"R2","difficulty":"応用","type":"yn","question":"税関職員は、輸出入者の事務所に立ち入り、帳簿・書類を検査することができる。","answer":true,"explanation":"関税法第105条の事後調査規定により、税関職員は輸出入者の事務所等に立ち入り帳簿・書類等を検査できる。"},{"id":373,"category":"関税法","subcategory":"税関の権限","year":"H28","difficulty":"難問","type":"yn","question":"税関職員が輸出入者の事務所に立ち入る際には、裁判所の令状が必要である。","answer":false,"explanation":"事後調査（行政調査）としての立入検査は行政権限の行使であり、刑事手続きの捜索とは異なり裁判所の令状は不要。ただし犯則調査は別。"},{"id":374,"category":"関税法","subcategory":"郵便物の通関","year":"H29","difficulty":"基本","type":"yn","question":"国際郵便物として輸入される貨物は、日本郵便株式会社を通じて通関手続きが行われる。","answer":true,"explanation":"関税法第77条により、郵便物の輸入通関は日本郵便が手続きを行う特別な制度（郵便物の通関）が設けられている。"},{"id":375,"category":"関税法","subcategory":"郵便物の通関","year":"R1","difficulty":"応用","type":"yn","question":"課税価格が200,000円を超える郵便物については、通常の輸入申告手続きが必要となる。","answer":true,"explanation":"関税法第77条により、課税価格20万円超の郵便物は原則として通常の輸入申告が必要（日本郵便による簡易手続きの対象外）。"},{"id":376,"category":"関税法","subcategory":"郵便物の通関","year":"H30","difficulty":"難問","type":"yn","question":"個人使用目的の少額郵便物については、関税が免除される場合がある。","answer":true,"explanation":"個人使用目的の少額郵便物（課税価格1万円以下等）については免税扱いとなる場合がある（関税暫定措置法等）。"},{"id":377,"category":"関税法","subcategory":"旅客・乗組員の通関","year":"H29","difficulty":"基本","type":"yn","question":"入国する旅客が携帯する外国製品について、本邦出国時に持ち出したことが証明できる場合は関税が免除される。","answer":true,"explanation":"本邦から持ち出した証明がある物品（持出証明書）については、再輸入時の関税が免除される（関税定率法第14条第1号）。"},{"id":378,"category":"関税法","subcategory":"旅客・乗組員の通関","year":"R2","difficulty":"応用","type":"yn","question":"船舶の乗組員が外国港で購入した物品を携帯して入国する場合、旅客と同様の免税制度が適用される。","answer":false,"explanation":"乗組員の携帯品については旅客とは異なる別途の免税規定が適用される。乗組員は通常、旅客より免税範囲が限定される。"},{"id":379,"category":"関税法","subcategory":"密輸","year":"H30","difficulty":"基本","type":"yn","question":"密輸とは、輸入禁制品を申告なしに輸入する行為だけでなく、関税を不正に免れようとして虚偽の申告をする行為も含む。","answer":true,"explanation":"密輸（関税法第109条）は輸入禁制品の無申告輸入を指すが、広義には関税ほ脱（第110条）も含め不正輸入全般を指す場合がある。"},{"id":380,"category":"関税法","subcategory":"密輸","year":"R1","difficulty":"応用","type":"yn","question":"税関は、密輸の疑いがある貨物について、船積み前の輸出国において情報収集することはできない。","answer":false,"explanation":"税関はインターポール・WCO等の国際機関を通じた情報交換や、外国税関との直接情報共有により輸出国側の情報収集も行っている。"},{"id":381,"category":"関税法","subcategory":"密輸","year":"H28","difficulty":"難問","type":"yn","question":"税関が密輸摘発のために行う X 線検査（スキャナー検査）は、法的根拠に基づいて行われる。","answer":true,"explanation":"税関のX線スキャナー検査は関税法第67条・第105条等の検査権限に基づいて行われる適法な行政行為。"},{"id":382,"category":"通関業法","subcategory":"総合","year":"H29","difficulty":"応用","type":"yn","question":"通関業者は、通関業務の委託を受けた場合、当該業務の処理について善管注意義務を負う。","answer":true,"explanation":"委任契約の本旨（民法第644条の善管注意義務）は通関業務にも適用され、通関業者は善良な管理者の注意義務をもって業務を行う必要がある。"},{"id":383,"category":"通関業法","subcategory":"総合","year":"H28","difficulty":"難問","type":"yn","question":"通関業者が依頼人のために行った輸入申告について税額不足が判明した場合、通関業者が修正申告の義務を負う。","answer":false,"explanation":"修正申告の義務は納税義務者（輸入者・依頼人）が負う。通関業者は手続きを代行するが、納税義務や申告義務は輸入者にある。"},{"id":384,"category":"外国為替及び外国貿易法","subcategory":"総合","year":"H29","difficulty":"応用","type":"yn","question":"外為法に基づく輸出管理は、主として経済産業省が所管するが、税関も水際での確認を担う。","answer":true,"explanation":"輸出管理の主管は経済産業省だが、実際の輸出通関では税関が輸出許可証等の確認を行い、両省庁が連携して執行する。"},{"id":385,"category":"外国為替及び外国貿易法","subcategory":"総合","year":"H28","difficulty":"難問","type":"yn","question":"外為法違反による輸出禁止処分を受けた者は、一定期間、すべての輸出入業務が禁止される。","answer":false,"explanation":"輸出禁止処分は違反に係る特定の貨物・取引を対象とするものが通常であり、すべての輸出入業務が禁止されるわけではない。"},{"id":386,"category":"関税評価","subcategory":"総合","year":"H29","difficulty":"応用","type":"yn","question":"課税価格の決定において、輸入者が提示した取引価格の正確性に疑義がある場合、税関長は情報提供を求めることができる。","answer":true,"explanation":"税関長は課税価格の確認のために必要な情報・書類の提出を輸入者に求めることができ、提出がない場合は他の方法で課税価格を決定する。"},{"id":387,"category":"関税評価","subcategory":"総合","year":"H28","difficulty":"難問","type":"yn","question":"輸入者が課税価格の決定方法に異議を唱える場合、事前教示制度を利用して確認することができる。","answer":true,"explanation":"事前教示（関税法第7条の16の2）により、輸入前に税関長に対して課税価格の決定方法等についての確認を求めることができる。"},{"id":388,"category":"関税率表","subcategory":"総合","year":"H29","difficulty":"応用","type":"yn","question":"輸入申告の際に申告した関税分類番号（HSコード）が誤っていた場合、税関から更正を受けることがある。","answer":true,"explanation":"申告されたHSコードが誤っている場合、税関は正しいコードに基づく更正を行い、差額関税を追徴することがある。"},{"id":389,"category":"関税率表","subcategory":"総合","year":"H28","difficulty":"難問","type":"yn","question":"事前教示（アドバンス・ルーリング）制度を利用することで、輸入前に関税分類について税関の見解を確認することができる。","answer":true,"explanation":"事前教示制度（関税法第7条の16の2）により、輸入前に品目分類・関税評価等について税関長の見解を文書で取得できる。"},{"id":390,"category":"関税法","subcategory":"事前教示","year":"H29","difficulty":"基本","type":"yn","question":"事前教示とは、輸入者等が税関に対して輸入前に関税率・関税分類等について照会し、文書による回答を得る制度である。","answer":true,"explanation":"事前教示制度（関税法第7条の16の2）は、輸入者等が貨物の輸入前に分類・評価・原産地等について事前に確認できる制度。"},{"id":391,"category":"関税法","subcategory":"事前教示","year":"R1","difficulty":"応用","type":"yn","question":"事前教示の回答は、特段の事情がない限り、回答の前提となった事実関係が変わらない限り有効である。","answer":true,"explanation":"事前教示の回答は、回答の基礎となった事実関係が変わらない限り有効であり、当該貨物の輸入に際して尊重される。"},{"id":392,"category":"関税法","subcategory":"事前教示","year":"H30","difficulty":"難問","type":"yn","question":"事前教示の回答に誤りがあった場合でも、その回答を信頼した輸入者に対して不利益な課税を行うことはできない。","answer":false,"explanation":"事前教示の回答は法的拘束力を持たず、誤った回答に基づいて輸入した場合でも、正しい税率による課税が行われる場合がある（信頼保護の観点からの救済は別途検討）。"},{"id":393,"category":"関税法","subcategory":"関税の申告と納付","year":"H29","difficulty":"基本","type":"yn","question":"輸入申告と同時に関税の納付が完了した場合に限り、輸入の許可が下りる。","answer":false,"explanation":"担保提供による許可前引取り（BP制度）や特例申告（月次後納付）等の場合は、関税納付前に輸入許可が得られる制度がある。"},{"id":394,"category":"関税法","subcategory":"関税の申告と納付","year":"R3","difficulty":"応用","type":"yn","question":"関税の納付は、金銭のほか、一定の有価証券（国債等）をもって行うことができる場合がある。","answer":true,"explanation":"関税法第9条の3により、担保として提供した国債等の有価証券を関税の納付に充当することができる。"},{"id":395,"category":"関税法","subcategory":"関税の申告と納付","year":"H28","difficulty":"難問","type":"yn","question":"クレジットカードによる関税の納付は、一切認められていない。","answer":false,"explanation":"税関でのクレジットカード等による納付については、電子納付の普及に伴い認められる範囲が拡大されており、一切不可とは言えない。"},{"id":396,"category":"通関業法","subcategory":"通関士の職責","year":"H29","difficulty":"応用","type":"yn","question":"通関士は、依頼人の利益を代表する立場にあるが、関税法令の遵守においては税関と協力する義務がある。","answer":true,"explanation":"通関士は依頼人の代理人として行動しつつも、法令遵守の面では税関行政に協力する立場にある。両者のバランスが通関士の職責の本質。"},{"id":397,"category":"通関業法","subcategory":"通関士の職責","year":"H28","difficulty":"難問","type":"yn","question":"通関士が税関への申告内容に虚偽があると知りながら申告書に記名した場合、通関業法のみならず関税法上の罰則も適用される可能性がある。","answer":true,"explanation":"虚偽申告への関与は通関業法違反に加え、関税法上の申告不正（共犯等）として関税法の罰則も適用される可能性がある。"},{"id":398,"category":"外国為替及び外国貿易法","subcategory":"安全保障貿易管理","year":"H29","difficulty":"応用","type":"yn","question":"輸出者は、安全保障貿易管理において、取引相手・最終需要者・用途を確認する義務（デュー・ディリジェンス）を負う。","answer":true,"explanation":"外為法の輸出管理制度において、輸出者は取引相手・最終用途・最終需要者を確認するデュー・ディリジェンス（取引審査）義務を負う。"},{"id":399,"category":"外国為替及び外国貿易法","subcategory":"安全保障貿易管理","year":"H28","difficulty":"難問","type":"yn","question":"輸出管理内部規程（CP：コンプライアンス・プログラム）を整備した企業は、特別一般包括許可の申請資格を持つ場合がある。","answer":true,"explanation":"輸出管理のCPを整備し経産省の確認を受けた企業は、特別一般包括許可等の優遇措置（手続き簡略化）の申請資格を持つ。"},{"id":400,"category":"関税法","subcategory":"総合","year":"R5","difficulty":"難問","type":"yn","question":"税関手続のデジタル化（電子申告の普及）は、通関の迅速化に寄与する一方、サイバーセキュリティ上のリスク管理も重要な課題となっている。","answer":true,"explanation":"NACCS等の電子通関システムの普及により通関効率は大幅に向上したが、システム障害・不正アクセス等のサイバーリスクへの対応も重要な課題となっている。"},{"id":401,"category":"関税法","subcategory":"輸入申告","year":"H27","difficulty":"基本","type":"yn","question":"輸入申告は、税関長に対して行うものであり、財務大臣に対して行うものではない。","answer":true,"explanation":"関税法第67条により、輸入申告は当該貨物を管轄する税関長に対して行う。財務大臣への申告ではない。"},{"id":402,"category":"関税法","subcategory":"輸入申告","year":"H26","difficulty":"応用","type":"yn","question":"輸入申告書に記載する価格は、原則として現実支払価格（インボイス価格）を基礎とした課税価格である。","answer":true,"explanation":"輸入申告書の申告価格欄には課税価格を記載する。課税価格は原則として現実支払価格（CIF価格ベース）を基礎として算出される。"},{"id":403,"category":"関税法","subcategory":"輸入申告","year":"H25","difficulty":"難問","type":"yn","question":"同一の船積書類（B/L）に記載された複数の貨物は、必ず一の輸入申告にまとめて申告しなければならない。","answer":false,"explanation":"一のB/Lに複数品目が含まれていても、品目ごとに別々の申告書を提出することは可能。申告の単位は法令上厳密に一B/L＝一申告と定められているわけではない。"},{"id":404,"category":"関税法","subcategory":"課税物件の確定","year":"H27","difficulty":"基本","type":"yn","question":"保税地域以外の場所に置くことが承認された外国貨物が亡失した場合、課税物件の確定時期は亡失の時である。","answer":true,"explanation":"関税法第4条第2項により、保税地域外に置くことが承認された外国貨物の亡失の場合も、亡失の時が課税物件確定時期となる。"},{"id":405,"category":"関税法","subcategory":"課税物件の確定","year":"H26","difficulty":"応用","type":"yn","question":"特例申告貨物の課税物件の確定時期は、特例申告書が提出された時ではなく、輸入の許可の時である。","answer":true,"explanation":"関税法第4条第1項ただし書きにより、特例申告貨物の課税物件確定時期は輸入許可の時となる。事後申告方式の特例。"},{"id":406,"category":"関税法","subcategory":"関税の納付","year":"H27","difficulty":"基本","type":"yn","question":"関税は、原則として輸入の許可前に納付しなければならない。","answer":true,"explanation":"関税法第9条により、関税は輸入の許可前に納付するのが原則。担保提供等による例外もある。"},{"id":407,"category":"関税法","subcategory":"関税の納付","year":"H26","difficulty":"応用","type":"yn","question":"特例申告貨物に係る関税の納期限は、特例申告書を提出した日の属する月の翌月末日である。","answer":true,"explanation":"関税法第9条の2により、特例申告貨物の関税納期限は特例申告書提出月の翌月末日。月次後納制度の核心。"},{"id":408,"category":"関税法","subcategory":"関税の納付","year":"H25","difficulty":"難問","type":"yn","question":"延納（分割納付）は、関税についても認められる場合がある。","answer":true,"explanation":"関税法上、一定の要件のもとで延納（分割納付・換価の猶予等）が認められる場合がある（国税通則法準用）。"},{"id":409,"category":"関税法","subcategory":"保税地域","year":"H27","difficulty":"基本","type":"yn","question":"外国から到着した貨物が保税地域に搬入されると、その貨物は外国貨物としての地位を取得する。","answer":false,"explanation":"外国から到着した貨物は、本邦に到着した時点から外国貨物の地位を持つ。保税地域搬入により地位を取得するわけではない。"},{"id":410,"category":"関税法","subcategory":"保税地域","year":"H26","difficulty":"応用","type":"yn","question":"保税地域において、外国貨物である原料を使用して内国貨物である製品を製造することが認められている保税地域がある。","answer":true,"explanation":"保税工場（関税法第56条）においては、外国貨物を原料として内国貨物・外国貨物混合での製造が認められている。"},{"id":411,"category":"関税法","subcategory":"保税地域","year":"H25","difficulty":"難問","type":"yn","question":"保税蔵置場に置かれている外国貨物を廃棄する場合、税関長の承認が必要である。","answer":true,"explanation":"関税法第45条第1項により、保税蔵置場内の外国貨物を廃棄する場合は税関長の承認が必要。廃棄後は関税が免除される。"},{"id":412,"category":"関税法","subcategory":"保税運送","year":"H27","difficulty":"基本","type":"yn","question":"保税運送の承認を受けた外国貨物が運送途中で亡失した場合、原則として運送人が関税を納付しなければならない。","answer":false,"explanation":"運送中の亡失の場合の納税義務者は、保税運送の承認を受けた者（荷主・通関業者等の承認申請者）であり、必ずしも運送人ではない。"},{"id":413,"category":"関税法","subcategory":"保税運送","year":"H26","difficulty":"応用","type":"yn","question":"複数の保税地域を経由して外国貨物を運送する場合、区間ごとに個別の保税運送承認が必要である。","answer":false,"explanation":"保税運送の承認は最終目的地まで一括して申請できる。区間ごとに個別申請は必須ではない。"},{"id":414,"category":"関税法","subcategory":"輸出申告","year":"H27","difficulty":"基本","type":"yn","question":"輸出申告は、原則として輸出しようとする貨物を置いている場所を所轄する税関長に対して行う。","answer":false,"explanation":"輸出申告は、原則として貨物を輸出しようとする開港・税関空港を管轄する税関長に対して行う（関税法第67条の3）。貨物を置いている場所の税関長ではない。"},{"id":415,"category":"関税法","subcategory":"輸出申告","year":"H26","difficulty":"応用","type":"yn","question":"輸出の許可を受けた後、積込みを完了する前であれば、当該許可を受けた貨物に他の貨物を追加して輸出することができる。","answer":false,"explanation":"輸出許可は特定の申告貨物に対して下りるものであり、許可後に貨物を追加することはできない。追加分は別途申告が必要。"},{"id":416,"category":"関税法","subcategory":"減免税","year":"H27","difficulty":"基本","type":"yn","question":"身体障害者用の車いすは、一定の要件のもとで関税が免除される場合がある。","answer":true,"explanation":"関税定率法第14条により、身体障害者用の器具・用具として輸入されるものについては関税免除の規定がある。"},{"id":417,"category":"関税法","subcategory":"減免税","year":"H26","difficulty":"応用","type":"yn","question":"国際的な競技大会（オリンピック等）に使用するために一時的に輸入されるスポーツ用品には、再輸出を条件として関税が免除される場合がある。","answer":true,"explanation":"再輸出免税（関税定率法第17条）により、一時的な輸入で再輸出が確実な競技用品等に対して関税免除が認められる場合がある。"},{"id":418,"category":"関税法","subcategory":"減免税","year":"H25","difficulty":"難問","type":"yn","question":"加工再輸入減税の適用を受けるためには、輸出の際に税関への届出（持出届）が必要である。","answer":true,"explanation":"加工再輸入減税（関税定率法第11条）の適用を受けるには、輸出時に税関への届出（加工輸出品の持出届）を行い、本邦からの輸出であることを証明することが必要。"},{"id":419,"category":"関税法","subcategory":"不服申立て","year":"H27","difficulty":"基本","type":"yn","question":"関税の賦課決定処分に不服がある者は、処分を知った日の翌日から3ヶ月以内に再調査の請求をすることができる。","answer":true,"explanation":"関税法第89条により、税関長の処分に対する再調査の請求期限は処分を知った日の翌日から3ヶ月以内。"},{"id":420,"category":"関税法","subcategory":"不服申立て","year":"H25","difficulty":"難問","type":"yn","question":"関税に関する処分についての審査請求は、財務大臣ではなく国税不服審判所長に対して行う。","answer":false,"explanation":"関税に関する処分の審査請求は財務大臣に対して行う（関税法第89条の2）。国税不服審判所は所得税・法人税等の国税についての機関。"},{"id":421,"category":"関税法","subcategory":"罰則","year":"H27","difficulty":"基本","type":"yn","question":"関税法における犯則調査において、税関職員は被疑者に対して黙秘権を告知する義務はない。","answer":true,"explanation":"税関の犯則調査は行政調査（収税官吏による調査）であり、刑事手続きとは異なるため黙秘権の告知義務はない。ただし強制力には限界がある。"},{"id":422,"category":"関税法","subcategory":"罰則","year":"H26","difficulty":"応用","type":"yn","question":"関税法上の犯則事件について、告発を受けた検察官が起訴した場合、通常の刑事裁判手続きが行われる。","answer":true,"explanation":"税関長が検察官に告発した後は、通常の刑事訴訟手続きに移行し、検察官が起訴・不起訴を判断し、起訴された場合は刑事裁判が行われる。"},{"id":423,"category":"関税法","subcategory":"罰則","year":"H25","difficulty":"難問","type":"yn","question":"通関業者が関税法の規定に違反して虚偽の申告を行った場合、通関業者のみが処罰され、依頼した荷主は処罰されない。","answer":false,"explanation":"虚偽申告への関与（共謀・教唆等）があれば荷主も共犯として処罰される場合がある。通関業者のみに責任が限定されない。"},{"id":424,"category":"通関業法","subcategory":"通関業の許可","year":"H27","difficulty":"基本","type":"yn","question":"通関業の許可の申請に際して、申請者は事業計画書を提出することが求められる場合がある。","answer":true,"explanation":"通関業法第4条の許可申請では、財務省令で定める書類（事業計画等）の添付が求められる場合がある。"},{"id":425,"category":"通関業法","subcategory":"通関業の許可","year":"H26","difficulty":"応用","type":"yn","question":"通関業者は、許可を受けた後に主たる営業所の所在地が変わった場合、財務大臣に変更の届出をしなければならない。","answer":true,"explanation":"通関業法第8条により、通関業者は営業所の移転・廃止等の変更事項について財務大臣への届出義務がある。"},{"id":426,"category":"通関業法","subcategory":"欠格事由","year":"H27","difficulty":"基本","type":"yn","question":"精神の機能の障害により通関業務を適正に行うに当たって必要な認知・判断・意思疎通を適切に行うことができない者は、通関業の許可を受けることができない。","answer":true,"explanation":"通関業法第6条の欠格事由として、精神機能の障害により通関業務を適正に行えないと認められる者が規定されている。"},{"id":427,"category":"通関業法","subcategory":"欠格事由","year":"H26","difficulty":"応用","type":"yn","question":"通関業の許可を取り消された法人において、取消しの原因となった事項に関与した役員は、取消しの日から3年間は許可を受けることができない。","answer":true,"explanation":"通関業法第6条第7号により、許可取消し法人の取消し原因に関与した役員等は3年間の欠格期間がある。"},{"id":428,"category":"通関業法","subcategory":"通関士","year":"H27","difficulty":"基本","type":"yn","question":"通関士試験の受験資格に年齢制限はない。","answer":true,"explanation":"通関士試験（通関業法第22条）に年齢制限の規定はなく、誰でも受験することができる。"},{"id":429,"category":"通関業法","subcategory":"通関士","year":"H26","difficulty":"応用","type":"yn","question":"通関士試験は年1回実施されている。","answer":true,"explanation":"通関士試験は毎年10月に年1回実施されている。合格率は概ね10〜15%程度の難関試験。"},{"id":430,"category":"通関業法","subcategory":"通関士","year":"H25","difficulty":"難問","type":"yn","question":"通関士試験に合格しても、通関業者に採用されない限り通関士の確認申請を行うことができない。","answer":true,"explanation":"通関士確認の申請は通関業者が行うものであり、通関業者に雇用されなければ確認申請の機会が得られない。試験合格のみでは通関士として業務できない。"},{"id":431,"category":"通関業法","subcategory":"通関業務","year":"H27","difficulty":"基本","type":"yn","question":"通関業者は、輸出入申告の手続き代行のほか、関税の納付手続きの代行も通関業務として行うことができる。","answer":true,"explanation":"通関業法第2条第1項により、関税その他の税の納付手続きの代行も通関業務に含まれる。"},{"id":432,"category":"通関業法","subcategory":"通関業務","year":"H26","difficulty":"応用","type":"yn","question":"通関業者は、他の通関業者の通関業務を代行（下請け）することができる。","answer":false,"explanation":"通関業務は依頼人（荷主等）から直接受任するものであり、他の通関業者から業務を受ける形での下請けは原則として通関業務の定義に合致しない。"},{"id":433,"category":"通関業法","subcategory":"通関士の審査","year":"H27","difficulty":"基本","type":"yn","question":"通関士は、輸入申告書に記名する前に、申告内容が関税法令に適合しているかを確認しなければならない。","answer":true,"explanation":"通関業法第14条により、通関士は通関書類の内容を審査し、法令適合性を確認した上で記名することが義務付けられている。"},{"id":434,"category":"通関業法","subcategory":"通関士の審査","year":"H26","difficulty":"応用","type":"yn","question":"通関士が記名した輸入申告書に誤りがあった場合、通関士個人が関税の追徴税額を負担しなければならない。","answer":false,"explanation":"関税の納税義務は輸入者（荷受人）にあり、通関士に納税義務はない。ただし通関士には職務上の責任（行政処分・懲戒等）が生じる可能性はある。"},{"id":435,"category":"通関業法","subcategory":"秘密保持","year":"H27","difficulty":"基本","type":"yn","question":"通関業者の役員及び従業員は、在職中のみならず退職後も守秘義務を負う。","answer":true,"explanation":"通関業法第21条の守秘義務は在職中・退職後を問わず継続する。業務上知り得た秘密の保持は永続的義務。"},{"id":436,"category":"通関業法","subcategory":"秘密保持","year":"H26","difficulty":"応用","type":"yn","question":"通関業者の従業員が依頼人の営業秘密を第三者に漏らした場合、通関業法上の罰則が科される場合がある。","answer":true,"explanation":"通関業法第21条違反（守秘義務違反）には罰則規定があり、業務上知り得た秘密の漏洩は処罰対象となる。"},{"id":437,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H27","difficulty":"基本","type":"yn","question":"外為法に基づく輸出規制の対象となる貨物の範囲は、経済産業省令（輸出貿易管理令別表）で定められる。","answer":true,"explanation":"輸出規制対象品目は輸出貿易管理令（輸出令）の別表第1・第2等に規定されており、経済産業省が所管する。"},{"id":438,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H26","difficulty":"応用","type":"yn","question":"輸出規制対象品目であっても、輸出先が日本と安全保障協力関係にある国（グループA）であれば許可が不要な場合がある。","answer":true,"explanation":"グループA（旧ホワイト国）向けの輸出については、包括許可の利用等により個別許可が不要となる場合がある。"},{"id":439,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H25","difficulty":"難問","type":"yn","question":"外為法上の輸出規制違反に対しては、輸出禁止処分（行政罰）に加え、刑事告発が行われることがある。","answer":true,"explanation":"外為法違反は行政制裁（業務停止・輸出禁止命令等）と刑事罰（懲役・罰金）の両方が規定されており、重大違反は刑事告発されることがある。"},{"id":440,"category":"外国為替及び外国貿易法","subcategory":"支払規制","year":"H27","difficulty":"基本","type":"yn","question":"外為法において、外国為替取引とは居住者と非居住者の間で行われる金銭の受払いをいう。","answer":false,"explanation":"外国為替取引の定義はより広く、異なる通貨間の交換・国際的な資金移動等を含む。単純に居住者・非居住者間の受払いのみを指すわけではない。"},{"id":441,"category":"外国為替及び外国貿易法","subcategory":"支払規制","year":"H26","difficulty":"応用","type":"yn","question":"制裁対象国・個人への送金は、外為法に基づき禁止または制限される場合がある。","answer":true,"explanation":"外為法第16条・第21条等に基づく閣議決定・財務省令により、制裁対象への資金移動（送金等）が禁止・制限される。"},{"id":442,"category":"外国為替及び外国貿易法","subcategory":"対内直接投資","year":"H25","difficulty":"難問","type":"yn","question":"外国投資家による安全保障上重要な分野（防衛・原子力・サイバーセキュリティ等）への投資については、事前届出が義務付けられている。","answer":true,"explanation":"外為法改正（2020年施行）により、安全保障上重要な分野への対内直接投資については事前届出義務が強化されている。"},{"id":443,"category":"関税評価","subcategory":"現実支払価格","year":"H27","difficulty":"基本","type":"yn","question":"現実支払価格とは、買手が売手に対して輸入貨物の対価として実際に支払いまたは支払うべき価格の総額をいう。","answer":true,"explanation":"関税定率法第4条第1項に規定する現実支払価格は、買手が売手に対して輸入貨物の対価として支払いまたは支払うべき総額。"},{"id":444,"category":"関税評価","subcategory":"現実支払価格","year":"H26","difficulty":"応用","type":"yn","question":"買手が輸入後に行う改造・加工の費用は、現実支払価格には含まれない。","answer":true,"explanation":"輸入後の改造・加工費用は輸入取引の対価ではなく、輸入後に生じる費用であるため課税価格（現実支払価格）には含まれない。"},{"id":445,"category":"関税評価","subcategory":"現実支払価格","year":"H25","difficulty":"難問","type":"yn","question":"輸入取引に際して行われた値引き（ディスカウント）は、その値引きが正当なものであれば課税価格から控除できる。","answer":true,"explanation":"正当な商業的値引き（数量割引・早期支払割引等）は、売手が受け取る実際の価格を減額するものであり、現実支払価格に反映される（課税価格も減少）。"},{"id":446,"category":"関税評価","subcategory":"加算要素","year":"H27","difficulty":"基本","type":"yn","question":"買手が輸入貨物の製造のために提供した工具・金型の費用は、課税価格に加算される。","answer":true,"explanation":"関税定率法第4条第1項第2号により、買手が提供した工具・金型・材料等（assists）の価値は課税価格に加算される。"},{"id":447,"category":"関税評価","subcategory":"加算要素","year":"H26","difficulty":"応用","type":"yn","question":"買手が売手に支払う買付手数料は、課税価格に加算される。","answer":false,"explanation":"買付手数料（buying commission）は買手自身のために支払うものであり、関税定率法上の加算要素である販売手数料とは異なり、課税価格に加算されない。"},{"id":448,"category":"関税評価","subcategory":"加算要素","year":"H25","difficulty":"難問","type":"yn","question":"輸入貨物の設計・デザインを輸出国以外の第三国の者が行い、その費用を買手が負担した場合、当該費用は課税価格に加算される。","answer":true,"explanation":"関税定率法第4条第1項第2号のassistsには、輸入貨物の設計・デザイン費用（輸出国外で行われたものを除く旨の規定に注意が必要だが）が含まれる場合がある。なお輸出国外で行われた設計等は加算不要とされる場合もある。"},{"id":449,"category":"関税率表","subcategory":"分類の実務","year":"H27","difficulty":"基本","type":"yn","question":"輸入申告の際に申告する品目番号（統計品目番号）は、関税率表の番号を基礎として設定されている。","answer":true,"explanation":"統計品目番号（9桁または10桁）はHS6桁コードを基礎に日本独自の細分を加えたものであり、輸入申告書に記載する。"},{"id":450,"category":"関税率表","subcategory":"分類の実務","year":"H26","difficulty":"応用","type":"yn","question":"品目分類の誤りにより過少申告となった場合、修正申告または更正の対象となる。","answer":true,"explanation":"品目分類の誤りにより税率が低く適用された場合は過少申告となり、輸入者の自主的修正（修正申告）または税関による更正の対象となる。"},{"id":451,"category":"関税率表","subcategory":"分類の実務","year":"H25","difficulty":"難問","type":"yn","question":"同一品目について、輸出申告と輸入申告で用いるHSコードは必ず一致しなければならない。","answer":false,"explanation":"輸出申告と輸入申告のHSコードは独立して決定される。同一品目でも輸出国と輸入国の分類解釈が異なる場合があり、必ずしも一致は義務付けられていない。"},{"id":452,"category":"関税法","subcategory":"知的財産侵害物品","year":"H27","difficulty":"基本","type":"yn","question":"輸入差止申立ての対象となる知的財産権には、商標権・著作権・特許権・意匠権等が含まれる。","answer":true,"explanation":"関税法第69条の13により、輸入差止申立ての対象となる知的財産権として商標権・著作権・特許権・意匠権・育成者権等が規定されている。"},{"id":453,"category":"関税法","subcategory":"知的財産侵害物品","year":"H26","difficulty":"応用","type":"yn","question":"認定手続において、輸入者が当該貨物は侵害品ではないと主張する場合、輸入者は意見・証拠を提出することができる。","answer":true,"explanation":"関税法第69条の17により、認定手続において輸入者（被申立人）も意見陳述・証拠提出の機会が保障されている（両当事者の手続き保障）。"},{"id":454,"category":"関税法","subcategory":"知的財産侵害物品","year":"H25","difficulty":"難問","type":"yn","question":"輸入差止申立てを行うことができる者は、日本国内において当該知的財産権を有する者に限られる。","answer":false,"explanation":"外国で権利を有する者が日本での侵害品輸入に対しても申立てできる場合がある。また専用実施権者等も申立て適格を持つ場合がある。"},{"id":455,"category":"関税法","subcategory":"輸入禁制品","year":"H27","difficulty":"基本","type":"yn","question":"人を傷つけるおそれのある変形トイガン（模倣銃）は、輸入禁制品に該当する場合がある。","answer":true,"explanation":"関税法第69条の11第1項第2号により、けん銃・小銃等の銃砲類およびこれらの模造品の一部は輸入禁制品に該当する場合がある。"},{"id":456,"category":"関税法","subcategory":"輸入禁制品","year":"H26","difficulty":"応用","type":"yn","question":"絶滅のおそれのある野生動植物の種の国際取引に関する条約（ワシントン条約）に違反して輸入される動植物は、輸入禁制品に該当する場合がある。","answer":true,"explanation":"関税法第69条の11第1項第12号により、ワシントン条約附属書Ⅰ掲載種の違法輸入品は輸入禁制品として規定されている。"},{"id":457,"category":"関税法","subcategory":"輸入禁制品","year":"H25","difficulty":"難問","type":"yn","question":"偽ブランド品は、商標権を侵害するものとして輸入禁制品に該当するが、個人使用目的で少量輸入する場合は例外として認められる。","answer":false,"explanation":"偽ブランド品（商標権侵害物品）は輸入禁制品であり、個人使用目的・少量であっても例外は認められない。"},{"id":458,"category":"関税法","subcategory":"旅具通関","year":"H27","difficulty":"基本","type":"yn","question":"入国旅客が携帯して輸入する酒類の免税数量は、1本760ml換算で3本（合計2.26L超は課税）が目安とされている。","answer":false,"explanation":"旅客携帯品の酒類免税数量は3本（各1本760mL換算）ではなく、現行制度では品目ごとに定められた免税範囲（例：酒類は3本まで）が適用される。ただし厳密な数量は制度改正で変動するため確認が必要。"},{"id":459,"category":"関税法","subcategory":"旅具通関","year":"H26","difficulty":"応用","type":"yn","question":"海外で購入した高価な宝飾品を申告せずに持ち帰った場合、関税法違反（無申告）として罰則が科される場合がある。","answer":true,"explanation":"関税法第109条・第110条等により、免税範囲を超える携帯品を無申告で持ち込むことは関税法違反となり、罰則の対象となる。"},{"id":460,"category":"関税法","subcategory":"旅具通関","year":"H25","difficulty":"難問","type":"yn","question":"別送品として申告した貨物は、入国後6ヶ月以内であれば免税扱いで輸入できる。","answer":false,"explanation":"別送品の免税輸入は、入国時の申告・確認が必要であり、入国後の輸入期限については関税法施行令で定められているが、「6ヶ月以内」という単純な規定ではない。具体的には入国の日から6ヶ月以内に輸入することが必要。"},{"id":461,"category":"通関業法","subcategory":"通関業の監督","year":"H27","difficulty":"基本","type":"yn","question":"税関職員は、通関業者の業務状況を把握するため、営業所に立ち入り検査することができる。","answer":true,"explanation":"通関業法第33条により、税関職員は通関業者の営業所等に立入検査する権限を有する。"},{"id":462,"category":"通関業法","subcategory":"通関業の監督","year":"H26","difficulty":"応用","type":"yn","question":"財務大臣は、通関業者の許可を取り消した場合、その旨を官報に公告しなければならない。","answer":false,"explanation":"通関業法には許可取消しを官報公告する義務を明示した規定はない。行政処分の通知は許可取消しの名義人に対して行われるが、必ずしも官報公告は義務ではない。"},{"id":463,"category":"通関業法","subcategory":"通関業の監督","year":"H25","difficulty":"難問","type":"yn","question":"通関業者に対する業務停止処分は、その営業所の一部についてのみ行うことも可能である。","answer":true,"explanation":"通関業法第34条の業務停止命令は、すべての業務・営業所を対象とする全部停止のほか、特定の業務・営業所に限定した一部停止も可能とされている。"},{"id":464,"category":"通関業法","subcategory":"通関士の職責","year":"H27","difficulty":"応用","type":"yn","question":"通関士は、通関業務に関する研修を受ける努力義務を負うとともに、自己研鑽により専門知識を維持することが求められる。","answer":true,"explanation":"通関士には法令の改正等に対応するための継続的な知識更新が求められており、自己研鑽・研修受講への努力義務が課されている。"},{"id":465,"category":"通関業法","subcategory":"通関士の職責","year":"H26","difficulty":"難問","type":"yn","question":"通関士が記名を拒否した書類を、通関業者が通関士の記名なしに税関に提出することは認められない。","answer":true,"explanation":"通関業法第14条により、通関士を設置する営業所が扱う通関書類には通関士の記名が必要とされており、記名なしの書類提出は認められない。"},{"id":466,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H27","difficulty":"基本","type":"yn","question":"輸出許可を受けた貨物について、許可後に仕向地が変更になった場合、原則として改めて許可を受ける必要がある。","answer":true,"explanation":"輸出許可は特定の仕向地・需要者・数量等に対して付与されるため、仕向地変更は許可内容の変更となり、改めての許可申請が必要となる。"},{"id":467,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H26","difficulty":"応用","type":"yn","question":"輸出者が輸出規制の適否について確認したい場合、経済産業省に対してアドバンス・ルーリング（事前確認）を求めることができる。","answer":true,"explanation":"経済産業省では、輸出規制の適用の有無について輸出者からの事前照会・確認（いわゆる事前確認制度）に応じる仕組みがある。"},{"id":468,"category":"外国為替及び外国貿易法","subcategory":"輸入規制","year":"H25","difficulty":"難問","type":"yn","question":"輸入割当て（IQ）を受けた者が、割当て数量を超えて輸入しようとした場合、超過分については輸入承認を受けることができない。","answer":true,"explanation":"IQ制度は割当て数量の範囲内での輸入を認めるものであり、割当て数量を超えた輸入は認められない。"},{"id":469,"category":"関税評価","subcategory":"課税価格の決定","year":"H27","difficulty":"基本","type":"yn","question":"課税価格の決定に疑義がある場合、輸入者は税関長に対して事前教示を求めることができる。","answer":true,"explanation":"関税法第7条の16の2の事前教示制度により、課税価格の決定方法についても輸入前に税関長の見解を確認できる。"},{"id":470,"category":"関税評価","subcategory":"課税価格の決定","year":"H26","difficulty":"応用","type":"yn","question":"関連会社間取引において、移転価格（TP価格）が独立企業間価格と著しく異なる場合、課税価格の調整が行われることがある。","answer":true,"explanation":"関連会社間取引では、独立当事者間価格と異なる取引価格（TP価格）が設定されることがあり、課税価格評価において価格の妥当性審査が行われる。"},{"id":471,"category":"関税評価","subcategory":"課税価格の決定","year":"H25","difficulty":"難問","type":"yn","question":"第6方法（合理的な方法）は、他のいずれの方法も使えない場合の最後の手段だが、恣意的な価格設定は認められない。","answer":true,"explanation":"第6方法（関税定率法第4条の8）は合理的な方法による決定であり、その合理性はWTO評価協定の精神に沿って判断される。恣意的・差別的な価格設定は禁止される。"},{"id":472,"category":"関税率表","subcategory":"重要な項目","year":"H27","difficulty":"基本","type":"yn","question":"食料品（穀物・野菜・果実等）は、主として関税率表第1部（第1類〜第24類）に分類される。","answer":true,"explanation":"関税率表の第1部（第1類〜第5類）は動植物、第2部（第6類〜第14類）は植物性生産品、第4部（第16類〜第24類）は食料品等として食料品全般が前半部に集中している。"},{"id":473,"category":"関税率表","subcategory":"重要な項目","year":"H26","difficulty":"応用","type":"yn","question":"鉄鋼製品は関税率表第72類・第73類に分類され、アルミニウム製品は第76類に分類される。","answer":true,"explanation":"第72類「鉄鋼」・第73類「鉄鋼製品」・第76類「アルミニウム及びその製品」として金属製品が分類されている。"},{"id":474,"category":"関税率表","subcategory":"重要な項目","year":"H25","difficulty":"難問","type":"yn","question":"医薬品は関税率表第30類に分類されるが、原薬（有効成分）は必ずしも第30類に分類されるとは限らない。","answer":true,"explanation":"第30類は製剤化された医薬品が主な対象であり、原薬（有効成分）は化学的性質に応じて第28類・第29類等に分類されることがある。"},{"id":475,"category":"関税法","subcategory":"関税の時効","year":"H27","difficulty":"基本","type":"yn","question":"不正行為により関税を免れた場合の関税徴収権の消滅時効期間は7年である。","answer":true,"explanation":"関税法第14条第2項により、偽りその他不正の行為により関税を免れた場合の時効は7年（通常の5年より長い）。"},{"id":476,"category":"関税法","subcategory":"関税の時効","year":"H26","difficulty":"応用","type":"yn","question":"関税の時効は、督促状を送付することにより中断（更新）される。","answer":true,"explanation":"国税通則法の準用により、督促状の送付・差押え等の滞納処分は時効の中断（更新）事由となる。"},{"id":477,"category":"関税法","subcategory":"関税の時効","year":"H25","difficulty":"難問","type":"yn","question":"関税の更正請求の期限は法定申告期限から5年であるが、判決等による場合は更正請求できる期間が延長される場合がある。","answer":true,"explanation":"通常の更正請求期限は5年だが、判決・和解等による後発的な事由が生じた場合は、その事由が生じたことを知った日から2ヶ月以内に更正請求できる特例がある。"},{"id":478,"category":"関税法","subcategory":"開港・税関空港","year":"H27","difficulty":"基本","type":"yn","question":"開港とは、外国貿易船が入港することのできる港として政令で定めた港をいう。","answer":true,"explanation":"関税法第2条第1項第1号により、開港は政令で指定された外国貿易船の入港可能な港。現在、横浜・神戸・名古屋・大阪・東京等が指定されている。"},{"id":479,"category":"関税法","subcategory":"開港・税関空港","year":"H26","difficulty":"応用","type":"yn","question":"外国貿易船が開港に入港した場合、船長は直ちに税関に入港の届出をしなければならない。","answer":true,"explanation":"関税法第15条により、外国から入港した外国貿易船の船長は入港後速やかに積荷目録等を提出し、税関への届出（報告）義務を負う。"},{"id":480,"category":"関税法","subcategory":"税関の役割","year":"H27","difficulty":"基本","type":"yn","question":"税関は関税の徴収のほか、輸出入禁制品の取締まり・社会安全の確保も重要な役割の一つである。","answer":true,"explanation":"税関の役割は①歳入確保（関税徴収）②社会安全（麻薬・武器等の密輸防止）③産業保護（知的財産水際保護・ダンピング対策）④貿易統計の4つが主要。"},{"id":481,"category":"関税法","subcategory":"税関の役割","year":"H26","difficulty":"応用","type":"yn","question":"税関は輸出入貨物の通関だけでなく、貿易統計の作成にも関与している。","answer":true,"explanation":"税関が収集した輸出入申告データは財務省貿易統計として集計・公表されており、税関は貿易統計作成の基礎データを提供する役割を担う。"},{"id":482,"category":"関税法","subcategory":"税関の役割","year":"H25","difficulty":"難問","type":"yn","question":"税関は麻薬取締官と同様の捜査権限を持つため、麻薬密輸事件の捜査において独自に逮捕・勾留を行うことができる。","answer":false,"explanation":"税関の犯則調査は行政調査権限であり、警察・麻薬取締官のような逮捕・勾留権限とは異なる。密輸摘発後は検察に告発し、刑事手続きは警察・検察が担当する。"},{"id":483,"category":"通関業法","subcategory":"通関士試験","year":"H27","difficulty":"基本","type":"yn","question":"通関士試験の試験科目には、関税法・通関業法・外国為替及び外国貿易法・関税定率法等が含まれる。","answer":true,"explanation":"通関士試験の試験科目は、①通関業法②関税法・関税定率法等③通関書類の作成等の3科目で構成されており、外為法も出題範囲に含まれる。"},{"id":484,"category":"通関業法","subcategory":"通関士試験","year":"H26","difficulty":"応用","type":"yn","question":"通関士試験において、一部科目のみ合格した場合でも、その科目は次回以降の試験で免除される。","answer":true,"explanation":"通関士試験には科目免除制度があり、合格した科目については翌年・翌々年の試験で免除申請が可能（一定期間有効）。"},{"id":485,"category":"外国為替及び外国貿易法","subcategory":"総合","year":"H27","difficulty":"応用","type":"yn","question":"日本の安全保障貿易管理制度は、WassenaarアレンジメントやNSGなどの国際輸出管理レジームに基づいている。","answer":true,"explanation":"日本の輸出管理制度はWassenaar（通常兵器・汎用品）・NSG（原子力）・AG（生物・化学兵器）・MTCR（ミサイル）等の多国間輸出管理レジームに参加し整合的に運用されている。"},{"id":486,"category":"外国為替及び外国貿易法","subcategory":"総合","year":"H26","difficulty":"難問","type":"yn","question":"外為法に基づく輸出規制の執行において、税関が輸出申告審査で発見した違反事案は経済産業省にも共有される。","answer":true,"explanation":"税関と経済産業省は外為法執行において情報共有・連携する体制を整備しており、輸出規制違反の疑いがある事案は経産省にも連絡される。"},{"id":487,"category":"関税評価","subcategory":"総合","year":"H27","difficulty":"応用","type":"yn","question":"課税価格の決定に当たり、税関長は輸入者から必要な情報・書類の提出を求めることができる。","answer":true,"explanation":"関税定率法第4条の10により、税関長は課税価格決定のために必要な情報・書類の提出を輸入者等に求めることができる。"},{"id":488,"category":"関税評価","subcategory":"総合","year":"H26","difficulty":"難問","type":"yn","question":"輸入者が課税価格の決定に不服がある場合、更正の請求または不服申立ての手続きにより争うことができる。","answer":true,"explanation":"課税価格に関する税関長の処分（更正等）に不服がある場合は、更正の請求・再調査の請求・審査請求等の手続きにより争うことができる。"},{"id":489,"category":"関税率表","subcategory":"総合","year":"H27","difficulty":"応用","type":"yn","question":"輸入申告書に記載した品目番号（HSコード）について、税関が異なる分類が正しいと判断した場合、税関は更正を行うことができる。","answer":true,"explanation":"税関は申告内容の審査において品目分類の誤りを発見した場合、正しい分類に基づく更正（税額の増減）を行う権限を持つ。"},{"id":490,"category":"関税率表","subcategory":"総合","year":"H26","difficulty":"難問","type":"yn","question":"WCO（世界税関機構）は、HS分類に関する紛争を解決するための国際的な仲裁機関としての機能も持つ。","answer":false,"explanation":"WCOはHS条約の管理・改訂や分類勧告（Classification Opinions）を行うが、法的拘束力を持つ仲裁機関ではない。国際的な関税分類紛争の最終解決はWTO紛争解決手続き等による。"},{"id":491,"category":"関税法","subcategory":"輸入申告","year":"H24","difficulty":"応用","type":"yn","question":"電子申告（NACCS）で行った輸入申告は、紙の申告書を別途提出することなく有効な申告として扱われる。","answer":true,"explanation":"NACCSによる電子申告は、関税法上の正式な申告として認められており、紙の申告書の別途提出は不要。"},{"id":492,"category":"関税法","subcategory":"関税の徴収","year":"H24","difficulty":"応用","type":"yn","question":"関税の徴収権は時効によって消滅するが、時効期間の進行は一定の事由によって停止する場合がある。","answer":true,"explanation":"関税の徴収権の時効は、納税申告・納付・猶予等の一定事由によって進行が停止（停止事由）する場合がある（国税通則法準用）。"},{"id":493,"category":"通関業法","subcategory":"通関業務","year":"H24","difficulty":"応用","type":"yn","question":"通関業者が通関業務の依頼を受けた場合、依頼人に対して受任の旨を通知することが望ましい。","answer":true,"explanation":"委任契約の適正な履行の観点から、通関業者は依頼を受けた際に受任の確認・通知を行うことが実務上推奨される。"},{"id":494,"category":"外国為替及び外国貿易法","subcategory":"輸出規制","year":"H24","difficulty":"応用","type":"yn","question":"輸出する貨物が規制対象かどうか不明な場合、経済産業省に照会（リスト規制・キャッチオール規制の確認）することができる。","answer":true,"explanation":"経済産業省の安全保障貿易審査課等では、輸出者からの照会に応じて規制の適否について相談・確認を行うサービスを提供している。"},{"id":495,"category":"関税評価","subcategory":"課税価格","year":"H24","difficulty":"応用","type":"yn","question":"同一の輸入貨物について、関税の課税価格と消費税の課税標準は必ずしも一致しない。","answer":true,"explanation":"関税の課税価格（CIF価格ベース）に関税額を加えたものが消費税の課税標準となるため、両者は一致しない。消費税の課税標準＝課税価格＋関税額（＋その他内国消費税）。"},{"id":496,"category":"関税率表","subcategory":"分類の実務","year":"H24","difficulty":"応用","type":"yn","question":"部品と完成品が同一の輸入申告に含まれる場合、それぞれ独立したHSコードで申告する。","answer":true,"explanation":"部品と完成品は通常それぞれ固有のHSコードを持ち、同一申告内であっても品目ごとに品番・税番・数量・価格を記載して申告する。"},{"id":497,"category":"関税法","subcategory":"総合","year":"H24","difficulty":"難問","type":"yn","question":"通関手続きの国際的な調和・簡素化を推進するための国際条約として、改正京都条約（WCO）がある。","answer":true,"explanation":"WCOの改正京都条約（通関手続の簡易化及び調和に関する国際条約の改正議定書）は、通関手続の国際標準化・簡素化・電子化を推進する重要な国際条約。日本も締結している。"},{"id":498,"category":"通関業法","subcategory":"総合","year":"H24","difficulty":"難問","type":"yn","question":"通関業者は、依頼人が外国法人である場合でも通関業務を受任することができる。","answer":true,"explanation":"通関業法は依頼人の国籍・設立地を問わない。外国法人・非居住者からの依頼であっても通関業務として受任できる。"},{"id":499,"category":"外国為替及び外国貿易法","subcategory":"総合","year":"H24","difficulty":"難問","type":"yn","question":"外為法に基づく輸出規制は、貨物の輸出だけでなく、技術の提供（役務取引）も規制の対象となる。","answer":true,"explanation":"外為法第25条により、規制対象技術の提供（役務取引）も輸出と同様の規制が適用される。貨物規制と技術規制の両輪が外為法輸出管理の基本構造。"},{"id":500,"category":"関税法","subcategory":"総合","year":"R5","difficulty":"応用","type":"yn","question":"通関士資格は、国際物流・貿易実務において、法令遵守（コンプライアンス）を担保する専門家としての役割が期待されている。","answer":true,"explanation":"通関士は輸出入申告の適正化・法令遵守を確保する専門職であり、AEO制度や内部統制の観点から企業のコンプライアンス体制において重要な位置を占める。"},{"id":501,"category":"関税定率法","subcategory":"特別特恵","year":"R6改正","difficulty":"応用","type":"yn","question":"特別特恵受益国の対象として、後発開発途上国でなくなる旨の国際連合総会の決議の日から起算して2年を経過するまでの国が追加された。","answer":true,"explanation":"関税定率法改正により、LDC（後発開発途上国）から卒業する国（国連総会の決議日から2年間）も特別特恵受益国の対象として追加された。卒業後も一定期間、特恵措置の恩恵を受けられる経過措置的な規定。"},{"id":502,"category":"外国為替及び外国貿易法","subcategory":"輸出許可の特例","year":"R6改正","difficulty":"難問","type":"yn","question":"輸出貿易管理令別表第1の1項（武器・兵器）に該当する貨物であっても、無償で輸出するべきものとして無償で輸入した貨物であって経済産業大臣が告示で定めるものについては、輸出の許可の特例が適用され輸出許可が不要となる。","answer":true,"explanation":"改正前は別表第1の1項（武器等）の貨物はすべて個別の輸出許可が必要だった。改正により、無償輸入・無償輸出の形態をとる特定の貨物（経済産業大臣告示で定めるもの）については輸出許可の特例が適用されるようになった。"},{"id":503,"category":"関税法","subcategory":"特例申告","year":"R6改正","difficulty":"応用","type":"yn","question":"特例輸入者は、関税等の保全のために必要があると認められる場合を除き、担保を提供することなく特例申告貨物の納期限の延長を行うことができるようになった。","answer":true,"explanation":"改正前は納期限延長に際して担保提供が原則として必要だった。改正により、関税等の保全のために必要と認められる場合を除き、担保なしで納期限延長が可能となった。信頼性の高いAEO事業者（特例輸入者）の手続き負担を軽減する措置。"}];

// ===== STATE =====
let filtered = [];
let queue    = [];
let current  = null;
let answered = false;
let sessionCorrect = 0;
let sessionTotal   = 0;
let history  = []; // 'c' or 'w'
let catStats = {}; // {cat: {c:0, w:0}}

// 全カテゴリ
const CATS = [...new Set(ALL_QUESTIONS.map(q => q.category))];
let activeCats  = new Set(CATS);
let activeDiffs = new Set(['基本','応用','難問']);

// ===== INIT =====
function init() {
  buildCatChips();
  bindDiffChips();
  rebuildQueue();
  renderCard();
}

function buildCatChips() {
  const wrap = document.getElementById('cat-chips');
  wrap.innerHTML = '';
  // 全選択ボタン
  const allBtn = document.createElement('button');
  allBtn.className = 'chip active';
  allBtn.textContent = 'すべて';
  allBtn.dataset.cat = '__all__';
  allBtn.addEventListener('click', () => {
    if (activeCats.size === CATS.length) {
      activeCats.clear();
    } else {
      CATS.forEach(c => activeCats.add(c));
    }
    updateCatChips();
    rebuildQueue();
    renderCard();
  });
  wrap.appendChild(allBtn);

  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'chip active';
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener('click', () => {
      if (activeCats.has(cat)) activeCats.delete(cat);
      else activeCats.add(cat);
      updateCatChips();
      rebuildQueue();
      renderCard();
    });
    wrap.appendChild(btn);
  });
}

function updateCatChips() {
  document.querySelectorAll('[data-cat]').forEach(btn => {
    if (btn.dataset.cat === '__all__') {
      btn.classList.toggle('active', activeCats.size === CATS.length);
    } else {
      btn.classList.toggle('active', activeCats.has(btn.dataset.cat));
    }
  });
}

function bindDiffChips() {
  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.diff;
      if (activeDiffs.has(d)) activeDiffs.delete(d);
      else activeDiffs.add(d);
      btn.classList.toggle('active', activeDiffs.has(d));
      rebuildQueue();
      renderCard();
    });
  });
}

function rebuildQueue() {
  filtered = ALL_QUESTIONS.filter(q =>
    activeCats.has(q.category) && activeDiffs.has(q.difficulty)
  );
  // シャッフル
  queue = [...filtered].sort(() => Math.random() - 0.5);
  sessionCorrect = 0;
  sessionTotal   = 0;
  history = [];
  updateHeader();
  updateProgress();
}

// ===== RENDER =====
function renderCard() {
  const app = document.getElementById('app-area');

  if (filtered.length === 0) {
    app.innerHTML = `
      <div class="card">
        <div class="empty-state">
          <div style="font-size:2rem">📋</div>
          <p>条件に合う問題がありません。<br>フィルターを変更してください。</p>
        </div>
      </div>`;
    return;
  }

  if (queue.length === 0) {
    renderComplete(app);
    return;
  }

  current  = queue.shift();
  answered = false;

  const dotsHTML = history.slice(-30).map(h => `<div class="dot ${h}"></div>`).join('');
  const qIdx = filtered.length - queue.length;

  app.innerHTML = `
    <div class="history-dots">${dotsHTML}</div>
    <div class="card">
      <div class="card-meta">
        <span class="badge badge-cat">${current.category}</span>
        <span class="badge badge-sub">${current.subcategory}</span>
        <span class="badge badge-year">${current.year}</span>
        <span class="badge badge-diff-${current.difficulty}">${current.difficulty}</span>
        <span class="q-number">No.${current.id}</span>
      </div>
      <div class="question-text">${current.question}</div>
      <div class="answer-area">
        <button class="btn-answer btn-true"  onclick="answer(true)">○　正しい</button>
        <button class="btn-answer btn-false" onclick="answer(false)">×　誤り</button>
      </div>
      <div class="result-panel" id="result-panel"></div>
      <div class="history-dots" id="dot-preview"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">次の問題へ →</button>
    </div>`;

  updateProgress(qIdx, filtered.length);
}

function answer(userAns) {
  if (answered) return;
  answered = true;
  sessionTotal++;

  const correct = (userAns === current.answer);
  if (correct) sessionCorrect++;

  // カテゴリ別集計
  if (!catStats[current.category]) catStats[current.category] = {c:0,w:0};
  correct ? catStats[current.category].c++ : catStats[current.category].w++;

  history.push(correct ? 'c' : 'w');

  // ボタン色変え
  const btns = document.querySelectorAll('.btn-answer');
  btns.forEach(b => b.disabled = true);

  const trueBtn  = btns[0];
  const falseBtn = btns[1];

  if (current.answer === true) {
    trueBtn.classList.add('correct');
    if (!correct) falseBtn.classList.add('wrong');
    else          falseBtn.classList.add('dimmed');
  } else {
    falseBtn.classList.add('correct');
    if (!correct) trueBtn.classList.add('wrong');
    else          trueBtn.classList.add('dimmed');
  }

  // 解説
  const panel = document.getElementById('result-panel');
  panel.className = 'result-panel show ' + (correct ? 'correct-panel' : 'wrong-panel');
  panel.innerHTML = `
    <div class="result-label ${correct ? 'correct-label' : 'wrong-label'}">
      ${correct ? '✓ 正解' : '✗ 不正解'}
      &nbsp;—&nbsp;正しい答え：<strong>${current.answer ? '○（正しい）' : '×（誤り）'}</strong>
    </div>
    <div class="explanation-text">${current.explanation}</div>`;

  document.getElementById('btn-next').classList.add('show');
  updateHeader();
  updateProgress(filtered.length - queue.length, filtered.length);
}

function nextQuestion() {
  renderCard();
}

function renderComplete(app) {
  const rate = sessionTotal > 0 ? Math.round(sessionCorrect / sessionTotal * 100) : 0;

  let accRows = Object.entries(catStats).map(([cat, s]) => {
    const total = s.c + s.w;
    const pct   = total > 0 ? Math.round(s.c / total * 100) : 0;
    const color = pct >= 80 ? '#1a5c2a' : pct >= 60 ? '#b8941e' : '#8b1a1a';
    return `
      <div class="acc-row">
        <span style="min-width:140px;font-size:0.8rem">${cat}</span>
        <div class="acc-bar-wrap"><div class="acc-bar" style="width:${pct}%;background:${color}"></div></div>
        <span style="min-width:64px;text-align:right;color:${color};font-weight:600">${pct}% (${s.c}/${total})</span>
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="card">
      <div class="session-complete">
        <h2>セッション完了</h2>
        <div class="score-display">${sessionCorrect}<span> / ${sessionTotal}</span></div>
        <div style="color:var(--muted);font-size:0.9rem">正答率 ${rate}%</div>
        ${accRows ? `<div class="accuracy-section"><h3>分野別正答率</h3>${accRows}</div>` : ''}
        <button class="btn-restart" onclick="restart()">もう一度挑戦する</button>
      </div>
    </div>`;
  updateProgress(filtered.length, filtered.length);
}

function restart() {
  catStats = {};
  rebuildQueue();
  renderCard();
}

// ===== UTILS =====
function updateHeader() {
  const rate = sessionTotal > 0 ? Math.round(sessionCorrect / sessionTotal * 100) + '%' : '—';
  document.getElementById('hdr-rate').textContent    = rate;
  document.getElementById('hdr-correct').textContent = sessionCorrect;
  document.getElementById('hdr-total').textContent   = sessionTotal;
}

function updateProgress(done, total) {
  if (done === undefined) { done = 0; total = filtered.length; }
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} 問`;
}

init();
</script>
</body>
</html>
