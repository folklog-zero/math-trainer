<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATA適性検査 知的能力 練習アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #181c27;
  --bg3: #1e2333;
  --bg4: #252b3d;
  --border: #2e3550;
  --border2: #3d4666;
  --text: #e8eaf2;
  --text2: #9ba3bf;
  --text3: #636b87;
  --accent: #4f8ef7;
  --accent2: #3a6fd8;
  --accent-bg: rgba(79,142,247,0.1);
  --accent-border: rgba(79,142,247,0.3);
  --green: #3ecf8e;
  --green-bg: rgba(62,207,142,0.1);
  --green-border: rgba(62,207,142,0.3);
  --red: #f76f6f;
  --red-bg: rgba(247,111,111,0.1);
  --red-border: rgba(247,111,111,0.3);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.1);
  --r: 10px;
  --r2: 14px;
  --serif: 'Noto Serif JP', serif;
  --sans: 'Noto Sans JP', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.7;
}

/* ── HEADER ── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,17,23,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
}
.logo {
  font-family: var(--serif);
  font-size: 16px; font-weight: 600;
  color: var(--text);
  letter-spacing: .03em;
}
.logo span { color: var(--accent); }
.header-meta { font-size: 12px; color: var(--text3); }

/* ── MAIN LAYOUT ── */
.container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* ── HERO ── */
.hero {
  text-align: center;
  padding: 3rem 1rem 2.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}
.hero-badge {
  display: inline-block;
  font-size: 11px; font-weight: 700; letter-spacing: .1em;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-border);
  border-radius: 99px;
  padding: 4px 14px;
  margin-bottom: 1rem;
  text-transform: uppercase;
}
.hero h1 {
  font-family: var(--serif);
  font-size: clamp(22px, 4vw, 34px);
  font-weight: 600;
  color: var(--text);
  margin-bottom: .75rem;
  line-height: 1.35;
}
.hero p { font-size: 14px; color: var(--text2); max-width: 520px; margin: 0 auto; }

/* ── GLOBAL STATS ── */
.global-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 2rem;
}
.gstat {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 16px;
}
.gstat-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; letter-spacing: .04em; }
.gstat-val { font-size: 22px; font-weight: 700; color: var(--text); }
.gstat-val.green { color: var(--green); }
.gstat-val.accent { color: var(--accent); }

/* ── CATEGORY TABS ── */
.cat-tabs {
  display: flex; gap: 8px; flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.cat-tab {
  padding: 8px 18px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 13px; font-family: var(--sans);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.cat-tab:hover { border-color: var(--accent); color: var(--accent); }
.cat-tab.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}

/* ── PROGRESS BAR ── */
.progress-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 18px;
  margin-bottom: 1.5rem;
  display: flex; align-items: center; gap: 16px;
}
.progress-bar-track {
  flex: 1; height: 6px;
  background: var(--bg4);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  border-radius: 99px;
  transition: width .4s ease;
}
.progress-text { font-size: 12px; color: var(--text2); white-space: nowrap; }

/* ── QUESTION MAP ── */
.qmap-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 18px;
  margin-bottom: 1.5rem;
}
.qmap-label { font-size: 11px; color: var(--text3); margin-bottom: 10px; letter-spacing: .04em; }
.qmap { display: flex; flex-wrap: wrap; gap: 6px; }
.qd {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500;
  cursor: pointer;
  color: var(--text3);
  background: var(--bg3);
  transition: all .15s;
}
.qd:hover { border-color: var(--accent); color: var(--accent); }
.qd.current { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); font-weight: 700; }
.qd.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green); }
.qd.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red); }

/* ── QUESTION CARD ── */
.qcard {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
  padding: 1.75rem;
  margin-bottom: 1.25rem;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.qcard-top {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 1.25rem;
}
.qcat-badge {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid var(--accent-border);
}
.qnum-label { font-size: 12px; color: var(--text3); }
.passage {
  font-size: 13.5px;
  color: var(--text2);
  line-height: 1.9;
  background: var(--bg3);
  border-left: 3px solid var(--accent);
  padding: 14px 18px;
  border-radius: 0 var(--r) var(--r) 0;
  margin-bottom: 1.25rem;
}
.table-title { font-size: 12px; color: var(--text3); margin-bottom: 8px; }
.table-wrap { overflow-x: auto; margin-bottom: 1.25rem; }
table.dtable {
  width: 100%; border-collapse: collapse; font-size: 13px;
  min-width: 400px;
}
table.dtable th {
  background: var(--bg3);
  padding: 8px 14px;
  text-align: left;
  font-weight: 500;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
table.dtable td {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}
table.dtable tr:last-child td { border-bottom: none; }
table.dtable tr:hover td { background: var(--bg3); }
.qtxt {
  font-size: 15px;
  color: var(--text);
  line-height: 1.75;
  margin-bottom: 1.25rem;
  white-space: pre-line;
}

/* ── OPTIONS ── */
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r);
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  background: var(--bg3);
  transition: all .15s;
  line-height: 1.6;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent);
  color: var(--text);
  background: var(--accent-bg);
}
.opt.disabled { cursor: default; }
.opt.correct {
  border-color: var(--green-border);
  background: var(--green-bg);
  color: var(--green);
}
.opt.wrong {
  border-color: var(--red-border);
  background: var(--red-bg);
  color: var(--red);
}
.opt-key {
  font-weight: 700; font-size: 12px;
  min-width: 22px; height: 22px;
  border-radius: 5px;
  background: var(--bg4);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}
.opt.correct .opt-key { background: var(--green-bg); color: var(--green); }
.opt.wrong .opt-key { background: var(--red-bg); color: var(--red); }
.opt.correct .icon-check::before { content: '✓'; }
.opt.wrong .icon-x::before { content: '✗'; }

/* ── EXPLANATION ── */
.explanation {
  margin-top: 14px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.8;
  background: var(--bg3);
  border-left: 3px solid var(--green);
  padding: 12px 16px;
  border-radius: 0 var(--r) var(--r) 0;
  animation: fadeIn .2s ease;
}
.explanation strong { color: var(--green); }

/* ── NAV ── */
.nav-row {
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
}
.btn {
  padding: 9px 20px;
  border-radius: var(--r);
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text2);
  font-size: 13px; font-family: var(--sans);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .3; cursor: default; }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
.btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #fff; }
.nav-center { font-size: 13px; color: var(--text3); text-align: center; }

/* ── RESULT PANEL ── */
.result-panel {
  text-align: center;
  padding: 3rem 1.5rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--r2);
}
.result-panel h2 {
  font-family: var(--serif);
  font-size: 22px; font-weight: 600;
  margin-bottom: 8px;
}
.score-big {
  font-size: 72px; font-weight: 700;
  color: var(--accent);
  line-height: 1;
  margin: .5rem 0;
}
.score-sub { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
.result-msg {
  font-size: 15px; color: var(--text2);
  margin-bottom: 1.75rem;
}
.result-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ── FOOTER ── */
.site-footer {
  text-align: center;
  padding: 2rem;
  font-size: 12px;
  color: var(--text3);
  border-top: 1px solid var(--border);
}

/* ── RESPONSIVE ── */
@media (max-width: 600px) {
  .site-header { padding: 0 1rem; }
  .container { padding: 1.25rem 1rem 3rem; }
  .hero { padding: 2rem .5rem 1.75rem; }
  .qcard { padding: 1.25rem; }
  .score-big { font-size: 56px; }
  .cat-tab { padding: 7px 14px; font-size: 12px; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">DATA<span>適性検査</span>練習</div>
  <div class="header-meta" id="header-meta">全70問</div>
</header>

<div class="container">
  <div class="hero">
    <div class="hero-badge">ダイヤモンド社 総合能力診断DATA 対策</div>
    <h1>知的能力テスト<br>練習アプリ</h1>
    <p>文章理解・問題解決・データ分析・関係把握の4領域、全70問。選択後に即採点・解説表示。</p>
  </div>

  <div class="global-stats" id="global-stats"></div>
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-track"><div class="progress-bar-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="progress-text" id="prog-text">0 / 0</div>
  </div>
  <div class="qmap-wrap">
    <div class="qmap-label">問題マップ（クリックでジャンプ）</div>
    <div class="qmap" id="qmap"></div>
  </div>
  <div id="qarea"></div>
  <div class="nav-row" id="nav-row"></div>
</div>

<footer class="site-footer">
  DATA適性検査 知的能力練習アプリ &nbsp;|&nbsp; ダイヤモンド社「総合能力診断DATAシリーズ」対策用私的練習ツール
</footer>

<script>
const CATS = ['文章理解', '問題解決', 'データ分析', '関係把握'];

const QDB = {

/* ===================== 文章理解 ===================== */
'文章理解': [
{id:'c01', passage:'物流における「モーダルシフト」とは、トラック輸送から鉄道や船舶などの輸送手段へ切り替えることを指す。CO₂排出量の削減や道路混雑緩和を主な目的とするが、リードタイムが延びる場合もある。政府は補助金制度を設け普及を促進しているが、中小企業への浸透は依然として課題である。',
q:'本文の主旨として最も適切なものはどれか。',
opts:['モーダルシフトはコスト削減のみを目的としている。','モーダルシフトは環境・交通上の利点がある一方、課題も残っている。','政府補助金により中小企業への普及は完了した。','鉄道輸送はあらゆる面でトラック輸送に勝る。'],
ans:1, exp:'メリット（環境・混雑緩和）とデメリット（リードタイム・中小普及）の両面が述べられている。一方だけを強調する選択肢は不適切。'},

{id:'c02', passage:'通関士試験は、貿易に関わる法令・実務を問う国家資格試験である。合格率は例年10〜15%程度と難関とされ、法令科目・実務科目の両方で基準点を超える必要がある。独学での合格者も多いが、専門的な知識体系を理解する自学自習の姿勢が求められる。',
q:'通関士試験について本文から読み取れる内容として正しいものはどれか。',
opts:['合格率は50%を超えており、比較的容易な試験である。','一つの科目で基準点を超えれば合格できる。','難関試験であるが、独学での合格例もある。','専門学校への通学が合格の絶対条件である。'],
ans:2, exp:'「合格率10〜15%程度と難関」かつ「独学での合格者も多い」と明記。'},

{id:'c03', passage:'土木遺産としての農業用水利施設は、単なる灌漑装置としてだけでなく、地域の歴史・文化・生態系と深く結びついた存在である。保全においては、機能維持だけでなく景観的・文化的価値の継承が求められる。しかし老朽化に伴う更新では現代的工法が採用され、伝統的な石積み構造が失われるケースも少なくない。',
q:'この文章が示す土木遺産保全の課題として最も適切なものはどれか。',
opts:['老朽化した施設はすべて新しい工法で更新すべきである。','機能維持と文化的価値の継承を両立することが難しい。','農業用水利施設に景観的価値はなく、機能のみが重要である。','石積み構造は現代工法より必ず優れている。'],
ans:1, exp:'機能維持のための更新が伝統的構造を失わせる「機能と文化価値のトレードオフ」が課題として示されている。'},

{id:'c04', passage:'生態系サービスとは、人間が自然から受ける便益の総称であり、食料・水の供給、気候調節、精神的・文化的価値などが含まれる。経済活動の拡大に伴い、生態系サービスの劣化が進んでいる地域も多い。この概念は、自然を経済的価値で評価することへの批判もあるが、政策立案において有用なフレームワークとなっている。',
q:'生態系サービスという概念について、本文から確実に言えることはどれか。',
opts:['生態系サービスは食料供給だけを指す狭義の概念である。','批判がある一方で、政策立案上の有用性は認められている。','経済活動の拡大は常に生態系サービスを向上させる。','経済的評価に批判はなく、広く受け入れられている。'],
ans:1, exp:'「批判もあるが、政策立案において有用なフレームワーク」という両側面が本文に明記されている。'},

{id:'c05', passage:'近年のサプライチェーン管理では、可視化（ビジビリティ）の確保が重要視されている。特定の供給者への過度な依存はリスクを高めるため、複数購買（マルチソーシング）が推奨される。一方でサプライヤー数を増やすと管理コストが増加するため、最適化が求められる。',
q:'本文でサプライチェーン管理の課題として挙げられているものはどれか。',
opts:['単一購買は常にコスト最小化につながる。','マルチソーシングにより管理コストが増加するというトレードオフ。','可視化の確保は不要であるという考え方が主流になっている。','サプライヤーを増やすほどリスクは必ず減少する。'],
ans:1, exp:'「マルチソーシングを推奨しつつも管理コストが増加する」というトレードオフ課題が明示されている。'},

{id:'c06', passage:'民俗学者の柳田國男は、全国の口承伝承を収集・体系化し、日本民俗学の基礎を築いた。彼の代表作『遠野物語』は、岩手県遠野地方の伝承を記録したものであり、日本民俗学の出発点とも評される。柳田は「常民」の日常生活に注目し、歴史から見落とされがちな庶民の文化を学問的に位置付けた。',
q:'柳田國男の学問的業績として本文から読み取れることはどれか。',
opts:['西洋民俗学を日本に輸入しただけに過ぎない。','庶民の文化・伝承を学問的に体系化した先駆者である。','遠野物語は現代小説として高い評価を受けた。','柳田は農業経済を専門とし、民俗学は副業であった。'],
ans:1, exp:'口承伝承の収集・体系化、「常民」への着目、民俗学の基礎構築が述べられており、選択肢Bが直接対応する。'},

{id:'c07', passage:'貿易における「インコタームズ」とは、売主と買主の間で費用・リスクの分担をどの時点で行うかを定めた国際的な規則である。2020年版では11の取引条件が定められており、FOBやCIFなどが代表的である。誤った条件の選択は契約上のトラブルを招くため、正確な理解が不可欠である。',
q:'インコタームズに関して本文から言えることはどれか。',
opts:['インコタームズは日本国内の取引にのみ適用される。','2020年版には11の取引条件があり、正確な理解が重要である。','FOBとCIFは同一の取引条件を指す。','インコタームズを使用しない取引はすべて無効である。'],
ans:1, exp:'「2020年版では11の取引条件」「正確な理解が不可欠」が本文に明記されており、選択肢Bが対応する。'},

{id:'c08', passage:'農業における「スマート農業」とは、ICTやロボット技術、ドローンなどを活用して農業の効率化・省力化を図る取り組みである。高齢化による農業従事者の減少が課題となる中、スマート農業は労働力不足の解決策として注目されている。ただし初期導入コストが高く、小規模農家には負担が大きい。',
q:'スマート農業の課題として本文が述べているものはどれか。',
opts:['技術的な性能が不十分で実用化が難しい。','初期導入コストが高く、特に小規模農家への普及に課題がある。','農業従事者がICTを必要としていない。','高齢化問題とは無関係な技術である。'],
ans:1, exp:'「初期導入コストが高く、小規模農家には負担が大きい」と明記されている。'},

let state = {
  cat: CATS[0],
  answers: {},
  idx: 0,
};

function qs() { return QDB[state.cat]; }

function totalCorrect() {
  let c = 0;
  CATS.forEach(cat => QDB[cat].forEach(q => { if (state.answers[q.id] === q.ans) c++; }));
  return c;
}
function totalAnswered() {
  let c = 0;
  CATS.forEach(cat => QDB[cat].forEach(q => { if (state.answers[q.id] !== undefined) c++; }));
  return c;
}
function totalQ() {
  let c = 0; CATS.forEach(cat => c += QDB[cat].length); return c;
}

function render() {
  renderHeader();
  renderGlobalStats();
  renderTabs();
  renderProgress();
  renderQMap();
  renderQ();
}

function renderHeader() {
  const tot = totalQ();
  document.getElementById('header-meta').textContent = `全${tot}問`;
}

function renderGlobalStats() {
  const tot = totalQ();
  const answered = totalAnswered();
  const correct = totalCorrect();
  const pct = answered > 0 ? Math.round(correct / answered * 100) : 0;
  document.getElementById('global-stats').innerHTML = `
    <div class="gstat"><div class="gstat-label">全問題数</div><div class="gstat-val accent">${tot}</div></div>
    <div class="gstat"><div class="gstat-label">回答済み</div><div class="gstat-val">${answered}</div></div>
    <div class="gstat"><div class="gstat-label">正解数</div><div class="gstat-val green">${correct}</div></div>
    <div class="gstat"><div class="gstat-label">総合正答率</div><div class="gstat-val ${pct>=70?'green':''}">${answered>0?pct+'%':'—'}</div></div>
  `;
}

function renderTabs() {
  document.getElementById('cat-tabs').innerHTML = CATS.map(c => {
    const qs2 = QDB[c];
    const done = qs2.filter(q => state.answers[q.id] !== undefined).length;
    return `<button class="cat-tab ${state.cat===c?'active':''}" onclick="switchCat('${c}')">${c} <span style="opacity:.7;font-size:11px;">${done}/${qs2.length}</span></button>`;
  }).join('');
}

function renderProgress() {
  const qs2 = qs();
  const done = qs2.filter(q => state.answers[q.id] !== undefined).length;
  const pct = Math.round(done / qs2.length * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-text').textContent = `${done} / ${qs2.length} 問回答済み`;
}

function renderQMap() {
  const qs2 = qs();
  document.getElementById('qmap').innerHTML = qs2.map((q, i) => {
    let cls = 'qd';
    if (i === state.idx) cls += ' current';
    else if (state.answers[q.id] !== undefined) cls += state.answers[q.id] === q.ans ? ' correct' : ' wrong';
    return `<div class="${cls}" onclick="goQ(${i})" title="第${i+1}問">${i+1}</div>`;
  }).join('');
}

function renderQ() {
  const qs2 = qs();
  if (state.idx >= qs2.length) { renderResult(); return; }
  const q = qs2[state.idx];
  const done = state.answers[q.id] !== undefined;

  const passageHtml = q.passage
    ? `<div class="passage">${q.passage.replace(/\n/g,'<br>')}</div>` : '';

  const tableHtml = q.tbl ? `
    ${q.tt ? `<div class="table-title">${q.tt}</div>` : ''}
    <div class="table-wrap">
      <table class="dtable">
        <thead><tr>${q.tbl.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
        <tbody>${q.tbl.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table>
    </div>` : '';

  const optsHtml = q.opts.map((o, i) => {
    let cls = 'opt';
    if (done) {
      cls += ' disabled';
      if (i === q.ans) cls += ' correct';
      else if (state.answers[q.id] === i) cls += ' wrong';
    }
    const key = String.fromCharCode(65+i);
    return `<div class="${cls}" onclick="${done?'':` selA('${q.id}',${i})`}">
      <span class="opt-key">${key}</span>
      <span>${o}</span>
    </div>`;
  }).join('');

  const expHtml = done
    ? `<div class="explanation"><strong>解説：</strong>${q.exp}</div>` : '';

  document.getElementById('qarea').innerHTML = `
    <div class="qcard">
      <div class="qcard-top">
        <span class="qcat-badge">${q.cat}</span>
        <span class="qnum-label">第 ${state.idx+1} 問 / 全 ${qs2.length} 問</span>
      </div>
      ${tableHtml}${passageHtml}
      <div class="qtxt">${q.q}</div>
      <div class="opts">${optsHtml}</div>
      ${expHtml}
    </div>`;

  document.getElementById('nav-row').innerHTML = `
    <button class="btn" onclick="prevQ()" ${state.idx===0?'disabled':''}>← 前の問題</button>
    <div class="nav-center">${state.idx+1} / ${qs2.length}</div>
    <button class="btn btn-primary" onclick="nextQ()" ${state.idx>=qs2.length-1?'disabled':''}>次の問題 →</button>
  `;
}

function renderResult() {
  const qs2 = qs();
  const correct = qs2.filter(q => state.answers[q.id] === q.ans).length;
  const total = qs2.length;
  const pct = Math.round(correct / total * 100);
  const msg = pct >= 80 ? '素晴らしい！本番でも十分通用するレベルです。'
    : pct >= 60 ? 'まずまずです。間違えた問題を見直しましょう。'
    : '解説をよく読んで、もう一度挑戦してみてください。';

  document.getElementById('qarea').innerHTML = `
    <div class="result-panel">
      <h2>${state.cat} — 結果</h2>
      <div class="score-big">${pct}<span style="font-size:28px;font-weight:400;">%</span></div>
      <div class="score-sub">${correct} / ${total} 問正解</div>
      <div class="result-msg">${msg}</div>
      <div class="result-btns">
        <button class="btn btn-primary" onclick="resetCat()">もう一度挑戦</button>
        <button class="btn" onclick="backToFirst()">問題一覧に戻る</button>
      </div>
    </div>`;
  document.getElementById('nav-row').innerHTML = '';
}

function selA(id, i) {
  state.answers[id] = i;
  render();
  window.scrollTo({ top: document.querySelector('.qcard') ? document.querySelector('.qcard').offsetTop - 80 : 0, behavior: 'smooth' });
}
function nextQ() { if (state.idx < qs().length - 1) { state.idx++; render(); scrollToQ(); } else { state.idx = qs().length; render(); } }
function prevQ() { if (state.idx > 0) { state.idx--; render(); scrollToQ(); } }
function goQ(i) { state.idx = i; render(); scrollToQ(); }
function switchCat(c) { state.cat = c; state.idx = 0; render(); scrollToTop(); }
function resetCat() { qs().forEach(q => delete state.answers[q.id]); state.idx = 0; render(); scrollToTop(); }
function backToFirst() { state.idx = 0; render(); scrollToTop(); }
function scrollToQ() { const el = document.getElementById('qarea'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

render();
</script>
