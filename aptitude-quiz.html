<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>思考力診断テスト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --accent2: #2c3e7a;
    --muted: #7a7a7a;
    --border: #d0c8b8;
    --correct: #27ae60;
    --wrong: #c0392b;
    --card: #faf7f2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Serif JP', serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(0,0,0,0.04) 28px);
  }

  #app {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px;
  }

  /* HEADER */
  .header {
    text-align: center;
    padding: 40px 0 32px;
    border-bottom: 2px solid var(--ink);
    margin-bottom: 40px;
    position: relative;
  }
  .header::after {
    content: '';
    display: block;
    width: 60%;
    height: 1px;
    background: var(--border);
    margin: 8px auto 0;
  }
  .header h1 {
    font-size: 2rem;
    letter-spacing: 0.15em;
    font-weight: 700;
  }
  .header h1 span {
    color: var(--accent);
  }
  .header p {
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* START SCREEN */
  #start-screen {
    text-align: center;
    padding: 40px 20px;
  }
  .start-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 32px 0;
  }
  .info-card {
    border: 1px solid var(--border);
    padding: 20px 12px;
    background: var(--card);
  }
  .info-card .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 2rem;
    font-weight: 600;
    color: var(--accent2);
    display: block;
  }
  .info-card .label {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    display: block;
    letter-spacing: 0.1em;
  }
  .category-list {
    text-align: left;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 20px 24px;
    margin: 24px 0;
  }
  .category-list h3 {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .category-list ul {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .category-list li {
    font-size: 0.9rem;
    padding-left: 16px;
    position: relative;
  }
  .category-list li::before {
    content: '▸';
    position: absolute;
    left: 0;
    color: var(--accent);
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    margin-bottom: 24px;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent2);
    transition: width 0.4s ease;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent2);
    padding: 28px 28px 24px;
    margin-bottom: 20px;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .q-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    background: var(--accent2);
    color: white;
    padding: 2px 8px;
  }
  .q-category {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    border: 1px solid var(--border);
    padding: 2px 8px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .q-text {
    font-size: 1rem;
    line-height: 1.9;
    margin-bottom: 8px;
  }
  .q-sub {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 8px;
    line-height: 1.7;
    border-left: 2px solid var(--border);
    padding-left: 12px;
  }

  /* TABLE */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin: 16px 0;
    font-family: 'IBM Plex Mono', monospace;
  }
  .data-table th {
    background: var(--ink);
    color: var(--paper);
    padding: 8px 12px;
    text-align: center;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .data-table td {
    border: 1px solid var(--border);
    padding: 7px 12px;
    text-align: center;
  }
  .data-table tr:nth-child(even) td {
    background: rgba(0,0,0,0.02);
  }
  .data-table .row-header {
    text-align: left;
    font-family: 'Noto Serif JP', serif;
    background: rgba(44,62,122,0.05);
  }

  /* SVG PUZZLE */
  .svg-wrap {
    display: flex;
    justify-content: center;
    margin: 16px 0;
  }
  .svg-wrap svg {
    border: 1px solid var(--border);
    background: white;
  }

  /* TEXT PASSAGE */
  .passage {
    background: white;
    border: 1px solid var(--border);
    padding: 16px 20px;
    font-size: 0.88rem;
    line-height: 2;
    margin: 12px 0;
    max-height: 200px;
    overflow-y: auto;
  }
  .passage .underline {
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-underline-offset: 3px;
  }
  .reorder-items {
    background: white;
    border: 1px solid var(--border);
    padding: 12px 16px;
    font-size: 0.88rem;
    line-height: 1.9;
    margin: 12px 0;
  }
  .reorder-items p {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .reorder-items p:last-child { border-bottom: none; }
  .reorder-items strong { color: var(--accent2); }

  /* OPTIONS */
  .options {
    display: grid;
    gap: 10px;
    margin-top: 20px;
  }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    border: 1px solid var(--border);
    background: white;
    cursor: pointer;
    font-family: 'Noto Serif JP', serif;
    font-size: 0.9rem;
    text-align: left;
    line-height: 1.7;
    transition: all 0.15s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent2);
    background: rgba(44,62,122,0.04);
    transform: translateX(3px);
  }
  .option-btn .opt-label {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--accent2);
    min-width: 20px;
    font-size: 0.85rem;
    margin-top: 1px;
  }
  .option-btn.selected {
    border-color: var(--accent2);
    background: rgba(44,62,122,0.07);
  }
  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(39,174,96,0.08);
  }
  .option-btn.correct .opt-label { color: var(--correct); }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(192,57,43,0.07);
  }
  .option-btn.wrong .opt-label { color: var(--wrong); }
  .option-btn:disabled { cursor: default; }

  /* FEEDBACK */
  .feedback {
    margin-top: 16px;
    padding: 16px 20px;
    border-left: 4px solid var(--correct);
    background: rgba(39,174,96,0.06);
    font-size: 0.88rem;
    line-height: 1.8;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.wrong-fb { border-color: var(--wrong); background: rgba(192,57,43,0.05); }
  .feedback strong { font-weight: 700; }

  /* NAVIGATION */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .nav-score {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* BUTTONS */
  .btn {
    font-family: 'Noto Serif JP', serif;
    font-size: 0.9rem;
    padding: 12px 28px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    border: none;
  }
  .btn-primary {
    background: var(--ink);
    color: var(--paper);
  }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--ink);
  }
  .btn-secondary:hover { background: var(--ink); color: var(--paper); }
  .btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .btn-accent {
    background: var(--accent);
    color: white;
  }
  .btn-accent:hover { background: #a93226; }

  /* RESULT SCREEN */
  #result-screen {
    text-align: center;
    padding: 40px 20px;
  }
  .score-display {
    margin: 32px 0;
    padding: 40px;
    border: 2px solid var(--ink);
    background: var(--card);
    position: relative;
  }
  .score-display::before {
    content: 'RESULT';
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    display: block;
    margin-bottom: 12px;
  }
  .score-big {
    font-size: 5rem;
    font-weight: 700;
    line-height: 1;
    color: var(--accent2);
  }
  .score-total {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.2rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .score-comment {
    margin-top: 16px;
    font-size: 1rem;
    color: var(--ink);
  }
  .result-breakdown {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 24px 0;
    text-align: left;
  }
  .breakdown-item {
    border: 1px solid var(--border);
    padding: 14px 16px;
    background: var(--card);
  }
  .breakdown-item .cat { font-size: 0.78rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }
  .breakdown-item .score { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }

  /* HIDDEN */
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>思考力<span>診断</span>テスト</h1>
    <p>DATA-style aptitude quiz — numerical / verbal / logical</p>
  </div>

  <!-- START -->
  <div id="start-screen">
    <div class="start-info">
      <div class="info-card"><span class="num">40</span><span class="label">問題数</span></div>
      <div class="info-card"><span class="num">4</span><span class="label">ジャンル</span></div>
      <div class="info-card"><span class="num">―</span><span class="label">時間制限なし</span></div>
    </div>
    <div class="category-list">
      <h3>出題ジャンル</h3>
      <ul>
        <li>資料解釈（表・割合・実数）</li>
        <li>数的推理（パズル・比率・規則）</li>
        <li>言語読解（傍線部・文脈）</li>
        <li>文章整序（論理的順序）</li>
        <li>図形推理（回転・移動・軌跡）</li>
        <li>論理推理（命題・推論）</li>
      </ul>
    </div>
    <button class="btn btn-primary" onclick="startQuiz()">テスト開始</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz-screen" class="hidden">
    <div class="progress-bar-wrap">
      <div class="progress-meta">
        <span id="q-counter">問題 1 / 40</span>
        <span id="q-score-top">正解: 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div id="question-area"></div>
    <div class="nav">
      <button class="btn btn-secondary" id="prev-btn" onclick="prevQ()" disabled>◀ 前の問題</button>
      <span class="nav-score" id="nav-score"></span>
      <button class="btn btn-primary" id="next-btn" onclick="nextQ()">次の問題 ▶</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result-screen" class="hidden">
    <div class="score-display">
      <div class="score-big" id="final-score">0</div>
      <div class="score-total" id="final-total">/ 40</div>
      <div class="score-comment" id="final-comment"></div>
    </div>
    <div class="result-breakdown" id="result-breakdown"></div>
    <button class="btn btn-primary" onclick="restartQuiz()" style="margin-top:8px">もう一度挑戦</button>
  </div>
</div>

<script>
// ===== QUESTION BANK =====
const questions = [

// ── 資料解釈 (10問) ──────────────────────────────────────────

{
  id:1, cat:'資料解釈',
  text:'下の表はある市の年齢別人口（千人）の推移を示したものである。次の記述のうち正しいものはどれか。',
  table:{
    headers:['年度','0〜14歳','15〜64歳','65歳以上','合計'],
    rows:[
      ['2010年','85','420','95','600'],
      ['2015年','78','415','107','600'],
      ['2020年','70','400','130','600'],
    ]
  },
  sub:'（単位：千人）',
  options:[
    {label:'A', text:'2010年から2020年にかけて、65歳以上の人口の増加数は50千人を超える。'},
    {label:'B', text:'2015年の15〜64歳人口が合計に占める割合は70%を超えている。'},
    {label:'C', text:'0〜14歳人口は各年とも合計の15%以上を占めている。'},
    {label:'D', text:'2020年の65歳以上の割合は2010年の約1.5倍である。'},
    {label:'E', text:'15〜64歳人口は10年間で20千人以上減少している。'},
  ],
  answer:1, // B
  explain:'2015年の15〜64歳は415千人、合計600千人。415÷600≒69.2%で70%を超えない（×）。\nA：65歳以上は95→130で35千人増（×）。\nC：2020年は70/600≒11.7%で15%未満（×）。\nD：95/600≒15.8%、130/600≒21.7%。21.7÷15.8≒1.37倍で約1.5倍ではない（×）。\nE：420→400で20千人減少、「以上」を含むため正しい（○）。\n\n正解はE。',
  answer:4
},

{
  id:2, cat:'資料解釈',
  text:'下の表はある工場の製品別月間生産数（個）を示している。次の記述のうち正しいものはどれか。',
  table:{
    headers:['月','製品X','製品Y','製品Z','合計'],
    rows:[
      ['4月','1200','800','500','2500'],
      ['5月','1100','900','600','2600'],
      ['6月','1300','850','750','2900'],
    ]
  },
  sub:'（単位：個）',
  options:[
    {label:'A', text:'製品Xの3ヶ月合計は3600個を超える。'},
    {label:'B', text:'6月における製品Zの割合は25%を超えている。'},
    {label:'C', text:'製品Yの生産数は3ヶ月を通じて増加し続けている。'},
    {label:'D', text:'5月の合計は4月より5%以上増加している。'},
    {label:'E', text:'6月の製品Xの割合は4月より低い。'},
  ],
  answer:1,
  explain:'A：X合計は1200+1100+1300=3600個。「超える」ではなくちょうど3600（×）。\nB：750÷2900≒25.9%で25%超（○）。\nC：Y is 800→900→850で6月に減少（×）。\nD：2600÷2500=1.04、4%増で5%未満（×）。\nE：4月は1200/2500=48%、6月は1300/2900≒44.8%で確かに低下（○）。\n\n正解はB。'
},

{
  id:3, cat:'資料解釈',
  text:'下の表はある学校の部活動加入者数（人）を示している。次の記述のうち誤っているものはどれか。',
  table:{
    headers:['部活','1年生','2年生','3年生','合計'],
    rows:[
      ['野球部','20','18','15','53'],
      ['サッカー部','25','22','17','64'],
      ['テニス部','15','14','12','41'],
      ['合計','60','54','44','158'],
    ]
  },
  options:[
    {label:'A', text:'3年生の人数は全体の約27.8%を占めている。'},
    {label:'B', text:'サッカー部の1年生は同学年全体の約41.7%を占める。'},
    {label:'C', text:'テニス部の合計は野球部より15人少ない。'},
    {label:'D', text:'2年生の合計は1年生より10%以上少ない。'},
    {label:'E', text:'全学年を通じて最も人数が多い学年は1年生である。'},
  ],
  answer:2,
  explain:'C：53-41=12人少ない（「15人」は誤り）。これが誤りの記述。\nA：44÷158≒27.8%（○）。\nB：25÷60≒41.7%（○）。\nD：54÷60≒0.9、つまり10%減少（10%以上）（○）。\nE：60人で最多（○）。\n\n正解（誤り）はC。'
},

{
  id:4, cat:'資料解釈',
  text:'下の表はある店舗の商品カテゴリ別売上（万円）と前年比（%）を示している。今年の食料品の売上として最も近い値はどれか。',
  table:{
    headers:['カテゴリ','昨年売上（万円）','前年比（%）'],
    rows:[
      ['食料品','1500','108'],
      ['衣料品','800','95'],
      ['日用品','600','112'],
      ['電化製品','1200','90'],
    ]
  },
  options:[
    {label:'A', text:'1560万円'},
    {label:'B', text:'1580万円'},
    {label:'C', text:'1620万円'},
    {label:'D', text:'1650万円'},
    {label:'E', text:'1680万円'},
  ],
  answer:2,
  explain:'1500万円 × 1.08 = 1620万円。\n\n正解はC。'
},

{
  id:5, cat:'資料解釈',
  text:'下の表はある会社の部門別従業員数（人）と平均年齢を示している。全社の平均年齢として最も近い値はどれか。',
  table:{
    headers:['部門','従業員数（人）','平均年齢（歳）'],
    rows:[
      ['営業部','40','32'],
      ['開発部','30','28'],
      ['管理部','20','38'],
      ['製造部','10','35'],
    ]
  },
  options:[
    {label:'A', text:'31.5歳'},
    {label:'B', text:'32.0歳'},
    {label:'C', text:'32.5歳'},
    {label:'D', text:'33.0歳'},
    {label:'E', text:'33.25歳'},
  ],
  answer:2,
  explain:'加重平均：(40×32 + 30×28 + 20×38 + 10×35) ÷ 100\n= (1280 + 840 + 760 + 350) ÷ 100\n= 3230 ÷ 100 = 32.3歳\n\n最も近いのはB（32.0歳）…いえ、C（32.5歳）です。\n32.3は32.0と32.5の中間より32.5寄り→正解はC。'
},

{
  id:6, cat:'資料解釈',
  text:'下の表はある地域の交通手段別利用者数（万人/日）の推移を示す。2020年から2022年にかけて、利用者数の減少幅が最も大きい交通手段はどれか。',
  table:{
    headers:['交通手段','2020年','2021年','2022年'],
    rows:[
      ['電車','310','285','270'],
      ['バス','120','108','100'],
      ['自転車','85','88','92'],
      ['自動車','150','155','162'],
    ]
  },
  options:[
    {label:'A', text:'電車'},
    {label:'B', text:'バス'},
    {label:'C', text:'自転車'},
    {label:'D', text:'自動車'},
    {label:'E', text:'電車とバスが同じ'},
  ],
  answer:0,
  explain:'2020→2022年の変化：\n電車：310-270 = 40万人減\nバス：120-100 = 20万人減\n自転車：増加\n自動車：増加\n\n最も減少幅が大きいのは電車（40万人）。正解はA。'
},

{
  id:7, cat:'資料解釈',
  text:'下の表はある国の輸出入額（億ドル）を示している。貿易収支（輸出－輸入）が最も大きい年はどれか。',
  table:{
    headers:['年','輸出額','輸入額'],
    rows:[
      ['2018年','8500','7800'],
      ['2019年','8200','7600'],
      ['2020年','7600','7200'],
      ['2021年','9100','8600'],
      ['2022年','9800','9000'],
    ]
  },
  options:[
    {label:'A', text:'2018年'},
    {label:'B', text:'2019年'},
    {label:'C', text:'2020年'},
    {label:'D', text:'2021年'},
    {label:'E', text:'2022年'},

// ===== STATE =====
let current = 0;
let answers = new Array(questions.length).fill(null);
let score = 0;
let started = false;

function startQuiz() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  
  document.getElementById('q-counter').textContent = `問題 ${current+1} / ${total}`;
  document.getElementById('q-score-top').textContent = `正解: ${score}`;
  document.getElementById('progress-fill').style.width = `${(current/total)*100}%`;
  
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === total-1 ? '結果を見る' : '次の問題 ▶';

  let html = `<div class="q-card">
    <div class="q-meta">
      <span class="q-num">Q${current+1}</span>
      <span class="q-category">${q.cat}</span>
    </div>
    <div class="q-text" style="white-space:pre-line">${q.text}</div>`;

  if (q.table) {
    html += `<table class="data-table"><thead><tr>`;
    q.table.headers.forEach(h => html += `<th>${h}</th>`);
    html += `</tr></thead><tbody>`;
    q.table.rows.forEach(r => {
      html += `<tr>`;
      r.forEach((cell, i) => html += `<td class="${i===0?'row-header':''}">${cell}</td>`);
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    if (q.sub) html += `<div class="q-sub">${q.sub}</div>`;
  }
  if (q.svg) {
    html += `<div class="svg-wrap">${q.svg}</div>`;
  }
  if (q.passage) {
    html += `<div class="passage">${q.passage.replace(/<u>/g,'<span class="underline">').replace(/<\/u>/g,'</span>')}</div>`;
  }
  if (q.reorder) {
    html += `<div class="reorder-items">`;
    q.reorder.forEach(r => html += `<p><strong>【${r.num}】</strong> ${r.text}</p>`);
    html += `</div>`;
  }
  if (q.sub && !q.table) {
    html += `<div class="q-sub">${q.sub}</div>`;
  }

  html += `<div class="options">`;
  q.options.forEach((opt, i) => {
    let cls = 'option-btn';
    const userAns = answers[current];
    if (userAns !== null) {
      if (i === q.answer) cls += ' correct';
      else if (i === userAns && userAns !== q.answer) cls += ' wrong';
    } else if (userAns === i) {
      cls += ' selected';
    }
    const disabled = userAns !== null ? 'disabled' : '';
    html += `<button class="${cls}" ${disabled} onclick="selectAnswer(${i})">
      <span class="opt-label">${opt.label}</span>
      <span>${opt.text}</span>
    </button>`;
  });
  html += `</div>`;

  // feedback
  if (answers[current] !== null) {
    const correct = answers[current] === q.answer;
    html += `<div class="feedback ${correct?'':'wrong-fb'} show">
      <strong>${correct ? '✓ 正解' : '✗ 不正解'}</strong>（正解：${q.options[q.answer].label}）<br><br>
      <span style="white-space:pre-line;font-size:0.85rem">${q.explain}</span>
    </div>`;
  }

  html += `</div>`;
  document.getElementById('question-area').innerHTML = html;
  window.scrollTo({top:0, behavior:'smooth'});
}

function selectAnswer(i) {
  if (answers[current] !== null) return;
  answers[current] = i;
  if (i === questions[current].answer) score++;
  document.getElementById('q-score-top').textContent = `正解: ${score}`;
  renderQuestion();
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResult();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('quiz-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.remove('hidden');
  
  const total = questions.length;
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-total').textContent = `/ ${total}`;
  
  const pct = Math.round(score/total*100);
  let comment = '';
  if (pct >= 90) comment = '優秀：全農サイロ、盤石です。';
  else if (pct >= 75) comment = '良好：本番でも十分通用する水準です。';
  else if (pct >= 60) comment = '標準：あと一歩。解説を確認して弱点を潰しましょう。';
  else comment = '要復習：解説を丁寧に読み返して、次は改善を目指しましょう。';
  document.getElementById('final-comment').textContent = comment;

  // breakdown by category
  const cats = {};
  questions.forEach((q, i) => {
    if (!cats[q.cat]) cats[q.cat] = {correct:0, total:0};
    cats[q.cat].total++;
    if (answers[i] === q.answer) cats[q.cat].correct++;
  });
  let bd = '';
  Object.entries(cats).forEach(([cat, s]) => {
    bd += `<div class="breakdown-item">
      <div class="cat">${cat}</div>
      <div class="score">${s.correct} / ${s.total}</div>
    </div>`;
  });
  document.getElementById('result-breakdown').innerHTML = bd;
}

function restartQuiz() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  score = 0;
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('quiz-screen').classList.remove('hidden');
  renderQuestion();
