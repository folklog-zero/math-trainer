{id:"N68",cat:"calc-new",label:"新型 計数",type:"choice",question:"3:4:5の比で配分する場合、合計360を3つに分けるとそれぞれいくつになるか？\n\n（3に対応する数を答えよ）",choices:["80","85","90","100"],answer:2,explanation:"比の合計=3+4+5=12。1単位=360÷12=30。3:4:5に対応するのは90:120:150。3対応=90。"},
{id:"N69",cat:"calc-new",label:"新型 計数",type:"choice",question:"原価1,500円の商品に20%の利益を見込んで定価をつけた後、定価の10%引きで売った場合、利益はいくらか？",choices:["120円","150円","180円","200円"],answer:0,explanation:"定価=1500×1.2=1800円。販売価格=1800×0.9=1620円。利益=1620-1500=120円。"},
{id:"N70",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある工場では機械A・Bがある製品をそれぞれ1個製造するのに、Aは6分、Bは10分かかる。両機械を同時に稼働させると1時間で何個製造できるか？",choices:["12個","14個","16個","18個"],answer:2,explanation:"1時間=60分。Aは60÷6=10個、Bは60÷10=6個。合計=10+6=16個。"},
{id:"E32",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"diversify\".\n\n\"The company decided to diversify its product portfolio to reduce risk.\"",choices:["concentrate（集中させる）","broaden（広げる）","abandon（放棄する）","simplify（簡素化する）"],answer:1,explanation:"diversifyは多様化する・多角化する。broadenが最も近い。経営戦略の頻出語彙。"},
{id:"E33",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"The new regulation will ( ) effect from January 1st next year.\"",choices:["make","take","do","put"],answer:1,explanation:"take effect=効力を発する・施行されるという定型句。法律・規則の施行表現。"},
{id:"E34",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"jurisdiction\" in a legal/customs context.\n\n\"This matter falls under the jurisdiction of the customs authority.\"",choices:["responsibility（責任）","authority's scope of power（管轄権）","investigation（捜査）","punishment（処罰）"],answer:1,explanation:"jurisdictionは管轄権・管轄区域。fall under the jurisdiction of=〜の管轄下にあるという慣用表現。"},
{id:"E35",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"Please ( ) the attached document for your reference.\"",choices:["find","see","look","watch"],answer:0,explanation:"Please find attached=添付資料をご参照くださいという英文ビジネスメール定型表現。Please find the attached document も可。"},
{id:"E36",cat:"eng",label:"英語",type:"choice",passage:"In international trade, the term \"FOB\" (Free on Board) means that the seller is responsible for delivering the goods to the port of shipment and loading them onto the vessel. Once the goods cross the ship's rail, the risk and ownership transfer to the buyer. This is one of the most commonly used Incoterms in maritime shipping.",question:"According to the passage, when does the risk transfer from the seller to the buyer under FOB terms?",choices:["When the buyer makes the payment","When the goods leave the seller's warehouse","When the goods cross the ship's rail","When the goods arrive at the destination port"],answer:2,explanation:"本文に\"Once the goods cross the ship's rail, the risk and ownership transfer to the buyer\"とある。FOB条件下では船の手すりを越えた時点で危険負担が買主に移転する。"},
{id:"E37",cat:"eng",label:"英語",type:"choice",question:"Choose the word that best completes the sentence.\n\n\"The company is required to ( ) all imports through customs.\"",choices:["clear","clean","clarify","clarify"],answer:0,explanation:"clear customs=通関する。輸入品をすべて通関させる、という意味の頻出表現。"},
{id:"E38",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"discrepancy\".\n\n\"The auditor noticed a discrepancy between the invoice and the actual quantity shipped.\"",choices:["agreement（一致）","inconsistency（不一致）","increase（増加）","accuracy（正確さ）"],answer:1,explanation:"discrepancyは不一致・矛盾。inconsistencyが最も近い。監査・通関・経理の文脈頻出。"},
{id:"E39",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"All imported pharmaceuticals are subject to ( ) inspection by health authorities.\"",choices:["voluntary","mandatory","optional","occasional"],answer:1,explanation:"輸入医薬品は当局の必須検査を受ける、という文脈。mandatoryが適切。"},
{id:"E40",cat:"eng",label:"英語",type:"choice",question:"次の英語イディオムの意味を選べ。\n\n\"on short notice\"",choices:["短い指示で","急な連絡で・直前で","小さな張り紙で","重要でないことで"],answer:1,explanation:"on short notice=急な通知で・直前に。ビジネス・予約変更などで頻出。例文：They were able to arrange a meeting on short notice.（彼らは急な要請でも会議を調整できた）。"},
{id:"E41",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"streamline\".\n\n\"The new software will streamline our logistics operations.\"",choices:["complicate（複雑化する）","make more efficient（効率化する）","expand（拡大する）","monitor（監視する）"],answer:1,explanation:"streamlineは効率化する・合理化する。make more efficientが最も近い。業務改善・DX関連の頻出語。"},
{id:"E42",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"The customs officer ( ) the shipment for inspection due to suspicious documentation.\"",choices:["flagged","ignored","released","forwarded"],answer:0,explanation:"flag＝怪しい貨物に印を付ける・要検査としてマークする。flagged for inspection=検査対象に指定する、税関・コンプライアンス用語。"},
{id:"E43",cat:"eng",label:"英語",type:"choice",passage:"A Letter of Credit (L/C) is a financial instrument issued by a bank that guarantees payment to a seller upon presentation of specified documents. It significantly reduces the risk for both parties in an international transaction. The buyer's bank acts as the issuing bank, while the seller's bank typically serves as the advising or confirming bank.",question:"What is the primary function of a Letter of Credit according to the passage?",choices:["To replace the need for shipping documents","To guarantee payment to the seller upon document presentation","To eliminate all risks in international trade","To provide insurance for damaged goods"],answer:1,explanation:"本文第1文：書類提示時に売主への支払いを保証する金融商品。②が正確。①は逆（書類が必要）、③は\"significantly reduces\"であり\"eliminates all\"ではない、④は保険ではない。"},
{id:"E44",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"prevailing\".\n\n\"The prevailing market price for this commodity is $50 per unit.\"",choices:["historical（歴史的な）","current and dominant（現在主流の）","unusual（異例な）","predicted（予測された）"],answer:1,explanation:"prevailingは現行の・主流の・大半を占める。current and dominantが最も近い。市場・気象などの文脈で頻出。"},
{id:"E45",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"The freight charges should be ( ) on a per-kilogram basis.\"",choices:["computed","cooked","compiled","composed"],answer:0,explanation:"運賃をkg単位で計算する。computed=計算するが適切。calculated でも可。"},
{id:"E46",cat:"eng",label:"英語",type:"choice",question:"次の英語表現の意味を選べ。\n\n\"due diligence\"",choices:["締切日（due date）の確認","適正な調査・精査（取引前の確認作業）","期限切れの責任","会計監査"],answer:1,explanation:"due diligence＝取引や投資の前に行う十分な調査・精査。M&Aや契約締結前の調査として頻出。直訳「適正な勤勉さ」。"},
{id:"E47",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"feasible\".\n\n\"The project's timeline seems feasible given the available resources.\"",choices:["impossible（不可能な）","practical and achievable（実行可能な）","expensive（高価な）","optional（任意の）"],answer:1,explanation:"feasibleは実行可能な・実現可能な。practical and achievable が最も近い。feasibility study（実現可能性調査）も頻出。"},
{id:"E48",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate word for the blank.\n\n\"The exporter must obtain an ( ) license before shipping controlled items.\"",choices:["import","export","entry","exit"],answer:1,explanation:"輸出者が規制品を出荷する前に必要なのは輸出許可（export license）。安全保障貿易管理の基本概念。"},
{id:"E49",cat:"eng",label:"英語",type:"choice",question:"Choose the word closest in meaning to \"liability\".\n\n\"The carrier's liability is limited to the value declared on the bill of lading.\"",choices:["asset（資産）","responsibility for damages（賠償責任）","cost（コスト）","capacity（能力）"],answer:1,explanation:"liabilityは責任・賠償責任。文脈は運送人の賠償責任。responsibility for damagesが最も近い。limited liability（有限責任）も基本概念。"},
{id:"E50",cat:"eng",label:"英語",type:"eng-multi",passage:"Japan is a major trading nation that relies heavily on imports for energy, raw materials, and food. Approximately 60% of the country's food calories are imported, making food security a key policy concern. Recently, geopolitical tensions and climate change have raised awareness about the [UNDER]fragility[/UNDER] of global supply chains.\n\n( [BLANK] ), the Japanese government has introduced various measures to support domestic production and diversify import sources. These include subsidies for farmers, strategic stockpiles of essential goods, and trade agreements with multiple countries.",questions:[{q:"(1) 空欄に入る最も適切な接続表現を選べ。",choices:["Despite this","In response","On the contrary"],answer:1,exp:"前段（供給網の脆弱性への認識）→後段（政府の各種対策）という対応関係。In response（これに応じて）が適切。"},{q:"(2) 下線部fragilityの意味として最も近いものを選べ。",choices:["strength（強固さ）","vulnerability（脆弱性）","complexity（複雑性）"],answer:1,exp:"fragilityは脆弱性・もろさ。vulnerabilityが最も近い。"},{q:"(3) 本文の内容と合致するものを選べ。",choices:["日本のカロリーベース食料自給率は60%程度である。","日本政府は食料安全保障対策として国内生産支援と輸入源多角化を進めている。","気候変動はサプライチェーンに影響を与えていない。"],answer:1,exp:"第2段落で政府が国内生産支援・輸入源多角化等の対策を導入したと述べている。①は逆（60%は輸入率、自給率は40%）。③は本文に反する。"}]},
{id:"E51",cat:"eng",label:"英語",type:"eng-multi",passage:"Authorized Economic Operator (AEO) is an international program that recognizes companies as reliable partners in supply chain security. Companies that meet certain criteria, such as proper compliance management and security measures, can be certified as AEOs. The main benefits include simplified customs procedures, reduced inspection rates, and priority handling at ports.\n\nIn Japan, the AEO program covers various roles in the supply chain: importers, exporters, warehouse operators, customs brokers, and carriers. AEO certification is ( [BLANK] ) for many large trading companies because the operational benefits significantly outweigh the costs of compliance.",questions:[{q:"(1) 空欄に入る最も適切な語を選べ。",choices:["disadvantageous","attractive","irrelevant"],answer:1,exp:"\"because the operational benefits significantly outweigh the costs\"より、AEO認証は魅力的（attractive）。"},{q:"(2) 本文によれば、AEO認証の利益として挙げられていないものを選べ。",choices:["税関手続きの簡素化","検査率の低減","関税の完全免除"],answer:2,exp:"本文では「簡素化された通関手続き」「検査率の低減」「優先処理」が挙げられている。「関税の完全免除」は記述なし。"},{q:"(3) 本文の内容として最も適切なものを選べ。",choices:["AEO認証は通関業者専用の制度である。","AEO認証はサプライチェーンの様々な役割をカバーする。","AEO認証はコストばかりかかり利益がない。"],answer:1,exp:"第2段落で輸入者・輸出者・倉庫業者・通関業者・運送業者など様々な役割をカバーすると述べている。"}]},
{id:"L71",cat:"lang",label:"言語",type:"choice",question:"次の文章の論理構造として最も適切なものを選べ。\n\n「ある政策が短期的に成功して見えるのは、その失敗が長期的にしか現れないからである。即効性のある政策ほど、後から大きな反作用を伴うことが多い。」",choices:["短期と長期の評価は必ず一致する。","即効性と長期的安定性はしばしばトレードオフの関係にある。","政策評価は常に短期で行うべきである。","長期評価は不可能なので意味がない。"],answer:1,explanation:"「即効性のある政策ほど後から大きな反作用」という主張から、短期効果と長期影響のトレードオフが論じられている。②が論旨に最も近い。"},
{id:"L72",cat:"lang",label:"言語",type:"blank",passage:"統計データは客観性の象徴とされがちだが、実際には数字を取る前の段階で大きな選択が行われている。「何を数えるか」「どの単位で区切るか」「いつ計測するか」――これらはすべて分析者の判断であり、（　）。だからこそ統計を読むとは、数字そのものよりも、その背後にある分類と境界線の引き方を読むことに他ならない。",question:"空欄に入る最も適切な内容を選べ。",choices:["したがって統計は完全に信頼できる","数字が出てくる前に解釈が組み込まれている","数字は誰が取っても同じ結果になる","統計学者の主観は排除されている"],answer:1,explanation:"前文「何を数えるか…はすべて分析者の判断」と、後文「数字よりも分類と境界線の引き方を読む」を繋ぐ役割。②「数字が出てくる前に解釈が組み込まれている」が文意に合致。"},
{id:"L73",cat:"lang",label:"言語",type:"choice",question:"次の各文が成り立つとき、確実に言えることを選べ。\n\n①すべての通関士は法令に詳しい。\n②法令に詳しい者は、契約書を正しく読める。\n③契約書を正しく読める者の中には、英語が得意な者もいる。",choices:["すべての通関士は英語が得意である。","すべての通関士は契約書を正しく読める。","英語が得意な者は必ず通関士である。","通関士の中には英語が苦手な者はいない。"],answer:1,explanation:"①「通関士→法令に詳しい」と②「法令に詳しい→契約書を正しく読める」を三段論法でつなぐと、「通関士→契約書を正しく読める」が確実に成立する。\n①は③が「中には〜もいる」の存在文なので導けない。③は逆向き推論なので成立しない。④は③の「中には」を全称化しているため不成立。"},
{id:"L74",cat:"lang",label:"言語",type:"blank",passage:"知識の体系には、ピラミッド型とネットワーク型の二つの捉え方がある。ピラミッド型は基礎から応用へと階層的に積み上がる構造であり、教科書的な学習が想定する形である。一方ネットワーク型は、（　）、ある分野の知識が別の分野の理解を不意に深めることがある。実務家ほど後者の感覚を強く持つのは、現場の問題が分野の枠組みを越えて立ち現れるからだろう。",question:"空欄に入る最も適切な内容を選べ。",choices:["分野間の階層関係を厳密に定める構造であり","知識同士が複雑に絡み合った網目状の構造であり","一つの分野を深く掘り下げる垂直型の構造であり","常にピラミッド型より劣る構造であり"],answer:1,explanation:"後段「分野の枠組みを越えて立ち現れる」「別の分野の理解を不意に深める」という記述から、ネットワーク型は分野横断的に絡み合う構造として説明されるべき。②が文脈に整合。"},
{id:"L75",cat:"lang",label:"言語",type:"choice",question:"次の議論の論理的欠陥として最も適切なものを選べ。\n\n「最近、自動運転車の死亡事故が報道された。やはり自動運転は人間の運転より危険なのだ。」",choices:["事実誤認に基づいている。","対人比較の基準（事故率・走行距離あたりの死亡率など）を欠いた、単一事例からの過剰な一般化である。","自動運転に関する技術的説明が不足している。","報道機関の信頼性を疑っていない。"],answer:1,explanation:"単一の事故報道から「人間の運転より危険」と結論づけている。人間の運転による事故数や走行距離あたりの死亡率と比較する基準が示されていない。②が論理的欠陥の本質。"},
// 【数列】
{id:"C71",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n1, 3, 7, 15, 31, （　）",choices:["47","55","63","127"],answer:2,explanation:"各項は2倍して1を足す（または2^n-1）：1→3→7→15→31→63。差は2,4,8,16,32と2倍ずつ。"},
{id:"C72",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n2, 1, 3, 4, 7, 11, 18, （　）",choices:["25","27","29","31"],answer:2,explanation:"リュカ数列。前2項の和：2+1=3, 1+3=4, 3+4=7, 4+7=11, 7+11=18, 11+18=29。"},
{id:"C73",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n2, 5, 10, 17, 26, 37, （　）",choices:["48","50","52","54"],answer:1,explanation:"各項=n²+1（n=1,2,3,…）：1+1, 4+1, 9+1, 16+1, 25+1, 36+1, 49+1=50。差は3,5,7,9,11,13と奇数列。"},
{id:"C74",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n1, 4, 9, 25, 49, 121, （　）",choices:["144","169","225","169 or 196"],answer:1,explanation:"素数の平方：2²=4, 3²=9, 5²=25, 7²=49, 11²=121, 13²=169。先頭の1は1²。"},
{id:"C75",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n2, 12, 30, 56, 90, （　）",choices:["120","126","132","144"],answer:2,explanation:"各項=(2n-1)×2n（隣接する奇数と偶数の積）：1×2=2, 3×4=12, 5×6=30, 7×8=56, 9×10=90, 11×12=132。"},
// 【暗号】
{id:"C76",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある暗号で「HELLO」が「KHOOR」と表される。同じ規則で「PEACE」はどう表されるか？",choices:["SHDFH","SGCEH","RGCDG","SHDCH"],answer:0,explanation:"各文字を3つずらすシーザー暗号：P→S, E→H, A→D, C→F, E→H。SHDFH。"},
{id:"C77",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある暗号で「JAPAN」が「QZKZM」と表される。この規則で「TRADE」はどう表されるか？",choices:["GIZWV","GIZVU","HIZWV","GJZWV"],answer:0,explanation:"アルファベットを逆順に置換（A↔Z, B↔Y, …）：T→G, R→I, A→Z, D→W, E→V。GIZWV。検算：J↔Q, A↔Z, P↔K, A↔Z, N↔M。一致。"},
{id:"C78",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある暗号で「CAT」が「DCW」、「DOG」が「EQJ」と表される。同じ規則で「BIRD」はどう表されるか？",choices:["CKUH","CKTI","DKUG","CKUG"],answer:0,explanation:"各文字を1, 2, 3, …と1ずつシフト量を増やしていく規則。\nCAT：C+1=D, A+2=C, T+3=W → DCW ✓\nDOG：D+1=E, O+2=Q, G+3=J → EQJ ✓\nBIRD：B+1=C, I+2=K, R+3=U, D+4=H → CKUH"},
// 【濃度】
{id:"C79",cat:"calc-old",label:"従来型 計数",type:"choice",question:"8%の食塩水200gと18%の食塩水300gを混ぜると、何%の食塩水になるか？",choices:["12%","13%","14%","15%"],answer:2,explanation:"食塩の量＝200×0.08＋300×0.18＝16＋54＝70g。全体500g。70÷500＝0.14＝14%。"},
{id:"C80",cat:"calc-old",label:"従来型 計数",type:"choice",question:"10%の食塩水500gに、何gの水を加えると6%の食塩水になるか？",choices:["200g","250g","333g","400g"],answer:2,explanation:"食塩の量は変わらず50g。50÷(500+x)＝0.06 → 500+x＝50/0.06≒833.3 → x≒333g。"},
{id:"C81",cat:"calc-old",label:"従来型 計数",type:"choice",question:"15%の食塩水400gから水を蒸発させて、20%の食塩水にしたい。何g蒸発させればよいか？",choices:["80g","100g","120g","150g"],answer:1,explanation:"食塩60g（400×0.15）は不変。60÷(400-x)＝0.20 → 400-x＝300 → x＝100g。"},
// 【速さ】
{id:"C82",cat:"calc-old",label:"従来型 計数",type:"choice",question:"A地点からB地点へ行くのに、行きは時速40km、帰りは時速60kmで走った。往復の平均速度は何km/hか？",choices:["46km/h","48km/h","50km/h","52km/h"],answer:1,explanation:"調和平均：2×40×60÷(40+60)＝4800÷100＝48km/h。単純な算術平均(50)は誤り。"},
{id:"C83",cat:"calc-old",label:"従来型 計数",type:"choice",question:"長さ200mの列車が、長さ500mの橋を時速72kmで通過するのにかかる時間は？",choices:["25秒","30秒","35秒","40秒"],answer:2,explanation:"時速72km＝秒速20m。通過距離＝列車長＋橋長＝200+500＝700m。時間＝700÷20＝35秒。"},
{id:"C84",cat:"calc-old",label:"従来型 計数",type:"choice",question:"静水時の速さが時速30kmの船で、川を72km下るのに2時間かかった。同じ船で同じ距離を上るのにかかる時間は？",choices:["2時間30分","3時間","3時間30分","4時間"],answer:1,explanation:"下りの速さ＝72÷2＝36km/h。流速＝36-30＝6km/h。上りの速さ＝30-6＝24km/h。時間＝72÷24＝3時間。"},
{id:"C85",cat:"calc-old",label:"従来型 計数",type:"choice",question:"Aは時速4kmで歩き、Bは時速6kmで歩く。Aが先に出発し、30分後にBが同じ地点から同じ方向へ追いかける。BがAに追いつくのは出発（A）から何時間後か？",choices:["1時間","1時間15分","1時間30分","2時間"],answer:2,explanation:"Aは30分(0.5h)で2km先行。Bが追う相対速度＝6-4＝2km/h。追いつく時間＝2÷2＝1時間。Aの出発からだと0.5+1＝1.5時間＝1時間30分。"},
// 【損益】
{id:"C86",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある商品を原価の20%増しで定価をつけた。しかし売れず、定価の15%引きで売った。利益率は原価のおよそ何%か？",choices:["1%","2%","3%","5%"],answer:1,explanation:"原価100とすると定価120、売価＝120×0.85＝102。利益＝102-100＝2、利益率＝2%。"},
{id:"C87",cat:"calc-old",label:"従来型 計数",type:"choice",question:"原価2,000円の品物に4割の利益を見込んで定価をつけたが、売れずに2割5分引きで売った。1個あたりの利益はいくらか？",choices:["100円","75円","125円","150円"],answer:0,explanation:"定価＝2000×1.4＝2800、売値＝2800×0.75＝2100、利益＝2100-2000＝100円。"},
// 【仕事算】
{id:"C88",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある仕事をするのにAとBがそれぞれ単独で行うと、Aは12日、Bは18日かかる。二人で一緒に行うと何日で終わるか？",choices:["6.0日","7.2日","7.5日","8.0日"],answer:1,explanation:"1日あたりの仕事量：A=1/12, B=1/18。合計＝3/36+2/36＝5/36。1÷(5/36)＝36/5＝7.2日。"},
{id:"C89",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある仕事を、A・Bの2人で行うと12日、A・Cの2人で15日、B・Cの2人で20日かかる。A・B・Cの3人で行うと何日かかるか？",choices:["8日","9日","10日","11日"],answer:2,explanation:"(A+B)+(A+C)+(B+C)＝2(A+B+C)＝1/12+1/15+1/20＝5/60+4/60+3/60＝12/60＝1/5。A+B+C＝1/10。よって10日。"},
{id:"C90",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある水槽は、給水管Aで12分、Bで20分で満水になる。排水管Cは30分で空にできる。A・B・Cすべて開けると満水まで何分か？",choices:["8分","10分","12分","15分"],answer:1,explanation:"1分あたり：A=1/12, B=1/20, C=-1/30。合計＝5/60+3/60-2/60＝6/60＝1/10。1÷(1/10)＝10分。"},
// 【鶴亀算・年齢算】
{id:"C91",cat:"calc-old",label:"従来型 計数",type:"choice",question:"鶴と亀が合わせて30匹いて、足の数の合計は80本だった。亀は何匹いるか？",choices:["8匹","10匹","12匹","15匹"],answer:1,explanation:"鶴x、亀y。x+y=30、2x+4y=80。代入して2(30-y)+4y=80 → 60+2y=80 → y=10。"},
{id:"C92",cat:"calc-old",label:"従来型 計数",type:"choice",question:"現在父は43歳、子は13歳である。父の年齢が子の年齢の3倍になるのは何年後か？",choices:["1年後","2年後","3年後","4年後"],answer:1,explanation:"x年後：43+x=3(13+x) → 43+x=39+3x → 4=2x → x=2。検算：45=3×15 ✓"},
{id:"C93",cat:"calc-old",label:"従来型 計数",type:"choice",question:"現在父は40歳、子は10歳である。父の年齢が子の年齢の3倍になるのは何年後か？",choices:["3年後","4年後","5年後","6年後"],answer:2,explanation:"x年後：40+x=3(10+x) → 40+x=30+3x → 10=2x → x=5。検算：45=3×15 ✓"},
// 【集合】
{id:"C94",cat:"calc-old",label:"従来型 計数",type:"choice",question:"100人の生徒のうち、英語が好きな人は60人、数学が好きな人は50人、両方好きな人は30人だった。両方とも好きでない人は何人か？",choices:["10人","20人","30人","40人"],answer:1,explanation:"包除原理：英語または数学が好きな人＝60+50-30＝80人。両方好きでない＝100-80＝20人。"},
{id:"C95",cat:"calc-old",label:"従来型 計数",type:"choice",question:"40人のクラスで、犬を飼っている人18人、猫を飼っている人15人、鳥を飼っている人8人。犬と猫の両方は4人、犬と鳥は3人、猫と鳥は2人、3種類とも飼っている人は1人。何も飼っていない人は何人か？",choices:["3人","5人","7人","9人"],answer:2,explanation:"3集合の包除原理：|A∪B∪C|=18+15+8-4-3-2+1=33人。40-33=7人。"},
// 【場合の数・確率】
{id:"C96",cat:"calc-old",label:"従来型 計数",type:"choice",question:"7人が円形のテーブルに座る方法は何通りか？",choices:["120通り","720通り","5040通り","720通り（180とも）"],answer:1,explanation:"円順列＝(n-1)!＝6!＝720通り。"},
{id:"C97",cat:"calc-old",label:"従来型 計数",type:"choice",question:"赤・青・黄・緑・白の5色のボールから3色を選ぶ組み合わせは何通りか？",choices:["6通り","10通り","15通り","20通り"],answer:1,explanation:"5C3＝5!/(3!2!)＝10通り。"},
{id:"C98",cat:"calc-old",label:"従来型 計数",type:"choice",question:"サイコロを2個同時に振ったとき、出る目の和が7になる確率は？",choices:["1/9","1/8","1/7","1/6"],answer:3,explanation:"和7の組み合わせ：(1,6),(2,5),(3,4),(4,3),(5,2),(6,1)の6通り。全36通りなので6/36=1/6。"},
{id:"C99",cat:"calc-old",label:"従来型 計数",type:"choice",question:"赤玉3個、白玉4個、青玉3個の計10個から、同時に2個取り出すとき、2個とも同じ色である確率は？",choices:["1/15","1/10","4/15","1/3"],answer:2,explanation:"全パターン：10C2=45通り。同色：赤(3C2=3)+白(4C2=6)+青(3C2=3)=12通り。確率=12/45=4/15。"},
// 【ニュートン算】
{id:"C100",cat:"calc-old",label:"従来型 計数",type:"choice",question:"ある窓口に毎分3人ずつ行列に人が増える。窓口は毎分5人を捌ける。開店時すでに50人が並んでいたとすると、行列がなくなるのは何分後か？",choices:["20分後","25分後","30分後","50分後"],answer:1,explanation:"純減＝5-3＝2人/分。50÷2＝25分。"},
// 【整数問題】
{id:"C101",cat:"calc-old",label:"従来型 計数",type:"choice",question:"各桁の数字がすべて異なる3桁の自然数のうち、各桁の和が6になるもので最大のものは？",choices:["330","420","510","600"],answer:2,explanation:"3桁で各桁異なる和6：候補は{5,1,0},{4,2,0},{3,2,1}。最大は510（5,1,0を大きい順）。"},
// 【推論】
{id:"C102",cat:"calc-old",label:"従来型 計数",type:"choice",question:"A・B・C・D・Eの5人が徒競走をした。次の条件から、Bは何位か？\n\n①AはBより前にゴール\n②CはDより前にゴール\n③BはCより前にゴール\n④Eは1位だった",choices:["2位","3位","4位","5位"],answer:1,explanation:"E=1位。①③②よりA<B<C<D。Eが1位なので順位は E→A→B→C→D。よってBは3位。"},
{id:"C103",cat:"calc-old",label:"従来型 計数",type:"choice",question:"P・Q・R・Sの4人の身長について、次のことが分かっている。\n\n①PはQより背が高い\n②QはRより背が高い\n③RはSと同じ身長である\n\nこのとき、4人の身長順として確実に正しいものはどれか？",choices:["P>Q>R>S","P>Q>R=S","Q>P>R=S","P>R=S>Q"],answer:1,explanation:"①P>Q、②Q>R、③R=S。これらを連結するとP>Q>R=S。よって②が確実。"},
// 【規則性応用】
{id:"C104",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n1, 2, 4, 7, 11, 16, （　）",choices:["20","22","23","26"],answer:1,explanation:"階差数列が1,2,3,4,5,…と増える：1+1=2, 2+2=4, 4+3=7, 7+4=11, 11+5=16, 16+6=22。"},
{id:"C105",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n3, 6, 12, 24, 48, （　）",choices:["72","84","96","108"],answer:2,explanation:"公比2の等比数列：48×2＝96。"},
{id:"C106",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n1, 1, 2, 6, 24, 120, （　）",choices:["360","480","600","720"],answer:3,explanation:"階乗：0!=1, 1!=1, 2!=2, 3!=6, 4!=24, 5!=120, 6!=720。または前項に1,2,3,4,5,…を掛ける。"},
{id:"C107",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n2, 3, 5, 8, 13, 21, （　）",choices:["27","30","34","35"],answer:2,explanation:"前2項の和（フィボナッチ風）：2+3=5, 3+5=8, 5+8=13, 8+13=21, 13+21=34。"},
{id:"C108",cat:"calc-old",label:"従来型 計数",type:"choice",question:"次の数列の規則性に従い、（　）に入る数を求めよ。\n\n1, 8, 27, 64, 125, （　）",choices:["196","216","225","256"],answer:1,explanation:"立方数：1³, 2³, 3³, 4³, 5³, 6³＝216。"},
{id:"C109",cat:"calc-old",label:"従来型 計数",type:"choice",question:"等比数列 3, 6, 12, 24, 48 の初項から第5項までの和を求めよ。",choices:["75","85","93","105"],answer:2,explanation:"等比数列の和：S₅=3(2⁵-1)/(2-1)=3×31=93。検算：3+6+12+24+48=93。"},
{id:"C110",cat:"calc-old",label:"従来型 計数",type:"choice",question:"1から100までの自然数のうち、3または5で割り切れる数は何個あるか？",choices:["33個","40個","47個","50個"],answer:2,explanation:"3の倍数＝33個、5の倍数＝20個、15の倍数（両方）＝6個。包除原理で33+20-6＝47個。"},
{id:"N71",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある工場では、製品Aを1個作るのに材料費200円、人件費150円、その他経費50円かかる。これを500円で販売している。1個あたりの利益率は何%か？",choices:["10%","15%","20%","25%"],answer:2,explanation:"原価＝200+150+50＝400円。利益＝500-400＝100円。利益率＝100/500×100＝20%（売上ベース）。原価ベースなら25%。\n通常「利益率」と言えば売上高利益率の20%を指すことが多い。正解③20%。"},
{id:"N72",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある倉庫の保管料金は、最初の1ヶ月3,000円、2ヶ月目以降は1ヶ月あたり2,500円。半年（6ヶ月）保管した場合の料金は？",choices:["14,500円","15,000円","15,500円","18,000円"],answer:2,explanation:"3,000＋2,500×5＝3,000＋12,500＝15,500円。"},
{id:"N73",cat:"calc-new",label:"新型 計数",type:"choice",question:"輸入貨物の通関手続きで、関税が課税価格の8%、消費税が（課税価格＋関税）の10%かかる。課税価格1,000,000円の貨物の関税と消費税の合計はいくらか？",choices:["180,000円","186,000円","188,000円","190,000円"],answer:2,explanation:"関税＝1,000,000×0.08＝80,000円。消費税＝(1,000,000+80,000)×0.10＝108,000円。合計188,000円。"},
{id:"N74",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある商品の在庫が月初500個あり、月内に1,200個入荷、950個出荷した。月末在庫は何個か？",choices:["650個","700個","750個","800個"],answer:2,explanation:"月末在庫＝月初+入荷-出荷＝500+1,200-950＝750個。"},
{id:"N75",cat:"calc-new",label:"新型 計数",type:"choice",question:"3つの倉庫A・B・Cの在庫はそれぞれ1,200個、800個、600個。今後、Aから100個をBへ、Bから200個をCへ移動する。移動後の各倉庫の在庫として正しい組み合わせは？",choices:["A:1,100, B:700, C:800","A:1,100, B:900, C:800","A:1,100, B:700, C:600","A:1,200, B:700, C:800"],answer:0,explanation:"A:1200-100=1100、B:800+100-200=700、C:600+200=800。"},
// 【図表】
{id:"N76",cat:"calc-new",label:"新型 計数",type:"table",headers:["品目","2023年(t)","2024年(t)","前年比"],rows:[["小麦","1,200","1,380","+15.0%"],["大豆","850","935","+10.0%"],["とうもろこし","2,400","2,160","-10.0%"],["飼料用米","320","416","+30.0%"]],question:"上表のうち、最も増加率が高い品目はどれか？",choices:["小麦","大豆","とうもろこし","飼料用米"],answer:3,explanation:"前年比が最大なのは飼料用米の+30.0%。"},
{id:"N77",cat:"calc-new",label:"新型 計数",type:"table",headers:["四半期","売上(百万円)","原価(百万円)","販管費(百万円)"],rows:[["Q1","450","270","120"],["Q2","520","290","135"],["Q3","580","330","145"],["Q4","630","350","155"]],question:"上表のQ3の営業利益（売上-原価-販管費）はいくらか？",choices:["95百万円","100百万円","105百万円","115百万円"],answer:2,explanation:"Q3：580-330-145＝105百万円。"},
{id:"N78",cat:"calc-new",label:"新型 計数",type:"table",headers:["年度","売上(億円)","営業利益(億円)","営業利益率"],rows:[["2021","120","6.0","5.0%"],["2022","135","9.5","7.0%"],["2023","148","12.6","8.5%"],["2024","160","16.0","10.0%"]],question:"2024年の営業利益率は2021年の何倍か？",choices:["1.5倍","1.8倍","2.0倍","2.5倍"],answer:2,explanation:"10.0% ÷ 5.0% ＝ 2.0倍。"},
{id:"N79",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社の従業員500人のうち、男性が60%、そのうち管理職は20%、女性のうち管理職は10%である。会社全体の管理職は何人か？",choices:["80人","85人","90人","100人"],answer:0,explanation:"男性＝300人、女性＝200人。男性管理職＝300×0.20＝60人、女性管理職＝200×0.10＝20人。合計80人。"},
{id:"N80",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある販売会社が、商品Aを単価1,200円で月に150個、商品Bを単価2,500円で月に80個販売している。月間売上総額はいくらか？",choices:["350,000円","380,000円","400,000円","420,000円"],answer:1,explanation:"A：1200×150＝180,000円、B：2500×80＝200,000円。合計380,000円。"},
{id:"N81",cat:"calc-new",label:"新型 計数",type:"choice",question:"4人で順番に1個ずつクッキーを取っていく。クッキーは全部で23個ある。最後にクッキーを取るのは誰か？\n（A→B→C→D→A→…の順に取り、1人1個ずつ）",choices:["A","B","C","D"],answer:2,explanation:"23÷4＝5余り3。23個目は1巡目から数えて6巡目の3番目。各巡A,B,C,Dの順なので3番目はC。"},
{id:"N82",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社の社員食堂では、定食A（650円）、定食B（750円）、定食C（850円）のいずれかを毎日提供する。1ヶ月（20営業日）で、Aを9日、Bを7日、Cを4日提供した。利用者1人あたり1日1食食べたとして、1人あたりの月額食費は？",choices:["13,750円","14,250円","14,500円","15,250円"],answer:2,explanation:"650×9＋750×7＋850×4＝5,850＋5,250＋3,400＝14,500円。"},
{id:"N83",cat:"calc-new",label:"新型 計数",type:"table",headers:["輸送モード","重量(t)","運賃(円/t)","所要日数"],rows:[["海上(コンテナ)","20","45,000","25日"],["航空","20","320,000","3日"],["鉄道","20","85,000","12日"],["陸上(トラック)","20","120,000","2日"]],question:"上表で、運賃が最も安い輸送モードと最も高い輸送モードの運賃差は何円か（1t当たり）？",choices:["75,000円","235,000円","275,000円","320,000円"],answer:2,explanation:"最安：海上45,000円/t、最高：航空320,000円/t。差＝320,000-45,000＝275,000円。"},
{id:"N84",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある倉庫の在庫管理データによれば、商品Xの在庫回転率（月）が3.0、平均月間在庫が500個である。月間出荷量は何個か？",choices:["166個","500個","1,500個","2,000個"],answer:2,explanation:"在庫回転率＝出荷量÷平均在庫。出荷量＝3.0×500＝1,500個。"},
{id:"N85",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある通関業者の月間取扱件数は、輸入600件、輸出400件である。1件あたりの手数料が輸入15,000円、輸出12,000円。月間手数料収入はいくらか？",choices:["13,800,000円","14,400,000円","15,000,000円","16,200,000円"],answer:0,explanation:"輸入：15,000×600＝9,000,000円。輸出：12,000×400＝4,800,000円。合計13,800,000円。"},
{id:"N86",cat:"calc-new",label:"新型 計数",type:"table",headers:["商品","原価(円)","売価(円)","販売数"],rows:[["X","800","1,200","250"],["Y","1,500","2,100","180"],["Z","600","900","320"]],question:"上表における3商品の総利益はいくらか？",choices:["280,000円","296,000円","304,000円","312,000円"],answer:2,explanation:"利益単価：X=1200-800=400, Y=2100-1500=600, Z=900-600=300。\n総利益＝400×250+600×180+300×320＝100,000+108,000+96,000＝304,000円。"},
{id:"N87",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある電力会社の電気料金は、基本料金1,500円、120kWhまで25円/kWh、120kWh超〜300kWhまで32円/kWh、300kWh超は38円/kWh。月間使用量250kWhの場合の料金は？",choices:["7,840円","8,140円","8,660円","8,860円"],answer:2,explanation:"基本1,500円＋120×25＝3,000円＋(250-120)×32＝130×32＝4,160円。合計1,500+3,000+4,160＝8,660円。"},
{id:"N88",cat:"calc-new",label:"新型 計数",type:"choice",question:"あるECサイトの送料は、購入金額3,000円未満で500円、3,000円以上5,000円未満で300円、5,000円以上は無料である。商品を3,800円分購入したときの支払総額は？",choices:["3,800円","4,100円","4,300円","4,500円"],answer:1,explanation:"3,800円は「3,000円以上5,000円未満」に該当するため送料300円。総額＝3,800+300＝4,100円。"},
{id:"N89",cat:"calc-new",label:"新型 計数",type:"table",headers:["地点","東京から(km)","通常運賃(円)","深夜割増"],rows:[["仙台","350","15,000","20%"],["名古屋","350","14,500","20%"],["大阪","510","20,000","25%"],["広島","800","30,000","30%"]],question:"上表のうち、深夜便で大阪まで運ぶ場合の運賃はいくらか？",choices:["24,000円","24,500円","25,000円","26,000円"],answer:2,explanation:"大阪通常20,000円、深夜割増25%。20,000×1.25＝25,000円。"},
{id:"N90",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある工場で、製品100個を作るのに不良品が3個出る。月間で5,000個製造する場合、見込まれる不良品数は何個か？",choices:["100個","120個","150個","200個"],answer:2,explanation:"不良率＝3/100＝3%。5,000×0.03＝150個。"},
{id:"N91",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社では、有給休暇の取得率が60%、平均取得日数が10日である。社員1人あたりの平均付与日数は何日か？",choices:["6日","10日","16.7日","20日"],answer:2,explanation:"取得率＝取得日数÷付与日数。0.60＝10÷付与日数。付与日数＝10÷0.60＝16.67日。"},
{id:"N92",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある書店で、文庫本（@800円）と単行本（@1,800円）を合計15冊購入し、合計17,000円支払った。単行本は何冊買ったか？",choices:["5冊","6冊","7冊","8冊"],answer:0,explanation:"文庫x、単行y：x+y=15、800x+1800y=17,000。x=15-yを代入：800(15-y)+1800y=17,000 → 12,000+1,000y=17,000 → y=5。"},
{id:"N93",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社のA事業部の昨年度売上は2億円、今年度は2.6億円。一方B事業部は昨年3億円、今年3.3億円。会社全体での売上成長率はいくらか？",choices:["12%","15%","18%","20%"],answer:2,explanation:"昨年合計5億円、今年合計5.9億円。成長率＝(5.9-5)/5＝0.18＝18%。"},
{id:"N94",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある倉庫の床面積は1,500㎡、天井高は8m。容積はどれだけか？",choices:["10,000㎥","12,000㎥","15,000㎥","18,000㎥"],answer:1,explanation:"容積＝1,500×8＝12,000㎥。"},
{id:"N95",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある商品の生産コストは、固定費1,000,000円/月、変動費800円/個である。1個1,500円で販売する場合、損益分岐点（利益0となる販売数）は？",choices:["1,000個","1,250個","1,429個","2,000個"],answer:2,explanation:"損益分岐点：1,500x-800x-1,000,000=0 → 700x=1,000,000 → x≒1,428.6 → 1,429個。"},
{id:"N96",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある飲食店の客単価が1,200円、月間来店客数が4,500人、原価率が30%、人件費が180万円、その他経費が60万円である。月間営業利益はいくらか？",choices:["1,260,000円","1,380,000円","1,540,000円","1,780,000円"],answer:1,explanation:"売上＝1,200×4,500＝5,400,000円。原価＝5,400,000×0.30＝1,620,000円。\n営業利益＝5,400,000-1,620,000-1,800,000-600,000＝1,380,000円。"},
{id:"N97",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある株式の現在の株価が1,500円、年間配当が45円である。配当利回りはいくらか？",choices:["2.0%","2.5%","3.0%","3.5%"],answer:2,explanation:"配当利回り＝45÷1,500＝0.03＝3.0%。"},
{id:"N98",cat:"calc-new",label:"新型 計数",type:"choice",question:"年率2%の複利で100万円を5年預けるとき、5年後の元利合計はおよそいくらになるか？",choices:["1,100,000円","1,104,000円","1,110,000円","1,120,000円"],answer:1,explanation:"1,000,000×(1.02)⁵＝1,000,000×1.10408≒1,104,080円。最も近いのは1,104,000円。"},
{id:"N99",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社で、新製品の市場調査をしたい。500人に対するアンケートで、好意的回答が320人だった。95%信頼区間で考えると、母集団の好意的回答率はおよそどの範囲か？（標準誤差は約2.2%）",choices:["60.0% 〜 68.0%","59.7% 〜 68.3%","61.4% 〜 66.6%","56.0% 〜 72.0%"],answer:1,explanation:"標本比率＝320/500＝0.64。95%信頼区間＝0.64±1.96×0.022≒0.64±0.043＝0.597〜0.683。②。"},
{id:"N100",cat:"calc-new",label:"新型 計数",type:"table",headers:["部署","人数","平均年齢","平均年収(万円)"],rows:[["営業","30","36","620"],["技術","45","32","580"],["管理","15","42","680"]],question:"上表の全社平均年収はいくらか？",choices:["595万円","605万円","610万円","625万円"],answer:2,explanation:"加重平均＝(30×620+45×580+15×680)/(30+45+15)＝(18,600+26,100+10,200)/90＝54,900/90＝610万円。"},
{id:"N101",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある会社が3年間で売上を2倍にした。年平均成長率（CAGR）はおよそ何%か？",choices:["20%","23%","26%","33%"],answer:2,explanation:"2^(1/3)-1≒1.26-1＝0.26＝約26%。"},
{id:"N102",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある国の人口が1.0億人、GDPが500兆円である。1人あたりGDPはいくらか？",choices:["300万円","400万円","500万円","600万円"],answer:2,explanation:"500兆円÷1.0億人＝500,000,000百万円÷100,000,000人＝500万円。"},
{id:"N103",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある倉庫のラックは、1段あたり200個収納でき、6段ある。ラックの台数が25台のとき、最大何個収納できるか？",choices:["25,000個","30,000個","36,000個","40,000個"],answer:1,explanation:"1台あたり＝200×6＝1,200個。25台＝1,200×25＝30,000個。"},
{id:"N104",cat:"calc-new",label:"新型 計数",type:"choice",question:"ある食品メーカーで、製品A（粗利30%）、製品B（粗利40%）、製品C（粗利50%）の売上比率は3:2:1である。全体の加重平均粗利率は？",choices:["33.3%","35.0%","36.7%","40.0%"],answer:2,explanation:"加重平均＝(3×30+2×40+1×50)/(3+2+1)＝(90+80+50)/6＝220/6＝36.67%。"},
{id:"N105",cat:"calc-new",label:"新型 計数",type:"table",headers:["年","売上(億円)","営業利益(億円)","研究開発費(億円)"],rows:[["2020","100","8","12"],["2021","120","12","15"],["2022","145","18","18"],["2023","170","24","22"],["2024","200","32","26"]],question:"上表で、2024年の研究開発費は売上の何%か？",choices:["11.0%","12.0%","13.0%","15.0%"],answer:2,explanation:"26÷200＝0.13＝13.0%。"},
{id:"E52",cat:"eng",label:"英語",type:"choice",question:"Choose the word that best fits the blank.\n\n\"The Incoterms® rules define the (　) of buyer and seller in international trade transactions, including delivery, risk transfer, and customs clearance.\"",choices:["responsibilities","celebrations","beverages","occupations"],answer:0,explanation:"インコタームズは買手と売手の「責任（responsibilities）」を定める国際商業会議所のルール。"},
{id:"E53",cat:"eng",label:"英語",type:"choice",question:"Choose the word that best fits the blank.\n\n\"Under FOB (Free On Board) terms, the seller's responsibility (　) when the goods are loaded onto the vessel at the named port of shipment.\"",choices:["begins","continues","ends","resumes"],answer:2,explanation:"FOB条件では、貨物が船積み港で本船に積み込まれた時点で売主の責任が「終了（ends）」し、買主にリスクが移転する。"},
{id:"E54",cat:"eng",label:"英語",type:"choice",question:"Choose the most appropriate translation for: \n「保税地域」",choices:["bonded area","customs warehouse","free trade zone","container yard"],answer:0,explanation:"保税地域は bonded area。関税の支払いが猶予される指定区域。bonded warehouseは保税蔵置場という個別施設を指すことが多い。"},
{id:"E55",cat:"eng",label:"英語",type:"eng-multi",passage:"International trade has experienced significant changes in recent years due to geopolitical tensions, the rise of protectionism, and supply chain disruptions caused by the COVID-19 pandemic. Companies that once enjoyed the benefits of globalization are now reassessing their strategies. Many are diversifying their supplier base across multiple countries, a practice known as \"China plus one\" or \"friend-shoring,\" to reduce dependency on a single country or region.\n\nAt the same time, environmental concerns are reshaping logistics. The International Maritime Organization (IMO) has set ambitious targets to reduce greenhouse gas emissions from shipping by at least 50% by 2050. This has accelerated investment in alternative fuels such as LNG, ammonia, and hydrogen. However, the [UNDER]transition[/UNDER] is not without challenges. Infrastructure for these new fuels is still ( [BLANK] ), and the cost of compliance may ultimately be passed on to consumers.",questions:[{q:"(1) 空欄に入る最も適切な語を選べ。",choices:["abundant","limited","unnecessary"],answer:1,exp:"代替燃料のインフラはまだ「限られている（limited）」という文脈。前後の「accelerated investment」「cost of compliance」と整合。"},{q:"(2) 下線部transitionの意味として最も近いものを選べ。",choices:["destruction（破壊）","shift（移行）","celebration（祝賀）"],answer:1,exp:"transition＝移行・変遷。代替燃料への「移行」を指している。"},{q:"(3) 本文の内容と合致するものを選べ。",choices:["IMOは2030年までに温室効果ガス排出をゼロにする目標を設定した。","「China plus one」戦略は単一国への依存度を下げる狙いがある。","代替燃料への移行はコスト面の懸念が全くない。"],answer:1,exp:"第1段落「reduce dependency on a single country or region」より、②が本文と一致。①は2050年までに50%（ゼロではない）、③は本文に反する。"}]},
{id:"E56",cat:"eng",label:"英語",type:"choice",question:"Choose the word that best fits the blank.\n\n\"A bill of lading (B/L) is a document that serves three main functions: a receipt for the goods, evidence of the contract of carriage, and a (　) of title.\"",choices:["statement","document","certificate","loss"],answer:1,explanation:"B/Lは「権利証券（document of title）」として機能する。①statement of titleは不自然、③certificate of titleは別概念（船舶登録など）、④lossは文脈外。"}
