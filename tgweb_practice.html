y=\"185\" text-anchor=\"middle\" font-size=\"10\" fill=\"#2d6a4f\">（正しい展開図）</text>\n\n  <!-- C: 正しい（L字型） -->\n  <text x=\"210\" y=\"35\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">C</text>\n  <rect x=\"175\" y=\"40\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"205\" y=\"40\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"235\" y=\"40\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"265\" y=\"40\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"175\" y=\"70\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"175\" y=\"100\" width=\"30\" height=\"30\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <text x=\"225\" y=\"88\" text-anchor=\"middle\" font-size=\"10\" fill=\"#2d6a4f\">（正しい展開図）</text>\n\n  <!-- D: 不正（2x3） -->\n  <text x=\"210\" y=\"120\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">D</text>\n  <rect x=\"175\" y=\"125\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <rect x=\"205\" y=\"125\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <rect x=\"235\" y=\"125\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <rect x=\"175\" y=\"155\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <rect x=\"205\" y=\"155\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <rect x=\"235\" y=\"155\" width=\"30\" height=\"30\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"1.5\"/>\n  <text x=\"225\" y=\"195\" text-anchor=\"middle\" font-size=\"10\" fill=\"#c1440e\">（2×3は不可）</text>\n</svg>",question:"上の図A・B・C・Dのうち、立方体の展開図として正しいものをすべて選べ。",choices:["AとBのみ","BとCのみ","AとDのみ","BとDのみ"],answer:1,explanation:"立方体の展開図の条件：①6面ある ②1列に4面以上連続しない ③折りたたんだとき対面が重ならない。\nA（1列6面）→ 不可。B（十字型）→ 正しい展開図。C（L字型）→ 正しい展開図。D（2×3）→ 不可（折ると対面が重なる）。よってBとCが正しい。"},
{id:"F02",type:"choice",svg:"<svg viewBox=\"0 0 220 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"10\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"60\" width=\"50\" height=\"50\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"110\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"60\" width=\"50\" height=\"50\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"10\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"110\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <text x=\"35\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">上</text>\n  <text x=\"85\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">前</text>\n  <text x=\"135\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">下</text>\n  <text x=\"185\" y=\"90\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">後</text>\n  <text x=\"85\" y=\"40\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">左</text>\n  <text x=\"85\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">右</text>\n</svg>",question:"この展開図を組み立てると立方体になるか？",choices:["なる","ならない","面が足りないので判断できない","面が多すぎる"],answer:0,explanation:"上・前・下・後・左・右の6面が正しく隣り合った展開図。連続する4面が一列であるが5面目は横にずれており、立方体として組み立て可能。正しい展開図。"},
{id:"F03",type:"choice",svg:"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 十字型展開図 -->\n  <rect x=\"60\" y=\"10\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"10\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"60\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"110\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"60\" y=\"110\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"160\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <!-- 目の数 -->\n  <text x=\"85\" y=\"42\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">1</text>\n  <text x=\"35\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">2</text>\n  <text x=\"85\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">3</text>\n  <text x=\"135\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">4</text>\n  <text x=\"85\" y=\"142\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">5</text>\n  <text x=\"185\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">6</text>\n</svg>",question:"上の展開図でサイコロを作ったとき、1の面の対面にくる目はいくつか。（サイコロの対面の和は常に7）",choices:["5","6","4","3"],answer:1,explanation:"この展開図では1は上部、6は右端に配置されている。十字型展開図で1の面を折りたたむと対面は6。また対面の和=7より、1の対面=6が確認できる。"},
{id:"F04",type:"choice",svg:"<svg viewBox=\"0 0 200 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- サイコロ3D: アイソメ風 -->\n  <!-- 上面 -->\n  <polygon points=\"100,20 160,55 100,90 40,55\" fill=\"#f0f8ff\" stroke=\"#333\" stroke-width=\"1.5\"/>\n  <!-- 右面 -->\n  <polygon points=\"160,55 160,125 100,160 100,90\" fill=\"#d0e8ff\" stroke=\"#333\" stroke-width=\"1.5\"/>\n  <!-- 左面 -->\n  <polygon points=\"40,55 100,90 100,160 40,125\" fill=\"#b0ccee\" stroke=\"#333\" stroke-width=\"1.5\"/>\n\n  <!-- 上面の目: 2 -->\n  <circle cx=\"82\" cy=\"60\" r=\"5\" fill=\"#333\"/>\n  <circle cx=\"118\" cy=\"50\" r=\"5\" fill=\"#333\"/>\n\n  <!-- 右面の目: 3 -->\n  <circle cx=\"118\" cy=\"95\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"138\" cy=\"112\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"155\" cy=\"128\" r=\"4\" fill=\"#333\"/>\n\n  <!-- 左面の目: 5（見えている面） -->\n  <circle cx=\"55\" cy=\"95\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"75\" cy=\"108\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"70\" cy=\"125\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"88\" cy=\"138\" r=\"4\" fill=\"#333\"/>\n  <circle cx=\"63\" cy=\"112\" r=\"4\" fill=\"#333\"/>\n\n  <text x=\"100\" y=\"178\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">上面=2、右面=3、左面=5のとき</text>\n</svg>",question:"上の図のサイコロで、見えていない底面の目はいくつか。（サイコロの対面の和は7）",choices:["3","4","5","6"],answer:2,explanation:"サイコロの対面の和は常に7。上面が2なので底面=7-2=5。これがサイコロ対面問題の基本解法。"},
{id:"F05",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- アイソメトリック積み木 -->\n  <!-- 1段目（下）: 2x2 -->\n  <!-- 左前 -->\n  <polygon points=\"30,130 70,110 70,150 30,170\" fill=\"#b8ddb8\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"70,110 110,130 110,170 70,150\" fill=\"#88bb88\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"30,130 70,110 110,130 70,150\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <!-- 右前 -->\n  <polygon points=\"70,130 110,110 110,150 70,170\" fill=\"#b8ddb8\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"110,110 150,130 150,170 110,150\" fill=\"#88bb88\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"70,130 110,110 150,130 110,150\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <!-- 左奥 -->\n  <polygon points=\"30,90 70,70 70,110 30,130\" fill=\"#b8ddb8\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"70,70 110,90 110,130 70,110\" fill=\"#88bb88\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <polygon points=\"30,90 70,70 110,90 70,110\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <!-- 2段目: 左前の上 -->\n  <polygon points=\"30,90 70,70 70,110 30,130\" fill=\"#aaccff\" stroke=\"#1a5c8c\" stroke-width=\"1.5\" opacity=\"0\"/>\n  <polygon points=\"30,90 70,70 70,110 30,130\" fill=\"#b8d4ff\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <polygon points=\"70,70 110,90 110,130 70,110\" fill=\"#88aadd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <polygon points=\"30,90 70,70 110,90 70,110\" fill=\"#d8e8ff\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <!-- ラベル -->\n  <text x=\"100\" y=\"190\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5650\">積み木は全部で何個？</text>\n</svg>",question:"上の図の積み木は全部で何個か。",choices:["6個","7個","8個","9個"],answer:1,explanation:"1段目（下段）：見えている範囲で4個（2×2）。2段目（上段）：左前に1個追加。さらに左奥に1個で合計7個。積み木問題は前面・側面・上面の3方向から確認して重複・隠れ部分を数えることが重要。"},
{id:"F06",type:"choice",svg:"<svg viewBox=\"0 0 360 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"60\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">上から見た図</text>\n  <!-- 上面図: 3x3グリッド、一部塗りつぶし -->\n  <rect x=\"10\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"70\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"10\" y=\"52\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"52\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n  <rect x=\"70\" y=\"52\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"10\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"70\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n\n  <text x=\"185\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">正面から見た図</text>\n  <!-- 正面図: 横3 縦2 -->\n  <rect x=\"130\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"165\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"200\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"130\" y=\"57\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"165\" y=\"57\" width=\"35\" height=\"35\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n  <rect x=\"200\" y=\"57\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n\n  <text x=\"310\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">横から見た図</text>\n  <!-- 側面図: 横3 縦2 -->\n  <rect x=\"265\" y=\"22\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"22\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"265\" y=\"57\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"57\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n\n  <text x=\"180\" y=\"125\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">（塗りつぶし＝積み木あり、破線＝なし）</text>\n</svg>",question:"上の3方向の図（上面図・正面図・側面図）から判断して、積み木の最小個数はいくつか。",choices:["6個","7個","8個","9個"],answer:0,explanation:"各視点図から各マスの積み木の最大高さを読み取る。上面図で8マスに積み木がある。正面図・側面図を照合すると高さは最大2段だが、最小構成では1段のみで成立するマスがある。最小個数=6個（3方向の図と矛盾しない最小配置）。"},
{id:"F07",type:"choice",svg:"<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 手順1: 正方形 -->\n  <rect x=\"10\" y=\"30\" width=\"80\" height=\"80\" fill=\"#fef3e2\" stroke=\"#b5641b\" stroke-width=\"2\"/>\n  <line x1=\"10\" y1=\"30\" x2=\"90\" y2=\"110\" stroke=\"#b5641b\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\"/>\n  <text x=\"50\" y=\"125\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">①正方形を</text>\n  <text x=\"50\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">対角線で折る</text>\n\n  <!-- 矢印 -->\n  <text x=\"108\" y=\"75\" font-size=\"20\" fill=\"#b5641b\">→</text>\n\n  <!-- 手順2: 三角形、切る線 -->\n  <polygon points=\"130,110 210,110 170,30\" fill=\"#fef3e2\" stroke=\"#b5641b\" stroke-width=\"2\"/>\n  <line x1=\"148\" y1=\"80\" x2=\"192\" y2=\"80\" stroke=\"#c1440e\" stroke-width=\"2.5\" stroke-dasharray=\"3,2\"/>\n  <text x=\"170\" y=\"125\" text-anchor=\"middle\" font-size=\"11\" fill=\"#c1440e\">②この線で切る</text>\n  <text x=\"170\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">（上部を切り落とす）</text>\n\n  <!-- 矢印 -->\n  <text x=\"225\" y=\"75\" font-size=\"20\" fill=\"#b5641b\">→</text>\n\n  <!-- 手順3: 展開後の形は？（問い） -->\n  <rect x=\"248\" y=\"30\" width=\"40\" height=\"40\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\" stroke-dasharray=\"5,3\"/>\n  <text x=\"268\" y=\"58\" text-anchor=\"middle\" font-size=\"18\" fill=\"#1a5c8c\">?</text>\n  <text x=\"268\" y=\"85\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">開くと</text>\n  <text x=\"268\" y=\"98\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">どんな形？</text>\n</svg>",question:"正方形の紙を対角線で折り、三角形にした。その三角形の上部（頂角部分）を水平に切り落とした。紙を開くと何の形になるか？",choices:["正方形","六角形","長方形","正三角形"],answer:1,explanation:"正方形を対角線で折ると直角二等辺三角形。頂角（直角）部分を水平にカット→開くと、カットラインが元の正方形の対角線を軸として対称に現れる。結果として六角形（ひし形の上下を水平にカットした形）になる。折り紙問題は「折った状態での切断線が開いたとき対称に現れる」ことを意識する。"},
{id:"F08",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 4つの領域（中央に十字で分割） -->\n  <rect x=\"20\" y=\"20\" width=\"160\" height=\"160\" fill=\"#f0f0f0\" stroke=\"#333\" stroke-width=\"2\"/>\n  <line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"180\" stroke=\"#333\" stroke-width=\"2\"/>\n  <line x1=\"20\" y1=\"100\" x2=\"180\" y2=\"100\" stroke=\"#333\" stroke-width=\"2\"/>\n  <!-- 中央の小円（5番目の領域） -->\n  <circle cx=\"100\" cy=\"100\" r=\"30\" fill=\"#f0f0f0\" stroke=\"#333\" stroke-width=\"2\"/>\n  <!-- 領域ラベル -->\n  <text x=\"58\" y=\"68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">A</text>\n  <text x=\"142\" y=\"68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">B</text>\n  <text x=\"58\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">C</text>\n  <text x=\"142\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">D</text>\n  <text x=\"100\" y=\"105\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">E</text>\n  <text x=\"100\" y=\"192\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">隣り合う領域は異なる色で塗る</text>\n</svg>",question:"上の図の5つの領域（A・B・C・D・E）を、隣り合う領域が異なる色になるよう塗り分ける。最低何色必要か。\n（Eは中央の円で、A・B・C・D全てと隣接している）",choices:["2色","3色","4色","5色"],answer:2,explanation:"Eは4つの領域すべてと隣接するため、E専用の色が1色必要。A・B・C・DはEとは異なる色を使う。AとBは隣接、BとDも隣接、AとCも隣接、CとDも隣接する。A=色1、B=色2、C=色2、D=色1（AとDは隣接しない）とするとE=色3の計3色で可能。"},
{id:"F09",type:"choice",svg:"<svg viewBox=\"0 0 300 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- L字型タイル（1x2 + 1x1の組み合わせ） -->\n  <rect x=\"20\" y=\"40\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"20\" y=\"80\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"80\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <text x=\"60\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">このL字タイル</text>\n  <!-- 矢印 -->\n  <text x=\"125\" y=\"90\" font-size=\"20\" fill=\"#b5641b\">→</text>\n  <!-- 4x3のグリッド（正方形） -->\n  <rect x=\"150\" y=\"30\" width=\"130\" height=\"130\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <!-- グリッド線 -->\n  <line x1=\"182\" y1=\"30\" x2=\"182\" y2=\"160\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <line x1=\"214\" y1=\"30\" x2=\"214\" y2=\"160\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <line x1=\"246\" y1=\"30\" x2=\"246\" y2=\"160\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <line x1=\"150\" y1=\"62\" x2=\"280\" y2=\"62\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <line x1=\"150\" y1=\"94\" x2=\"280\" y2=\"94\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <line x1=\"150\" y1=\"126\" x2=\"280\" y2=\"126\" stroke=\"#2d6a4f\" stroke-width=\"0.8\" stroke-dasharray=\"3\"/>\n  <text x=\"215\" y=\"173\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">4×4マス（16マス）に敷き詰める</text>\n</svg>",question:"上のL字型タイル（3マス分）を使って4×4マス（16マス）を隙間なく敷き詰めることはできるか。",choices:["できる","できない","条件による","タイルが不足する"],answer:1,explanation:"4×4=16マス。L字タイルは3マス。16÷3=5余り1。16は3の倍数でないため、L字タイルだけでは16マスを過不足なく埋めることができない。「面積が割り切れるか」を最初に確認するのが敷き詰め問題の鉄則。"},
{id:"F10",type:"choice",svg:"<svg viewBox=\"0 0 300 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 図1: 一筆書き可能（橋を2本持つ頂点が0か2） -->\n  <!-- 四角形＋対角線1本 -->\n  <rect x=\"20\" y=\"30\" width=\"100\" height=\"100\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"2.5\"/>\n  <line x1=\"20\" y1=\"30\" x2=\"120\" y2=\"130\" stroke=\"#2d6a4f\" stroke-width=\"2.5\"/>\n  <circle cx=\"20\" cy=\"30\" r=\"5\" fill=\"#2d6a4f\"/>\n  <circle cx=\"120\" cy=\"30\" r=\"5\" fill=\"#2d6a4f\"/>\n  <circle cx=\"20\" cy=\"130\" r=\"5\" fill=\"#2d6a4f\"/>\n  <circle cx=\"120\" cy=\"130\" r=\"5\" fill=\"#2d6a4f\"/>\n  <text x=\"70\" y=\"155\" text-anchor=\"middle\" font-size=\"11\" fill=\"#2d6a4f\" font-weight=\"bold\">図A</text>\n\n  <!-- 図2: 一筆書き可能（奇数次数が2） -->\n  <!-- 三角形 -->\n  <polygon points=\"200,30 280,130 120,130\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"2.5\"/>\n  <circle cx=\"200\" cy=\"30\" r=\"5\" fill=\"#1a5c8c\"/>\n  <circle cx=\"280\" cy=\"130\" r=\"5\" fill=\"#1a5c8c\"/>\n  <circle cx=\"120\" cy=\"130\" r=\"5\" fill=\"#1a5c8c\"/>\n  <text x=\"200\" y=\"155\" text-anchor=\"middle\" font-size=\"11\" fill=\"#1a5c8c\" font-weight=\"bold\">図B</text>\n\n  <text x=\"150\" y=\"185\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">一筆書きできるのはどちら？（またはどちらも）</text>\n</svg>",question:"図Aと図Bについて、一筆書きができるのはどれか。\n\n【一筆書きの条件】奇数次数（奇数本の辺が集まる）の頂点が0個か2個のとき可能。",choices:["図Aのみ","図Bのみ","AもBもできる","AもBもできない"],answer:2,explanation:"一筆書きは「奇数次数の頂点が0個か2個」のとき可能。\n図A（四角形＋対角線1本）：4隅は3本の辺が集まる頂点が2つ（奇数次数2個）→一筆書き可能。\n図B（三角形）：各頂点に2本の辺→すべて偶数次数（0個）→一筆書き可能（出発点に戻れる）。\nよってAもBも一筆書きできる。"},
{id:"F11",type:"choice",svg:"<svg viewBox=\"0 0 280 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 正方形 -->\n  <rect x=\"80\" y=\"50\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#5a5650\" stroke-width=\"2\"/>\n  <!-- 円（左下角にある初期状態） -->\n  <circle cx=\"80\" cy=\"170\" r=\"20\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <circle cx=\"80\" cy=\"170\" r=\"2\" fill=\"#1a5c8c\"/>\n  <!-- 矢印（時計回り） -->\n  <path d=\"M 140 35 Q 200 20 220 80\" fill=\"none\" stroke=\"#c1440e\" stroke-width=\"1.5\" stroke-dasharray=\"5,3\" marker-end=\"url(#arrow)\"/>\n  <defs>\n    <marker id=\"arrow\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L0,6 L8,3 z\" fill=\"#c1440e\"/>\n    </marker>\n  </defs>\n  <text x=\"140\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">半径20の円が正方形（1辺120）の</text>\n  <text x=\"140\" y=\"203\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">外側を転がる。中心の軌跡の長さは？</text>\n</svg>",question:"半径20の円が、1辺120の正方形の外周を時計回りに1周転がる。円の中心が描く軌跡の全長はいくらか。（π≒3.14）",choices:["約606","約754","約880","約503"],answer:0,explanation:"軌跡の構成：\n①直線部分：正方形の各辺と平行に距離20だけ外側を、辺と同じ長さ120走る×4辺=480。\n②各頂点での円弧：90°の円弧（半径20）が4か所=4×(2π×20×90/360)=4×(π×10)=40π≈125.7。\n合計=480+125.7≈606。"},
{id:"F12",type:"choice",svg:"<svg viewBox=\"0 0 220 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <rect x=\"10\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"60\" width=\"50\" height=\"50\" fill=\"#d8f3dc\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <rect x=\"110\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"60\" width=\"50\" height=\"50\" fill=\"#d8f3dc\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"10\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <rect x=\"110\" y=\"110\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n</svg>",question:"この展開図を組み立てると立方体になるか？",choices:["なる","ならない","向きによってはなる","面が足りない"],answer:1,explanation:"この展開図は、上段4面の一列と側面2面の配置になっている。一列4面は折りたたむと筒状になり、残り2面（上下蓋）の位置が重要。この配置では折りたたんだとき対面が重なる組み合わせが生じるため、立方体にならない。展開図の判定は「対面が重なるかどうか」を確認するのが基本。"},
{id:"F13",type:"choice",svg:"<svg viewBox=\"0 0 360 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <text x=\"60\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">上から見た図</text>\n  <!-- 上面図: 3x3グリッド、一部塗りつぶし -->\n  <rect x=\"10\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"70\" y=\"22\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"10\" y=\"52\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"52\" width=\"30\" height=\"30\" fill=\"none\" stroke=\"#2d6a4f\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n  <rect x=\"70\" y=\"52\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"10\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"40\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"70\" y=\"82\" width=\"30\" height=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n\n  <text x=\"185\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">正面から見た図</text>\n  <!-- 正面図: 横3 縦2 -->\n  <rect x=\"130\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"165\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"200\" y=\"22\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"130\" y=\"57\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <rect x=\"165\" y=\"57\" width=\"35\" height=\"35\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"1.5\" stroke-dasharray=\"4\"/>\n  <rect x=\"200\" y=\"57\" width=\"35\" height=\"35\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n\n  <text x=\"310\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">横から見た図</text>\n  <!-- 側面図: 横3 縦2 -->\n  <rect x=\"265\" y=\"22\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"22\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"265\" y=\"57\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n  <rect x=\"300\" y=\"57\" width=\"35\" height=\"35\" fill=\"#fde8f4\" stroke=\"#8c1a5c\" stroke-width=\"1.5\"/>\n\n  <text x=\"180\" y=\"125\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">（塗りつぶし＝積み木あり、破線＝なし）</text>\n</svg>",question:"3方向の図から、積み木の最大個数はいくつか。",choices:["8個","10個","12個","14個"],answer:1,explanation:"最大個数は「各視点の最大高さを全マスに適用した場合」で求まる。上面図から積み木があるマスを確認（8マス）、正面図・側面図から最大高さ2段と読む。各マスすべてに2段積んだ場合=8×2=16だが、角のマスは各視点と矛盾しない最大を取ると最大10個になる。"},
{id:"F14",type:"choice",svg:"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 十字型展開図 -->\n  <rect x=\"60\" y=\"10\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"10\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"60\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"110\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"60\" y=\"110\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <rect x=\"160\" y=\"60\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\" rx=\"3\"/>\n  <!-- 目の数 -->\n  <text x=\"85\" y=\"42\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">1</text>\n  <text x=\"35\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">2</text>\n  <text x=\"85\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">3</text>\n  <text x=\"135\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">4</text>\n  <text x=\"85\" y=\"142\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">5</text>\n  <text x=\"185\" y=\"92\" text-anchor=\"middle\" font-size=\"20\" fill=\"#b5641b\">6</text>\n</svg>",question:"この展開図でサイコロを作ったとき、3の面と対面になるのはいくつか。",choices:["2","4","5","6"],answer:1,explanation:"この十字型展開図で3は中央（折り目基準）。折りたたむと3の対面は4になる。対面の和=7より3+4=7で確認できる。"},
{id:"F15",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 4つの領域（中央に十字で分割） -->\n  <rect x=\"20\" y=\"20\" width=\"160\" height=\"160\" fill=\"#f0f0f0\" stroke=\"#333\" stroke-width=\"2\"/>\n  <line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"180\" stroke=\"#333\" stroke-width=\"2\"/>\n  <line x1=\"20\" y1=\"100\" x2=\"180\" y2=\"100\" stroke=\"#333\" stroke-width=\"2\"/>\n  <!-- 中央の小円（5番目の領域） -->\n  <circle cx=\"100\" cy=\"100\" r=\"30\" fill=\"#f0f0f0\" stroke=\"#333\" stroke-width=\"2\"/>\n  <!-- 領域ラベル -->\n  <text x=\"58\" y=\"68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">A</text>\n  <text x=\"142\" y=\"68\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">B</text>\n  <text x=\"58\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">C</text>\n  <text x=\"142\" y=\"148\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">D</text>\n  <text x=\"100\" y=\"105\" text-anchor=\"middle\" font-size=\"14\" fill=\"#5a5650\">E</text>\n  <text x=\"100\" y=\"192\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">隣り合う領域は異なる色で塗る</text>\n</svg>",question:"A・B・C・D・Eの5領域を3色（赤・青・黄）で塗り分けようとしたとき、塗り分け方は何通りか。（Eは全領域と隣接）",choices:["6通り","12通り","18通り","24通り"],answer:0,explanation:"Eを最初に塗る：3色のうち1色→3通り。Aを塗る：E以外の2色→2通り。Bを塗る：EとAと隣接→E・A以外の色しか使えず、AとEが異なる色を使っているので残り1色→1通り。Cを塗る：EとAと隣接→同様に1通り。DはE・B・C全と隣接→B=1色、C=1色、E=1色で3色すべて使われている→不可。\n実は3色では塗れないため、問題は4色の場合→4×3×2×2=48か、3色で可能なパターンを確認。3色でEを囲む4領域を塗る→A=色2、B=色3、C=色3、D=色2とすれば可能（AとDは非隣接、BとCは非隣接）。塗り方=3（Eの色）×2（Aの色）×1×1×1=6通り。"},
{id:"F16",type:"choice",svg:"<svg viewBox=\"0 0 220 170\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- T字型展開図 -->\n  <rect x=\"10\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"110\" y=\"60\" width=\"50\" height=\"50\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"10\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"60\" y=\"110\" width=\"50\" height=\"50\" fill=\"#fef3e2\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"160\" y=\"60\" width=\"50\" height=\"50\" fill=\"#d8f3dc\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <text x=\"35\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">A</text>\n  <text x=\"85\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">B</text>\n  <text x=\"135\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">C</text>\n  <text x=\"85\" y=\"42\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">D</text>\n  <text x=\"85\" y=\"142\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">E</text>\n  <text x=\"185\" y=\"92\" text-anchor=\"middle\" font-size=\"16\" fill=\"#1a5c8c\">F</text>\n</svg>",question:"この展開図を組み立てたとき、面Aと向かい合う（対面となる）のはどれか？",choices:["B","C","D","F"],answer:1,explanation:"中央の十字配置で、Bを底面と仮定するとAは左、Cは右で、AとCが対面。残るDは前、Eは後ろ、Fは上で対をなす。AとC、DとE、Bと（連続する次の面F）がそれぞれ対面の関係。"},
{id:"F17",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 正方形の紙、2回折って切る -->\n  <rect x=\"30\" y=\"30\" width=\"140\" height=\"140\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\"/>\n  <line x1=\"30\" y1=\"100\" x2=\"170\" y2=\"100\" stroke=\"#b5641b\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <line x1=\"100\" y1=\"30\" x2=\"100\" y2=\"170\" stroke=\"#b5641b\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <!-- 切り込み（折りたたんだ角を斜めに切る） -->\n  <line x1=\"85\" y1=\"100\" x2=\"100\" y2=\"85\" stroke=\"#c1440e\" stroke-width=\"3\"/>\n  <text x=\"100\" y=\"190\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">2回折って中央の角を1回直線で切り取った</text>\n</svg>",question:"正方形の紙を縦横の中央で2回折って4分の1の正方形にした後、折り目の交点（中央）の角を1回直線で切り取った。開いたときにできる穴の形は？",choices:["正方形（小さい穴1つ）","ひし形（小さい穴1つ）","正方形が4つ","円形"],answer:1,explanation:"中央の角＝紙の中心点を含む角を斜めに直線で切る。4枚重なった状態で1回切るので、開くとその切り口は中心を挟んで対称に4本の切り口になる。それらの線は中心を取り囲むひし形（45度回転した正方形）を形成する。"},
{id:"F18",type:"choice",svg:"<svg viewBox=\"0 0 220 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 階段型展開図 -->\n  <rect x=\"10\" y=\"110\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"50\" y=\"110\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"50\" y=\"70\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"90\" y=\"70\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"90\" y=\"30\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <rect x=\"130\" y=\"30\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n</svg>",question:"この階段型の展開図を折りたたんで立方体を作ることができるか？",choices:["できる","できない","面が足りない","面が多すぎる"],answer:0,explanation:"階段状に6面が並んだ展開図は、立方体の11通りの正規展開図のうち代表的なパターンの一つ。折りたたむと正しい立方体になる。立方体の展開図11種類のうち、階段型・T字型・十字型・L字型などが該当する。"},
{id:"F19",type:"choice",svg:"<svg viewBox=\"0 0 240 160\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g font-size=\"22\" fill=\"#c1440e\" text-anchor=\"middle\" font-weight=\"bold\">\n    <rect x=\"10\" y=\"40\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n    <text x=\"35\" y=\"75\">1</text>\n    <rect x=\"65\" y=\"40\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n    <text x=\"90\" y=\"75\">2</text>\n    <rect x=\"120\" y=\"40\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n    <text x=\"145\" y=\"75\">6</text>\n    <rect x=\"175\" y=\"40\" width=\"50\" height=\"50\" fill=\"#fff8e8\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n    <text x=\"200\" y=\"75\">5</text>\n  </g>\n  <text x=\"120\" y=\"120\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5650\">サイコロの上面の目（手前に転がす度に変化）</text>\n  <text x=\"120\" y=\"138\" text-anchor=\"middle\" font-size=\"12\" fill=\"#5a5650\">最初1→転がすと2→2→6→6→5</text>\n</svg>",question:"上の図のように、サイコロを手前方向に1回ずつ転がすと、上面に見える目が「1→2→6→5」と変化した。サイコロの「3」の対面はいくつか？\n（サイコロの対面の和は常に7）",choices:["2","4","5","6"],answer:1,explanation:"サイコロの対面の和は常に7（1↔6, 2↔5, 3↔4）。よって3の対面=7-3=4。\n選択肢の他の数字も対面のペアを確認：2と5は互いに対面、1と6も互いに対面なので残るペアが3と4。"},
{id:"F20",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 一筆書き：4頂点と複数の辺 -->\n  <circle cx=\"50\" cy=\"50\" r=\"6\" fill=\"#1a5c8c\"/>\n  <circle cx=\"150\" cy=\"50\" r=\"6\" fill=\"#1a5c8c\"/>\n  <circle cx=\"50\" cy=\"150\" r=\"6\" fill=\"#1a5c8c\"/>\n  <circle cx=\"150\" cy=\"150\" r=\"6\" fill=\"#1a5c8c\"/>\n  <line x1=\"50\" y1=\"50\" x2=\"150\" y2=\"50\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"50\" x2=\"150\" y2=\"150\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"150\" x2=\"50\" y2=\"150\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"150\" x2=\"50\" y2=\"50\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"50\" y1=\"50\" x2=\"150\" y2=\"150\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"150\" y1=\"50\" x2=\"50\" y2=\"150\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"40\" font-size=\"14\" fill=\"#5a5650\">A</text>\n  <text x=\"160\" y=\"40\" font-size=\"14\" fill=\"#5a5650\">B</text>\n  <text x=\"30\" y=\"170\" font-size=\"14\" fill=\"#5a5650\">C</text>\n  <text x=\"160\" y=\"170\" font-size=\"14\" fill=\"#5a5650\">D</text>\n</svg>",question:"この図形（4頂点A・B・C・D、すべての頂点同士を結ぶ完全グラフK4）を一筆書きできるか？",choices:["できる","できない","頂点による（A・Bからのみ可能）","頂点による（C・Dからのみ可能）"],answer:1,explanation:"一筆書きの条件：奇数次の頂点が0または2個。K4は各頂点の次数が3（奇数）で、奇数次の頂点が4個。よって一筆書き不可能。"},
{id:"F21",type:"choice",svg:"<svg viewBox=\"0 0 200 160\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 紙を3回折って切る -->\n  <rect x=\"40\" y=\"30\" width=\"120\" height=\"80\" fill=\"#fff8e8\" stroke=\"#b5641b\" stroke-width=\"2\"/>\n  <line x1=\"100\" y1=\"30\" x2=\"100\" y2=\"110\" stroke=\"#b5641b\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <line x1=\"40\" y1=\"70\" x2=\"160\" y2=\"70\" stroke=\"#b5641b\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <!-- 切り込み：折りたたんだ状態で中央付近に1つ穴 -->\n  <circle cx=\"100\" cy=\"70\" r=\"4\" fill=\"#c1440e\"/>\n  <text x=\"100\" y=\"140\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">縦横各1回折りたたみ、中央に1つ穴を開けて開く</text>\n</svg>",question:"紙を縦に1回・横に1回折って4枚重ねの状態にし、折り目の交点（中央）に1つの穴を開けた。開いたとき穴はいくつあるか？",choices:["1個","2個","3個","4個"],answer:0,explanation:"穴の位置が折り目の交点（中央）にあるため、開いたとき4枚分の穴がすべて同一の中央位置に重なる。よって開いた状態でも穴は1個に見える。\n（注：もし穴を折り目以外の場所に開ければ、開いたとき4個の穴になる）"},
{id:"F22",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 積み木：上から見た図 -->\n  <text x=\"60\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">上から見た図（2x2）</text>\n  <rect x=\"20\" y=\"25\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"60\" y=\"25\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"20\" y=\"65\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <rect x=\"60\" y=\"65\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"50\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2d6a4f\">2</text>\n  <text x=\"80\" y=\"50\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2d6a4f\">3</text>\n  <text x=\"40\" y=\"90\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2d6a4f\">1</text>\n  <text x=\"80\" y=\"90\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2d6a4f\">2</text>\n  <text x=\"60\" y=\"125\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">数字は各マスの段数</text>\n  <text x=\"180\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">表面積を求める</text>\n  <text x=\"180\" y=\"75\" text-anchor=\"middle\" font-size=\"30\" fill=\"#5a5650\">?</text>\n</svg>",question:"1辺1cmの立方体を上図のように積み上げた立体の表面積はいくつか？\n（各マス位置の数字は積み上げた段数）",choices:["28cm²","32cm²","34cm²","38cm²"],answer:1,explanation:"配置は左奥2段・右奥3段・左前1段・右前2段。\n①上面：各柱の天井1cm²×4柱=4cm²。②底面：4cm²。\n③外周側面：北面=2+3=5、南面=1+2=3、東面=3+2=5、西面=2+1=3、合計16cm²。\n④段差壁（内部の見える壁、両側カウント）：4組の隣接でいずれも段差1、|差|×2=2cm²ずつ×4組=8cm²。\n合計=4+4+16+8=32cm²。正解②32cm²。"},
{id:"F23",type:"choice",svg:"<svg viewBox=\"0 0 200 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 円を直径で2回折る → 4枚重ね、扇形 -->\n  <!-- 元の円 -->\n  <circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <!-- 折りたたんだ扇形 -->\n  <path d=\"M 100 100 L 170 100 A 70 70 0 0 1 100 170 Z\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <!-- 切り込み（扇形の弧の真ん中を内側へ三角形に切る） -->\n  <path d=\"M 149 149 L 145 130 L 130 145 Z\" fill=\"#fff\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"195\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">直径で2回折り、弧の中央を三角形に切り取った</text>\n</svg>",question:"円形の紙を直径で2回折り（4枚重ねの扇形）、扇形の弧の中央を三角形の形に切り取った。広げたときの穴の形は？",choices:["1個の三角形","2個の三角形（対称配置）","4個の三角形（円周上等間隔）","円形の穴"],answer:2,explanation:"直径で2回折ると4分の1の扇形（4枚重ね）になる。1回切ると、開いた円の上で4回分の切り口になる。中心軸を基準に対称・90度ずつ回転した位置に4個の同じ三角形の穴ができる。"},
{id:"F24",type:"choice",svg:"<svg viewBox=\"0 0 240 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 立方体の展開図：十字型（標準） -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">展開図</text>\n  <rect x=\"100\" y=\"20\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"45\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">A</text>\n  <rect x=\"60\" y=\"60\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"85\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">B</text>\n  <rect x=\"100\" y=\"60\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"85\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">C</text>\n  <rect x=\"140\" y=\"60\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"160\" y=\"85\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">D</text>\n  <rect x=\"100\" y=\"100\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"125\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">E</text>\n  <rect x=\"100\" y=\"140\" width=\"40\" height=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"165\" text-anchor=\"middle\" font-size=\"16\" fill=\"#c1440e\">F</text>\n</svg>",question:"上の展開図を組み立てて立方体にしたとき、面Aと向かい合う面はどれか？",choices:["B","C","E","F"],answer:2,explanation:"十字型展開図では、上下に3つ並ぶ面（A・C・E or F）の両端の2面（AとE、またはAとF）のうち、Aを底にすると…\n標準的な十字型では、中央のC面が「前面」、上の面Aと、下から2番目のE面が「天井と床」の関係になり対面。F面はC面と対面。よって正解はE。"},
{id:"F25",type:"choice",svg:"<svg viewBox=\"0 0 240 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 立方体の展開図：T字型変形 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">展開図（記号入り）</text>\n  <rect x=\"60\" y=\"30\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"80\" y=\"55\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">★</text>\n  <rect x=\"100\" y=\"30\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"55\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">●</text>\n  <rect x=\"140\" y=\"30\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"160\" y=\"55\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">▲</text>\n  <rect x=\"100\" y=\"70\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"95\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">◆</text>\n  <rect x=\"100\" y=\"110\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"135\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">■</text>\n  <rect x=\"100\" y=\"150\" width=\"40\" height=\"40\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"1.5\"/>\n  <text x=\"120\" y=\"175\" text-anchor=\"middle\" font-size=\"20\" fill=\"#2d6a4f\">▼</text>\n</svg>",question:"上の展開図を組み立てて立方体にしたとき、★の面と向かい合う面はどれか？",choices:["●","▲","◆","▼"],answer:1,explanation:"展開図の中央縦列は●◆■▼の4枚。これを底面●→正面◆→天井■→背面▼と回り込ませると、●と■、◆と▼が対面ペアになる。左右に張り出した★と▲は左右側面ペアとなり対面。よって★の対面は▲。"},
{id:"F26",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 図形の回転：矢印が90度ずつ回転 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">図形の回転（90度ずつ）</text>\n  <g transform=\"translate(40,70)\">\n    <text x=\"0\" y=\"-20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">①</text>\n    <path d=\"M -15 0 L 15 0 M 5 -10 L 15 0 L 5 10\" stroke=\"#1a5c8c\" stroke-width=\"2\" fill=\"none\"/>\n  </g>\n  <g transform=\"translate(100,70) rotate(90)\">\n    <text x=\"0\" y=\"-30\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" transform=\"rotate(-90)\">②</text>\n    <path d=\"M -15 0 L 15 0 M 5 -10 L 15 0 L 5 10\" stroke=\"#1a5c8c\" stroke-width=\"2\" fill=\"none\"/>\n  </g>\n  <g transform=\"translate(160,70) rotate(180)\">\n    <text x=\"0\" y=\"30\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" transform=\"rotate(-180)\">③</text>\n    <path d=\"M -15 0 L 15 0 M 5 -10 L 15 0 L 5 10\" stroke=\"#1a5c8c\" stroke-width=\"2\" fill=\"none\"/>\n  </g>\n  <text x=\"205\" y=\"70\" text-anchor=\"middle\" font-size=\"20\" fill=\"#c1440e\">?</text>\n  <text x=\"205\" y=\"100\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">④</text>\n</svg>",question:"①→②→③と図形が変化している。④に入る図形として最も適切なものはどれか？\n（矢印が90度ずつ回転している）",choices:["矢印が右向き","矢印が下向き","矢印が左向き","矢印が上向き"],answer:3,explanation:"①右向き → ②下向き（90度時計回り） → ③左向き → ④上向き（さらに90度時計回り）。"},
{id:"F27",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- サイコロの問題：3面が見える -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">サイコロ（対面の和=7）</text>\n  <!-- サイコロ全体 -->\n  <path d=\"M 60 50 L 120 50 L 150 70 L 150 130 L 120 150 L 60 150 L 30 130 L 30 70 Z\" fill=\"#fff5d7\" stroke=\"#5a5650\" stroke-width=\"1.5\"/>\n  <!-- 上面 -->\n  <path d=\"M 60 50 L 120 50 L 150 70 L 90 70 Z\" fill=\"#ffe9b8\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n  <text x=\"100\" y=\"68\" text-anchor=\"middle\" font-size=\"16\" fill=\"#5a5650\">2</text>\n  <!-- 正面 -->\n  <path d=\"M 30 70 L 90 70 L 90 150 L 30 130 Z\" fill=\"#fff\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n  <text x=\"60\" y=\"115\" text-anchor=\"middle\" font-size=\"22\" fill=\"#5a5650\">3</text>\n  <!-- 右面 -->\n  <path d=\"M 90 70 L 150 70 L 150 130 L 90 150 Z\" fill=\"#f0e8d8\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n  <text x=\"120\" y=\"115\" text-anchor=\"middle\" font-size=\"22\" fill=\"#5a5650\">1</text>\n</svg>",question:"上図のサイコロは、対面の和が7になる標準的なサイコロである。底面の目はいくつか？",choices:["3","4","5","6"],answer:2,explanation:"上面が2なので、底面は7-2＝5。"},
{id:"F28",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 折り紙の問題：4回折って切る -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">折り紙：縦2回・横2回折る（4×4=16枚重ね）</text>\n  <rect x=\"80\" y=\"40\" width=\"80\" height=\"80\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <rect x=\"80\" y=\"40\" width=\"20\" height=\"20\" fill=\"#cce5f6\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <!-- 切り込み -->\n  <path d=\"M 95 55 L 90 50 L 85 55 L 90 60 Z\" fill=\"#fff\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">折りたたんだ角に菱形の切れ込み</text>\n  <text x=\"120\" y=\"165\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">広げたとき穴は何個できる？</text>\n</svg>",question:"正方形の紙を縦2回・横2回（合計4回）折って16枚重ねの正方形にし、4枚の重なった角に菱形の切り込みを入れた。広げたとき、紙にできる穴の数は？",choices:["4個","8個","12個","16個"],answer:3,explanation:"4回折ると2⁴＝16枚重ね。1回の切り込みは広げたとき16ヶ所に展開される。よって16個。"},
{id:"F29",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 切断面の問題 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">立方体の切断面</text>\n  <!-- 立方体 -->\n  <path d=\"M 60 60 L 140 60 L 170 40 L 170 120 L 140 140 L 60 140 L 30 120 L 30 40 L 60 60 Z\" fill=\"none\" stroke=\"#5a5650\" stroke-width=\"1.5\"/>\n  <path d=\"M 30 40 L 110 40 L 140 60 M 110 40 L 110 120 M 140 60 L 140 140\" fill=\"none\" stroke=\"#5a5650\" stroke-width=\"1.5\" stroke-dasharray=\"3\"/>\n  <!-- 切断面: 3頂点を通る -->\n  <path d=\"M 30 40 L 140 60 L 60 140 Z\" fill=\"#ffd0d0\" stroke=\"#c1440e\" stroke-width=\"2\" fill-opacity=\"0.4\"/>\n  <text x=\"100\" y=\"170\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">3頂点を通る平面で切る</text>\n</svg>",question:"立方体を、隣接しない3頂点を通る平面で切断したとき、切断面の形は？",choices:["正三角形","二等辺三角形","正方形","正六角形"],answer:0,explanation:"立方体の同一頂点に集まらない3辺の端点を結ぶと、すべて等しい長さの正三角形になる。各辺は立方体の面の対角線。"},
{id:"F30",type:"choice",svg:"<svg viewBox=\"0 0 240 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 立方体を6つの平行な面のうち、対面の中心を通る平面で切断 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">立方体の切断面（対角線方向）</text>\n  <path d=\"M 60 60 L 140 60 L 170 40 L 170 120 L 140 140 L 60 140 L 30 120 L 30 40 L 60 60 Z\" fill=\"none\" stroke=\"#5a5650\" stroke-width=\"1.5\"/>\n  <!-- 切断面：上面と下面の対角線、左右面の中央線 -->\n  <path d=\"M 30 40 L 170 40 L 140 140 L 60 140 Z\" fill=\"#d0f0d0\" stroke=\"#2d6a4f\" stroke-width=\"2\" fill-opacity=\"0.5\"/>\n  <text x=\"120\" y=\"180\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">上面の対角線と平行な切り口</text>\n</svg>",question:"立方体を、6つの面のうち向かい合う2面に対して対角線方向に切断したとき、切断面の形は？",choices:["正方形","長方形","ひし形","台形"],answer:1,explanation:"立方体の対面に垂直方向ではなく、対面の対角線を含む平面で切ると長方形になる。一辺は立方体の一辺、もう一辺は面の対角線（√2倍）。"},
{id:"F31",type:"choice",svg:"<svg viewBox=\"0 0 240 200\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 一筆書きの問題 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">一筆書き</text>\n  <!-- 四角形と対角線 -->\n  <rect x=\"60\" y=\"40\" width=\"120\" height=\"100\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"60\" y1=\"40\" x2=\"180\" y2=\"140\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <line x1=\"180\" y1=\"40\" x2=\"60\" y2=\"140\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <circle cx=\"60\" cy=\"40\" r=\"4\" fill=\"#c1440e\"/>\n  <circle cx=\"180\" cy=\"40\" r=\"4\" fill=\"#c1440e\"/>\n  <circle cx=\"180\" cy=\"140\" r=\"4\" fill=\"#c1440e\"/>\n  <circle cx=\"60\" cy=\"140\" r=\"4\" fill=\"#c1440e\"/>\n  <circle cx=\"120\" cy=\"90\" r=\"4\" fill=\"#c1440e\"/>\n  <text x=\"120\" y=\"175\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">この図形は一筆書きできるか？</text>\n</svg>",question:"上の図形（四角形と両対角線）は一筆書きできるか？できる場合、奇数次の頂点の数は？",choices:["できない（奇数頂点5個）","できる（奇数頂点0個）","できる（奇数頂点2個）","できない（奇数頂点4個）"],answer:3,explanation:"各頂点の次数：4つの角＝3（隣2辺+対角線1）、中心＝4。奇数次（次数3）の頂点が4個。一筆書き可能条件は「奇数次頂点が0または2個」。4個あるので不可能。"},
{id:"F32",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 図形の回転体 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">図形の回転体</text>\n  <!-- 軸 -->\n  <line x1=\"120\" y1=\"30\" x2=\"120\" y2=\"160\" stroke=\"#5a5650\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n  <!-- 直角三角形 -->\n  <path d=\"M 120 50 L 120 130 L 170 130 Z\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <text x=\"100\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">回転軸</text>\n  <text x=\"190\" y=\"135\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">底辺</text>\n</svg>",question:"直角三角形を、直角を挟む一辺を軸に1回転させてできる立体は？",choices:["球","円柱","円錐","角錐"],answer:2,explanation:"直角三角形を直角の一辺を軸に回転させると、底が円・側面が斜面の円錐（cone）になる。"},
{id:"F33",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 図形の組み合わせ：歯車 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">歯車の回転</text>\n  <circle cx=\"80\" cy=\"90\" r=\"30\" fill=\"#d8f3dc\" stroke=\"#2d6a4f\" stroke-width=\"2\"/>\n  <circle cx=\"160\" cy=\"90\" r=\"40\" fill=\"#d0e8f5\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <text x=\"80\" y=\"95\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2d6a4f\">歯数12</text>\n  <text x=\"160\" y=\"95\" text-anchor=\"middle\" font-size=\"12\" fill=\"#1a5c8c\">歯数20</text>\n  <text x=\"80\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">A（右回り3周）</text>\n  <text x=\"160\" y=\"150\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">B（？周）</text>\n</svg>",question:"歯数12の歯車Aと歯数20の歯車Bが噛み合っている。Aを右回りに3周回したとき、Bは何周どちら向きに回るか？",choices:["1.5周、右回り","1.8周、左回り","2.5周、左回り","5.0周、左回り"],answer:1,explanation:"歯数比A:B=12:20=3:5。Aが3周＝12×3＝36歯動く。Bは36÷20＝1.8周。噛み合う歯車は逆向きに回転するので左回り。"},
{id:"F34",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 立方体4個を組み合わせた立体の上面・正面・側面の見え方 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">投影図：上面=L字、正面=長方形、側面=？</text>\n  <!-- 上面（L字） -->\n  <g transform=\"translate(30,30)\">\n    <rect x=\"0\" y=\"0\" width=\"20\" height=\"20\" fill=\"#fff5d7\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n    <rect x=\"20\" y=\"0\" width=\"20\" height=\"20\" fill=\"#fff5d7\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n    <rect x=\"0\" y=\"20\" width=\"20\" height=\"20\" fill=\"#fff5d7\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n    <text x=\"20\" y=\"55\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">上面</text>\n  </g>\n  <!-- 正面（長方形） -->\n  <g transform=\"translate(110,30)\">\n    <rect x=\"0\" y=\"0\" width=\"40\" height=\"20\" fill=\"#d8f3dc\" stroke=\"#5a5650\" stroke-width=\"1\"/>\n    <text x=\"20\" y=\"35\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">正面</text>\n  </g>\n  <!-- 側面（？） -->\n  <g transform=\"translate(190,30)\">\n    <rect x=\"0\" y=\"0\" width=\"40\" height=\"40\" fill=\"none\" stroke=\"#5a5650\" stroke-width=\"1\" stroke-dasharray=\"3\"/>\n    <text x=\"20\" y=\"25\" text-anchor=\"middle\" font-size=\"18\" fill=\"#c1440e\">?</text>\n    <text x=\"20\" y=\"55\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">側面</text>\n  </g>\n</svg>",question:"上面がL字型（3マス）、正面が横長方形（2マス分）に見える立体の側面の見え方として最も適切なものは？",choices:["正方形（1マス）","横長方形（2マス）","縦長方形（2マス）","L字型"],answer:2,explanation:"L字型上面の縦方向（2マス）が側面の奥行きに対応し、高さ1マスなら側面は縦2マス×横1マス＝縦長方形。"},
{id:"F35",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 円錐の展開図 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">円錐の展開図（側面=扇形）</text>\n  <!-- 扇形 -->\n  <path d=\"M 120 90 L 180 60 A 67 67 0 0 1 180 120 Z\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"88\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">中心</text>\n  <text x=\"175\" y=\"55\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">母線</text>\n  <text x=\"195\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">弧</text>\n  <text x=\"120\" y=\"160\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\">底面の半径3cm、母線9cm</text>\n</svg>",question:"円錐の底面の半径が3cm、母線の長さが9cmのとき、側面の展開図（扇形）の中心角は何度か？",choices:["90°","120°","135°","180°"],answer:1,explanation:"扇形の弧の長さ＝底面の円周＝2π×3＝6π。母線9cmの全円周＝2π×9＝18π。中心角＝6π/18π×360°＝120°。"},
{id:"F36",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 投影された影 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">透視投影：直方体の影</text>\n  <!-- 直方体 -->\n  <path d=\"M 60 50 L 130 50 L 150 40 L 150 100 L 130 110 L 60 110 L 40 100 L 40 40 L 60 50 Z\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"1.5\"/>\n  <path d=\"M 40 40 L 110 40 L 130 50 M 110 40 L 110 100 M 130 50 L 130 110\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"1.5\" stroke-dasharray=\"3\"/>\n  <!-- 影 -->\n  <path d=\"M 60 130 L 130 130 L 150 140 L 50 140 Z\" fill=\"#cccccc\" stroke=\"#5a5650\" stroke-width=\"1\" fill-opacity=\"0.5\"/>\n  <text x=\"120\" y=\"165\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">真上から光を当てたときの影は？</text>\n</svg>",question:"直方体（縦・横・高さがそれぞれ3cm、5cm、4cm）に対し、真上から平行光を当てたとき、地面に投影される影の形と面積は？",choices:["長方形 15cm²","長方形 20cm²","長方形 12cm²","正方形 16cm²"],answer:0,explanation:"真上からの平行光なら、直方体の上面（縦×横＝3×5＝15cm²）がそのまま影として地面に映る。長方形15cm²。"},
{id:"F37",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 重なった円の面積 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">重なった円</text>\n  <circle cx=\"100\" cy=\"90\" r=\"40\" fill=\"#e8f4fd\" stroke=\"#1a5c8c\" stroke-width=\"2\" fill-opacity=\"0.6\"/>\n  <circle cx=\"140\" cy=\"90\" r=\"40\" fill=\"#fff5d7\" stroke=\"#c1440e\" stroke-width=\"2\" fill-opacity=\"0.6\"/>\n  <text x=\"75\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">円A</text>\n  <text x=\"165\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">円B</text>\n  <text x=\"120\" y=\"155\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">A・B同半径、中心間=半径と等しい</text>\n</svg>",question:"半径rの円AとBが、中心間距離rで重なっている。重なった部分の面積を表す式として正しいものは？",choices:["πr²/3","(2π/3 - √3/2)r²","r²(π - 2)/4","r²(2π - 3√3)/6"],answer:1,explanation:"中心間距離r=半径rのとき、重なる部分は2つの円弧で囲まれた領域。各円から見れば中心角120°の扇形から正三角形を引き、それを2倍。各扇形＝πr²/3、各三角形＝√3r²/4。重なり＝2(πr²/3 - √3r²/4)＝(2π/3 - √3/2)r²。"},
{id:"F38",type:"choice",svg:"<svg viewBox=\"0 0 240 180\" xmlns=\"http://www.w3.org/2000/svg\">\n  <!-- 内接・外接 -->\n  <text x=\"120\" y=\"15\" text-anchor=\"middle\" font-size=\"11\" fill=\"#5a5650\" font-weight=\"bold\">円に内接する正方形</text>\n  <circle cx=\"120\" cy=\"95\" r=\"60\" fill=\"none\" stroke=\"#1a5c8c\" stroke-width=\"2\"/>\n  <rect x=\"77.6\" y=\"52.6\" width=\"84.9\" height=\"84.9\" fill=\"#e8f4fd\" stroke=\"#c1440e\" stroke-width=\"2\" fill-opacity=\"0.5\" transform=\"rotate(0,120,95)\"/>\n  <text x=\"190\" y=\"95\" text-anchor=\"middle\" font-size=\"10\" fill=\"#5a5650\">r=6</text>\n</svg>",question:"半径6cmの円に内接する正方形の面積は何cm²か？",choices:["36cm²","48cm²","72cm²","144cm²"],answer:2,explanation:"内接正方形の対角線＝円の直径＝12cm。一辺＝12/√2＝6√2。面積＝(6√2)²＝72cm²。または対角線dの正方形面積＝d²/2＝144/2＝72。"}

try { stats = JSON.parse(localStorage.getItem("tgweb-all-stats") || "{}"); } catch(e){}
function saveStats(){ try{ localStorage.setItem("tgweb-all-stats", JSON.stringify(stats)); }catch(e){} }

/* ── Home ── */
function renderHome(){
  const cg = document.getElementById("cat-grid");
  cg.innerHTML = CATS.map(c => {
    const qs  = ALL_Q.filter(q => q.cat === c.id);
    const st  = stats[c.id] || {done:0, correct:0};
    const pct = st.done ? Math.round(st.correct/st.done*100)+"%" : "未挑戦";
    return `<button class="cat-btn ${c.cls}" onclick="startCat('${c.id}')">
      <div class="cat-label">${c.desc}</div>
      <div class="cat-name">${c.name}</div>
      <div class="cat-count">${qs.length}問 · 正解率 ${pct}</div>
    </button>`;
  }).join("");

  const td = Object.values(stats).reduce((a,b)=>a+(b.done||0),0);
  const tc = Object.values(stats).reduce((a,b)=>a+(b.correct||0),0);
  document.getElementById("stat-grid").innerHTML = [
    {num:ALL_Q.length, lbl:"総問題数"},
    {num:td,           lbl:"解答済み"},
    {num:tc,           lbl:"正解数"},
    {num:td ? Math.round(tc/td*100)+"%" : "—", lbl:"全体正答率"},
  ].map(s=>`<div class="stat-card"><div class="s-num">${s.num}</div><div class="s-lbl">${s.lbl}</div></div>`).join("");
}

function resetStats(){ if(!confirm("記録をリセットしますか？"))return; stats={}; saveStats(); renderHome(); }
function startCat(catId){ const qs=ALL_Q.filter(q=>q.cat===catId).sort(()=>Math.random()-.5); session={questions:qs,idx:0,answers:[],cat:catId}; showScreen("quiz"); renderQuestion(); }
function startAll(){ const qs=[...ALL_Q].sort(()=>Math.random()-.5); session={questions:qs,idx:0,answers:[],cat:null}; showScreen("quiz"); renderQuestion(); }
function retrySession(){ startCat(session.cat||"lang"); }
function backHome(){ showScreen("home"); renderHome(); }

/* ── Render ── */
let multiSel=[], engAnswers={};

function renderQuestion(){
  const q     = session.questions[session.idx];
  const total = session.questions.length;
  document.getElementById("prog-text").textContent = `${session.idx+1} / ${total}`;
  document.getElementById("prog-cat").textContent  = q.label || "";
  document.getElementById("prog-fill").style.width = Math.round(session.idx/total*100)+"%";
  document.getElementById("btn-next").classList.add("hidden");
  multiSel=[]; engAnswers={};

  const cat   = CATS.find(c=>c.id===q.cat);
  const badge = cat ? cat.badge : "bq";

  let html = `<div class="q-card"><div class="q-meta">
    <span class="badge ${badge}">${q.label||q.cat}</span>
    <span class="badge bq">Q${session.idx+1}</span>
  </div>`;

  if(q.type==="eng-multi"){
    html += buildEngMulti(q);
  } else {
    // 図形SVG
    if(q.svg)       html += `<div class="q-svg-wrap">${q.svg}</div>`;
    if(q.passage)   html += `<div class="q-passage">${esc(q.passage)}</div>`;
    if(q.tableData) html += buildTable(q.tableData);
    html += `<div class="q-text">${esc(q.question)}</div>`;
    if(q.type==="multi"){
      html += `<p class="multi-hint">※正しいものをすべて選び「回答する」を押してください</p>`;
      html += buildChoices(q, true);
      html += `<div style="margin-top:10px"><button class="btn btn-p" id="btn-submit-multi" onclick="submitMulti()">回答する</button></div>`;
    } else {
      html += buildChoices(q, false);
    }
  }
  html += "</div>";
  document.getElementById("q-container").innerHTML = html;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildTable(td){
  let h="<table class='q-table'><tr>";
  td.headers.forEach(hd=>h+=`<th>${hd}</th>`);
  h+="</tr>";
  td.rows.forEach(row=>{h+="<tr>";row.forEach(c=>h+=`<td>${c}</td>`);h+="</tr>";});
  return h+"</table>";
}

function buildChoices(q, isMulti){
  return `<div class="choices">${q.choices.map((c,i)=>`
    <button class="choice-btn" id="ch-${i}" onclick="${isMulti?`toggleMulti(${i},this)`:`submitAnswer(${i})`}">
      <span class="choice-num">${i+1}</span><span>${esc(c)}</span>
    </button>`).join("")}</div>`;
}

function buildEngMulti(q){
  let html = `<div class="q-passage">${esc(q.passage)}</div>`;
  q.questions.forEach((sub,qi)=>{
    html += `<div class="q-text" style="margin-top:1rem;font-size:.9rem">${esc(sub.q)}</div>
    <div class="choices" id="eng-choices-${qi}">${sub.choices.map((c,ci)=>`
      <button class="choice-btn" id="eng-${qi}-${ci}" onclick="submitEngSub(${qi},${ci})">
        <span class="choice-num">${ci+1}</span><span>${esc(c)}</span>
      </button>`).join("")}</div>`;
  });
  html += "<div id='eng-all-exp'></div>";
  return html;
}

/* ── Submit ── */
function disableAll(){ document.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true); }

function submitAnswer(idx){
  const q  = session.questions[session.idx];
  const ok = idx === q.answer;
  disableAll();
  document.getElementById("ch-"+idx).classList.add(ok?"correct":"wrong");
  if(!ok) document.getElementById("ch-"+q.answer)?.classList.add("reveal");
  record(ok, q);
  showExp(q.explanation);
  document.getElementById("btn-next").classList.remove("hidden");
}

function toggleMulti(idx,btn){
  if(multiSel.includes(idx)){ multiSel=multiSel.filter(x=>x!==idx); btn.style.borderColor=""; btn.style.background=""; }
  else { multiSel.push(idx); btn.style.borderColor="var(--accent)"; btn.style.background="var(--accent-l)"; }
}

function submitMulti(){
  const q  = session.questions[session.idx];
  const ok = JSON.stringify([...multiSel].sort((a,b)=>a-b)) === JSON.stringify([...q.answer].sort((a,b)=>a-b));
  disableAll();
  q.answer.forEach(i=>document.getElementById("ch-"+i)?.classList.add("reveal"));
  multiSel.forEach(i=>{ const b=document.getElementById("ch-"+i); if(b) b.classList.add(q.answer.includes(i)?"correct":"wrong"); });
  record(ok, q);
  showExp(q.explanation);
  document.getElementById("btn-next").classList.remove("hidden");
  document.getElementById("btn-submit-multi")?.remove();
  multiSel=[];
}

function submitEngSub(qi,ci){
  const q   = session.questions[session.idx];
  const sub = q.questions[qi];
  const ok  = ci===sub.answer;
  engAnswers[qi]=ok;
  document.querySelectorAll(`#eng-choices-${qi} .choice-btn`).forEach(b=>b.disabled=true);
  document.getElementById(`eng-${qi}-${ci}`).classList.add(ok?"correct":"wrong");
  if(!ok) document.getElementById(`eng-${qi}-${sub.answer}`)?.classList.add("reveal");
  const ea=document.getElementById("eng-all-exp");
  const d=document.createElement("div"); d.className="explanation"; d.style.marginTop="8px";
  d.innerHTML=`<strong>(${qi+1})解説</strong><br>${esc(sub.exp)}`; ea.appendChild(d);
  if(Object.keys(engAnswers).length===q.questions.length){
    record(Object.values(engAnswers).every(Boolean), q);
    document.getElementById("btn-next").classList.remove("hidden");
  }
}

function record(ok, q){
  session.answers.push(ok);
  if(!stats[q.cat]) stats[q.cat]={done:0,correct:0};
  stats[q.cat].done++;
  if(ok) stats[q.cat].correct++;
  saveStats();
}

function showExp(exp){
  if(!exp) return;
  const d=document.createElement("div"); d.className="explanation";
  d.innerHTML=`<strong>解説</strong><br>${esc(exp)}`;
  document.querySelector(".q-card")?.appendChild(d);
}

/* ── Nav ── */
function nextQuestion(){
  session.idx++;
  if(session.idx>=session.questions.length){ showResult(); return; }
  renderQuestion(); window.scrollTo(0,0);
}

function showResult(){
  const total  = session.answers.length;
  const correct= session.answers.filter(Boolean).length;
  document.getElementById("res-score").textContent   = total ? Math.round(correct/total*100)+"%" : "—";
  document.getElementById("res-correct").textContent = correct;
  document.getElementById("res-wrong").textContent   = total-correct;
  document.getElementById("res-total").textContent   = total;
  showScreen("result");
}

function showScreen(name){
  ["home","quiz","result"].forEach(s=>document.getElementById("screen-"+s).classList.toggle("hidden",s!==name));
}

renderHome();
</script>
</body>
</html>
