let S={cat:'文章理解',ans:{},idx:0};

function qs(){return QS[S.cat];}
function render(){rTabs();rScore();rQ();}

function rTabs(){
document.getElementById('app').innerHTML=`
<div class="hd"><h1>総合能力診断DATA 知的能力 練習</h1><p>文章理解12問 / 問題解決13問 / データ分析12問 / 関係把握14問　計51問</p></div>
<div class="tabs" id="tabs"></div>
<div class="sc-row" id="scr"></div>
<div id="qmap-wrap"></div>
<div id="qc"></div>`;
document.getElementById('tabs').innerHTML=CATS.map(c=>`<button class="tab ${S.cat===c?'active':''}" onclick="sw('${c}')">${c}</button>`).join('');
}

function rScore(){
const q2=qs();let ok=0,tot=0;
q2.forEach(q=>{if(S.ans[q.id]!==undefined){tot++;if(S.ans[q.id]===q.ans)ok++;}});
document.getElementById('scr').innerHTML=`
<div class="sc"><div class="lb">回答済み</div><div class="vl">${tot} / ${q2.length}</div></div>
<div class="sc"><div class="lb">正解数</div><div class="vl">${ok}</div></div>
<div class="sc"><div class="lb">正答率</div><div class="vl">${tot>0?Math.round(ok/tot*100):'-'}%</div></div>`;
const dots=q2.map((q,i)=>{
let cl='qd';
if(i===S.idx)cl+=' cur';
else if(S.ans[q.id]!==undefined)cl+=S.ans[q.id]===q.ans?' ok2':' ng';
return `<div class="${cl}" onclick="goQ(${i})">${i+1}</div>`;}).join('');
document.getElementById('qmap-wrap').innerHTML=`<div class="ttl">問題一覧（緑=正解 / 赤=不正解）</div><div class="qmap">${dots}</div>`;
}

function rQ(){
const q2=qs();
if(S.idx>=q2.length){rRes();return;}
const q=q2[S.idx];
const done=S.ans[q.id]!==undefined;
let tbl='';
if(q.tbl){
tbl=`<div class="ttl" style="margin-bottom:5px;">${q.tt||''}</div><div class="tw"><table class="dt"><thead><tr>${q.tbl.h.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${q.tbl.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
const pass=q.passage?`<div class="passage">${q.passage.replace(/\n/g,'<br>')}</div>`:'';
const opts2=q.opts.map((o,i)=>{
let cl='opt';
if(done){cl+=' disabled';if(i===q.ans)cl+=' correct';else if(S.ans[q.id]===i)cl+=' wrong';}
return `<div class="${cl}" onclick="${done?'':` selA('${q.id}',${i})`}"><span class="ok">${String.fromCharCode(65+i)}</span><span>${o}</span></div>`;}).join('');
const ex=done?`<div class="exp">解説：${q.exp}</div>`:'';
const prev=S.idx===0?'disabled':'';
const nxt=S.idx>=q2.length-1?'disabled':'';
document.getElementById('qc').innerHTML=`
<div class="qcard">
<div class="qtype">${q.cat}</div>
<div class="qnum">第${S.idx+1}問</div>
${tbl}${pass}
<div class="qtxt">${q.q}</div>
<div class="opts">${opts2}</div>${ex}
</div>
<div class="nav">
<button class="btn" onclick="prev()" ${prev}>← 前</button>
<span class="pg">${S.idx+1} / ${q2.length}</span>
<button class="btn btn-p" onclick="next()" ${nxt}>次 →</button>
</div>`;}

function rRes(){
const q2=qs();let ok=0;
q2.forEach(q=>{if(S.ans[q.id]===q.ans)ok++;});
const pct=Math.round(ok/q2.length*100);
document.getElementById('qc').innerHTML=`<div class="res">
<h2>${S.cat} 完了</h2>
<div class="big">${pct}<span style="font-size:20px">%</span></div>
<p style="margin-top:8px;font-size:14px;color:var(--color-text-secondary);">${ok} / ${q2.length} 問正解</p>
<div style="margin-top:1.25rem;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
<button class="btn btn-p" onclick="rst()">もう一度</button>
<button class="btn" onclick="sendPrompt('${S.cat}のDATA適性検査対策として、さらに難しい練習問題を出してください。')">さらに難しい問題を出してもらう ↗</button>
</div></div>`;}

function selA(id,i){S.ans[id]=i;render();}
function next(){if(S.idx<qs().length-1){S.idx++;render();}else{S.idx=qs().length;render();}}
function prev(){if(S.idx>0){S.idx--;render();}}
function goQ(i){S.idx=i;render();}
function sw(c){S.cat=c;S.idx=0;render();}
function rst(){const q2=qs();q2.forEach(q=>{delete S.ans[q.id];});S.idx=0;render();}
render();
</script>
