<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>総合能力診断DATA 対策アプリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --bg2: #0f1425;
    --panel: #141930;
    --panel2: #1a2040;
    --border: #2a3560;
    --accent: #4f8ef7;
    --accent2: #7b5cf0;
    --accent3: #f05c7b;
    --gold: #f0c050;
    --green: #3ecf8e;
    --text: #e8ecf5;
    --text2: #9aa5c4;
    --text3: #5a6480;
    --easy: #3ecf8e;
    --mid: #f0c050;
    --hard: #f05c7b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 20px; }

  /* Header */
  header {
    text-align: center;
    padding: 48px 20px 36px;
    position: relative;
  }
  .header-badge {
    display: inline-block;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 4px 14px;
    margin-bottom: 16px;
    opacity: 0.8;
  }
  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--text) 0%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.3;
  }
  header p {
    margin-top: 10px;
    color: var(--text2);
    font-size: 13px;
    letter-spacing: 1px;
  }

  /* Score bar */
  #scorebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 20px;
    margin-bottom: 24px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text2);
    flex-wrap: wrap;
    gap: 8px;
  }
  #scorebar span { color: var(--text); }
  .score-num { color: var(--gold); font-size: 18px; font-weight: bold; }
  .streak-num { color: var(--green); }

  /* Category tabs */
  .tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .tab-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    padding: 10px 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    text-align: center;
    transition: all 0.2s;
    line-height: 1.4;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--text); }
  .tab-btn.active {
    background: var(--panel2);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 12px rgba(79,142,247,0.2);
  }
  .tab-icon { font-size: 18px; display: block; margin-bottom: 4px; }

  /* Difficulty */
  .difficulty-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .diff-btn {
    flex: 1;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: all 0.2s;
    text-align: center;
  }
  .diff-btn[data-diff="easy"].active { border-color: var(--easy); color: var(--easy); background: rgba(62,207,142,0.1); }
  .diff-btn[data-diff="mid"].active  { border-color: var(--mid); color: var(--mid); background: rgba(240,192,80,0.1); }
  .diff-btn[data-diff="hard"].active { border-color: var(--hard); color: var(--hard); background: rgba(240,92,123,0.1); }
  .diff-btn:hover { border-color: var(--text3); color: var(--text); }

  /* Question card */
  #question-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    margin-bottom: 16px;
    min-height: 200px;
    position: relative;
  }
  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .q-tag {
    font-size: 10px;
    letter-spacing: 2px;
    font-family: 'Share Tech Mono', monospace;
    padding: 3px 10px;
    border-radius: 3px;
    border: 1px solid;
  }
  .q-tag.reading  { color: var(--accent);  border-color: var(--accent);  background: rgba(79,142,247,0.08); }
  .q-tag.solving  { color: var(--accent2); border-color: var(--accent2); background: rgba(123,92,240,0.08); }
  .q-tag.data     { color: var(--gold);    border-color: var(--gold);    background: rgba(240,192,80,0.08); }
  .q-tag.logic    { color: var(--green);   border-color: var(--green);   background: rgba(62,207,142,0.08); }

  .q-diff-badge {
    font-size: 10px;
    letter-spacing: 1px;
    font-family: 'Share Tech Mono', monospace;
    padding: 3px 10px;
    border-radius: 3px;
  }
  .q-diff-badge.easy { background: rgba(62,207,142,0.15);  color: var(--easy); }
  .q-diff-badge.mid  { background: rgba(240,192,80,0.15);  color: var(--mid); }
  .q-diff-badge.hard { background: rgba(240,92,123,0.15);  color: var(--hard); }

  #question-num {
    font-family: 'Share Tech Mono', monospace;
    color: var(--text3);
    font-size: 12px;
  }

  #question-text {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
  }

  .q-table {
    border-collapse: collapse;
    margin: 14px 0;
    font-size: 13px;
    width: 100%;
  }
  .q-table th {
    background: var(--panel2);
    border: 1px solid var(--border);
    padding: 8px 12px;
    color: var(--text2);
    font-weight: 500;
    text-align: center;
  }
  .q-table td {
    border: 1px solid var(--border);
    padding: 8px 12px;
    text-align: center;
    color: var(--text);
  }
  .q-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

  /* Timer */
  #timer-bar-wrap {
    height: 3px;
    background: var(--panel2);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
    display: none;
  }
  #timer-bar { height: 100%; background: var(--accent); transition: width 0.5s linear, background 0.5s; }

  /* Options */
  #options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .opt-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 14px 20px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    text-align: left;
    transition: all 0.15s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    line-height: 1.6;
  }
  .opt-label {
    font-family: 'Share Tech Mono', monospace;
    color: var(--text3);
    font-size: 12px;
    min-width: 20px;
    margin-top: 1px;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--panel2);
    transform: translateX(3px);
  }
  .opt-btn.correct { border-color: var(--easy) !important; background: rgba(62,207,142,0.1) !important; color: var(--easy) !important; }
  .opt-btn.correct .opt-label { color: var(--easy); }
  .opt-btn.wrong   { border-color: var(--hard) !important; background: rgba(240,92,123,0.08) !important; color: var(--hard) !important; opacity: 0.7; }
  .opt-btn.wrong .opt-label { color: var(--hard); }
  .opt-btn:disabled { cursor: default; }

  /* Explanation */
  #explanation {
    display: none;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent2);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.85;
    color: var(--text2);
    animation: fadeIn 0.3s ease;
  }
  #explanation strong { color: var(--text); }
  #explanation .correct-label { color: var(--easy); font-weight: 700; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Buttons row */
  .btn-row { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    padding: 12px 24px;
    border-radius: 6px;
    border: 1px solid;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    transition: all 0.2s;
    font-weight: 500;
    letter-spacing: 0.5px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6ba0ff; }
  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn-ghost:hover { border-color: var(--text2); color: var(--text); }

  /* Progress */
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .progress-bar-outer { flex: 1; height: 4px; background: var(--panel2); border-radius: 2px; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 2px; transition: width 0.4s; }
  .progress-label { font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text3); white-space: nowrap; }

  /* Result screen */
  #result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: fadeIn 0.5s ease;
  }
  .result-circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 24px;
    background: radial-gradient(circle at center, rgba(79,142,247,0.1), transparent);
  }
  .result-pct { font-size: 32px; font-weight: 900; font-family: 'Share Tech Mono', monospace; color: var(--accent); }
  .result-label { font-size: 11px; color: var(--text3); letter-spacing: 1px; }
  .result-grade { font-family: 'Noto Serif JP', serif; font-size: 22px; margin-bottom: 8px; }
  .result-msg { color: var(--text2); font-size: 14px; margin-bottom: 32px; line-height: 1.8; }
  .result-breakdown {
    display: grid; grid-template-columns: repeat(2,1fr);
    gap: 10px; margin-bottom: 30px; text-align: left;
  }
  .breakdown-item {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px;
  }
  .breakdown-item .bi-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; }
  .breakdown-item .bi-val { font-size: 20px; font-family: 'Share Tech Mono', monospace; color: var(--text); }

  /* Responsive */
  @media(max-width: 600px) {
    .tabs { grid-template-columns: repeat(2,1fr); }
    .result-breakdown { grid-template-columns: 1fr; }
    #question-card { padding: 18px; }
    .btn { padding: 10px 16px; font-size: 12px; }
  }

  /* Scroll to top */
  .scroll-hint { text-align: center; font-size: 11px; color: var(--text3); padding-top: 40px; font-family: 'Share Tech Mono', monospace; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-badge">PURE INTELLIGENCE TEST</div>
    <h1>総合能力診断 DATA<br>対策練習アプリ</h1>
    <p>文章理解力 ／ 問題解決力 ／ データ分析力 ／ 関係把握力・論理展開度</p>
  </header>

  <div id="scorebar">
    <div>累計正解：<span class="score-num" id="total-correct">0</span> 問</div>
    <div>今回の正答率：<span class="score-num" id="session-pct">—</span></div>
    <div>連続正解：<span class="streak-num" id="streak">0</span> 🔥</div>
  </div>

  <div id="main-screen">
    <div class="tabs">
      <button class="tab-btn active" data-cat="all"><span class="tab-icon">🧠</span>全カテゴリ</button>
      <button class="tab-btn" data-cat="reading"><span class="tab-icon">📖</span>文章理解力</button>
      <button class="tab-btn" data-cat="solving"><span class="tab-icon">🔧</span>問題解決力</button>
      <button class="tab-btn" data-cat="data"><span class="tab-icon">📊</span>データ分析力</button>
    </div>
    <div class="tabs" style="margin-top:-10px">
      <button class="tab-btn" data-cat="logic" style="grid-column: span 4"><span class="tab-icon" style="display:inline;margin:0 6px 0 0">🔗</span>関係把握力・論理展開度</button>
    </div>

    <div class="difficulty-row">
      <button class="diff-btn active" data-diff="easy">初級 ★☆☆</button>
      <button class="diff-btn" data-diff="mid">中級 ★★☆</button>
      <button class="diff-btn" data-diff="hard">上級 ★★★</button>
    </div>

    <div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>

    <div class="progress-wrap">
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-inner" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0 / 0</div>
    </div>

    <div id="question-card">
      <div class="q-meta">
        <span id="q-tag" class="q-tag reading">文章理解力</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="q-diff-badge" class="q-diff-badge easy">初級</span>
          <span id="question-num">Q1</span>
        </div>
      </div>
      <div id="question-text">カテゴリと難易度を選択して「次の問題」を押してください。</div>
    </div>

    <div id="options"></div>
    <div id="explanation"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="skip-btn" onclick="loadQuestion()">スキップ</button>
      <button class="btn btn-primary" id="next-btn" onclick="loadQuestion()">次の問題 →</button>
    </div>
  </div>

  <div id="result-screen">
    <div class="result-circle">
      <div class="result-pct" id="res-pct">—</div>
      <div class="result-label">SCORE</div>
    </div>
    <div class="result-grade" id="res-grade"></div>
    <div class="result-msg" id="res-msg"></div>
    <div class="result-breakdown">
      <div class="breakdown-item"><div class="bi-label">正解数</div><div class="bi-val" id="res-correct">0</div></div>
      <div class="breakdown-item"><div class="bi-label">問題数</div><div class="bi-val" id="res-total">0</div></div>
      <div class="breakdown-item"><div class="bi-label">最長連続正解</div><div class="bi-val" id="res-streak">0</div></div>
      <div class="breakdown-item"><div class="bi-label">累計正解</div><div class="bi-val" id="res-cumulative">0</div></div>
    </div>
    <button class="btn btn-primary" onclick="resetSession()">もう一度挑戦する</button>
  </div>

  <p class="scroll-hint">powered by PURE Intelligence Framework · DATA Adaptation</p>
</div>

<script>
// ===== QUESTION BANK =====
const QUESTIONS = [

// ===================== 文章理解力 =====================

// --- EASY ---
{cat:'reading',diff:'easy',
text:`次の文章を読んで、問いに答えなさい。

「近年、在宅勤務の普及に伴い、通勤時間が削減され、その分の時間を個人の自由時間として活用できる人が増えている。一方で、仕事と生活の境界線が曖昧になることで、かえって労働時間が延長してしまうという指摘もある。」

この文章が伝えたい主な内容として最も適切なものはどれか。`,
options:['在宅勤務は通勤時間の節約という利点があるが、労働時間増加という問題も生じうる','在宅勤務をすると全員の自由時間が増える','通勤時間の削減が生産性向上の最大要因である','労働時間延長は通勤そのものが原因である'],
answer:0,
exp:'文章は「一方で」という逆接で在宅勤務の二面性を述べています。利点（通勤削減）と問題点（労働時間延長）の両方を提示しているのがポイントです。'},

{cat:'reading',diff:'easy',
text:`次の文章を読んで、空欄（　）に入る最も適切な語句を選びなさい。

「科学的な仮説を立てる際には、検証可能性が重要である。どれほど精緻に組み立てられた理論であっても、実験や観察によって反証できる可能性がなければ、それは科学的な命題ではなく（　）に過ぎない。」`,
options:['形而上学的な信念','技術的な提案','統計的な推測','哲学的な命題'],
answer:0,
exp:'カール・ポパーの反証可能性の概念が背景にあります。反証不可能な命題は科学の範疇外とみなされ、形而上学的な信念や神話的な言説と同列に置かれます。'},

{cat:'reading',diff:'easy',
text:`次の文章の論理構造として正しいものを選びなさい。

「すべての管理職は意思決定の責任を持つ。田中氏は管理職である。したがって、田中氏は意思決定の責任を持つ。」`,
options:['三段論法（演繹推論）','帰納推論','類比推論','仮説演繹法'],
answer:0,
exp:'「全称命題→個別事例→結論」という構造は演繹推論の典型、三段論法です。帰納は個別→一般、類比は類似性に基づく推論です。'},

{cat:'reading',diff:'easy',
text:`次の文章を読み、筆者の主張として最も適切なものを選びなさい。

「情報リテラシーの欠如は、現代社会において個人だけでなく組織にも深刻なリスクをもたらす。フェイクニュースや誤情報が瞬時に拡散する環境下では、批判的思考力を養うための教育投資こそが、最も費用対効果の高いリスク管理策の一つとなる。」`,
options:['批判的思考教育への投資はリスク管理として有効である','フェイクニュースは個人の問題であり組織に影響しない','情報リテラシーよりも技術的なセキュリティ対策が重要','情報拡散速度の抑制が最優先課題である'],
answer:0,
exp:'筆者は「批判的思考力を養う教育投資＝費用対効果の高いリスク管理策」と主張しています。文章全体の論点がこの結論に向かっています。'},

{cat:'reading',diff:'easy',
text:`次の文章を読み、下線部「これ」が指す内容を選びなさい。

「市場競争の激化によって製品価格は低下し、消費者は以前より安価に商品を購入できるようになった。しかし、これが長期的に中小企業の収益を圧迫し、市場から退出を余儀なくされる企業が増えれば、最終的には競争そのものが失われる可能性がある。」`,
options:['製品価格の低下','消費者の購買行動の変化','市場への新規参入','企業の合理化策'],
answer:0,
exp:'「しかし、これが」の「これ」は直前の内容を指します。直前は「製品価格は低下し、消費者が安価に購入できるようになった」という事態であり、それが中小企業を圧迫するという流れです。'},

// --- MID ---
{cat:'reading',diff:'mid',
text:`次の文章を読んで、問いに答えなさい。

「あらゆる組織は、その存立基盤として何らかの正統性を必要とする。ウェーバーは正統性の型として、伝統的支配・カリスマ的支配・合法的支配の三類型を示した。現代の官僚制組織が採用するのは主に合法的支配であり、明文化されたルールへの服従が組織秩序の根拠となる。しかし、規則への過度な従属は、手続きの遵守それ自体が目的化する「目標の転移」を招き、組織の本来の目的達成能力を損ないうる。」

この文章から導ける推論として最も適切なものを選びなさい。`,
options:[
'官僚制のルール遵守は組織秩序を支えるが、過度になると本来目的の達成を妨げるパラドックスを内包している',

]; // end QUESTIONS

// ===== STATE =====
let state = {
  cat: 'all', diff: 'easy',
  pool: [], idx: 0, answered: false,
  sessionCorrect: 0, sessionTotal: 0,
  totalCorrect: parseInt(localStorage.getItem('totalCorrect')||'0'),
  streak: 0, maxStreak: 0,
  timerHandle: null
};

function getPool(){
  let q = QUESTIONS.filter(q => {
    const catOk = state.cat==='all' || q.cat===state.cat;
    const diffOk = q.diff===state.diff;
    return catOk && diffOk;
  });
  // shuffle
  return q.sort(()=>Math.random()-0.5);
}

// ===== UI HELPERS =====
const catNames = {reading:'文章理解力',solving:'問題解決力',data:'データ分析力',logic:'関係把握力・論理展開度'};
const catClass = {reading:'reading',solving:'solving',data:'data',logic:'logic'};
const diffNames = {easy:'初級',mid:'中級',hard:'上級'};

function updateScorebar(){
  document.getElementById('total-correct').textContent = state.totalCorrect;
  const pct = state.sessionTotal===0 ? '—' : Math.round(state.sessionCorrect/state.sessionTotal*100)+'%';
  document.getElementById('session-pct').textContent = pct;
  document.getElementById('streak').textContent = state.streak;
}

function updateProgress(){
  const total = state.pool.length;
  const done = state.idx;
  const pct = total===0 ? 0 : Math.round(done/total*100);
  document.getElementById('progress-inner').style.width = pct+'%';
  document.getElementById('progress-label').textContent = done+' / '+total;
}

function loadQuestion(){
  if(state.pool.length===0){
    state.pool = getPool();
    state.idx = 0;
  }
  if(state.idx >= state.pool.length){
    showResult(); return;
  }

  const q = state.pool[state.idx];
  state.answered = false;
  document.getElementById('explanation').style.display='none';

  // Tags
  const tagEl = document.getElementById('q-tag');
  tagEl.textContent = catNames[q.cat];
  tagEl.className = 'q-tag '+catClass[q.cat];
  const badgeEl = document.getElementById('q-diff-badge');
  badgeEl.textContent = diffNames[q.diff];
  badgeEl.className = 'q-diff-badge '+q.diff;
  document.getElementById('question-num').textContent = 'Q'+(state.idx+1);

  // Question text (handle table markdown)
  const qtEl = document.getElementById('question-text');
  qtEl.innerHTML = '';
  const lines = q.text.split('\n');
  let inTable = false, tableLines = [];
  let textBuffer = [];

  const flushText = ()=>{
    if(textBuffer.length){
      const p = document.createElement('p');
      p.style.cssText='white-space:pre-wrap;margin-bottom:10px;font-size:15px;line-height:1.9';
      p.textContent = textBuffer.join('\n');
      qtEl.appendChild(p);
      textBuffer=[];
    }
  };
  const flushTable = ()=>{
    if(tableLines.length<2) return;
    const table = document.createElement('table');
    table.className='q-table';
    tableLines.forEach((line,i)=>{
      if(line.match(/^\|[-| ]+\|$/)) return;
      const cells = line.split('|').filter((_,j,a)=>j>0&&j<a.length-1);
      const row = document.createElement('tr');
      cells.forEach(c=>{
        const cell = document.createElement(i===0?'th':'td');
        cell.textContent=c.trim();
        row.appendChild(cell);
      });
      table.appendChild(row);
    });
    qtEl.appendChild(table);
    tableLines=[];
    inTable=false;
  };

  lines.forEach(line=>{
    if(line.startsWith('|')){
      if(!inTable){ flushText(); inTable=true; }
      tableLines.push(line);
    } else {
      if(inTable) flushTable();
      textBuffer.push(line);
    }
  });
  if(inTable) flushTable();
  flushText();

  // Options
  const optsEl = document.getElementById('options');
  optsEl.innerHTML='';
  const labels=['A','B','C','D'];
  q.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className='opt-btn';
    btn.innerHTML=`<span class="opt-label">${labels[i]}</span><span>${opt}</span>`;
    btn.addEventListener('click',()=>answerQuestion(i));
    optsEl.appendChild(btn);
  });

  updateProgress();
  startTimer(q.diff);
}

let timerInterval=null;
function startTimer(diff){
  const times={easy:60,mid:90,hard:120};
  let secs=times[diff];
  const bar=document.getElementById('timer-bar');
  const wrap=document.getElementById('timer-bar-wrap');
  wrap.style.display='block';
  bar.style.width='100%';
  bar.style.background='var(--accent)';
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(state.answered){clearInterval(timerInterval);return;}
    secs--;
    const pct=secs/times[diff]*100;
    bar.style.width=pct+'%';
    if(pct<30) bar.style.background='var(--hard)';
    else if(pct<60) bar.style.background='var(--mid)';
    if(secs<=0){
      clearInterval(timerInterval);
      autoTimeOut();
    }
  },1000);
}

function autoTimeOut(){
  if(state.answered) return;
  state.answered=true;
  const q=state.pool[state.idx];
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.disabled=true);
  btns[q.answer].classList.add('correct');
  state.streak=0;
  state.sessionTotal++;
  updateScorebar();
  showExplanation(q,-1);
  state.idx++;
}

function answerQuestion(chosen){
  if(state.answered) return;
  clearInterval(timerInterval);
  state.answered=true;
  const q=state.pool[state.idx];
  const btns=document.querySelectorAll('.opt-btn');
  btns.forEach(b=>b.disabled=true);

  if(chosen===q.answer){
    btns[chosen].classList.add('correct');
    state.sessionCorrect++;
    state.totalCorrect++;
    state.streak++;
    if(state.streak>state.maxStreak) state.maxStreak=state.streak;
    localStorage.setItem('totalCorrect',state.totalCorrect);
  } else {
    btns[chosen].classList.add('wrong');
    btns[q.answer].classList.add('correct');
    state.streak=0;
  }
  state.sessionTotal++;
  updateScorebar();
  showExplanation(q,chosen);
  state.idx++;
}

function showExplanation(q,chosen){
  const el=document.getElementById('explanation');
  const timedOut=chosen===-1;
  el.style.display='block';
  el.innerHTML=`<strong class="correct-label">${timedOut?'⏱ 時間切れ':'解説'}</strong>　正解：<strong>${['A','B','C','D'][q.answer]}. ${q.options[q.answer]}</strong><br><br>${q.exp.replace(/\n/g,'<br>')}`;
}

function showResult(){
  document.getElementById('main-screen').style.display='none';
  const rs=document.getElementById('result-screen');
  rs.style.display='block';
  const pct=state.sessionTotal===0?0:Math.round(state.sessionCorrect/state.sessionTotal*100);
  document.getElementById('res-pct').textContent=pct+'%';
  let grade,msg;
  if(pct>=90){grade='S ランク';msg='卓越した思考力です。本番でも自信を持って臨めます。';}
  else if(pct>=75){grade='A ランク';msg='高水準です。苦手カテゴリをもう一押しすれば盤石。';}
  else if(pct>=60){grade='B ランク';msg='合格圏内。解説を活用してさらに精度を高めましょう。';}
  else if(pct>=40){grade='C ランク';msg='もう一歩。解説を丁寧に読んで思考プロセスを確認。';}
  else{grade='D ランク';msg='基礎から積み上げましょう。焦らず繰り返すことが力になります。';}
  document.getElementById('res-grade').textContent=grade;
  document.getElementById('res-msg').textContent=msg;
  document.getElementById('res-correct').textContent=state.sessionCorrect;
  document.getElementById('res-total').textContent=state.sessionTotal;
  document.getElementById('res-streak').textContent=state.maxStreak;
  document.getElementById('res-cumulative').textContent=state.totalCorrect;
}

function resetSession(){
  state.sessionCorrect=0;state.sessionTotal=0;state.streak=0;state.maxStreak=0;
  state.pool=getPool();state.idx=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('main-screen').style.display='block';
  updateScorebar();
  loadQuestion();
}

// ===== EVENTS =====
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.cat=btn.dataset.cat;
    state.pool=getPool();state.idx=0;
    state.sessionCorrect=0;state.sessionTotal=0;state.streak=0;state.maxStreak=0;
    updateScorebar();
    loadQuestion();
  });
});

document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.diff=btn.dataset.diff;
    state.pool=getPool();state.idx=0;
    loadQuestion();
  });
});

// INIT
state.pool=getPool();
updateScorebar();
loadQuestion();
</script>
</body>
